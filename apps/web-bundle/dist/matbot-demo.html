    "/plugin-api/src/store-query.ts": "// The matbot store query grammar: a minimal, closed filter AST designed to be translated to a\n// real backend (SQL WHERE, Elasticsearch bool, Mongo find, IndexedDB cursor) — not interpreted by\n// an embedded engine. The in-memory reference evaluator lives in @matatbread/matbot-core/storage-base.\n//\n// Design rules (see CLAUDE.md / the store-query design notes):\n//   - LHS is always a field, RHS is always a constant. No field-vs-field, no computed values.\n//   - Operators are a closed union discriminated by `op`, so every backend compiler is one total\n//     `switch` the type checker can prove exhaustive.\n//   - Comparisons are type-strict; null and absent are a single \"missing\" state (queried only via\n//     `exists`). null is therefore barred from every comparison operand.\n\n     \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n      // structurally invalid node (or unreadable cursor)\n\n// Thrown at the query boundary (before any backend touches data) with a JSON pointer into the\n// offending node, so an LLM author can locate and fix the clause and retry. Lives in plugin-api\n// (a host-shared package) so cross-plugin `instanceof` works — see the plugin hot-reload notes.\nexport class StoreQueryError extends Error {\n   pointer;\n   code;\n  constructor(message, pointer, code) {\n    super(message);\n    this.name    = 'StoreQueryError';\n    this.pointer = pointer;\n    this.code    = code;\n  }\n}\n",
    "/plugin-api/src/vault.ts": "\n\n/**\n * The `createSecret` policy, written once over the spec primitives so every backend behaves\n * identically. A backend's `createSecret` is just `applyCreateSecret(this, name, value)`.\n *\n * The dedup step (returning an existing name for a value already stored) technically lets a\n * caller confirm a name for a value they already hold — but holding the value already grants\n * everything that confirmation would, so it leaks nothing.\n */\nexport async function applyCreateSecret(\n  spec,\n  name,\n  value,\n) {\n  if (spec.hasKey(value)) return value;\n  const existing = spec.findByValue?.(value);\n  if (existing !== undefined) return existing;\n  await spec.writeSecret(name, value);\n  return name;\n}\n",
    "/plugin-api/src/errors.ts": "/**\n * matbot's typed errors are **duck-typed, not class-based**: each is a plain `Error` carrying a\n * `matbot` brand string (the discriminant) plus its data fields. Callers test the brand through the\n * exported `isX` guards — never `instanceof`.\n *\n * Why not classes: plugin-api can be physically duplicated in a skewed install (two copies at\n * different versions). A class is a per-copy object, so `instanceof MissingSecretError` returns\n * `false` when the host throws from one copy and a plugin tests with another — silently breaking\n * error handling across the boundary. A brand string is identity-independent, so the guard holds no\n * matter how many copies are loaded. See docs/duplicate-singletons.md.\n *\n * The interfaces are kept named `XError` so existing `import type { XError }` annotations and field\n * access (`e.missingKeys`) survive; only construction (`new XError()` → `xError()`) and detection\n * (`instanceof XError` → `isXError()`) change.\n */\n\nconst BRAND = 'matbot';\n\n \n\nfunction isKind(e, kind) {\n  return typeof e === 'object' && e !== null && (e )[BRAND] === kind;\n}\n\n/**\n * Thrown by Vault.resolve() when one or more ${NAME} placeholders cannot be resolved.\n * `missingKeys` carries the unresolved key names (e.g. `ANTHROPIC_API_KEY`) so callers\n * can prompt for and store them.\n */\n\n\n\n\nexport function missingSecretError(missingKeys) {\n  const e = new Error(`Vault: secret(s) not found: ${missingKeys.join(', ')}`);\n  e.name = 'MissingSecretError';\n  return Object.assign(e, { matbot: 'MissingSecret' , missingKeys });\n}\nexport function isMissingSecretError(e) {\n  return isKind(e, 'MissingSecret');\n}\n\n/**\n * Thrown by the loader when an explicit, single, user-initiated load (the `plugin`/`provider`\n * tools via `services.loadPlugin`) targets a plugin whose `matbotRuntime` excludes this host.\n * Unlike a setup() failure — which may be transient (a missing secret) and is left in config to\n * fix — this is permanent for the host, so the `add` flow catches it specifically and rolls the\n * specifier back out of matbot.yaml rather than persisting a plugin that can never activate here.\n */\n\n\n\n\n\n\nexport function incompatibleRuntimeError(specifier, declared, hostRuntime) {\n  const e = new Error(`Cannot load plugin \"${specifier}\": declares matbotRuntime [${declared.join(', ')}], host runtime is \"${hostRuntime}\".`);\n  e.name = 'IncompatibleRuntimeError';\n  return Object.assign(e, { matbot: 'IncompatibleRuntime' , specifier, declared, hostRuntime });\n}\nexport function isIncompatibleRuntimeError(e) {\n  return isKind(e, 'IncompatibleRuntime');\n}\n\n/**\n * Thrown by the loader when an explicit, single, user-initiated load targets a module that imports\n * cleanly but is not plugin-shaped — no `plugin` export, a `plugin` without `apiVersion`, or a\n * non-function lifecycle member. Like {@link IncompatibleRuntimeError} this is *permanent* for the\n * specifier (the code is a library, not a plugin), so the `add` flow catches it specifically and\n * rolls the specifier back out of matbot.yaml — distinct from a transient setup() failure (a missing\n * secret), which is left in config to fix. `reason` is the precise shape defect for logs; callers\n * surfacing this to an LLM should prefer a terminal \"not a plugin\" message over echoing `reason`,\n * which is phrased as a code-fix instruction the model may try to act on.\n */\n\n\n\n\n\nexport function notAPluginError(specifier, reason) {\n  const e = new Error(reason);\n  e.name = 'NotAPluginError';\n  return Object.assign(e, { matbot: 'NotAPlugin' , specifier, reason });\n}\nexport function isNotAPluginError(e) {\n  return isKind(e, 'NotAPlugin');\n}\n\n/**\n * Thrown by a `PromptFn` implementation when the user cancels — the \"give up\" path, not a graceful\n * decline. Callers awaiting `ctx.prompt()` need not branch on it: the surrounding try/catch turns\n * it into a tool error that closes the tool call, while the host separately abandons the turn.\n */\n\n\n\nexport function promptCancelledError(message = 'User cancelled — cannot proceed.') {\n  const e = new Error(message);\n  e.name = 'PromptCancelledError';\n  return Object.assign(e, { matbot: 'PromptCancelled'  });\n}\nexport function isPromptCancelledError(e) {\n  return isKind(e, 'PromptCancelled');\n}\n",
    "/plugin-api/src/principal-context.ts": "\n\n/**\n * Ambient carrier for the security {@link Principal} — the single mechanism by which any layer\n * (runner, hook, tool, or a Store/FileStore/Vault/KnowledgeIndex backend) discovers *who*\n * originated the current operation, without that identity being threaded through every signature.\n *\n * The host installs one platform implementation at boot via {@link installPrincipalCarrier}:\n *   - node (multi-user, concurrent turns): an `AsyncLocalStorage`-backed carrier — each turn /\n *     request runs in its own isolated scope (see the node app's `createAlsPrincipalCarrier`).\n *   - browser / any single-principal realm: {@link createConstantPrincipalCarrier} — there is only\n *     ever one principal, so no async isolation is needed and `run` is a passthrough.\n *\n * Carrying the principal *grants nothing*. A backend MAY call {@link currentPrincipal} (or\n * {@link tryCurrentPrincipal}) to attribute, branch on, or reject an operation; the default\n * implementations ignore it entirely. Policy is the service's concern — this is only the wire.\n */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// The carrier is process-global, not module-local: a published install can end up with two physical\n// copies of this package (npm nesting under a version skew, a mixed .plugins/npm tree, pnpm peer\n// suffixes). A plain module `let` would then give each copy its own carrier — the host installs into\n// one, a plugin reads the other, and every principal read throws. Anchoring it on `globalThis` under a\n// well-known symbol lets all copies share the single carrier the host installs at boot. Deduping the\n// package (caret ranges) is still preferred; this just makes duplication harmless rather than fatal.\nconst CARRIER_KEY = Symbol.for('@matatbread/matbot-plugin-api#principalCarrier');\n\n\n/** Install the host's platform carrier. Called once at boot, before any turn or request runs. */\nexport function installPrincipalCarrier(impl) {\n  (globalThis )[CARRIER_KEY] = impl;\n}\n\nfunction need() {\n  const carrier = (globalThis )[CARRIER_KEY];\n  if (carrier === undefined) {\n    throw new Error('No PrincipalCarrier installed — the host must call installPrincipalCarrier() at boot.');\n  }\n  return carrier;\n}\n\n/** The principal in force for the current flow. Throws if called with no carrier or no scope. */\nexport function currentPrincipal() {\n  return need().current();\n}\n\n/** The principal in force, or `undefined` when no carrier is installed or no scope is established.\n *  Backends that want to fail-open on out-of-scope access read this instead of {@link currentPrincipal}. */\nexport function tryCurrentPrincipal() {\n  return (globalThis )[CARRIER_KEY]?.tryCurrent();\n}\n\n/** Run `fn` with `principal` established as the ambient identity for its async extent. */\nexport function runAs(principal, fn) {\n  return need().run(principal, fn);\n}\n\n/** Imperatively establish `principal` for the current flow (entry points only). */\nexport function enterPrincipal(principal) {\n  need().enter(principal);\n}\n\n/**\n * A carrier for single-principal realms (the browser, tests): every read returns the same\n * `principal` and `run` is a passthrough, since there is no second identity to isolate from.\n */\nexport function createConstantPrincipalCarrier(principal) {\n  return {\n    current:    () => principal,\n    tryCurrent: () => principal,\n    run:        (_principal, fn) => fn(),\n    enter:      () => {},\n  };\n}\n",
    "/plugin-api/src/usage-context.ts": "\n\n/**\n * Ambient carrier for token accounting — the channel by which a completion run *inside a tool* (via\n * `MatbotRuntime.complete`/`singleTurn`) reports its usage back to the runner without that bookkeeping\n * being threaded through every tool, ranker, or merger signature. It mirrors the {@link PrincipalCarrier}:\n * a sink is established for an async extent, and code deep within (the host's `complete()`) appends to\n * whatever sink is in force via {@link recordUsage}.\n *\n * Why ambient. A tool reaches an LLM only through the core completion services — it cannot call a\n * provider directly. Recording at that one choke point therefore captures *every* tool's spend (a\n * `single_turn`, an `ask_inner_voice`, each of `dream_time`'s per-fact ranker/merger calls) with zero\n * per-tool code. The runner opens one sink per turn ({@link withUsageScope}) and slices it per tool\n * call, attributing each completion to the call that triggered it.\n *\n * The host installs one platform implementation at boot:\n *   - node (concurrent turns): an `AsyncLocalStorage`-backed carrier, so overlapping turns keep\n *     separate sinks (see the node app's `createAlsUsageCarrier`).\n *   - browser / single-turn realms: {@link createSerialUsageCarrier} — a set-and-restore global,\n *     correct while turns do not truly overlap (the same realm the constant principal carrier assumes).\n *\n * Capture is best-effort accounting: with no carrier installed (e.g. tests), {@link recordUsage} and\n * {@link currentUsageSink} are no-ops and usage simply isn't recorded — never an error.\n */\n\n\n\n\n\n\n\nconst CARRIER_KEY = Symbol.for('@matatbread/matbot-plugin-api#usageCarrier');\n\n\n/** Install the host's platform carrier. Called once at boot. */\nexport function installUsageCarrier(impl) {\n  (globalThis )[CARRIER_KEY] = impl;\n}\n\n/** The usage sink in force, or `undefined` when no carrier is installed or no scope is established. */\nexport function currentUsageSink() {\n  return (globalThis )[CARRIER_KEY]?.tryCurrent();\n}\n\n/** Append one provider call's usage to the sink in force. No-op outside any scope (best-effort accounting). */\nexport function recordUsage(provider, usage) {\n  currentUsageSink()?.push({ provider, usage });\n}\n\n/** Run `fn` with a fresh, empty usage sink established for its async extent. Passthrough when no carrier. */\nexport function withUsageScope(fn) {\n  const carrier = (globalThis )[CARRIER_KEY];\n  if (carrier === undefined) return fn();\n  return carrier.run([], fn);\n}\n\n/**\n * A carrier for realms with no async-context isolation (the browser, tests): a single module-global\n * sink, set on `run` and restored once `fn` settles. Correct as long as scopes do not truly overlap —\n * the same single-turn assumption the constant principal carrier makes.\n */\nexport function createSerialUsageCarrier() {\n  let current;\n  return {\n    run(sink, fn) {\n      const prev = current;\n      current = sink;\n      try {\n        const r = fn();\n        if (r instanceof Promise) {\n          return r.finally(() => { current = prev; }) ;\n        }\n        current = prev;\n        return r;\n      } catch (e) {\n        current = prev;\n        throw e;\n      }\n    },\n    tryCurrent: () => current,\n  };\n}\n",
    "/plugin-api/src/session.ts": "\n\n/**\n * A session's `updatedAt` invariant: the timestamp of its last message, or its own `createdAt` when it\n * has none. `updatedAt` tracks *conversational activity*, not structural or metadata edits — so a\n * compaction, cut, split, fork, rename, or archive leaves it (and thus the session's place in a\n * recency-sorted list) untouched, since none of them change which message is last. Kept as a\n * materialised field, not a getter: `Session` round-trips as plain JSON through every storage backend\n * and is sorted on `updatedAt` as a stored column, neither of which survives a live accessor.\n *\n * Apply it to the final session object at every write — `{ ...session, updatedAt: lastActivityAt(session) }`\n * — rather than stamping a fresh `now()`.\n */\nexport function lastActivityAt(session) {\n  const last = session.messages[session.messages.length - 1];\n  return last ? last.createdAt : session.createdAt;\n}\n",
    "/plugin-api/src/context-switch.ts": "\nimport { runAs } from './principal-context.js';\nimport { globalSlot } from './global-state.js';\n\n/**\n * A context switch is the machine analogue of an OS one: it pages in any pending machine state and\n * sets the owner. {@link runAs} is the bare \"set the owner\" instruction (the principal carrier);\n * {@link contextSwitch} is the scheduler operation layered on top — it also lands any machine\n * mutation that was deferred while the machine was busy.\n *\n * Why deferral exists: a service like the `StorageBackend` is the system of record, and swapping it\n * under a running operation would split a compare-and-swap (or a turn) across two backends. So a\n * swap is queued and applied only at the *quiescent edge* — the instant no context is active — which\n * is exactly a context-switch boundary. The principal carrier stays a pure identity primitive; this\n * module owns the machine-update half, so the two concerns share call sites without sharing code.\n *\n * The host registers what to flush ({@link onContextQuiesce}); the three entry points (a web\n * request, a telegram message, a turn) switch context through {@link contextSwitch} instead of\n * calling {@link runAs} directly. The boot principal (an `enter`, not a `run`) is the depth-0\n * baseline and is never counted.\n */\n\n// State-shaped and reachable from a plugin (a storage plugin registering a deferred-swap flusher, or\n// switching context), so it lives in the global slot: a duplicated plugin-api copy shares one set of\n// quiescers and one depth count rather than splitting them. See ./global-state.ts.\n\n\n\n\n\nconst cs = globalSlot('context-switch', () => ({\n  quiescers: new Set(),\n  depth:     0,\n  flushing:  false,\n}));\n\n/**\n * Register a machine-update flush, run at every quiescent edge (no context active). Flushers MUST be\n * idempotent: a no-op when nothing is pending, since the edge is reached after every operation.\n * Returns an unregister fn. A throwing flusher is isolated — one must not block the others or escape\n * into the operation that triggered the edge.\n */\nexport function onContextQuiesce(flush) {\n  cs.quiescers.add(flush);\n  return () => { cs.quiescers.delete(flush); };\n}\n\n/**\n * Run the registered flushers iff no context is currently active — the quiescent edge. Called by\n * {@link contextSwitch} at both edges, and by the host right after it *queues* a deferred mutation:\n * queued while busy (depth > 0) this no-ops and the exit edge lands it; queued while idle (depth 0)\n * it applies immediately, so an idle-time swap doesn't wait for the next request to take effect.\n */\nexport function flushIfQuiescent() {\n  if (cs.depth !== 0 || cs.flushing) return;\n  cs.flushing = true;\n  try {\n    for (const q of cs.quiescers) {\n      try { q(); }\n      catch (e) { console.error('[matbot] context-quiesce flush threw:', e instanceof Error ? e.message : e); }\n    }\n  } finally {\n    cs.flushing = false;\n  }\n}\n\n/**\n * Switch into the machine as `principal`: land any pending machine mutation (only safe while idle),\n * then run `fn` under the principal. Mirrors {@link runAs}'s sync/async return — when `fn` is async,\n * the context stays open until its promise settles, so the depth count tracks the real operation.\n */\nexport function contextSwitch(principal, fn) {\n  flushIfQuiescent();\n  cs.depth++;\n  const settle = () => { cs.depth--; flushIfQuiescent(); };\n  let result;\n  try {\n    result = runAs(principal, fn);\n  } catch (e) {\n    settle();\n    throw e;\n  }\n  return result instanceof Promise ? (result.finally(settle) ) : (settle(), result);\n}\n",
    "/plugin-api/src/hooks.ts": "\n\n\n\n\nconst HOOK_ERROR_CREATOR = 'matbot-hooks';\n\nexport class HookRegistry {\n    hooks = new Map();\n\n  // A hook handler that *throws* is a failure, not an intentional stop (which is a return value:\n  // `abort` / `rejectTool`). A throw must never propagate out of a run* method — that is what bricked\n  // the turn loop: one misconfigured screen hook (e.g. a provider with an unresolved secret) threw at\n  // the top of every turn, so the model never ran and the user couldn't even invoke a tool to fix it.\n  // So every handler call goes through `invoke`, which catches, logs, and treats the throw as \"the\n  // hook returned nothing\" (skipped). The failure is recorded once per hook (`markedFailures`) and\n  // drained into a marker by the next `runScreen`, so it degrades *visibly* rather than silently.\n    markedFailures = new Set();\n   pendingFailureMarkers = [];\n\n  register(hook) {\n    const list = this.hooks.get(hook.on) ?? [];\n    list.push(hook);\n    list.sort((a, b) => (a.priority ?? 50) - (b.priority ?? 50));\n    this.hooks.set(hook.on, list);\n  }\n\n  removeByPlugin(pluginName) {\n    for (const [point, list] of this.hooks) {\n      this.hooks.set(point, list.filter(h => h.pluginName !== pluginName));\n    }\n  }\n\n  // Backing for the per-call `ctx.removeHook()`: drop one hook by identity. Filtering into a fresh\n  // array (rather than splicing) leaves any in-flight run loop — which iterates the array reference\n  // it captured before the mutation — to finish over the old list; the next run sees the new one.\n  // Idempotent: removing an already-absent hook is a no-op, so calling removeHook() twice is safe.\n   removeOne(point, hook) {\n    const list = this.hooks.get(point);\n    if (list) this.hooks.set(point, list.filter(h => h !== hook));\n  }\n\n  // Run one handler, isolating a throw: log it, record it for a one-time marker, and return undefined\n  // — which every run* method already treats as \"no contribution from this hook\".\n   async invoke(hook, run) {\n    try {\n      return await run();\n    } catch (err) {\n      const message = err instanceof Error ? err.message : String(err);\n      const owner = hook.pluginName !== undefined ? ` from \"${hook.pluginName}\"` : '';\n      console.error(`[matbot] ${hook.on} hook${owner} threw; skipping it for this turn:`, message);\n      if (!this.markedFailures.has(hook)) {\n        this.markedFailures.add(hook);\n        this.pendingFailureMarkers.push({\n          channel: hook.on,\n          ...(hook.pluginName !== undefined ? { pluginName: hook.pluginName } : {}),\n          message,\n        });\n      }\n      return undefined;\n    }\n  }\n\n  // Append a `marker` message for each not-yet-marked hook failure (from any channel) to the session,\n  // then clear the queue. Called from runScreen — the once-per-turn, session-owning channel whose\n  // returned session the runner persists — so failures surface durably and exactly once. Returns the\n  // appended marker content blocks too, so the runner can carry them live (a session reload is the\n  // fallback path, not the only one).\n   drainFailureMarkers(session) {\n    if (this.pendingFailureMarkers.length === 0) return { session, markers: [] };\n    const messages = this.pendingFailureMarkers.map(f => ({\n      id:        crypto.randomUUID(),\n      role:      'marker',\n      createdAt: new Date().toISOString(),\n      traceId:   '',\n      content:   [{\n        type:    'marker',\n        creator: HOOK_ERROR_CREATOR,\n        data:    { channel: f.channel, ...(f.pluginName !== undefined ? { pluginName: f.pluginName } : {}), message: f.message },\n      }],\n    }));\n    this.pendingFailureMarkers = [];\n    return {\n      session: { ...session, messages: [...session.messages, ...messages] },\n      markers: messages.flatMap(m => m.content),\n    };\n  }\n\n  // screen folds across hooks: each sees the session as shaped so far, accumulates ephemeral, and\n  // the first `abort` short-circuits (the partial session is returned so the caller can persist it).\n  async runScreen(ctx) {\n    let session = ctx.session;\n    const ephemeral = [];\n    // Handler-returned markers: appended to the session here (so they persist) and accumulated so the\n    // runner can also emit them live — keeping a live draw and a reload identical.\n    const handlerMarkers = [];\n    const appendMarkers = (blocks) => {\n      handlerMarkers.push(...blocks);\n      session = { ...session, messages: [...session.messages, {\n        id: crypto.randomUUID(), role: 'marker', createdAt: new Date().toISOString(), traceId: '', content: blocks,\n      }] };\n    };\n    // Handler-returned durable context: folded onto the running turn's user message (the last one\n    // with role 'user'), so it persists into history AND rides every subsequent provider call — the\n    // persisted twin of `ephemeral`. Accumulated too, so the runner emits it live as a `robo-user`\n    // event (keeping live draw and reload identical). No user message ⇒ nothing to fold onto, so the\n    // blocks are dropped rather than orphaned (a screen hook only runs when a turn is being submitted,\n    // so a user message is present in practice; this is defensive).\n    const durable = [];\n    const foldDurable = (blocks) => {\n      const idx = session.messages.findLastIndex(m => m.role === 'user');\n      if (idx < 0) return;\n      durable.push(...blocks);\n      session = { ...session, messages: session.messages.map((m, i) =>\n        i === idx ? { ...m, content: [...m.content, ...blocks] } : m) };\n    };\n    for (const hook of this.hooks.get('screen') ?? []) {\n      if (hook.on !== 'screen') continue;\n      const r = await this.invoke(hook, () => hook.handler({ ...ctx, session, removeHook: () => this.removeOne('screen', hook) }));\n      if (!r) continue;\n      if (r.session)                     session = r.session;\n      if (r.ephemeral)                   ephemeral.push(...r.ephemeral);\n      if (r.durable && r.durable.length) foldDurable(r.durable);\n      if (r.markers && r.markers.length) appendMarkers(r.markers);\n      if (r.abort) {\n        const drained = this.drainFailureMarkers(session);\n        return { session: drained.session, ephemeral, durable, markers: [...handlerMarkers, ...drained.markers], abort: r.abort };\n      }\n    }\n    const drained = this.drainFailureMarkers(session);\n    return { session: drained.session, ephemeral, durable, markers: [...handlerMarkers, ...drained.markers] };\n  }\n\n  // contribute folds the outgoing array through each hook — a pure transform pipeline; the stored\n  // session is never touched.\n  async runContribute(ctx) {\n    let outgoing = ctx.outgoing ;\n    for (const hook of this.hooks.get('contribute') ?? []) {\n      if (hook.on !== 'contribute') continue;\n      const r = await this.invoke(hook, () => hook.handler({ ...ctx, outgoing, removeHook: () => this.removeOne('contribute', hook) }));\n      if (r) outgoing = r;\n    }\n    return outgoing;\n  }\n\n  // toolcall stops at the first hook that rejects or aborts; the rest don't run.\n  async runToolCall(ctx) {\n    for (const hook of this.hooks.get('toolcall') ?? []) {\n      if (hook.on !== 'toolcall') continue;\n      const r = await this.invoke(hook, () => hook.handler({ ...ctx, removeHook: () => this.removeOne('toolcall', hook) }));\n      if (r && (r.rejectTool || r.abort)) return r;\n    }\n    return {};\n  }\n\n  // toolresult folds the tool result through each hook — a transform pipeline (redaction, truncation);\n  // a hook that returns nothing just observes (auditing). Returns the final result.\n  async runToolResult(ctx) {\n    let result = ctx.result;\n    for (const hook of this.hooks.get('toolresult') ?? []) {\n      if (hook.on !== 'toolresult') continue;\n      const r = await this.invoke(hook, () => hook.handler({ ...ctx, result, removeHook: () => this.removeOne('toolresult', hook) }));\n      if (r) result = r.result;\n    }\n    return result;\n  }\n\n  // followup runs every hook and collects their resubmissions (each becomes its own head-enqueued\n  // turn), any durable markers (appended to the committed session by the pump), and any\n  // retract-and-rerun requests. A turn can be popped only once, so multiple hooks' retraction\n  // contexts merge into a single redo (in practice only one fires); `retract` is omitted when none did.\n  async runFollowup(ctx) {\n    const resubmits = [];\n    const markers   = [];\n    const retract   = [];\n    for (const hook of this.hooks.get('followup') ?? []) {\n      if (hook.on !== 'followup') continue;\n      const r = await this.invoke(hook, () => hook.handler({ ...ctx, removeHook: () => this.removeOne('followup', hook) }));\n      if (r?.resubmit)        resubmits.push(r.resubmit.content);\n      if (r?.retractAndRerun) retract.push(...r.retractAndRerun.context);\n      if (r?.markers)         markers.push(...r.markers);\n    }\n    return { resubmits, markers, ...(retract.length > 0 ? { retract: { context: retract } } : {}) };\n  }\n}\n",
    "/plugin-api/src/plugin.ts": "\n\n\n\n\n\n\n\nexport const PLUGIN_API_VERSION = '0.1';\n\n// ── Sub-runner types ──────────────────────────────────────────────────────────\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Wrap a services object so every registered service is reachable as a member (`services.InterfaceName`),\n * not only via `services.get('InterfaceName')` — one access surface for base members and plugin-registered\n * services alike. A member read of a key the object doesn't carry falls back to its own `get()` (the\n * registry), so the augmentation that declares `InterfaceName?: InterfaceName` is also the access path;\n * the optional `?` is the single call-site signal of \"may be absent, null-check it\". Assignment throws,\n * directing callers to `register()` (the swap-aware write path). Applied to both the host services object\n * and the per-plugin scoped object, so plugins see the same surface the host does.\n */\nexport function unifyServices(services) {\n  return new Proxy(services, {\n    get(target, key, receiver) {\n      if (Reflect.has(target, key)) return Reflect.get(target, key, receiver);\n      return typeof key === 'string' ? target.get(key ) : undefined;\n    },\n    has(target, key) {\n      if (Reflect.has(target, key)) return true;\n      return typeof key === 'string' && target.get(key ) !== undefined;\n    },\n    set(_target, key) {\n      throw new Error(\n        `Cannot assign services.${String(key)} directly — use services.register('${String(key)}', impl) to register or replace a service.`,\n      );\n    },\n  });\n}\n\n// ── Capture-safe swap proxies ───────────────────────────────────────────────────\n\n\n\n/**\n * A capture-safe forwarding proxy: every trap routes to whatever `getCurrent()` returns *now*, so a\n * reference captured before a register()-driven swap keeps resolving to the live impl. getPrototypeOf\n * is forwarded so `instanceof` sees the real impl (the StorageBackend identity checks depend on it);\n * ownKeys + getOwnPropertyDescriptor keep object spread faithful. Methods bind to the current impl,\n * not the proxy. A nullish current (an optional service with nothing registered yet) reads as empty.\n */\nexport function forwardingProxy(getCurrent) {\n  return new Proxy({} , {\n    get(_t, prop) {\n      const cur = getCurrent();\n      if (cur === undefined) return undefined;\n      const val = Reflect.get(cur, prop, cur);\n      return typeof val === 'function' ? (val ).bind(cur) : val;\n    },\n    has(_t, prop)    { const cur = getCurrent(); return cur !== undefined && Reflect.has(cur, prop); },\n    getPrototypeOf() { const cur = getCurrent(); return cur === undefined ? null : Reflect.getPrototypeOf(cur); },\n    ownKeys()        { const cur = getCurrent(); return cur === undefined ? [] : Reflect.ownKeys(cur); },\n    getOwnPropertyDescriptor(_t, prop) {\n      const cur = getCurrent();\n      if (cur === undefined) return undefined;\n      const d = Reflect.getOwnPropertyDescriptor(cur, prop);\n      if (d !== undefined) d.configurable = true; // Proxy invariant: props absent from the {} target must be configurable.\n      return d;\n    },\n  });\n}\n\n/**\n * Returns [proxy, swap]: the Store/FileStore handle plugins capture, plus the fn register() calls to\n * repoint it at a new backend's store. Built on forwardingProxy so capture-safety is uniform.\n */\nexport function makeSwappable(initial) {\n  let current = initial;\n  return [forwardingProxy(() => current), (next) => { current = next; }];\n}\n\n// ── Mount table ─────────────────────────────────────────────────────────────────\n\n/** The machine with one registry key narrowed to present — what a keyed mount handler receives. */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction reportMountHandlerError(e) {\n  console.error('[matbot] mounted handler threw:', e instanceof Error ? e.message : e);\n}\n\n/**\n * Build a {@link MountTable} over a lazily-read machine. Notifications batch to the quiescent edge\n * ({@link flush}), where each dirty key's net presence (absent→present = mount, present→present =\n * remount, present→absent = committed unload) is multicast to that key's subscribers. The clock holds\n * the last-committed presence per key, so a reload collapses to one remount and a committed unload is\n * well-defined. Presence is read by member access on the unified machine, which resolves both the core\n * getters (StorageBackend/Vault/KnowledgeIndex) and the registry-backed augmented keys.\n */\nexport function createMountTable(getMachine) {\n  const interests = new Map();\n  const committed = new Map();   // last-committed presence per key (the clock)\n  const dirty     = new Set();\n\n  const present = (key) => (getMachine() )[key] !== undefined;\n\n  const run = (fn, machine) => {\n    try {\n      const r = fn(machine);\n      if (r instanceof Promise) r.catch(reportMountHandlerError);\n    } catch (e) { reportMountHandlerError(e); }\n  };\n\n  const mounted = {\n    consume(options, handler) {\n      const { key, replay, signal, onUnmount } = options;\n      if (signal?.aborted === true) return;\n      const interest = {\n        handler:   handler ,\n        onUnmount: onUnmount ,\n        signal,\n      };\n      let set = interests.get(key);\n      if (set === undefined) { set = new Set(); interests.set(key, set); }\n      const subs = set;\n      subs.add(interest);\n      signal?.addEventListener('abort', () => { subs.delete(interest); }, { once: true });\n      // Replay on the next microtask (async-iterator parity — never inline in the consume() frame).\n      // Reads the live machine, not `committed`: replay is \"current state\", separate from the clock.\n      if (replay === true) queueMicrotask(() => {\n        if (signal?.aborted === true) return;\n        if (present(key )) run(interest.handler, getMachine());\n      });\n    },\n  };\n\n  return {\n    mounted,\n    markDirty(key) { dirty.add(key ); },\n    flush() {\n      if (dirty.size === 0) return;\n      const keys = [...dirty];\n      dirty.clear();\n      const machine = getMachine();\n      for (const key of keys) {\n        const before = committed.get(key) ?? false;\n        const after  = present(key);\n        committed.set(key, after);\n        const subs = interests.get(key);\n        if (subs === undefined) continue;\n        if (after) {\n          for (const i of subs) run(i.handler, machine);                                  // mount / remount\n        } else if (before) {\n          for (const i of subs) if (i.onUnmount !== undefined) run(i.onUnmount, machine);  // committed unload\n        }\n      }\n    },\n  };\n}\n\n/**\n * Build the one-message CompletionRequest for a {@link MatbotRuntime.singleTurn} call, hiding the\n * otherwise-mandatory and meaningless Message fields (id/traceId/createdAt) an out-of-band one-shot\n * has no use for. Pure; the host invokes its own complete() with the result.\n */\nexport function singleTurnRequest(req) {\n  return {\n    provider: req.provider,\n    messages: [{\n      id: '', traceId: '', createdAt: new Date().toISOString(), role: 'user',\n      content: [{ type: 'text', text: req.prompt }],\n    }],\n    ...(req.system !== undefined ? { system: req.system } : {}),\n    ...(req.signal !== undefined ? { signal: req.signal } : {}),\n  };\n}\n\n// ── Factory types ─────────────────────────────────────────────────────────────\n\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n",
    "/plugin-api/src/broadcast.ts": "// A minimal multi-subscriber fan-out for AsyncIterable observation streams (tool/plugin/skill watch,\n// and any future plugin-owned CRUD stream). Each subscriber gets its own unbounded queue, so a slow\n// consumer never blocks emit() or its peers. Acceptable because these events are rare and small\n// (registry/document CRUD); this is not a high-throughput data path. emit() is synchronous and never throws.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Wrap a bare subscribe generator into a full {@link Subscribable}, supplying the standard detached\n * `consume` loop. Use for a *derived* stream — e.g. a per-plugin scoped view of a shared broadcaster —\n * that owns its own subscribe generator but wants the same consume ergonomics as a real broadcaster.\n */\nexport function subscribable(subscribe) {\n  const consume = (handler, signal) => {\n    void (async () => {\n      for await (const v of subscribe(signal)) {\n        try { await handler(v); }\n        catch (e) { console.error('[matbot] consume handler threw:', e instanceof Error ? e.message : e); }\n      }\n    })();\n  };\n  return { subscribe, consume };\n}\n\nexport function createBroadcaster() {\n  const subs = new Set();\n\n  const emit = (value) => {\n    for (const sub of subs) {\n      sub.queue.push(value);\n      sub.wake?.();\n    }\n  };\n\n  async function* subscribe(signal) {\n    const sub = { queue: [], wake: undefined, done: false };\n    subs.add(sub);\n    const onAbort = () => { sub.done = true; sub.wake?.(); };\n    signal?.addEventListener('abort', onAbort, { once: true });\n    try {\n      while (true) {\n        while (sub.queue.length > 0) yield sub.queue.shift();\n        if (sub.done || signal?.aborted) return;\n        await new Promise(resolve => { sub.wake = resolve; });\n        sub.wake = undefined;\n      }\n    } finally {\n      subs.delete(sub);\n      signal?.removeEventListener('abort', onAbort);\n    }\n  }\n\n  return { emit, ...subscribable(subscribe) };\n}\n",
    "/plugin-api/src/invoke-tool.ts": "\n\n\n/**\n * Inputs to {@link invokeTool} that a one-shot caller can't derive from the machine. A tool\n * forwarding a call to another tool should pass its own {@link ToolContext} straight through as\n * `opts` — `session`, `signal`, `prompt` and crucially **`provider`** all propagate, so a callee\n * that needs an LLM (e.g. `find_fact`, or anything using `singleTurn`) inherits the same model\n * rather than finding no provider. Only spell out individual fields when starting a call from\n * scratch or deliberately overriding one; never hand-pick a subset of `ctx` and drop the rest.\n */\n \n\n\n\n/**\n * Programmatically invoke a tool by name, the same way the harness does — resolve it off the\n * machine's tool registry, build a `ToolContext` from the machine, and return its event stream.\n * The host-only bits a one-shot caller can't derive (the session under which the call runs, its\n * abort signal, and an optional interactive `prompt`/`provider`) come in via `opts` — pass the\n * calling tool's `ctx` to forward them all (see {@link InvokeToolOptions}); everything else (vault,\n * plugin (un)loading, workdir/configPath/files) is filled from `machine`.\n *\n * Throws synchronously if no tool is registered under `name`. When no `prompt` is supplied the tool\n * runs non-interactively: any attempt to prompt rejects, which a tool surfaces as a normal error\n * event. Pair with {@link toolText} to collapse the stream to its result string.\n */\nexport function invokeTool(\n  machine,\n  name,\n  params,\n  opts,\n) {\n  const tool = machine.tools.resolve(name);\n  if (tool === null) throw new Error(`Tool \"${name}\" is not registered`);\n\n  const prompt = opts.prompt ?? rejectingPrompt;\n  const ctx = {\n    callId:       opts.callId ?? crypto.randomUUID(),\n    session:      opts.session,\n    signal:       opts.signal,\n    vault:        machine.Vault,\n    prompt,\n    loadPlugin:   (specifier, refresh) => machine.loadPlugin(specifier, prompt, refresh),\n    unloadPlugin: (specifier) => machine.unloadPlugin(specifier),\n    ...(opts.provider      !== undefined ? { provider:   opts.provider      } : {}),\n    ...(machine.workdir    !== undefined ? { workdir:    machine.workdir    } : {}),\n    ...(machine.configPath !== undefined ? { configPath: machine.configPath } : {}),\n    ...(machine.files      !== undefined ? { files:      machine.files      } : {}),\n  };\n\n  // The registry is name-keyed and untyped (`ToolExecutor.execute` yields `ToolEvent<unknown>`); the\n  // `ToolContracts` mapping is the call-site contract, asserted here so callers read a typed result.\n  return tool.executor.execute(params, ctx) ;\n}\n\n/**\n * Drain a tool event stream (e.g. {@link invokeTool}'s return) to its raw `result` *value*, typed:\n * paired with `invokeTool(machine, name, …)` it returns whatever `ToolContracts[name]` declares (or\n * `unknown` for an unregistered tool). This is the structured counterpart to {@link toolText} — use it\n * for any tool that returns data; use `toolText` when you want the result collapsed to a string.\n * Stops and throws on the first `error` event, or if the tool finished without yielding a `result`.\n */\nexport async function toolResult(events) {\n  let value;\n  let hadResult = false;\n  for await (const ev of events) {\n    if      (ev.type === 'result') { value = ev.value; hadResult = true; }\n    else if (ev.type === 'error')  { throw new Error(ev.message); }\n  }\n  if (!hadResult) throw new Error('Tool produced no result');\n  return value;\n}\n\n/**\n * Drain a tool event stream (e.g. {@link invokeTool}'s return) to its result as text. Stops and\n * throws on the first `error` event, or if the tool finished without yielding a `result`. The result\n * value is rendered the way the model would see it: a string verbatim, a `{ content: string }`\n * (the shape `skill_action` and other prose tools return) by its `content`, anything else as JSON.\n */\nexport async function toolText(events) {\n  let result;\n  let hadResult = false;\n  for await (const ev of events) {\n    if      (ev.type === 'result') { result = ev.value; hadResult = true; }\n    else if (ev.type === 'error')  { throw new Error(ev.message); }\n  }\n  if (!hadResult) throw new Error('Tool produced no result');\n\n  if (typeof result === 'string') return result;\n  if (result !== null && typeof result === 'object' && typeof (result ).content === 'string') {\n    return (result ).content;\n  }\n  return JSON.stringify(result, null, 2);\n}\n\nconst rejectingPrompt = (((p) => {\n  const label = typeof p === 'string' ? p : p.label;\n  return Promise.reject(new Error(`Non-interactive context: cannot prompt for \"${label}\"`));\n}) );\n",

    "/plugins/providers/anthropic/src/convert.ts": "\n\n// ── Internal Anthropic API types ──────────────────────────────────────────────\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// ── Message conversion ────────────────────────────────────────────────────────\n\nexport function toAnthropicMessages(messages) {\n  const result = [];\n\n  for (const msg of messages) {\n    if (msg.role === 'system') continue;   // handled via system= parameter\n    if (msg.role !== 'user' && msg.role !== 'assistant' && msg.role !== 'tool') continue;\n\n    const role =\n      msg.role === 'tool' ? 'user' : msg.role;\n\n    const content = msg.content.flatMap((c) => {\n      switch (c.type) {\n        case 'text':\n          return [{ type: 'text', text: c.text }];\n        case 'thinking':\n        case 'redacted-thinking':\n          // Anthropic thinking blocks are signed provider-native state, not\n          // portable conversation content. The API accepts them only when the\n          // signature verifies for the exact target request; the neutral message\n          // format does not carry enough information to prove that, so elide\n          // them deterministically rather than sending possibly-invalid input.\n          return [];\n        case 'reasoning':\n          return [];  // OpenAI/DeepSeek reasoning — strip; Anthropic has no equivalent\n        case 'image':\n          return [{ type: 'image', source: { type: 'base64', media_type: c.mimeType, data: c.data } }];\n        case 'image-url':\n          return [{ type: 'image', source: { type: 'url', url: c.url } }];\n        case 'tool-call':\n          return [{ type: 'tool_use', id: c.id, name: c.name, input: c.input  }];\n        case 'tool-result':\n          // `?? null` so a no-result tool (e.g. remember_fact, which yields only a marker) becomes\n          // the string \"null\" rather than JSON.stringify(undefined) → undefined; a tool_result must\n          // carry content.\n          return [{ type: 'tool_result', tool_use_id: c.id,\n            content: JSON.stringify(c.result ?? null),\n            ...(c.isError ? { is_error: true } : {}),\n          }];\n        case 'file-ref':\n          return [{ type: 'text', text: `[Attached file: ${c.name}]` }];\n        case 'document':\n          return [{ type: 'text', text: `[Document: ${c.name ?? c.mimeType}]` }];\n        case 'audio':\n          return [{ type: 'text', text: `[Audio: ${c.mimeType}]` }];\n        case 'refusal':\n        case 'form':\n        case 'form-response':\n        case 'marker':         // opaque UI annotation; transparent to the model\n        case 'unknown-content':\n          return [];\n      }\n    });\n\n    if (content.length > 0) result.push({ role, content });\n  }\n\n  // Cache the second-to-last user turn (stable across the next request)\n  const userTurns = result.reduce((acc, m, i) => {\n    if (m.role === 'user') acc.push(i);\n    return acc;\n  }, []);\n\n  if (userTurns.length >= 2) {\n    const idx  = userTurns[userTurns.length - 2];\n    const turn = result[idx];\n    const last = turn.content[turn.content.length - 1];\n    if (last && last.type === 'text') {\n      (last ).cache_control = { type: 'ephemeral' };\n    }\n  }\n\n  return result;\n}\n\nexport function toAnthropicSystem(messages) {\n  const parts = messages\n    .filter(m => m.role === 'system')\n    .flatMap(m => m.content)\n    .filter(c => c.type === 'text')\n    .map(c => (c ).text);\n\n  return parts.length > 0 ? parts.join('\\n\\n') : undefined;\n}\n\nexport function toAnthropicTools(tools) {\n  const defs = tools.map(t => ({\n    name:         t.name,\n    description:  t.description,\n    input_schema: t.inputSchema,\n  }));\n\n  // Cache tool definitions — they're stable across turns\n  if (defs.length > 0) {\n    defs[defs.length - 1].cache_control = { type: 'ephemeral' };\n  }\n\n  return defs;\n}\n",
    "/plugins/providers/openai-compat/src/convert.ts": "\n\n// ── Internal OpenAI API types ─────────────────────────────────────────────────\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// ── Message conversion ────────────────────────────────────────────────────────\n\n// Prompt caching for OpenAI-compatible providers that honour Anthropic-style breakpoints when\n// routed through OpenRouter (Anthropic / Gemini / Qwen). Opt-in via the provider's `promptCache`\n// parameter — a plain OpenAI or local (ollama/vLLM) endpoint that doesn't understand `cache_control`\n// must never see it, so the default stays the flat OpenAI wire shape. Mirrors the native anthropic\n// adapter: cache the system prefix, the tool defs, and the second-to-last user turn (the newest\n// content is left fresh — it changes next request anyway, so caching it just churns the write).\nfunction markCacheable(msg) {\n  if (typeof msg.content === 'string') {\n    msg.content = [{ type: 'text', text: msg.content, cache_control: { type: 'ephemeral' } }];\n    return;\n  }\n  if (Array.isArray(msg.content)) {\n    for (let i = msg.content.length - 1; i >= 0; i--) {\n      const part = msg.content[i];\n      if (part.type === 'text') { part.cache_control = { type: 'ephemeral' }; return; }\n    }\n  }\n}\n\nfunction applyCacheBreakpoints(result) {\n  for (let i = result.length - 1; i >= 0; i--) {\n    if (result[i].role === 'system') { markCacheable(result[i]); break; }\n  }\n  const userTurns = result.reduce((acc, m, i) => { if (m.role === 'user') acc.push(i); return acc; }, []);\n  if (userTurns.length >= 2) markCacheable(result[userTurns[userTurns.length - 2]]);\n}\n\nexport function toOAIMessages(messages, cache = false) {\n  const result = [];\n\n  for (const msg of messages) {\n    if (msg.role === 'system') {\n      const text = msg.content\n        .filter(c => c.type === 'text')\n        .map(c => (c ).text)\n        .join('\\n\\n');\n      result.push({ role: 'system', content: text });\n      continue;\n    }\n\n    if (msg.role === 'tool') {\n      for (const c of msg.content) {\n        if (c.type === 'tool-result') {\n          result.push({\n            role:         'tool',\n            tool_call_id: c.id,\n            // `?? null` so a no-result tool (e.g. remember_fact, which yields only a marker) becomes\n            // the string \"null\" rather than `JSON.stringify(undefined)` → undefined (a non-string the\n            // API rejects). Every tool message must carry a string content.\n            content:      JSON.stringify(c.result ?? null),\n          });\n        }\n      }\n      continue;\n    }\n\n    if (msg.role !== 'user' && msg.role !== 'assistant') continue;\n\n    const toolCalls = msg.content.filter(c => c.type === 'tool-call');\n    const parts     = msg.content.filter(c => c.type !== 'tool-call');\n\n    const contentParts = parts.flatMap((c) => {\n      switch (c.type) {\n        case 'text':      return [{ type: 'text', text: c.text }];\n        case 'image':     return [{ type: 'image_url', image_url: { url: `data:${c.mimeType};base64,${c.data}` } }];\n        case 'image-url': return [{ type: 'image_url', image_url: { url: c.url, ...(c.detail !== undefined ? { detail: c.detail } : {}) } }];\n        case 'file-ref':  return [{ type: 'text', text: `[Attached file: ${c.name}]` }];\n        case 'document':  return [{ type: 'text', text: `[Document: ${c.name ?? c.mimeType}]` }];\n        case 'audio':     return [{ type: 'text', text: `[Audio: ${c.mimeType}]` }];\n        case 'thinking':\n        case 'redacted-thinking':\n        case 'reasoning':\n        case 'tool-result':    // only in role === 'tool' messages, handled above\n        case 'refusal':\n        case 'form':\n        case 'form-response':\n        case 'marker':         // opaque UI annotation; transparent to the model\n        case 'unknown-content':\n          return [];\n      }\n    });\n\n    let content;\n    const first = contentParts[0];\n    if (contentParts.length === 1 && first !== undefined && first.type === 'text') {\n      content = first.text;  // plain string for text-only messages\n    } else if (contentParts.length > 0) {\n      content = contentParts;\n    }\n\n    // Set `content` only when there is some — never an explicit `null`. The spec makes `content`\n    // optional once `tool_calls` is present, and stricter validators (e.g. gpt-5.x) reject\n    // `\"content\": null` with \"expected a string, got null\". So an assistant tool-call turn with no\n    // text is sent as `{ role, tool_calls }`, content omitted.\n    const oaiMsg = { role: msg.role };\n    if (content !== undefined) oaiMsg.content = content;\n\n    if (toolCalls.length > 0) {\n      oaiMsg.tool_calls = toolCalls.map(c => {\n        if (c.type !== 'tool-call') return null;\n        return {\n          id:       c.id,\n          type:     'function' ,\n          function: { name: c.name, arguments: JSON.stringify(c.input) },\n        };\n      }).filter(Boolean);\n    }\n\n    // Provider-specific reasoning/thinking blocks are intentionally stripped above. If that leaves a\n    // message with neither content nor tool calls, drop it rather than send an empty one.\n    if (oaiMsg.content === undefined && (oaiMsg.tool_calls?.length ?? 0) === 0) continue;\n\n    result.push(oaiMsg);\n  }\n\n  if (cache) applyCacheBreakpoints(result);\n  return result;\n}\n\nexport function toOAITools(tools, cache = false) {\n  const defs = tools.map(t => ({\n    type:     'function' ,\n    function: { name: t.name, description: t.description, parameters: t.inputSchema },\n  }));\n  // Tool defs are stable across turns — cache them too (last breakpoint covers the whole array).\n  if (cache && defs.length > 0) defs[defs.length - 1].cache_control = { type: 'ephemeral' };\n  return defs;\n}\n",
    "/core/src/config/yaml.ts": "/**\n * Minimal YAML parser for matbot config files.\n *\n * Supports:\n *   - Nested block mappings (key: value / key: followed by indented block)\n *   - Block sequences (- item)\n *   - Scalar types: string, number, boolean, null\n *   - Quoted strings (single and double)\n *   - Comments (# ...)\n *\n * Does NOT support anchors, aliases, flow syntax, or ${NAME} expansion.\n * ${NAME} placeholders are left intact for the Vault to resolve.\n * Supports literal block scalars (|) and folded block scalars (>).\n */\n\n\n\n\n\n\n\n\n\n\nfunction tokenize(text) {\n  const tokens = [];\n  for (const line of text.split('\\n')) {\n    const stripped = line.replace(/#.*$/, '').trimEnd();\n    if (stripped.trim() === '') continue;\n    const indent = stripped.length - stripped.trimStart().length;\n    tokens.push({ indent, raw: stripped.trimStart() });\n  }\n  return tokens;\n}\n\nfunction parseScalar(raw) {\n  if ((raw.startsWith('\"') && raw.endsWith('\"')) ||\n      (raw.startsWith(\"'\") && raw.endsWith(\"'\"))) {\n    return raw.slice(1, -1);\n  }\n\n  if (raw === 'null' || raw === '~') return null;\n  if (raw === 'true')  return true;\n  if (raw === 'false') return false;\n\n  const num = Number(raw);\n  if (!Number.isNaN(num) && raw !== '') return num;\n\n  return raw;\n}\n\nfunction parse(tokens, pos, baseIndent) {\n  if (pos >= tokens.length) return { value: null, next: pos };\n\n  const first = tokens[pos];\n\n  if (first.raw.startsWith('- ')) {\n    const items = [];\n    let i = pos;\n    while (i < tokens.length) {\n      const tok = tokens[i];\n      if (tok.indent < first.indent) break;\n      if (tok.indent === first.indent && tok.raw.startsWith('- ')) {\n        const itemRaw = tok.raw.slice(2).trim();\n        if (itemRaw === '') {\n          const sub = parse(tokens, i + 1, tok.indent + 2);\n          items.push(sub.value);\n          i = sub.next;\n        } else {\n          items.push(parseScalar(itemRaw));\n          i++;\n        }\n      } else {\n        break;\n      }\n    }\n    return { value: items, next: i };\n  }\n\n  if (first.raw.includes(':')) {\n    const map = {};\n    let i = pos;\n    while (i < tokens.length) {\n      const tok = tokens[i];\n      if (tok.indent < baseIndent) break;\n      if (!tok.raw.includes(':')) break;\n\n      const colonIdx = tok.raw.indexOf(':');\n      const key      = tok.raw.slice(0, colonIdx).trim();\n      const rest     = tok.raw.slice(colonIdx + 1).trimStart();\n\n      if (rest === '|' || rest === '>') {\n        const blockIndent = tok.indent + 2;\n        const lines = [];\n        let j = i + 1;\n        while (j < tokens.length && tokens[j].indent >= blockIndent) {\n          const t = tokens[j];\n          lines.push(' '.repeat(t.indent - blockIndent) + t.raw);\n          j++;\n        }\n        map[key] = rest === '|'\n          ? lines.join('\\n') + (lines.length > 0 ? '\\n' : '')\n          : lines.join(' ');\n        i = j;\n      } else if (rest === '') {\n        const sub = parse(tokens, i + 1, tok.indent + 2);\n        map[key]  = sub.value;\n        i         = sub.next;\n      } else {\n        map[key] = parseScalar(rest);\n        i++;\n      }\n    }\n    return { value: map, next: i };\n  }\n\n  return { value: parseScalar(first.raw), next: pos + 1 };\n}\n\nexport function parseYaml(text) {\n  const tokens = tokenize(text);\n  if (tokens.length === 0) return {};\n  const { value } = parse(tokens, 0, 0);\n  return (typeof value === 'object' && value !== null && !Array.isArray(value))\n    ? value \n    : {};\n}\n",
    "/core/src/config/loader.ts": "\nimport { parseYaml, } from './yaml.js';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction asString(v, label) {\n  if (typeof v === 'string') return v;\n  throw new Error(`Config: expected string for \"${label}\", got ${v === undefined ? 'undefined' : typeof v}`);\n}\n\nfunction asRecord(v, label) {\n  if (typeof v === 'object' && v !== null && !Array.isArray(v)) return v ;\n  throw new Error(`Config: expected mapping for \"${label}\", got ${v === undefined ? 'undefined' : typeof v}`);\n}\n\nfunction toModelParameters(raw) {\n  const params = {};\n  for (const [k, v] of Object.entries(raw)) {\n    params[k] = v ;\n  }\n  return params;\n}\n\nfunction toProviderConfig(name, raw) {\n  const module_ = asString(raw['module'], `providers.${name}.module`);\n  const model   = asString(raw['model'],  `providers.${name}.model`);\n\n  const credsRaw   = raw['credentials'];\n  const credentials = {};\n  if (credsRaw !== undefined) {\n    const credsMap = asRecord(credsRaw, `providers.${name}.credentials`);\n    for (const [k, v] of Object.entries(credsMap)) {\n      credentials[k] = asString(v, `providers.${name}.credentials.${k}`);\n    }\n  }\n\n  const config = { name, module: module_, model, credentials };\n\n  if (raw['endpoint'] !== undefined) {\n    config.endpoint = asString(raw['endpoint'], `providers.${name}.endpoint`);\n  }\n  if (raw['fallback'] !== undefined) {\n    config.fallback = asString(raw['fallback'], `providers.${name}.fallback`);\n  }\n  if (raw['parameters'] !== undefined) {\n    config.parameters = toModelParameters(asRecord(raw['parameters'], `providers.${name}.parameters`));\n  }\n\n  return config;\n}\n\nexport function parseConfig(\n  text,\n  base,\n) {\n  const derived = parseYaml(text);\n  const doc = base !== undefined\n    ? { ...parseYaml(base), ...derived }\n    : derived;\n\n  // plugins: optional ordered list of specifiers\n  const pluginsRaw = doc['plugins'];\n  const plugins = [];\n  if (pluginsRaw !== undefined && pluginsRaw !== null) {\n    if (!Array.isArray(pluginsRaw)) {\n      throw new Error('Config: \"plugins\" must be a sequence (list)');\n    }\n    for (let i = 0; i < pluginsRaw.length; i++) {\n      plugins.push(asString(pluginsRaw[i], `plugins[${i}]`));\n    }\n  }\n\n  const providersRaw = doc['providers'];\n  const providers    = new Map();\n\n  if (providersRaw !== undefined && providersRaw !== null) {\n    const providersMap = asRecord(providersRaw, 'providers');\n    for (const [name, raw] of Object.entries(providersMap)) {\n      providers.set(name, toProviderConfig(name, asRecord(raw, `providers.${name}`)));\n    }\n  }\n\n  const prompt           = typeof doc['prompt']            === 'string' ? doc['prompt']            : undefined;\n  const ephemeral        = doc['ephemeral'] === true ? true : undefined;\n  const defaultProvider  = typeof doc['default_provider'] === 'string' ? doc['default_provider']  : undefined;\n  const principal        = toPrincipal(doc['principal']);\n\n  return {\n    plugins,\n    providers,\n    ...(prompt           !== undefined ? { prompt           } : {}),\n    ...(ephemeral        !== undefined ? { ephemeral        } : {}),\n    ...(defaultProvider  !== undefined ? { defaultProvider  } : {}),\n    ...(principal        !== undefined ? { principal        } : {}),\n  };\n}\n\n// principal: either a bare string id (type defaults to 'user') or a mapping { id, type? }.\nfunction toPrincipal(v) {\n  if (v === undefined) return undefined;\n  if (typeof v === 'string') return { id: v, type: 'user' };\n  if (typeof v === 'object' && !Array.isArray(v)) {\n    const id   = (v )['id'];\n    const type = (v )['type'];\n    if (typeof id === 'string' && id !== '') {\n      return { id, type: type === 'agent' || type === 'system' ? type : 'user' };\n    }\n  }\n  throw new Error('Config: \"principal\" must be a string id or a mapping with a string \"id\" (and optional \"type\").');\n}\n",
    "/core/src/security/vault.ts": "\nimport { missingSecretError, applyCreateSecret } from '@matatbread/matbot-plugin-api';\n\nconst REF_RE = /\\$\\{([^}]+)\\}/g;\n\n/**\n * Default vault implementation: a single flat namespace of secrets keyed by name.\n *\n * Resolves ${NAME} placeholders by looking up `NAME`. There is no env/secret distinction —\n * an env var is simply a secret whose name happens to be its env-var name. A backend may\n * privately treat some prefixes specially, but the placeholder syntax and this interface do not.\n *\n * The caller loads any backing store (e.g. a .env file) into the snapshot passed to the\n * constructor; persistence beyond the current process is a subclass concern (see EnvFileVault).\n */\nexport class VaultImpl  {\n    store = new Map();\n\n  constructor(\n    secrets,\n    env,\n  ) {\n    if (secrets) {\n      for (const [k, v] of Object.entries(secrets)) {\n        this.store.set(k, v);\n      }\n    }\n    if (env) {\n      for (const [k, v] of Object.entries(env)) {\n        if (v !== undefined && !this.store.has(k)) this.store.set(k, v);\n      }\n    }\n  }\n\n  createSecret(name, value) {\n    return applyCreateSecret(this, name, value);\n  }\n\n  async writeSecret(name, value) {\n    if (value === '') this.store.delete(name);\n    else this.store.set(name, value);\n  }\n\n  hasKey(name) {\n    return this.store.has(name);\n  }\n\n  findByValue(value) {\n    for (const [k, v] of this.store) if (v === value) return k;\n    return undefined;\n  }\n\n  async resolve(ref) {\n    const errors = [];\n\n    const result = ref.replace(REF_RE, (_, name) => {\n      const value = this.store.get(name);\n      if (value === undefined) { errors.push(name); return ''; }\n      return value;\n    });\n\n    if (errors.length > 0) {\n      throw missingSecretError(errors);\n    }\n    return result;\n  }\n\n  scrub(text) {\n    let result = text;\n    for (const value of this.store.values()) {\n      if (value.length >= 4) {\n        result = result.split(value).join('[REDACTED]');\n      }\n    }\n    return result;\n  }\n}\n",
    "/core/src/security/grants.ts": "\n\n/** Convenience: the system principal — the origin for operations not driven by an external user. */\nexport function systemPrincipal(id = 'system') {\n  return { id, type: 'system' };\n}\n",
    "/core/src/knowledge/lookup-knowledge-index.ts": "\n\n// In-memory KnowledgeIndex for development and environments without a persistent/reranking\n// backend. Entries are held in a Set; search scores each entry across its curated metadata\n// (entities, tags, summary) as well as its content, then returns the clear winners.\n//\n// Scoring rationale — the metadata is the signal, the body is the tie-breaker. A curated entity\n// match is the strongest evidence an entry is *about* a term; a heading is next; the summary is a\n// tight, deliberately-written description; raw body text is the weakest (it is incidental and\n// length-biased — a long document mentions everything). Body occurrences are therefore saturated\n// (tf/(tf+k)), so a wordy entry can't win on sheer volume of passing mentions over a short entry\n// whose curated entities name the term outright. This deliberately does NOT weight by\n// procedural/informational class: that is not a relevance signal (a how-to about X is a fair match\n// for X) — it lives on the entry as metadata for other consumers, not here.\nconst WEIGHT = {\n  entityExact: 10,  // the term IS a curated entity — strongest evidence\n  entityFuzzy:  4,  // the term is only a substring of an entity (\"matt\" in \"plant matter\") — weaker\n  tag:          4,\n  summary:      3,  // per occurrence, capped (the summary is short, so this is naturally bounded)\n  headingH1:    8,\n  headingH2:    5,\n  headingH3:    3,\n  body:         2,  // multiplied by a 0–1 saturation factor, so this is the per-term ceiling\n} ;\n\n// Body term-frequency saturation: contribution = WEIGHT.body * tf/(tf + BODY_K). Diminishing\n// returns past a couple of mentions keep long documents from dominating on raw count.\nconst BODY_K = 3;\n\n// Returned window: the clear winners by cumulative-score coverage, but always offer at least MIN\n// alternatives (when they exist) so a consumer can re-rank/filter, and never more than MAX.\nconst COVERAGE = 0.5;\nconst MIN_RESULTS = 3;\nconst MAX_RESULTS = 10;\n\nfunction escapeRegExp(s) {\n  return s.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&');\n}\n\n// Whole-word occurrence count, for free text (content, summary). Word-boundary matching avoids the\n// substring trap — \"matt\" must not match \"matter\", \"owl\" must not match \"fowl\" — that plain\n// indexOf() falls into. A multi-word term (\"inner voice\") is matched as a phrase.\nfunction countWordMatches(haystack, term) {\n  const m = haystack.match(new RegExp(`\\\\b${escapeRegExp(term)}\\\\b`, 'g'));\n  return m ? m.length : 0;\n}\n\n// Looser, substring-in-either-direction match for CURATED fields (entities, tags), where fuzziness\n// is wanted: \"matt\" should match the entity \"Matthew Woolf\", \"volvo\" the entity \"my volvo\". Guarded\n// so the contained string is at least 3 chars, keeping \"us\" out of \"user\"/\"bus\".\nfunction fuzzyMatch(a, b) {\n  if (a === b) return true;\n  if (b.length >= 3 && a.includes(b)) return true;\n  if (a.length >= 3 && b.includes(a)) return true;\n  return false;\n}\n\nfunction headingWeight(level) {\n  if (level === 1) return WEIGHT.headingH1;\n  if (level === 2) return WEIGHT.headingH2;\n  return WEIGHT.headingH3;\n}\n\nfunction scoreContent(content, term) {\n  let headingScore = 0;\n  let bodyTf = 0;\n  for (const line of content.split('\\n')) {\n    const m = /^(#{1,3})(?!#)\\s+(.+)/.exec(line);\n    if (m) {\n      if (countWordMatches(m[2].toLowerCase(), term) > 0) headingScore += headingWeight(m[1].length);\n    } else {\n      bodyTf += countWordMatches(line.toLowerCase(), term);\n    }\n  }\n  const bodyScore = bodyTf > 0 ? WEIGHT.body * (bodyTf / (bodyTf + BODY_K)) : 0;\n  return headingScore + bodyScore;\n}\n\nfunction scoreEntry(entry, terms) {\n  const entities = entry.entities.map(e => e.toLowerCase());\n  const tags     = entry.tags.map(t => t.toLowerCase());\n  const summary  = entry.summary.toLowerCase();\n  let score = 0;\n  for (const { term } of terms) {\n    const t = term.toLowerCase().trim();\n    if (t.length < 2) continue;\n    // Best single entity match for this term: exact beats fuzzy-substring, and we don't stack\n    // multiple entity hits for one term (one entity naming the term is the signal, not how many).\n    if (entities.includes(t)) score += WEIGHT.entityExact;\n    else if (entities.some(e => fuzzyMatch(e, t))) score += WEIGHT.entityFuzzy;\n    if (tags.some(g => fuzzyMatch(g, t))) score += WEIGHT.tag;\n    const sf = countWordMatches(summary, t);\n    if (sf > 0) score += WEIGHT.summary * Math.min(sf, 2);\n    score += scoreContent(entry.content, t);\n  }\n  return score;\n}\n\nexport class LookupKnowledgeIndex  {\n   docs = new Set();\n\n  entries() {\n    return this.docs;\n  }\n\n  async index(entry) {\n    // Replace any existing entry with the same id.\n    for (const existing of this.docs) {\n      if (existing.id === entry.id) {\n        this.docs.delete(existing);\n        break;\n      }\n    }\n    this.docs.add(entry);\n  }\n\n  async remove(id) {\n    for (const existing of this.docs) {\n      if (existing.id === id) {\n        this.docs.delete(existing);\n        return;\n      }\n    }\n  }\n\n  async search(\n    terms,\n    _signal,\n  ) {\n    if (terms.length === 0) return [];\n\n    const scored = [];\n    for (const entry of this.docs) {\n      const score = scoreEntry(entry, terms);\n      if (score > 0) scored.push({ entry, score });\n    }\n    scored.sort((a, b) => b.score - a.score);\n\n    const total = scored.reduce((sum, r) => sum + r.score, 0);\n    if (total <= 0) return [];\n\n    const target = total * COVERAGE;\n    const top = [];\n    let cumulative = 0;\n    for (const { entry, score } of scored) {\n      top.push(entry);\n      cumulative += score;\n      if (top.length >= MAX_RESULTS) break;\n      if (top.length >= MIN_RESULTS && cumulative >= target) break;\n    }\n    return top;\n  }\n}\n",
    "/plugin-api/src/global-state.ts": "/**\n * Process-global home for matbot's **state-shaped** singletons.\n *\n * A skewed install can load two physical copies of plugin-api (a plugin bundling its own copy at a\n * version that doesn't dedupe with the host's). Module-level state then splits: the host mutates one\n * copy's state, a plugin reads the other's, and the two never agree. Anchoring that state on\n * `globalThis` under one well-known key collapses every copy onto a single shared object, so\n * duplication becomes *benign* rather than corrupting.\n *\n * This handles state — Sets, Maps, counters-in-a-container. It deliberately does NOT cover\n * identity-shaped things (class `instanceof`): a class object is per-copy and can't be shared this\n * way, which is why plugin-api's typed errors are brand-based instead (see ./errors.ts). And the\n * principal carrier predates this module and stays on its own established `Symbol.for` key for\n * backward compatibility with already-published copies — moving it would re-split it in mixed\n * version trees, the exact bug it fixes. See docs/duplicate-singletons.md.\n *\n * Keyed by a registered `Symbol.for` so the lookup is identical across every module copy and\n * resistant to accidental string-key clashes on `globalThis`.\n */\n\nconst KEY = Symbol.for('@matatbread/matbot.globalState');\n\n\n\nfunction bag() {\n  const g = globalThis ;\n  return (g[KEY] ??= {});\n}\n\n/**\n * Return the shared slot named `name`, creating it from `init` on first access. Every copy of every\n * module that asks for the same `name` gets the same object back, so the state is singular however\n * many physical copies are loaded. `init` must produce a *container* (object/Map/Set) — primitives\n * can't be shared by reference, so counters live as fields inside a container.\n */\nexport function globalSlot(name, init) {\n  const b = bag();\n  return (b[name] ??= init()) ;\n}\n",
    "/core/src/storage-base/query/index.ts": "export { getField, pathSegments } from './access.js';\nexport { compileFilter }           from './compile.js';\nexport { validateQuery }           from './validate.js';\nexport { applySort }               from './sort.js';\nexport { encodeCursor, decodeCursor, } from './paginate.js';\nexport { executeQuery }            from './execute.js';\n",
    "/core/src/providers-base/sse.ts": "// Parses a Server-Sent Events stream into data payloads.\n// Uses only Web APIs (ReadableStream, TextDecoder) — works in Node 24+ and browsers.\nexport async function* parseSSE(body) {\n  const reader  = body.getReader();\n  const decoder = new TextDecoder();\n  let   buffer  = '';\n\n  try {\n    while (true) {\n      const { done, value } = await reader.read();\n      if (done) break;\n\n      buffer += decoder.decode(value, { stream: true });\n\n      let nl;\n      while ((nl = buffer.indexOf('\\n')) !== -1) {\n        const line = buffer.slice(0, nl).trimEnd();\n        buffer = buffer.slice(nl + 1);\n        if (line.startsWith('data: ')) {\n          const data = line.slice(6);\n          if (data !== '[DONE]') yield data;\n        }\n      }\n    }\n  } finally {\n    reader.releaseLock();\n  }\n}\n",
    "/core/src/storage-base/query/access.ts": "\n\nexport function pathSegments(field) {\n  return Array.isArray(field) ? field : [field];\n}\n\n// Null-safe traversal (the grammar's implicit `?.`): any absent or non-object segment\n// short-circuits to undefined and never throws. A present `null` is returned as-is.\nexport function getField(row, segments) {\n  let cur = row;\n  for (const seg of segments) {\n    if (cur === null || typeof cur !== 'object') return undefined;\n    cur = (cur )[seg];\n  }\n  return cur;\n}\n",
    "/core/src/storage-base/query/compile.ts": "\nimport { getField, pathSegments } from './access.js';\n\n\n\n// null and absent collapse to a single \"missing\" state — no comparison ever matches a missing\n// value (so `neq` excludes missing rows too). Only `exists` observes missing-ness.\nfunction resolve(row, seg) {\n  const v = getField(row, seg);\n  return v === null ? undefined : v;\n}\n\n// Ordering is defined only within a type (numeric for numbers, codepoint for strings). A\n// cross-type comparison yields undefined → the predicate is false (type-mismatch no-match).\nfunction order(a, b) {\n  if (typeof a === 'number' && typeof b === 'number') return a - b;\n  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;\n  return undefined;\n}\n\n// Compile the AST to a composed closure — the same one-pass \"compile to native\" the SQL/ES\n// backends do, with JS closures as the target. No `eval`/`new Function`: CSP-safe, and operands\n// are captured as data so there is no injection surface.\nexport function compileFilter(f) {\n  switch (f.op) {\n    case 'and': { const ps = f.clauses.map(compileFilter); return r => ps.every(p => p(r)); }\n    case 'or':  { const ps = f.clauses.map(compileFilter); return r => ps.some(p => p(r)); }\n    case 'not': { const p = compileFilter(f.clause); return r => !p(r); }\n\n    case 'eq':  { const seg = pathSegments(f.field), v = f.value; return r => resolve(r, seg) === v; }\n    case 'neq': { const seg = pathSegments(f.field), v = f.value; return r => { const x = resolve(r, seg); return x !== undefined && x !== v; }; }\n    case 'lt':  { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c < 0; }; }\n    case 'lte': { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c <= 0; }; }\n    case 'gt':  { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c > 0; }; }\n    case 'gte': { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c >= 0; }; }\n    case 'in':  { const seg = pathSegments(f.field), vs = f.value ; return r => { const x = resolve(r, seg); return x !== undefined && vs.includes(x); }; }\n    case 'nin': { const seg = pathSegments(f.field), vs = f.value ; return r => { const x = resolve(r, seg); return x !== undefined && !vs.includes(x); }; }\n    case 'exists':         { const seg = pathSegments(f.field), want = f.value; return r => (resolve(r, seg) !== undefined) === want; }\n    case 'stringContains': { const seg = pathSegments(f.field), v = f.value; return r => { const x = resolve(r, seg); return typeof x === 'string' && x.includes(v); }; }\n    case 'arrayContains':  { const seg = pathSegments(f.field), v = f.value; return r => { const x = getField(r, seg); return Array.isArray(x) && (x ).includes(v); }; }\n  }\n}\n",
    "/core/src/storage-base/query/validate.ts": "\nimport { StoreQueryError } from '@matatbread/matbot-plugin-api';\n\n// Validate the query at the boundary, before any backend touches data, and throw a located,\n// detailed StoreQueryError so an LLM author can fix the offending clause and retry. Input is\n// treated as untrusted (LLM/JSON-sourced) — the static types are only a convenience for callers.\n\nfunction isComparable(v) {\n  return typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';\n}\n\nfunction requireComparable(v, ptr, op) {\n  if (v === null)\n    throw new StoreQueryError(`'${op}' cannot compare to null — use { op: 'exists', value: false } to match absent-or-null`, ptr, 'NULL_OPERAND');\n  if (!isComparable(v))\n    throw new StoreQueryError(`'${op}' requires a string|number|boolean value`, ptr, 'OPERAND_TYPE');\n}\n\nfunction requireOrderable(v, ptr, op) {\n  if (v === null)\n    throw new StoreQueryError(`'${op}' cannot compare to null — use { op: 'exists', value: false }`, ptr, 'NULL_OPERAND');\n  if (typeof v !== 'string' && typeof v !== 'number')\n    throw new StoreQueryError(`'${op}' requires a string|number value`, ptr, 'OPERAND_TYPE');\n}\n\nfunction validateField(field, ptr) {\n  if (typeof field === 'string') {\n    if (field.length === 0) throw new StoreQueryError('field path is empty', ptr, 'EMPTY_FIELD');\n    return;\n  }\n  if (Array.isArray(field)) {\n    if (field.length === 0) throw new StoreQueryError('field path has no segments', ptr, 'EMPTY_FIELD');\n    field.forEach((s, i) => {\n      if (typeof s !== 'string' || s.length === 0)\n        throw new StoreQueryError('field path segment must be a non-empty string', `${ptr}/${i}`, 'EMPTY_FIELD');\n    });\n    return;\n  }\n  throw new StoreQueryError('field must be a string or array of strings', ptr, 'MALFORMED');\n}\n\nfunction validateFilter(f, ptr) {\n  if (f === null || typeof f !== 'object' || typeof (f ).op !== 'string')\n    throw new StoreQueryError('     "/core/src/storage-base/query/sort.ts": "\nimport { getField, pathSegments } from './access.js';\n\n// Compares two resolved field values. Missing (undefined/null) sorts last; numbers compare\n// numerically, everything else by string codepoint order.\nfunction compareValues(a, b) {\n  if (a === b) return 0;\n  const am = a === undefined || a === null;\n  const bm = b === undefined || b === null;\n  if (am || bm) return am ? (bm ? 0 : 1) : -1;\n  if (typeof a === 'number' && typeof b === 'number') return a - b;\n  const as = String(a), bs = String(b);\n  return as < bs ? -1 : as > bs ? 1 : 0;\n}\n\n// Sorts by the requested specs, then appends `id` as a final tiebreaker so the order is always\n// total — without which an opaque cursor over the result could not point at a stable boundary.\nexport function applySort(docs, sort) {\n  const compiled = [...(sort ?? []), { field: 'id', dir: 'asc'  }]\n    .map(s => ({ seg: pathSegments(s.field), sign: s.dir === 'desc' ? -1 : 1 }));\n\n  return [...docs].sort((a, b) => {\n    for (const { seg, sign } of compiled) {\n      const c = compareValues(getField(a, seg), getField(b, seg));\n      if (c !== 0) return c * sign;\n    }\n    return 0;\n  });\n}\n",

    "/core/src/storage-base/query/execute.ts": "\nimport { validateQuery } from './validate.js';\nimport { compileFilter } from './compile.js';\nimport { applySort } from './sort.js';\nimport { encodeCursor, decodeCursor, } from './paginate.js';\n\nfunction toQuery(p) {\n  return {\n    ...(p.where !== undefined ? { where: p.where } : {}),\n    ...(p.sort  !== undefined ? { sort:  p.sort  } : {}),\n    ...(p.limit !== undefined ? { limit: p.limit } : {}),\n  };\n}\n\n// Reference in-memory execution: validate → filter → totally-order → paginate. Backends that load\n// all documents into memory (filesystem, IndexedDB, sqlite-as-blob) delegate here; a pushdown\n// backend would instead compile the same StoreQuery to its native query language.\n//\n// A cursor is self-contained: it carries the query, sort, page size, and position, so a caller can\n// page by sending only the cursor back. When a cursor is present it fully determines the page —\n// any where/sort/limit passed alongside it are ignored — which is what makes consecutive pages a\n// disjoint cover (page N re-applies the same sort as page 1, so the total order never shifts). A\n// cursor is untrusted input, so its decoded query is validated exactly like a fresh one.\nexport function executeQuery(docs, q) {\n  // Validate the caller's RAW query first. The projection below keeps only where/sort/limit, so an\n  // unknown top-level key (e.g. `filter` instead of `where`) would otherwise be silently discarded\n  // and the query would degrade to match-everything with no feedback to the author.\n  validateQuery(q);\n\n  const page = q.cursor !== undefined\n    ? decodeCursor(q.cursor)\n    : {\n        offset: 0,\n        ...(q.where !== undefined ? { where: q.where } : {}),\n        ...(q.sort  !== undefined ? { sort:  q.sort  } : {}),\n        ...(q.limit !== undefined ? { limit: q.limit } : {}),\n      };\n\n  // A cursor is untrusted input, so its decoded query is validated exactly like a fresh one.\n  if (q.cu
