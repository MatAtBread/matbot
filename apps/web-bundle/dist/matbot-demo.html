    "/plugins/http/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\n\n\n\n\n\n\n\nconst executor = {\n  async *execute(input, ctx) {\n    const { url, method = 'GET', headers = {}, body, responseType = 'text' } = input ;\n\n    let res;\n    try {\n      res = await fetch(url, {\n        method,\n        headers,\n        ...(body !== undefined ? { body } : {}),\n        signal: ctx.signal,\n      });\n    } catch (e) {\n      yield { type: 'error', message: String(e) };\n      return;\n    }\n\n    let text;\n    try {\n      text = await res.text();\n    } catch (e) {\n      yield { type: 'error', message: `Failed to read response: ${String(e)}` };\n      return;\n    }\n\n    if (!res.ok) {\n      yield { type: 'error', message: `HTTP ${res.status}: ${text}`, code: res.status };\n      return;\n    }\n\n    if (responseType === 'json') {\n      try {\n        yield { type: 'result', value: JSON.parse(text)  };\n      } catch (e2) {\n        yield { type: 'error', message: `Non-JSON response: ${text.slice(0, 200)}` };\n      }\n    } else {\n      yield { type: 'result', value: text };\n    }\n  },\n};\n\nexport const httpTool = {\n  name:        'http',\n  description: 'Make an HTTP request and return the response body.',\n  inputSchema: {\n    type:       'object',\n    required:   ['url'],\n    properties: {\n      url:          { type: 'string', description: 'The URL to request.' },\n      method:       { type: 'string', enum: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH'], default: 'GET' },\n      headers:      { type: 'object', additionalProperties: { type: 'string' } },\n      body:         { type: 'string', description: 'Request body for POST/PUT/PATCH.' },\n      responseType: { type: 'string', enum: ['text', 'json'], default: 'text' },\n    },\n  },\n  executor,\n};\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  tools:      [httpTool],\n};\n",
    "/plugins/ask-user/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\nconst MAX_OPTIONS = 10;\nconst VALID_TYPES = ['text', 'password', 'select', 'confirm'];\n\nconst executor = {\n  async *execute(input, ctx) {\n    const field = input ;\n\n    if (!field.name || typeof field.name !== 'string') {\n      yield { type: 'error', message: 'Missing required field \"name\" (string).' };\n      return;\n    }\n    if (!field.label || typeof field.label !== 'string') {\n      yield { type: 'error', message: 'Missing required field \"label\" (string).' };\n      return;\n    }\n    if (!(VALID_TYPES ).includes(field.type)) {\n      yield { type: 'error', message: `Invalid type \"${field.type}\"; must be one of: ${VALID_TYPES.join(', ')}.` };\n      return;\n    }\n    if (field.type === 'select') {\n      if (!Array.isArray(field.options) || field.options.length === 0) {\n        yield { type: 'error', message: 'type \"select\" requires a non-empty \"options\" array.' };\n        return;\n      }\n      if (field.options.length > MAX_OPTIONS) {\n        yield { type: 'error', message: `Too many options (${field.options.length}); maximum is ${MAX_OPTIONS}.` };\n        return;\n      }\n    }\n\n    try {\n      const answer = await ctx.prompt(field);\n      yield { type: 'result', value: { name: field.name, answer } };\n    } catch (e) {\n      yield { type: 'error', message: String(e) };\n    }\n  },\n};\n\nexport const askUserTool = {\n  name: 'ask_user',\n  description: `Use this tool when you need the user to choose, confirm, or supply a value\n   before proceeding. The frontend renders the question as an interactive control.\n\n## Input contract\n\\`\\`\\`typescript\ninterface FormField {\n  name:        string;   // machine-readable key for the response\n  label:       string;   // the question text shown to the user\n  type:        'text' | 'password' | 'select' | 'confirm';\n  options?:    string[]; // required when type is 'select' — mutually exclusive choices\n  allowOther?: boolean;  // select-only: also let the user type a free-form answer\n  default?:    string;   // pre-filled or pre-selected value\n  required?:   boolean;  // if true, user must supply a non-empty value\n  cancelable?: boolean;  // default true; set false to forbid cancelling (see below)\n}\n\\`\\`\\`\n\n## Field types\n\n- **text** — free-form text input. Use for open-ended questions.\n- **password** — masked text input. Use for secrets, API keys, tokens (the value is not displayed).\n- **select** — mutually exclusive pick from \\`options\\`. Use for multiple-choice questions. The frontend renders options as buttons or a dropdown. Set \\`allowOther: true\\` to also offer a free-text answer when your options may not cover every case.\n- **confirm** — yes/no confirmation. Use for irreversible actions. The frontend renders as a confirm/cancel dialog. Returns \"Yes\" or \"No\".\n\n## Declining vs cancelling\n\nThese are different and you should design for the first one. If the user might legitimately say \"no thanks\", \"skip\", or \"I don't know\", offer that as one of your \\`options\\` (or a \\`confirm\\`) — you get the choice back as a normal answer and branch on it. Only omit such an option when an answer is genuinely required (e.g. a password with no fallback).\n\n\\`cancelable\\` is unrelated: it controls whether the frontend shows a \"give up entirely\" affordance. Cancelling is not an answer — it abandons the whole operation and returns control to the user, and this tool reports it as an error. Leave \\`cancelable\\` at its default (true); set it false only for a prompt the user must not be able to escape.\n\n## Examples\n\n\\`\\`\\`json\n// Multiple-choice question (4 mutually exclusive options)\n{\n  \"name\": \"skill\",\n  \"label\": \"If you could instantly master any skill, which would you choose?\",\n  \"type\": \"select\",\n  \"options\": [\n    \"Playing a musical instrument fluently\",\n    \"Speaking every language in the world\",\n    \"Expert-level coding and software development\",\n    \"Painting or drawing with professional skill\"\n  ]\n}\n\n// Confirmation before a destructive action\n{\n  \"name\": \"confirmed\",\n  \"label\": \"Delete all records for project X?\",\n  \"type\": \"confirm\"\n}\n\n// Ask for a password or API key\n{\n  \"name\": \"token\",\n  \"label\": \"Enter your GitHub personal access token:\",\n  \"type\": \"password\",\n  \"required\": true\n}\n\n// Open-ended question\n{\n  \"name\": \"title\",\n  \"label\": \"What should the report be titled?\",\n  \"type\": \"text\",\n  \"default\": \"Q4 Summary\"\n}\n\\`\\`\\``,\n\n  inputSchema: {\n    type: 'object',\n    required: ['name', 'label', 'type'],\n    properties: {\n      name:     { type: 'string', description: 'Machine-readable key for the response value.' },\n      label:    { type: 'string', description: 'The question text shown to the user.' },\n      type:     { type: 'string', enum: ['text', 'password', 'select', 'confirm'], description: 'Control type: text (free text), password (masked), select (multiple choice from options), confirm (yes/no).' },\n      options:    { type: 'array', items: { type: 'string' }, minItems: 1, maxItems: MAX_OPTIONS, description: 'Mutually exclusive options. Required when type is \"select\".' },\n      allowOther: { type: 'boolean', description: 'select-only: also let the user type a free-form answer alongside the options.' },\n      default:    { type: 'string', description: 'Pre-filled or pre-selected value.' },\n      required:   { type: 'boolean', description: 'If true, user must supply a non-empty value.' },\n      cancelable: { type: 'boolean', description: 'Default true. Set false to forbid cancelling — a graceful \"decline\" should be an option/confirm value, not a cancel.' },\n    },\n  },\n  executor,\n};\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  tools:      [askUserTool],\n};\n",
    "/plugins/sessions/src/index.ts": "\nimport { PLUGIN_API_VERSION }               from '@matatbread/matbot-plugin-api';\nimport { makeSessionTools }                 from './tools.js';\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n\n  async setup(services) {\n    const store = services.sessions;\n    if (!store) return;\n    for (const tool of makeSessionTools(store)) {\n      services.tools.register(tool);\n    }\n  },\n};\n",
    "/plugins/edit-session/src/index.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } } function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\nconst MARKER_CREATOR = '@matatbread/matbot-edit-session';\n\n// This plugin's marker payload, made type-safe by augmenting the shared MarkerData registry.\n// Any reader narrowing on creator === MARKER_CREATOR gets the typed `data` for free.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// ── helpers ───────────────────────────────────────────────────────────────────\n\nfunction now() { return new Date().toISOString(); }\n\n// A standalone marker message: opaque to the LLM (the 'marker' role is skipped by every provider\n// converter), preserved by compaction, carried with the session for the UI to render as a\n// cross-thread link.\nfunction markerMessage(data) {\n  const marker = { type: 'marker', creator: MARKER_CREATOR, data };\n  return {\n    id:        crypto.randomUUID(),\n    role:      'marker',\n    content:   [marker],\n    createdAt: now(),\n    traceId:   crypto.randomUUID(),\n  };\n}\n\nfunction bumpVersion(doc) {\n  return { ...doc, version: crypto.randomUUID() };\n}\n\n// Resolve msgIndex (raw index into session.messages) to the actual index.\n// The frontend passes the original message index from the full messages array.\nfunction resolveIndex(session, msgIndex) {\n  if (msgIndex < 0 || msgIndex >= session.messages.length) return null;\n  return msgIndex;\n}\n\nfunction generateSplitTitle(title) {\n  // If title ends with \" pt N\", bump the number\n  const match = title.match(/^(.*?)\\s*pt\\s+(\\d+)$/);\n  if (match && match.length > 2) {\n    return `${_optionalChain([match, 'access', _ => _[1], 'optionalAccess', _2 => _2.trimEnd, 'call', _3 => _3()])} pt ${parseInt(_nullishCoalesce(match[2], () => ( '0'))) + 1}`;\n  }\n  // Otherwise append \" pt 2\"\n  return `${title || 'Untitled'} pt 2`;\n}\n\nconst KEEP_TYPES = new Set(['text', 'refusal', 'marker']);\n\n// ── tool ──────────────────────────────────────────────────────────────────────\n\n// All four actions share the same parameter shape ({ sessionId, msgIndex }); only the behaviour\n// differs. The schema stays loose (action enum + the shared fields) and the description carries\n// this TypeScript signature, which the executor enforces.\n\n\nfunction makeSessionEditTool(store) {\n  return {\n    name: 'session_edit',\n    description:\n      'Edit the message history of a session (see `session_action` for what a session is). Every ' +\n      'action takes a session ID and a message index (`msgIndex`, an index into session.messages) ' +\n      'and uses it to manage the conversation\\'s length and structure:\\n' +\n      '  cut     — Truncate: remove all messages from msgIndex onward.\\n' +\n      '  fork    — Branch: create a NEW session with messages[0..msgIndex-1]; the original is unchanged.\\n' +\n      '  split   — Move: messages before msgIndex move to a new session; the current session keeps\\n' +\n      '            msgIndex onward. Both sides get cross-link markers.\\n' +\n      '  compact — Shrink: strip thinking blocks, tool calls, and tool results from messages before\\n' +\n      '            msgIndex, keeping user/assistant text — fewer tokens, same thread.\\n\\n' +\n      '```ts\\n' +\n      \"type SessionEdit = { action: 'cut' | 'fork' | 'split' | 'compact'; sessionId: string; msgIndex: number };\\n\" +\n      '```',\n    inputSchema: {\n      type:       'object',\n      required:   ['action', 'sessionId', 'msgIndex'],\n      properties: {\n        action:    { type: 'string', enum: ['cut', 'fork', 'split', 'compact'], description: 'The edit to perform.' },\n        sessionId: { type: 'string', description: 'ID of the session to edit.' },\n        msgIndex:  { type: 'number', description: 'Index into session.messages the action pivots on (see per-action meaning in the description).' },\n      },\n    },\n    executor: {\n      async *execute(input) {\n        const { action, sessionId, msgIndex } = input ;\n        if (!sessionId) { yield { type: 'error', message: 'session_edit requires \"sessionId\".' }; return; }\n        if (typeof msgIndex !== 'number') { yield { type: 'error', message: 'session_edit requires \"msgIndex\" (number).' }; return; }\n\n        const session = await store.get(sessionId);\n        if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n        const idx = resolveIndex(session, msgIndex);\n        if (idx === null) { yield { type: 'error', message: `msgIndex ${msgIndex} out of range.` }; return; }\n\n        switch (action) {\n          case 'cut': {\n            const next = bumpVersion({\n              ...session,\n              messages:  session.messages.slice(0, idx),\n              updatedAt: now(),\n            });\n            const res = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { sessionId, messagesRemaining: next.messages.length } };\n            return;\n          }\n\n          case 'fork': {\n            // One-way: only the fork is marked (pointing back to its origin). The original is left\n            // unchanged, per this action's contract.\n            const forked = {\n              ...bumpVersion(session),\n              id:               crypto.randomUUID(),\n              parentSessionId:  sessionId,\n              // targetMsg idx-1: the fork point in the (unchanged) parent — its last message shared\n              // with this fork.\n              messages:         [...session.messages.slice(0, idx), markerMessage({ relation: 'forked-from', peerSessionId: sessionId, targetMsg: Math.max(0, idx - 1) })],\n              createdAt:        now(),\n              updatedAt:        now(),\n            };\n            await store.set(forked.id, forked);\n            yield { type: 'result', value: { newSessionId: forked.id, messagesCopied: idx } };\n            return;\n          }\n\n          case 'split': {\n            if (idx === 0) { yield { type: 'error', message: 'Cannot split at index 0 — nothing to split off.' }; return; }\n\n            // Messages before the split point go to the new session\n            const prefixMsgs = session.messages.slice(0, idx);\n            // Messages from the split point onward stay in the current session\n            const suffixMsgs = session.messages.slice(idx);\n\n            const newSessionId = crypto.randomUUID();\n\n            // New session: prefix messages, tailed by a marker pointing forward to the continuing\n            // (current) session.\n            const newSession = {\n              ...bumpVersion(session),\n              id:               newSessionId,\n              parentSessionId:  sessionId,\n              // targetMsg 1: in the current session the prepended split-from marker is index 0, so the\n              // continuation (first suffix message) lands at index 1.\n              messages:         [...prefixMsgs, markerMessage({ relation: 'continued-in', peerSessionId: sessionId, targetMsg: 1 })],\n              createdAt:        now(),\n              updatedAt:        now(),\n            };\n            await store.set(newSession.id, newSession);\n\n            // Current session: keep only suffix messages, headed by a marker pointing back to where\n            // the earlier messages now live.\n            const updated = bumpVersion({\n              ...session,\n              title:     generateSplitTitle(_nullishCoalesce(session.title, () => ( ''))),\n              // targetMsg idx-1: the last earlier message in the new session.\n              messages:  [markerMessage({ relation: 'split-from', peerSessionId: newSessionId, targetMsg: idx - 1 }), ...suffixMsgs],\n              updatedAt: now(),\n            });\n            const res = await store.cas(sessionId, session.version, updated);\n            if (!res.ok) {\n              // CAS failed — clean up the new session we just created\n              await store.delete(newSession.id);\n              yield { type: 'error', message: 'Concurrent modification — please retry.' };\n              return;\n            }\n\n            yield {\n              type: 'result',\n              value: {\n                newSessionId:      newSession.id,\n                messagesSplit:     prefixMsgs.length,\n                currentSessionId:  sessionId,\n                messagesRemaining: suffixMsgs.length,\n              },\n            };\n            return;\n          }\n\n          case 'compact': {\n            if (idx === 0) { yield { type: 'error', message: `msgIndex ${msgIndex} out of range or nothing to compact.` }; return; }\n            let stripped = 0;\n            const messages = session.messages.map((m, i) => {\n              if (i >= idx) return m;\n              const compact = m.content.filter(c => KEEP_TYPES.has(c.type));\n              if (compact.length === m.content.length) return m;\n              stripped++;\n              return { ...m, content: compact };\n            });\n            const next = bumpVersion({ ...session, messages, updatedAt: now() });\n            const res = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { sessionId, messagesStripped: stripped } };\n            return;\n          }\n\n          default:\n            yield { type: 'error', message: `Unknown action \"${String(action)}\". Expected one of: cut, fork, split, compact.` };\n        }\n      },\n    },\n  };\n}\n\n// ── plugin ────────────────────────────────────────────────────────────────────\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n\n  async setup(services) {\n    const store = services.sessions;\n    if (!store) return;\n    services.tools.register(makeSessionEditTool(store));\n  },\n};\n",

    "/core/src/tool-registry.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } }\nimport { createBroadcaster } from '@matatbread/matbot-plugin-api';\n\nexport class ToolRegistryImpl  {\n    __init() {this.tools = new Map()}\n    __init2() {this.events = createBroadcaster()}\n\n  constructor(initial) {;ToolRegistryImpl.prototype.__init.call(this);ToolRegistryImpl.prototype.__init2.call(this);\n    if (initial !== undefined) for (const tool of initial) this.tools.set(tool.name, tool);\n  }\n\n  register(tool) {\n    this.tools.set(tool.name, tool);\n    this.events.emit({ type: 'registered', name: tool.name, ...(tool.pluginName !== undefined ? { pluginName: tool.pluginName } : {}) });\n  }\n\n  remove(name) {\n    if (this.tools.delete(name)) this.events.emit({ type: 'removed', name });\n  }\n\n  removeByPlugin(pluginName) {\n    for (const [name, tool] of this.tools) {\n      if (tool.pluginName === pluginName && this.tools.delete(name)) this.events.emit({ type: 'removed', name });\n    }\n  }\n\n  resolve(name) {\n    return _nullishCoalesce(this.tools.get(name), () => ( null));\n  }\n\n  list() {\n    return [...this.tools.values()];\n  }\n\n  watch(signal) {\n    return this.events.subscribe(signal);\n  }\n}\n",

    "/core/src/single-turn.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } }\n\n/**\n * Exposes {@link MatbotMachine.singleTurn} to the model: a one-shot completion against a configured\n * provider, returning its reply. The intended use is consulting another model (e.g. a different-lineage\n * critic of the current draft, or any generation that should run on a specific provider) with a\n * well-defined interface, rather than the model improvising a bash/curl call.\n *\n * `provider` is optional: omitted, the call runs on the current turn's provider ({@link ToolContext.provider}).\n * This is the general case — name a provider to switch models, or leave it off to relay through the\n * model already in use. It lives in core (not in any plugin) because it is the model-facing surface of\n * a core service (`singleTurn`); core is also the one cross-runtime home both the node app and the\n * browser bundle register it from — the tool-plugin barrel (where `plugin`/`provider` live) is node-only.\n */\nexport function createSingleTurnTool(services) {\n  const executor = {\n    async *execute(input, ctx) {\n      const args = input ;\n      if (typeof args.prompt !== 'string') { yield { type: 'error', message: 'single_turn requires a string \"prompt\".' }; return; }\n      const provider = _nullishCoalesce(args.provider, () => ( ctx.provider));\n      if (!provider) {\n        yield { type: 'error', message: 'single_turn needs a \"provider\" — none was given and there is no current turn provider to fall back to.' };\n        return;\n      }\n      if (!services.providers.has(provider)) {\n        const known = [...services.providers.keys()].join(', ') || '(none configured)';\n        yield { type: 'error', message: `Unknown provider \"${provider}\". Configured providers: ${known}.` };\n        return;\n      }\n      const res = await services.singleTurn({\n        provider,\n        prompt: args.prompt,\n        sign     "/plugin-api/src/types.ts": "\n\n\n// ── Primitives ────────────────────────────────────────────────────────────────\n\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Canonical values a `type: 'confirm'` prompt resolves to. The rendered label and buttons are a\n * cosmetic, host-specific concern (and may be localised), so consumers MUST branch on these tokens\n * — never on the displayed string. Compare case-insensitively to tolerate host casing differences.\n */\nexport const CONFIRM_YES = 'yes';\nexport const CONFIRM_NO  = 'no';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n",
    "/plugin-api/src/store-query.ts": "// The matbot store query grammar: a minimal, closed filter AST designed to be translated to a\n// real backend (SQL WHERE, Elasticsearch bool, Mongo find, IndexedDB cursor) — not interpreted by\n// an embedded engine. The in-memory reference evaluator lives in @matatbread/matbot-core/storage-base.\n//\n// Design rules (see CLAUDE.md / the store-query design notes):\n//   - LHS is always a field, RHS is always a constant. No field-vs-field, no computed values.\n//   - Operators are a closed union discriminated by `op`, so every backend compiler is one total\n//     `switch` the type checker can prove exhaustive.\n//   - Comparisons are type-strict; null and absent are a single \"missing\" state (queried only via\n//     `exists`). null is therefore barred from every comparison operand.\n\n     \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n      // structurally invalid node (or unreadable cursor)\n\n// Thrown at the query boundary (before any backend touches data) with a JSON pointer into the\n// offending node, so an LLM author can locate and fix the clause and retry. Lives in plugin-api\n// (a host-shared package) so cross-plugin `instanceof` works — see the plugin hot-reload notes.\nexport class StoreQueryError extends Error {\n  \n  \n  constructor(message, pointer, code) {\n    super(message);\n    this.name    = 'StoreQueryError';\n    this.pointer = pointer;\n    this.code    = code;\n  }\n}\n",
    "/plugin-api/src/vault.ts": " function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n/**\n * The `createSecret` policy, written once over the spec primitives so every backend behaves\n * identically. A backend's `createSecret` is just `applyCreateSecret(this, name, value)`.\n *\n * The dedup step (returning an existing name for a value already stored) technically lets a\n * caller confirm a name for a value they already hold — but holding the value already grants\n * everything that confirmation would, so it leaks nothing.\n */\nexport async function applyCreateSecret(\n  spec,\n  name,\n  value,\n) {\n  if (spec.hasKey(value)) return value;\n  const existing = _optionalChain([spec, 'access', _ => _.findByValue, 'optionalCall', _2 => _2(value)]);\n  if (existing !== undefined) return existing;\n  await spec.writeSecret(name, value);\n  return name;\n}\n",
    "/plugin-api/src/errors.ts": "/**\n * Thrown by Vault.resolve() when one or more ${NAME} placeholders cannot be resolved.\n * `missingKeys` carries the unresolved key names (e.g. `ANTHROPIC_API_KEY`) so callers\n * can prompt for and store them.\n */\nexport class MissingSecretError extends Error {\n  \n\n  constructor(missingKeys) {\n    super(`Vault: secret(s) not found: ${missingKeys.join(', ')}`);\n    this.name        = 'MissingSecretError';\n    this.missingKeys = missingKeys;\n  }\n}\n\n/**\n * Thrown by the loader when an explicit, single, user-initiated load (the `plugin`/`provider`\n * tools via `services.loadPlugin`) targets a plugin whose `matbotRuntime` excludes this host.\n * Unlike a setup() failure — which may be transient (a missing secret) and is left in config to\n * fix — this is permanent for the host, so the `add` flow catches it specifically and rolls the\n * specifier back out of matbot.yaml rather than persisting a plugin that can never activate here.\n */\nexport class IncompatibleRuntimeError extends Error {\n  \n  \n  \n\n  constructor(specifier, declared, hostRuntime) {\n    super(`Cannot load plugin \"${specifier}\": declares matbotRuntime [${declared.join(', ')}], host runtime is \"${hostRuntime}\".`);\n    this.name        = 'IncompatibleRuntimeError';\n    this.specifier   = specifier;\n    this.declared    = declared;\n    this.hostRuntime = hostRuntime;\n  }\n}\n\n/**\n * Thrown by the loader when an explicit, single, user-initiated load targets a module that imports\n * cleanly but is not plugin-shaped — no `plugin` export, a `plugin` without `apiVersion`, or a\n * non-function lifecycle member. Like {@link IncompatibleRuntimeError} this is *permanent* for the\n * specifier (the code is a library, not a plugin), so the `add` flow catches it specifically and\n * rolls the specifier back out of matbot.yaml — distinct from a transient setup() failure (a missing\n * secret), which is left in config to fix. `reason` is the precise shape defect for logs; callers\n * surfacing this to an LLM should prefer a terminal \"not a plugin\" message over echoing `reason`,\n * which is phrased as a code-fix instruction the model may try to act on.\n */\nexport class NotAPluginError extends Error {\n  \n  \n\n  constructor(specifier, reason) {\n    super(reason);\n    this.name      = 'NotAPluginError';\n    this.specifier = specifier;\n    this.reason    = reason;\n  }\n}\n\n/**\n * Thrown by a `PromptFn` implementation when the user cancels — the \"give up\" path, not a graceful\n * decline. Callers awaiting `ctx.prompt()` need not branch on it: the surrounding try/catch turns\n * it into a tool error that closes the tool call, while the host separately abandons the turn.\n */\nexport class PromptCancelledError extends Error {\n  constructor(message = 'User cancelled — cannot proceed.') {\n    super(message);\n    this.name = 'PromptCancelledError';\n  }\n}\n",
    "/plugin-api/src/principal-context.ts": " function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n/**\n * Ambient carrier for the security {@link Principal} — the single mechanism by which any layer\n * (runner, hook, tool, or a Store/FileStore/Vault/KnowledgeIndex backend) discovers *who*\n * originated the current operation, without that identity being threaded through every signature.\n *\n * The host installs one platform implementation at boot via {@link installPrincipalCarrier}:\n *   - node (multi-user, concurrent turns): an `AsyncLocalStorage`-backed carrier — each turn /\n *     request runs in its own isolated scope (see the node app's `createAlsPrincipalCarrier`).\n *   - browser / any single-principal realm: {@link createConstantPrincipalCarrier} — there is only\n *     ever one principal, so no async isolation is needed and `run` is a passthrough.\n *\n * Carrying the principal *grants nothing*. A backend MAY call {@link currentPrincipal} (or\n * {@link tryCurrentPrincipal}) to attribute, branch on, or reject an operation; the default\n * implementations ignore it entirely. Policy is the service's concern — this is only the wire.\n */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// The carrier is process-global, not module-local: a published install can end up with two physical\n// copies of this package (npm nesting under a version skew, a mixed .plugins/npm tree, pnpm peer\n// suffixes). A plain module `let` would then give each copy its own carrier — the host installs into\n// one, a plugin reads the other, and every principal read throws. Anchoring it on `globalThis` under a\n// well-known symbol lets all copies share the single carrier the host installs at boot. Deduping the\n// package (caret ranges) is still preferred; this just makes duplication harmless rather than fatal.\nconst CARRIER_KEY = Symbol.for('@matatbread/matbot-plugin-api#principalCarrier');\n\n\n/** Install the host's platform carrier. Called once at boot, before any turn or request runs. */\nexport function installPrincipalCarrier(impl) {\n  (globalThis )[CARRIER_KEY] = impl;\n}\n\nfunction need() {\n  const carrier = (globalThis )[CARRIER_KEY];\n  if (carrier === undefined) {\n    throw new Error('No PrincipalCarrier installed — the host must call installPrincipalCarrier() at boot.');\n  }\n  return carrier;\n}\n\n/** The principal in force for the current flow. Throws if called with no carrier or no scope. */\nexport function currentPrincipal() {\n  return need().current();\n}\n\n/** The principal in force, or `undefined` when no carrier is installed or no scope is established.\n *  Backends that want to fail-open on out-of-scope access read this instead of {@link currentPrincipal}. */\nexport function tryCurrentPrincipal() {\n  return _optionalChain([(globalThis ), 'access', _ => _[CARRIER_KEY], 'optionalAccess', _2 => _2.tryCurrent, 'call', _3 => _3()]);\n}\n\n/** Run `fn` with `principal` established as the ambient identity for its async extent. */\nexport function runAs(principal, fn) {\n  return need().run(principal, fn);\n}\n\n/** Imperatively establish `principal` for the current flow (entry points only). */\nexport function enterPrincipal(principal) {\n  need().enter(principal);\n}\n\n/**\n * A carrier for single-principal realms (the browser, tests): every read returns the same\n * `principal` and `run` is a passthrough, since there is no second identity to isolate from.\n */\nexport function createConstantPrincipalCarrier(principal) {\n  return {\n    current:    () => principal,\n    tryCurrent: () => principal,\n    run:        (_principal, fn) => fn(),\n    enter:      () => {},\n  };\n}\n",
    "/plugin-api/src/context-switch.ts": "\nimport { runAs } from './principal-context.js';\n\n/**\n * A context switch is the machine analogue of an OS one: it pages in any pending machine state and\n * sets the owner. {@link runAs} is the bare \"set the owner\" instruction (the principal carrier);\n * {@link contextSwitch} is the scheduler operation layered on top — it also lands any machine\n * mutation that was deferred while the machine was busy.\n *\n * Why deferral exists: a service like the `StorageBackend` is the system of record, and swapping it\n * under a running operation would split a compare-and-swap (or a turn) across two backends. So a\n * swap is queued and applied only at the *quiescent edge* — the instant no context is active — which\n * is exactly a context-switch boundary. The principal carrier stays a pure identity primitive; this\n * module owns the machine-update half, so the two concerns share call sites without sharing code.\n *\n * The host registers what to flush ({@link onContextQuiesce}); the three entry points (a web\n * request, a telegram message, a turn) switch context through {@link contextSwitch} instead of\n * calling {@link runAs} directly. The boot principal (an `enter`, not a `run`) is the depth-0\n * baseline and is never counted.\n */\n\nconst quiescers = new Set();\nlet depth = 0;\nlet flushing = false;\n\n/**\n * Register a machine-update flush, run at every quiescent edge (no context active). Flushers MUST be\n * idempotent: a no-op when nothing is pending, since the edge is reached after every operation.\n * Returns an unregister fn. A throwing flusher is isolated — one must not block the others or escape\n * into the operation that triggered the edge.\n */\nexport function onContextQuiesce(flush) {\n  quiescers.add(flush);\n  return () => { quiescers.delete(flush); };\n}\n\n/**\n * Run the registered flushers iff no context is currently active — the quiescent edge. Called by\n * {@link contextSwitch} at both edges, and by the host right after it *queues* a deferred mutation:\n * queued while busy (depth > 0) this no-ops and the exit edge lands it; queued while idle (depth 0)\n * it applies immediately, so an idle-time swap doesn't wait for the next request to take effect.\n */\nexport function flushIfQuiescent() {\n  if (depth !== 0 || flushing) return;\n  flushing = true;\n  try {\n    for (const q of quiescers) {\n      try { q(); }\n      catch (e) { console.error('[matbot] context-quiesce flush threw:', e instanceof Error ? e.message : e); }\n    }\n  } finally {\n    flushing = false;\n  }\n}\n\n/**\n * Switch into the machine as `principal`: land any pending machine mutation (only safe while idle),\n * then run `fn` under the principal. Mirrors {@link runAs}'s sync/async return — when `fn` is async,\n * the context stays open until its promise settles, so the depth count tracks the real operation.\n */\nexport function contextSwitch(principal, fn) {\n  flushIfQuiescent();\n  depth++;\n  const settle = () => { depth--; flushIfQuiescent(); };\n  let result;\n  try {\n    result = runAs(principal, fn);\n  } catch (e) {\n    settle();\n    throw e;\n  }\n  return result instanceof Promise ? (result.finally(settle) ) : (settle(), result);\n}\n",
    "/plugin-api/src/hooks.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } } function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n\n\n\nconst HOOK_ERROR_CREATOR = 'matbot-hooks';\n\nexport class HookRegistry {constructor() { HookRegistry.prototype.__init.call(this);HookRegistry.prototype.__init2.call(this);HookRegistry.prototype.__init3.call(this); }\n    __init() {this.hooks = new Map()}\n\n  // A hook handler that *throws* is a failure, not an intentional stop (which is a return value:\n  // `abort` / `rejectTool`). A throw must never propagate out of a run* method — that is what bricked\n  // the turn loop: one misconfigured screen hook (e.g. a provider with an unresolved secret) threw at\n  // the top of every turn, so the model never ran and the user couldn't even invoke a tool to fix it.\n  // So every handler call goes through `invoke`, which catches, logs, and treats the throw as \"the\n  // hook returned nothing\" (skipped). The failure is recorded once per hook (`markedFailures`) and\n  // drained into a marker by the next `runScreen`, so it degrades *visibly* rather than silently.\n    __init2() {this.markedFailures = new Set()}\n   __init3() {this.pendingFailureMarkers = []}\n\n  register(hook) {\n    const list = _nullishCoalesce(this.hooks.get(hook.on), () => ( []));\n    list.push(hook);\n    list.sort((a, b) => (_nullishCoalesce(a.priority, () => ( 50))) - (_nullishCoalesce(b.priority, () => ( 50))));\n    this.hooks.set(hook.on, list);\n  }\n\n  removeByPlugin(pluginName) {\n    for (const [point, list] of this.hooks) {\n      this.hooks.set(point, list.filter(h => h.pluginName !== pluginName));\n    }\n  }\n\n  // Backing for the per-call `ctx.removeHook()`: drop one hook by identity. Filtering into a fresh\n  // array (rather than splicing) leaves any in-flight run loop — which iterates the array reference\n  // it captured before the mutation — to finish over the old list; the next run sees the new one.\n  // Idempotent: removing an already-absent hook is a no-op, so calling removeHook() twice is safe.\n   removeOne(point, hook) {\n    const list = this.hooks.get(point);\n    if (list) this.hooks.set(point, list.filter(h => h !== hook));\n  }\n\n  // Run one handler, isolating a throw: log it, record it for a one-time marker, and return undefined\n  // — which every run* method already treats as \"no contribution from this hook\".\n   async invoke(hook, run) {\n    try {\n      return await run();\n    } catch (err) {\n      const message = err instanceof Error ? err.message : String(err);\n      const owner = hook.pluginName !== undefined ? ` from \"${hook.pluginName}\"` : '';\n      console.error(`[matbot] ${hook.on} hook${owner} threw; skipping it for this turn:`, message);\n      if (!this.markedFailures.has(hook)) {\n        this.markedFailures.add(hook);\n        this.pendingFailureMarkers.push({\n          channel: hook.on,\n          ...(hook.pluginName !== undefined ? { pluginName: hook.pluginName } : {}),\n          message,\n        });\n      }\n      return undefined;\n    }\n  }\n\n  // Append a `marker` message for each not-yet-marked hook failure (from any channel) to the session,\n  // then clear the queue. Called from runScreen — the once-per-turn, session-owning channel whose\n  // returned session the runner persists — so failures surface durably and exactly once. Returns the\n  // appended marker content blocks too, so the runner can carry them live (a session reload is the     "/core/src/config/yaml.ts": "/**\n * Minimal YAML parser for matbot config files.\n *\n * Supports:\n *   - Nested block mappings (key: value / key: followed by indented block)\n *   - Block sequences (- item)\n *   - Scalar types: string, number, boolean, null\n *   - Quoted strings (single and double)\n *   - Comments (# ...)\n *\n * Does NOT support anchors, aliases, flow syntax, or ${NAME} expansion.\n * ${NAME} placeholders are left intact for the Vault to resolve.\n * Supports literal block scalars (|) and folded block scalars (>).\n */\n\n\n\n\n\n\n\n\n\n\nfunction tokenize(text) {\n  const tokens = [];\n  for (const line of text.split('\\n')) {\n    const stripped = line.replace(/#.*$/, '').trimEnd();\n    if (stripped.trim() === '') continue;\n    const indent = stripped.length - stripped.trimStart().length;\n    tokens.push({ indent, raw: stripped.trimStart() });\n  }\n  return tokens;\n}\n\nfunction parseScalar(raw) {\n  if ((raw.startsWith('\"') && raw.endsWith('\"')) ||\n      (raw.startsWith(\"'\") && raw.endsWith(\"'\"))) {\n    return raw.slice(1, -1);\n  }\n\n  if (raw === 'null' || raw === '~') return null;\n  if (raw === 'true')  return true;\n  if (raw === 'false') return false;\n\n  const num = Number(raw);\n  if (!Number.isNaN(num) && raw !== '') return num;\n\n  return raw;\n}\n\nfunction parse(tokens, pos, baseIndent) {\n  if (pos >= tokens.length) return { value: null, next: pos };\n\n  const first = tokens[pos];\n\n  if (first.raw.startsWith('- ')) {\n    const items = [];\n    let i = pos;\n    while (i < tokens.length) {\n      const tok = tokens[i];\n      if (tok.indent < first.indent) break;\n      if (tok.indent === first.indent && tok.raw.startsWith('- ')) {\n        const itemRaw = tok.raw.slice(2).trim();\n        if (itemRaw === '') {\n          const sub = parse(tokens, i + 1, tok.indent + 2);\n          items.push(sub.value);\n          i = sub.next;\n        } else {\n          items.push(parseScalar(itemRaw));\n          i     "/core/src/config/loader.ts": "\nimport { parseYaml, } from './yaml.js';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction asString(v, label) {\n  if (typeof v === 'string') return v;\n  throw new Error(`Config: expected string for \"${label}\", got ${v === undefined ? 'undefined' : typeof v}`);\n}\n\nfunction asRecord(v, label) {\n  if (typeof v === 'object' && v !== null && !Array.isArray(v)) return v ;\n  throw new Error(`Config: expected mapping for \"${label}\", got ${v === undefined ? 'undefined' : typeof v}`);\n}\n\nfunction toModelParameters(raw) {\n  const params = {};\n  for (const [k, v] of Object.entries(raw)) {\n    params[k] = v ;\n  }\n  return params;\n}\n\nfunction toProviderConfig(name, raw) {\n  const module_ = asString(raw['module'], `providers.${name}.module`);\n  const model   = asString(raw['model'],  `providers.${name}.model`);\n\n  const credsRaw   = raw['credentials'];\n  const credentials = {};\n  if (credsRaw !== undefined) {\n    const credsMap = asRecord(credsRaw, `providers.${name}.credentials`);\n    for (const [k, v] of Object.entries(credsMap)) {\n      credentials[k] = asString(v, `providers.${name}.credentials.${k}`);\n    }\n  }\n\n  const config = { name, module: module_, model, credentials };\n\n  if (raw['endpoint'] !== undefined) {\n    config.endpoint = asString(raw['endpoint'], `providers.${name}.endpoint`);\n  }\n  if (raw['fallback'] !== undefined) {\n    config.fallback = asString(raw['fallback'], `providers.${name}.fallback`);\n  }\n  if (raw['parameters'] !== undefined) {\n    config.parameters = toModelParameters(asRecord(raw['parameters'], `providers.${name}.parameters`));\n  }\n\n  return config;\n}\n\nexport function parseConfig(\n  text,\n  base,\n) {\n  const derived = parseYaml(text);\n  const doc = base !== undefined\n    ? { ...parseYaml(base), ...derived }\n    : derived;\n\n  // plugins: optional ordered list of specifiers\n  const pluginsRaw = doc['plugins'];\n  const plugins = [];\n  if (pluginsRaw !== undefin     "/core/src/security/vault.ts": "\nimport { MissingSecretError, applyCreateSecret } from '@matatbread/matbot-plugin-api';\n\nconst REF_RE = /\\$\\{([^}]+)\\}/g;\n\n/**\n * Default vault implementation: a single flat namespace of secrets keyed by name.\n *\n * Resolves ${NAME} placeholders by looking up `NAME`. There is no env/secret distinction —\n * an env var is simply a secret whose name happens to be its env-var name. A backend may\n * privately treat some prefixes specially, but the placeholder syntax and this interface do not.\n *\n * The caller loads any backing store (e.g. a .env file) into the snapshot passed to the\n * constructor; persistence beyond the current process is a subclass concern (see EnvFileVault).\n */\nexport class VaultImpl  {\n    __init() {this.store = new Map()}\n\n  constructor(\n    secrets,\n    env,\n  ) {;VaultImpl.prototype.__init.call(this);\n    if (secrets) {\n      for (const [k, v] of Object.entries(secrets)) {\n        this.store.set(k, v);\n      }\n    }\n    if (env) {\n      for (const [k, v] of Object.entries(env)) {\n        if (v !== undefined && !this.store.has(k)) this.store.set(k, v);\n      }\n    }\n  }\n\n  createSecret(name, value) {\n    return applyCreateSecret(this, name, value);\n  }\n\n  async writeSecret(name, value) {\n    this.store.set(name, value);\n  }\n\n  hasKey(name) {\n    return this.store.has(name);\n  }\n\n  findByValue(value) {\n    for (const [k, v] of this.store) if (v === value) return k;\n    return undefined;\n  }\n\n  async resolve(ref) {\n    const errors = [];\n\n    const result = ref.replace(REF_RE, (_, name) => {\n      const value = this.store.get(name);\n      if (value === undefined) { errors.push(name); return ''; }\n      return value;\n    });\n\n    if (errors.length > 0) {\n      throw new MissingSecretError(errors);\n    }\n    return result;\n  }\n\n  scrub(text) {\n    let result = text;\n    for (const value of this.store.values()) {\n      if (value.length >= 4) {\n        result = result.split(value).join('[REDACTED]');\n      }\n    }\n    return result;\n  }\n}\n",
    "/core/src/security/grants.ts": "\n\n/** Convenience: the system principal — the origin for operations not driven by an external user. */\nexport function systemPrincipal(id = 'system') {\n  return { id, type: 'system' };\n}\n",
    "/core/src/knowledge/lookup-knowledge-index.ts": "\n\n// In-memory KnowledgeIndex for development and environments without a BGE reranker.\n// Entries are held in a Set; search scores each doc by raw term-occurrence count, sorts\n// descending, then returns the top docs whose cumulative score covers 50% of the total —\n// surfacing clear winners quickly without drowning results in long-tail noise.\nexport class LookupKnowledgeIndex  {constructor() { LookupKnowledgeIndex.prototype.__init.call(this); }\n   __init() {this.docs = new Set()}\n\n  entries() {\n    return this.docs;\n  }\n\n  async index(entry) {\n    // Replace any existing entry with the same id.\n    for (const existing of this.docs) {\n      if (existing.id === entry.id) {\n        this.docs.delete(existing);\n        break;\n      }\n    }\n    this.docs.add(entry);\n  }\n\n  async search(\n    terms,\n    _signal,\n  ) {\n    const results = [];\n\n    for (const entry of this.docs) {\n      const text = entry.content.toLowerCase();\n      let score = 0;\n      for (const { term } of terms) {\n        const t = term.toLowerCase();\n        let pos = 0;\n        while ((pos = text.indexOf(t, pos)) !== -1) {\n          score++;\n          pos += t.length;\n        }\n      }\n      if (score > 0) results.push({ entry, score });\n    }\n\n    results.sort((a, b) => b.score - a.score);\n\n    const total     = results.reduce((sum, r) => sum + r.score, 0);\n    const threshold = total * 0.5;\n    let   cumulative = 0;\n    const top = [];\n    for (const { entry, score } of results) {\n      top.push(entry);\n      cumulative += score;\n      if (cumulative >= threshold) break;\n    }\n    return top;\n  }\n}\n",
    "/core/src/storage-base/query/index.ts": "export { getField, pathSegments } from './access.js';\nexport { compileFilter }           from './compile.js';\nexport { validateQuery }           from './validate.js';\nexport { applySort }               from './sort.js';\nexport { encodeCursor, decodeCursor, } from './paginate.js';\nexport { executeQuery }            from './execute.js';\n",
    "/core/src/providers-base/sse.ts": "// Parses a Server-Sent Events stream into data payloads.\n// Uses only Web APIs (ReadableStream, TextDecoder) — works in Node 24+ and browsers.\nexport async function* parseSSE(body) {\n  const reader  = body.getReader();\n  const decoder = new TextDecoder();\n  let   buffer  = '';\n\n  try {\n    while (true) {\n      const { done, value } = await reader.read();\n      if (done) break;\n\n      buffer += decoder.decode(value, { stream: true });\n\n      let nl;\n      while ((nl = buffer.indexOf('\\n')) !== -1) {\n        const line = buffer.slice(0, nl).trimEnd();\n        buffer = buffer.slice(nl + 1);\n        if (line.startsWith('data: ')) {\n          const data = line.slice(6);\n          if (data !== '[DONE]') yield data;\n        }\n      }\n    }\n  } finally {\n    reader.releaseLock();\n  }\n}\n",
    "/core/src/storage-base/query/access.ts": "\n\nexport function pathSegments(field) {\n  return Array.isArray(field) ? field : [field];\n}\n\n// Null-safe traversal (the grammar's implicit `?.`): any absent or non-object segment\n// short-circuits to undefined and never throws. A present `null` is returned as-is.\nexport function getField(row, segments) {\n  let cur = row;\n  for (const seg of segments) {\n    if (cur === null || typeof cur !== 'object') return undefined;\n    cur = (cur )[seg];\n  }\n  return cur;\n}\n",
    "/core/src/storage-base/query/compile.ts": "\nimport { getField, pathSegments } from './access.js';\n\n\n\n// null and absent collapse to a single \"missing\" state — no comparison ever matches a missing\n// value (so `neq` excludes missing rows too). Only `exists` observes missing-ness.\nfunction resolve(row, seg) {\n  const v = getField(row, seg);\n  return v === null ? undefined : v;\n}\n\n// Ordering is defined only within a type (numeric for numbers, codepoint for strings). A\n// cross-type comparison yields undefined → the predicate is false (type-mismatch no-match).\nfunction order(a, b) {\n  if (typeof a === 'number' && typeof b === 'number') return a - b;\n  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;\n  return undefined;\n}\n\n// Compile the AST to a composed closure — the same one-pass \"compile to native\" the SQL/ES\n// backends do, with JS closures as the target. No `eval`/`new Function`: CSP-safe, and operands\n// are captured as data so there is no injection surface.\nexport function compileFilter(f) {\n  switch (f.op) {\n    case 'and': { const ps = f.clauses.map(compileFilter); return r => ps.every(p => p(r)); }\n    case 'or':  { const ps = f.clauses.map(compileFilter); return r => ps.some(p => p(r)); }\n    case 'not': { const p = compileFilter(f.clause); return r => !p(r); }\n\n    case 'eq':  { const seg = pathSegments(f.field), v = f.value; return r => resolve(r, seg) === v; }\n    case 'neq': { const seg = pathSegments(f.field), v = f.value; return r => { const x = resolve(r, seg); return x !== undefined && x !== v; }; }\n    case 'lt':  { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c < 0; }; }\n    case 'lte': { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c <= 0; }; }\n    case 'gt':  { const seg = pathSegments(f.field), v = f.value; re   const PKG     = MB.packageEntries;   // { "@matatbread/matbot-core": "/core/.../index.ts" }
  const ENTRY   = MB.entry;            // bootstrap module id
  const SYN = (id) => 'mbmod:' + id;

  // The host is stripped at build time, so boot needs no stripper. The ONLY thing that needs stripping
  // in-browser is a runtime-fetched remote .ts plugin (loadRemote) — and that path is http-only (you
  // can't fetch a remote plugin from file://), so we lazy-load sucrase from a CDN on first use rather
  // than inlining ~700 KB into every page. Cached after the first remote load.
  let _transform;
  const getTransform = async () => {
    if (_transform) return _transform;
    const mod = await import(/* @vite-ignore */ 'https://esm.sh/sucrase@3.35.1');
    _transform = mod.transform;
    return _transform;
  };

  // Normalise a relative specifier against its importer's module id, with .js -> .ts remap (the same
  // remap ts-hooks.js does in node, for source that ships no compiled output).
  const resolveRel = (importerId, spec) => {
    const dir   = importerId.slice(0, importerId.lastIndexOf('/'));
    const parts = (dir + '/' + spec).split('/');
    const out   = [];
    for (const p of parts) {
      if (p === '' || p === '.') continue;
      if (p === '..') out.pop();
      else out.push(p);
    }
    let id = '/' + out.join('/');
    if (SOURCES[id] === undefined && id.endsWith('.js') && SOURCES[id.slice(0, -3) + '.ts'] !== undefined) {
      id = id.slice(0, -3) + '.ts';
    }
    return id;
  };

  // Matches the specifier string in: `… from '…'`, side-effect `import '…'`, and dynamic `import('…')`.
  const SPEC_RE = /(\bfrom\s*|\bimport\s*\(\s*|\bimport\s+)(['"])([^'"]+)\2/g;

  // Rewrite relative specifiers via mapFn (returning a replacement specifier, or null to leave as-is).
  // Async to allow the remote loader to fetch dependencies while resolving.
  const rewrite = async (code, mapFn) => {
    const hits = [...code.matchAll(SPEC_RE)];
    let out = '', last = 0;
    for (const m of hits) {
      const [full, lead, quote, spec] = m;
      const start = m.index;
      const replacement = await mapFn(spec);
      out += code.slice(last, start);
      out += replacement === null ? full : `${lead}${quote}${replacement}${quote}`;
      last = start + full.length;
    }
    return out + code.slice(last);
  };

  const isRelative = (spec) => spec.startsWith('./') || spec.startsWith('../');

  // ── Build the inlined (baseline) graph ──────────────────────────────────────────────────────
  const blobUrl = {};
  for (const id of Object.keys(SOURCES)) {
    const rewritten = await rewrite(SOURCES[id], (spec) => {   // SOURCES[id] is already stripped JS
      if (!isRelative(spec)) return null;                 // bare → import map (singleton boundary)
      const target = resolveRel(id, spec);
      if (SOURCES[target] === undefined) {                // not one of ours (e.g. a string literal) — leave
        console.warn(`[matbot] unresolved relative import "${spec}" from ${id}`);
        return null;
      }
      return SYN(target);
    });
    blobUrl[id] = URL.createObjectURL(new Blob([rewritten], { type: 'text/javascript' }));
  }

  const imports = {};
  for (const [name, id] of Object.entries(PKG)) imports[name] = blobUrl[id];
  for (const id of Object.keys(SOURCES))         imports[SYN(id)] = blobUrl[id];

  const map = document.createElement('script');
  map.type = 'importmap';
  map.textContent = JSON.stringify({ imports });
  document.head.appendChild(map);

  // ── Runtime remote plugin loading (best-effort; needs http, not file://) ──────────────────────
  // Fetch a remote .ts module graph, type-strip it, and rewrite its *relative* imports straight to
  // the blob URLs of their (recursively loaded) dependencies — so no second import map is needed.
  // Bare imports still flow through the baseline import map, preserving the singleton boundary.
  const remoteCache = new Map();
  const loadRemoteModule = async (absUrl, stack) => {
    if (remoteCache.has(absUrl)) return remoteCache.get(absUrl);
    if (stack.includes(absUrl)) throw new Error(`matbot: import cycle in remote plugin at ${absUrl}`);

    let res = await fetch(absUrl);
    let url = absUrl;
    if (!res.ok && absUrl.endsWith('.js')) { url = absUrl.slice(0, -3) + '.ts'; res = await fetch(url); }
    if (!res.ok) throw new Error(`matbot: failed to fetch "${absUrl}" (${res.status})`);

    const raw      = await res.text();
    const stripped = url.endsWith('.ts') ? (await getTransform())(raw, { transforms: ['typescript'], filePath: url, preserveDynamicImport: true }).code : raw;
    const rewritten = await rewrite(stripped, async (spec) => {
      if (spec.startsWith('node:')) {
        throw new Error(`remote plugin "${absUrl}" imports the Node-only module "${spec}" and cannot run in the browser`);
      }
      if (!isRelative(spec)) return null;   // bare → baseline import map (host singletons)
      const childAbs = new URL(spec, url).href;
      return await loadRemoteModule(childAbs, [...stack, url]);
    });
    const blob = URL.createObjectURL(new Blob([rewritten], { type: 'text/javascript' }));
    remoteCache.set(absUrl, blob);
    return blob;
  };

  // exports["."] may be a string or a condition/subpath map — prefer import > default > first.
  const resolveExportsEntry = (value) => {
    if (typeof value === 'string') return value;
    if (typeof value !== 'object' || value === null) return undefined;
    if ('.' in value) return resolveExportsEntry(value['.']);
    for (const k of ['import', 'default', ...Object.keys(value)]) if (k in value) return resolveExportsEntry(value[k]);
    return undefined;
  };

  const runtimesOf = (pkg) => Array.isArray(pkg.matbotRuntime)
    ? pkg.matbotRuntime.filter(r => typeof r === 'string')
    : undefined;

  // matbot's remote-plugin contract: a plugin IS a package, so a direct entry URL (…/index.ts) must
  // sit beside its package.json — we check the sibling only, never fish up ancestors or down subdirs
  // (a URL into a tree could otherwise pick up an unrelated/monorepo manifest). Absence, or a missing
  // "name", is a hard error: point at the package directory or its package.json instead. Returns the
  // name plus the declared matbotRuntime (so the host can gate / record it).
  const readSiblingManifest = async (entryUrl) => {
    const url = new URL('./package.json', entryUrl).href;
    let res;
    try { res = await fetch(url); } catch { res = undefined; }
    if (res?.ok) {
      const pkg = JSON.parse(await res.text());
      if (pkg.name) return { name: pkg.name, runtimes: runtimesOf(pkg) };
    }
    throw new Error(`matbot: remote plugin "${entryUrl}" has no sibling package.json with a "name" at ${url} (a plugin must be a named package — point at the package directory or its package.json instead)`);
  };

  const loader = {
    async loadRemote(specifier) {
      let absUrl = new URL(specifier, globalThis.location?.href ?? 'http://localhost/').href;
      let name, runtimes;

      // Accept a package directory or a package.json URL: resolve exports["."] to the real entry,
      // mirroring how the node loader resolves a plugin path to its module.
      if (absUrl.endsWith('/')) absUrl += 'package.json';
      if (absUrl.endsWith('/package.json')) {
        const res = await fetch(absUrl);
        if (!res.ok) throw new Error(`matbot: failed to fetch "${absUrl}" (${res.status})`);
        const pkg   = JSON.parse(await res.text());
        const entry = resolveExportsEntry(pkg.exports) ?? pkg.module ?? pkg.main;
        if (!entry) throw new Error(`matbot: "${absUrl}" has no exports["."], module, or main entry`);
        if (!pkg.name) throw new Error(`matbot: package.json at "${absUrl}" has no "name" (a remote plugin must be a named package)`);
        name     = pkg.name;
        runtimes = runtimesOf(pkg);
        absUrl   = new URL(entry, absUrl).href;
      } else {
        // A direct entry URL: the package.json contract still holds — read the sibling manifest for
        // the name and declared runtimes. Throws if none is reachable.
        ({ name, runtimes } = await readSiblingManifest(absUrl));
      }

      const spec = await loadRemoteModule(absUrl, []);
      return { spec, name, ...(runtimes !== undefined ? { runtimes } : {}) };
    },
  };

  // ── Boot ──────────────────────────────────────────────────────────────────────────────────────
  try {
    const mod = await import(SYN(ENTRY));
    await mod.boot({ config: MB.config, specNames: MB.specNames, specRuntimes: MB.specRuntimes, loader });
  } catch (err) {
    console.error('[matbot] boot failed:', err);
    const pre = document.createElement('pre');
    pre.style.cssText = 'color:#b91c1c;padding:16px;white-space:pre-wrap;font:13px monospace';
    pre.textContent = 'matbot failed to start:\n' + (err && err.stack ? err.stack : String(err));
    document.body.appendChild(pre);
  }
})();
</script>
</body>
</html>
