 _sucraseTransform(source, { transforms: ['typescript'], disableESTransforms: true, keepUnusedImports: true }).code;\n};\n\n/** Shape of the inlined config baked into the artifact (the browser analogue of matbot.yaml). */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst PROVIDERS_KEY = 'matbot.providers';\n\nfunction loadPersistedProviders() {\n  try {\n    const raw = globalThis.localStorage?.getItem(PROVIDERS_KEY);\n    return raw ? (JSON.parse(raw) ) : {};\n  } catch { return {}; }\n}\n\nfunction savePersistedProvider(cfg) {\n  const cur = loadPersistedProviders();\n  const { name, ...rest } = cfg;\n  cur[name] = rest;\n  try { globalThis.localStorage?.setItem(PROVIDERS_KEY, JSON.stringify(cur)); } catch { /* unavailable */ }\n}\n\nfunction removePersistedProvider(name) {\n  const cur = loadPersistedProviders();\n  if (!(name in cur)) return;\n  delete cur[name];\n  try { globalThis.localStorage?.setItem(PROVIDERS_KEY, JSON.stringify(cur)); } catch { /* unavailable */ }\n}\n\n/** Host services the in-page loader provides to the bootstrap (see loader.js / __mbLoader). */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst NEVER_ABORT = new AbortController().signal;\nconst WEB_USER = { id: 'web-user', type: 'user' };\n\n/** Resolve `${NAME}` placeholders, prompting (once, persisted) for any the vault is missing. */\nasync function resolveInteractive(ref, vault) {\n  for (;;) {\n    try {\n      return await vault.resolve(ref);\n    } catch (e) {\n      if (!isMissingSecretError(e)) throw e;\n      for (const name of e.missingKeys) {\n        const val = globalThis.prompt?.(`matbot needs the secret \"${name}\" (e.g. an API key):`) ?? '';\n        if (!val.trim()) throw new Error(`No value provided for required secret \"${name}\".`);\n        await vault.writeSecret(name, val.trim());\n      }\n    }\n  }\n}\n\nasync function resolveCredentials(creds, vault) {\n  const out = {};\n  for (const [k, v] of Object.entries(creds)) out[k] = await resolveInteractive(v, vault);\n  return out;\n}\n\nexport async function boot(env) {\n  const { config, specNames, loader } = env;\n  const specRuntimes = env.specRuntimes ?? {};\n  const specVersions = env.specVersions ?? {};\n\n  // One identity for the whole realm — the browser is single-principal, so the carrier is constant\n  // and `runAs` is a passthrough (no AsyncLocalStorage needed; see CLAUDE.md \"Platform split\").\n  // The realm's identity comes from config (a per-tenant bundle bakes it); WEB_USER is the\n  // anonymous default.\n  installPrincipalCarrier(createConstantPrincipalCarrier(config.principal ?? WEB_USER));\n  // Token accounting needs a per-turn sink even though identity is constant; the serial carrier is\n  // correct here because the browser runs one turn at a time (no async-context isolation to do).\n  installUsageCarrier(createSerialUsageCarrier());\n\n  // Vault behind a capture-safe proxy (like StorageBackend/KnowledgeIndex): a plugin may\n  // `register('Vault', impl)` to swap in a different secret store (e.g. a Drive-backed one), and\n  // every captured reference — complete(), resolveProvider(), the session runner — follows the swap\n  // because resolution is lazy/per-turn through the proxy. The default boots from localStorage.\n  let activeVault = new LocalStorageVault();\n  const vault = forwardingProxy(() => activeVault);\n\n  // Store a wizard draft: key in the vault under a derived name, persist the config (with a ${ref},\n  // never the raw key) to localStorage, and return the runnable config. A self-contained provider\n  // (no endpoint/key — e.g. a local demo adapter) persists neither: only model + module.\n  const persistDraft = async (draft) => {\n    let credentials;\n    if (draft.apiKey) {\n      const varName = 'APIKEY_' + draft.name.toUpperCase().replace(/[^A-Z0-9]/g, '_');\n      // createSecret, not writeSecret: the entered value may already be a key name (a vault\n      // substitution the user typed instead of the secret) or a value already stored und LookupKnowledgeIndex();\n  // Capture-safe handles (see forwardingProxy): a captured reference, including a destructure like\n  // `const { KnowledgeIndex, StorageBackend } = services`, follows register()-driven swaps.\n  const knowledgeProxy      = forwardingProxy(() => knowledgeImpl);\n  const storageBackendProxy = forwardingProxy(() => activeStorageBackend);\n\n  // Boot defaults captured for revert-on-unregister (mirrors the CLI host): a swap-key reverts here\n  // when its plugin is unloaded, instead of dangling on the now-gone impl. (bootBackend is captured\n  // above, before the pre-scan defaulting, so a config backend never poses as the host base.)\n  const bootVault                   = activeVault;\n  const bootKnowledge               = knowledgeImpl;\n\n  // Re-point every store proxy + the file proxy at `next`. Returns whether anything actually changed,\n  // so the caller can skip a redundant `mounted` emit. Synchronous: the repoint completes before this\n  // returns, so readers see `next` at once and the `mounted` emit can fire immediately. The displaced\n  // impl is closed in the *background* — a slow or throwing close() must never gate the swap or suppress\n  // the mounted notification. Driven only from the quiescent-edge flush below — never mid-turn.\n  const swapStorage = (next) => {\n    const removed = activeStorageBackend;\n    if (removed === next) return false;\n    activeStorageBackend = next;\n    for (const [ns, [, swap]] of storeProxies) swap(next.createStore(ns));\n    swapFiles(next.fileStore);\n    void Promise.resolve(removed?.close?.()).catch(e => console.error('[matbot] closing displaced StorageBackend:', e));\n    return true;\n  };\n\n  // Deferred StorageBackend swap (mirrors the CLI host): register/unregister('StorageBackend') stage the\n  // desired backend (last write wins — a slot, not a queue) and ask the context-switch machinery to land\n  // it at the next quiescent edge, so a swap never splits a compare-and-swap across ed ? { endpoint: await resolveInteractive(rawCfg.endpoint, vault) } : {}),\n      };\n      const adpt = await instantiateProvider(services, resolved);\n      if (adpt === null) throw new Error(`complete(): provider \"${req.provider}\" has no loadable adapter (module \"${resolved.module}\").`);\n      const msgs = req.system !== undefined\n        ? [createMessage({ role: 'system', content: [{ type: 'text', text: req.system }], traceId: crypto.randomUUID() }), ...req.messages]\n        : req.messages;\n      let text = '';\n      let usage = { inputTokens: 0, outputTokens: 0 };\n      for await (const ev of adpt.complete(msgs, resolved, [], req.signal ?? NEVER_ABORT)) {\n        if (ev.type === 'text-delta') text += ev.delta;\n        if (ev.type === 'usage') {\n          usage = {\n            inputTokens:  ev.inputTokens,\n            outputTokens: ev.outputTokens,\n            ...(ev.costUsd              !== undefined ? { costUsd:             ev.costUsd              } : {}),\n            ...(ev.cacheReadTokens     !== undefined ? { cacheReadTokens:     ev.cacheReadTokens     } : {}),\n            ...(ev.cacheCreationTokens !== undefined ? { cacheCreationTokens: ev.cacheCreationTokens } : {}),\n          };\n        }\n      }\n      // Report into the ambient usage sink: a tool running this completion has its spend attributed to\n      // the tool call by the runner. No-op outside any tool scope.\n      recordUsage(req.provider, usage);\n      return { text, usage };\n    },\n\n    async singleTurn(req) {\n      return this.complete(singleTurnRequest(req));\n    },\n\n    async loadPlugin(specifier, prompt) {\n      // A runtime add of a remote .ts (URL or root-absolute path) is fetched and type-stripped by the\n      // in-page loader into an ephemeral blob: URL; baked baseline specifiers are already importable\n      // via the import map. For a remote, we import the blob but record the *source* URL as the\n      // plugin's specifier (via { spec, importSpec }) alues()].map(p => ({\n      name: p.name, module: p.module, model: p.model,\n      ...(p.endpoint   !== undefined ? { endpoint:   p.endpoint   } : {}),\n      ...(p.parameters !== undefined ? { parameters: p.parameters } : {}),\n      hasKey: p.credentials?.['apiKey'] !== undefined,\n    })),\n    add:    applyDraft,\n    remove: removeProvider,\n  }));\n\n  // single_turn: the same core tool the node app registers — a one-shot completion against any\n  // configured provider (or the current turn's, when omitted). Pure (services only), so it runs\n  // identically in the browser realm.\n  toolReg.register(createSingleTurnTool(services));\n\n  // about_matbot: the harness's own version + description. The harness isn't a plugin, so this singleton\n  // fact gets a dedicated tool; the assembler bakes the web-bundle's own package version into the env.\n  toolReg.register(createAboutMatbotTool(env.harnessVersion ?? '?'));\n\n  // Let the frontend offer \"add another provider\" from the UI (runs the wizard form).\n  (globalThis ).__mbProviders = {\n    add:  async () => applyDraft(await runProviderSetup(config.availableProviders, { title: 'Add a provider', cancelable: true })),\n    list: () => [...providers.keys()],\n  };\n\n  // Then the rest — frontends, tools, storage, knowledge, hooks. The frontend plugin mounts the UI.\n  await loadPlugins(config.plugins, services);\n\n  // The pre-scan opened a manifest storageBackend before the loader knew the plugin's name, bypassing\n  // the scoped register() that records a service key. Attribute it now, so unloading that plugin reverts\n  // storage to the host base and closes the backend — unload-equal to a runtime register().\n  if (storageBootSpec !== undefined) {\n    const name = getPluginNameForSpecifier(storageBootSpec);\n    if (name !== undefined) recordServiceKey(name, 'StorageBackend');\n  }\n\n  console.warn('[matbot] web runtime ready —', toolReg.list().length, 'tools,', providers.size, 'providers.');\n}\n",
    "/plugins/browser/src/index.ts": "export { plugin }                from './plugin.js';\nexport { BrowserStorageBackend } from './storage-backend.js';\nexport { IDBStore }              from './idb-store.js';\nexport { OPFSFileStore }         from './opfs-file-store.js';\nexport { WebCryptoVault }        from './webcrypto-vault.js';\nexport { LocalStorageVault }     from './local-vault.js';\nexport { createBrowserPluginTool } from './plugin-tool.js';\n;\nexport { createBrowserProviderTool } from './provider-tool.js';\n;\nexport { createBrowserToolTypeIndex, extractToolContracts } from './tool-types.js';\n;\n",
    "/plugins/frontend/dom/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\nimport { ChatUI } from './ui.js';\n\n// Same tool name (and therefore the same one merged entry) as the served web frontend — declared\n// identically so the two augmentations agree.\n\n\n\n\n\n\n// No HTTP server in-process, so a file is addressed by materialising its bytes into a `blob:` URL.\n// These are page-scoped and deliberately never revoked — the URL is handed straight to the user/DOM,\n// and revoking would break a link still in view; the leak is bounded by the document lifetime.\n// Same default-deny gate as the served frontend: only files marked `allowed` get a URL.\nconst urlForResourceTool = {\n  name: 'url_for_resource',\n  description:\n    'Return a URL for a stored file the user can open, or null when it is not publicly viewable. Use this ' +\n    'to hand the user a link to a file (e.g. a workspace artifact) rather than guessing a path. Only files ' +\n    'marked viewable are served — workspace files are (namespace \"workspace\"); most other namespaces return null.\\n\\n' +\n    'Parameters: { namespace: string, name: string } — `name` is the file path within the namespace (for a ' +\n    'workspace file, the same path you wrote it under).',\n  inputSchema: {\n    type:     'object',\n    required: ['namespace', 'name'],\n    properties: {\n      namespace: { type: 'string', description: 'The file namespace, e.g. \"workspace\".' },\n      name:      { type: 'string', description: 'The file path/name within the namespace.' },\n    },\n  },\n  executor: {\n    async *execute(input, ctx) {\n      const { namespace, name } = input ;\n      if (!namespace || !name) { yield { type: 'error', message: 'url_for_resource requires \"namespace\" and \"name\".' }; return; }\n      if (!ctx.files) { yield { type: 'result', value: { url: null } }; return; }\n      const handle = await ctx.files.getByName(name, namespace);\n      if (!handle || !handle.allowed) { yield { type: 'result', value: { url: null } }; return; }\n\n      const chunks = [];\n      let total = 0;\n      for await (const chunk of handle.stream(ctx.signal)) { chunks.push(chunk); total += chunk.byteLength; }\n      const bytes = new Uint8Array(total);\n      let offset = 0;\n      for (const chunk of chunks) { bytes.set(chunk, offset); offset += chunk.byteLength; }\n      yield { type: 'result', value: { url: URL.createObjectURL(new Blob([bytes], { type: handle.mimeType })) } };\n    },\n  },\n};\n\n/**\n * In-process browser frontend. Mounts a chat UI into the DOM and drives `services.run` directly —\n * the same contract a remote frontend uses over HTTP/SSE, minus the wire. The mount point is\n * `#matbot-root` if present, else `document.body`.\n */\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  manifest:   { description: 'Browser chat frontend rendering to the DOM (in-process, no server).' },\n  tools:      [urlForResourceTool],\n\n  async setup(services) {\n    services.registerFrontend({ name: 'frontend-dom' });\n    const root = document.getElementById('matbot-root') ?? document.body;\n    await new ChatUI(services, root).mount();\n  },\n};\n",
    "/plugins/http/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n// Single arm: the request params paired with `unknown` (the body is parsed text or arbitrary JSON). The\n// params are inlined structurally (not a `HttpInput` reference) so the derived wire text shows real fields.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst executor = {\n  async *execute(input, ctx) {\n    const { url, method = 'GET', headers = {}, body, responseType = 'text' } = input ;\n\n    let res;\n    try {\n      res = await fetch(url, {\n        method,\n        headers,\n        ...(body !== undefined ? { body } : {}),\n        signal: ctx.signal,\n      });\n    } catch (e) {\n      yield { type: 'error', message: String(e) };\n      return;\n    }\n\n    let text;\n    try {\n      text = await res.text();\n    } catch (e) {\n      yield { type: 'error', message: `Failed to read response: ${String(e)}` };\n      return;\n    }\n\n    if (!res.ok) {\n      yield { type: 'error', message: `HTTP ${res.status}: ${text}`, code: res.status };\n      return;\n    }\n\n    if (responseType === 'json') {\n      try {\n        yield { type: 'result', value: JSON.parse(text)  };\n      } catch {\n        yield { type: 'error', message: `Non-JSON response: ${text.slice(0, 200)}` };\n      }\n    } else {\n      yield { type: 'result', value: text };\n    }\n  },\n};\n\nexport const httpTool = {\n  name:        'http',\n  description: 'Make an HTTP request and return the response body.',\n  inputSchema: {\n    type:       'object',\n    required:   ['url'],\n    properties: {\n      url:          { type: 'string', description: 'The URL to request.' },\n      method:       { type: 'string', enum: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH'], default: 'GET' },\n      headers:      { type: 'object', additionalProperties: { type: 'string' } },\n      body:         { type: 'string', description: 'Request body for POST/PUT/PATCH.' },\n      responseType: { type: 'string', enum: ['text', 'json'], default: 'text' },\n    },\n  },\n  executor,\n};\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  tools:      [httpTool],\n};\n",
    "/plugins/ask-user/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\n\n\n\n\n\n\nconst MAX_OPTIONS = 10;\nconst VALID_TYPES = ['text', 'password', 'select', 'confirm'];\n\nconst executor = {\n  async *execute(input, ctx) {\n    const field = input ;\n\n    if (!field.name || typeof field.name !== 'string') {\n      yield { type: 'error', message: 'Missing required field \"name\" (string).' };\n      return;\n    }\n    if (!field.label || typeof field.label !== 'string') {\n      yield { type: 'error', message: 'Missing required field \"label\" (string).' };\n      return;\n    }\n    if (!(VALID_TYPES ).includes(field.type)) {\n      yield { type: 'error', message: `Invalid type \"${field.type}\"; must be one of: ${VALID_TYPES.join(', ')}.` };\n      return;\n    }\n    if (field.type === 'select') {\n      if (!Array.isArray(field.options) || field.options.length === 0) {\n        yield { type: 'error', message: 'type \"select\" requires a non-empty \"options\" array.' };\n        return;\n      }\n      if (field.options.length > MAX_OPTIONS) {\n        yield { type: 'error', message: `Too many options (${field.options.length}); maximum is ${MAX_OPTIONS}.` };\n        return;\n      }\n    }\n\n    try {\n      const answer = await ctx.prompt(field);\n      yield { type: 'result', value: { name: field.name, answer } };\n    } catch (e) {\n      yield { type: 'error', message: String(e) };\n    }\n  },\n};\n\nexport const askUserTool = {\n  name: 'ask_user',\n  description: `Use this tool when you need the user to choose, confirm, or supply a value\n   before proceeding. The frontend renders the question as an interactive control.\n\n## Input contract\n\\`\\`\\`typescript\ninterface FormField {\n  name:        string;   // machine-readable key for the response\n  label:       string;   // the question text shown to the user\n  type:        'text' | 'password' | 'select' | 'confirm';\n  options?:    string[]; // required when type is 'select' — mutually exclusive choices\n  allowOther?: boolean;  // select-only: also let the user type a free-form answer\n  default?:    string;   // pre-filled or pre-selected value\n  required?:   boolean;  // if true, user must supply a non-empty value\n  cancelable?: boolean;  // default true; set false to forbid cancelling (see below)\n}\n\\`\\`\\`\n\n## Field types\n\n- **text** — free-form text input. Use for open-ended questions.\n- **password** — masked text input. Use for secrets, API keys, tokens (the value is not displayed).\n- **select** — mutually exclusive pick from \\`options\\`. Use for multiple-choice questions. The frontend renders options as buttons or a dropdown. Set \\`allowOther: true\\` to also offer a free-text answer when your options may not cover every case.\n- **confirm** — yes/no confirmation. Use for irreversible actions. The frontend renders as a confirm/cancel dialog. Returns \"Yes\" or \"No\".\n\n## Declining vs cancelling\n\nThese are different and you should design for the first one. If the user might legitimately say \"no thanks\", \"skip\", or \"I don't know\", offer that as one of your \\`options\\` (or a \\`confirm\\`) — you get the choice back as a normal answer and branch on it. Only omit such an option when an answer is genuinely required (e.g. a password with no fallback).\n\n\\`cancelable\\` is unrelated: it controls whether the frontend shows a \"give up entirely\" affordance. Cancelling is not an answer — it abandons the whole operation and returns control to the user, and this tool reports it as an error. Leave \\`cancelable\\` at its default (true); set it false only for a prompt the user must not be able to escape.\n\n## Examples\n\n\\`\\`\\`json\n// Multiple-choice question (4 mutually exclusive options)\n{\n  \"name\": \"skill\",\n  \"label\": \"If you could instantly master any skill, which would you choose?\",\n  \"type\": \"select\",\n  \"options\": [\n    \"Playing a musical instrument fluently\",\n    \"Speaking every language in the world\",\n    \"Expert-level coding and software development\",\n    \"Painting or drawing with professional skill\"\n  ]\n}\n\n// Confirmation before a destructive action\n{\n  \"name\": \"confirmed\",\n  \"label\": \"Delete all records for project X?\",\n  \"type\": \"confirm\"\n}\n\n// Ask for a password or API key\n{\n  \"name\": \"token\",\n  \"label\": \"Enter your GitHub personal access token:\",\n  \"type\": \"password\",\n  \"required\": true\n}\n\n// Open-ended question\n{\n  \"name\": \"title\",\n  \"label\": \"What should the report be titled?\",\n  \"type\": \"text\",\n  \"default\": \"Q4 Summary\"\n}\n\\`\\`\\``,\n\n  inputSchema: {\n    type: 'object',\n    required: ['name', 'label', 'type'],\n    properties: {\n      name:     { type: 'string', description: 'Machine-readable key for the response value.' },\n      label:    { type: 'string', description: 'The question text shown to the user.' },\n      type:     { type: 'string', enum: ['text', 'password', 'select', 'confirm'], description: 'Control type: text (free text), password (masked), select (multiple choice from options), confirm (yes/no).' },\n      options:    { type: 'array', items: { type: 'string' }, minItems: 1, maxItems: MAX_OPTIONS, description: 'Mutually exclusive options. Required when type is \"select\".' },\n      allowOther: { type: 'boolean', description: 'select-only: also let the user type a free-form answer alongside the options.' },\n      default:    { type: 'string', description: 'Pre-filled or pre-selected value.' },\n      required:   { type: 'boolean', description: 'If true, user must supply a non-empty value.' },\n      cancelable: { type: 'boolean', description: 'Default true. Set false to forbid cancelling — a graceful \"decline\" should be an option/confirm value, not a cancel.' },\n    },\n  },\n  executor,\n};\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  tools:      [askUserTool],\n};\n",
    "/plugins/sessions/src/index.ts": "\nimport { PLUGIN_API_VERSION }               from '@matatbread/matbot-plugin-api';\nimport { makeSessionTools }                 from './tools.js';\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n\n  async setup(services) {\n    const store = services.sessions;\n    if (!store) return;\n    for (const tool of makeSessionTools(store)) {\n      services.tools.register(tool);\n    }\n  },\n};\n",
    "/plugins/edit-session/src/index.ts": "\n\n\nimport { PLUGIN_API_VERSION, lastActivityAt } from '@matatbread/matbot-plugin-api';\n\nimport { makeCompactSessionsTool } from './compact-sessions.js'\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst MARKER_CREATOR = '@matatbread/matbot-edit-session';\n\n// This plugin's marker payload, made type-safe by augmenting the shared MarkerData registry.\n// Any reader narrowing on creator === MARKER_CREATOR gets the typed `data` for free.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// ── helpers ───────────────────────────────────────────────────────────────────\n\nfunction now() { return new Date().toISOString(); }\n\n// A standalone marker message: opaque to the LLM (the 'marker' role is skipped by every provider\n// converter), preserved by compaction, carried with the session for the UI to render as a\n// cross-thread link.\nfunction markerMessage(data) {\n  const marker = { type: 'marker', creator: MARKER_CREATOR, data };\n  return {\n    id:        crypto.randomUUID(),\n    role:      'marker',\n    content:   [marker],\n    createdAt: now(),\n    traceId:   crypto.randomUUID(),\n  };\n}\n\nfunction bumpVersion(doc) {\n  return { ...doc, version: crypto.randomUUID() };\n}\n\n// Resolve msgIndex (raw index into session.messages) to the actual index.\n// The frontend passes the original message index from the full messages array.\nfunction resolveIndex(session, msgIndex) {\n  if (msgIndex < 0) msgIndex = session.messages.length + msgIndex;\n  if (msgIndex < 0 || msgIndex >= session.messages.length) return null;\n  return msgIndex;\n}\n\nfunction generateSplitTitle(title) {\n  // If title ends with \" pt N\", bump the number\n  const match = title.match(/^(.*?)\\s*pt\\s+(\\d+)$/);\n  if (match && match.length > 2) {\n    return `${match[1]?.trimEnd()} pt ${parseInt(match[2] ?? '0') + 1}`;\n  }\n  // Otherwise append \" pt 2\"\n  return `${title || 'Untitled'} pt 2`;\n}\n\nconst KEEP_TYPES = new Set(['text', 'refusal', 'marker']);\n\n// ── tool ──────────────────────────────────────────────────────────────────────\n\n// All four actions share the same parameter shape ({ sessionId, msgIndex }); only the behaviour\n// differs. The schema stays loose (action enum + the shared fields) and the description carries\n// this TypeScript signature, which the executor enforces.\n\n\nfunction makeSessionEditTool(store) {\n  return {\n    name: 'session_edit',\n    description:\n      'Edit the message history of a session (see `session_action` for what a session is). Every ' +\n      'action takes a session ID and a message index (`msgIndex`, an index into session.messages) ' +\n      'and uses it to manage the conversation\\'s length and structure:\\n' +\n      '  cut     — Truncate: remove all messages from msgIndex onward.\\n' +\n      '  fork    — Branch: create a NEW session with messages[0..msgIndex-1]; the original is unchanged.\\n' +\n      '  split   — Move: messages before msgIndex move to a new session; the current session keeps\\n' +\n      '            msgIndex onward. Both sides get cross-link markers.\\n' +\n      '  compact — Shrink: strip thinking blocks, tool calls, and tool results from messages before\\n' +\n      '            msgIndex, keeping user/assistant text — fewer tokens, same thread.',\n    inputSchema: {\n      type:       'object',\n      required:   ['action', 'sessionId', 'msgIndex'],\n      properties: {\n        action:    { type: 'string', enum: ['cut', 'fork', 'split', 'compact'], description: 'The edit to perform.' },\n        sessionId: { type: 'string', description: 'ID of the session to edit.' },\n        msgIndex:  { type: 'number', description: 'Index into session.messages the action pivots on (see per-action meaning in the description). Like slice index, negative is an offset from the end of the session.' },\n      },\n    },\n    executor: {\n      async *execute(input) {\n        const { action, sessionId, msgIndex } = input ;\n        if (!sessionId) { yield { type: 'error', message: 'session_edit requires \"sessionId\".' }; return; }\n        if (typeof msgIndex !== 'number') { yield { type: 'error', message: 'session_edit requires \"msgIndex\" (number).' }; return; }\n\n        const session = await store.get(sessionId);\n        if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n        const idx = resolveIndex(session, msgIndex);\n        if (idx === null) { yield { type: 'error', message: `msgIndex ${msgIndex} out of range.` }; return; }\n\n        switch (action) {\n          case 'cut': {\n            const trimmed = { ...session, messages: session.messages.slice(0, idx) };\n            const next = bumpVersion({ ...trimmed, updatedAt: lastActivityAt(trimmed) });\n            const res = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { sessionId, messagesRemaining: next.messages.length } };\n            return;\n          }\n\n          case 'fork': {\n            // One-way: only the fork is marked (pointing back to its origin). The original is left\n            // unchanged, per this action's contract.\n            // targetMsg idx-1: the fork point in the (unchanged) parent — its last message shared with\n            // this fork. The marker is the fork's last message, so its timestamp is the fork's updatedAt.\n            const forkMarker = markerMessage({ relation: 'forked-from', peerSessionId: sessionId, targetMsg: Math.max(0, idx - 1) });\n            const forked = {\n              ...bumpVersion(session),\n              id:               crypto.randomUUID(),\n              parentSessionId:  sessionId,\n              messages:         [...session.messages.slice(0, idx), forkMarker],\n              createdAt:        now(),\n              updatedAt:        forkMarker.createdAt,\n            };\n            await store.set(forked.id, forked);\n            yield { type: 'result', value: { newSessionId: forked.id, messagesCopied: idx } };\n            return;\n          }\n\n          case 'split': {\n            if (idx === 0) { yield { type: 'error', message: 'Cannot split at index 0 — nothing to split off.' }; return; }\n\n            // Messages before the split point go to the new session\n            const prefixMsgs = session.messages.slice(0, idx);\n            // Messages from the split point onward stay in the current session\n            const suffixMsgs = session.messages.slice(idx);\n\n            const newSessionId = crypto.randomUUID();\n\n            // New session: prefix messages, tailed by a marker pointing forward to the continuing\n            // (current) session. The marker is its last message, hence its updatedAt.\n            // targetMsg 1: in the current session the prepended split-from marker is index 0, so the\n            // continuation (first suffix message) lands at index 1.\n            const continuedMarker = markerMessage({ relation: 'continued-in', peerSessionId: sessionId, targetMsg: 1 });\n            const newSession = {\n              ...bumpVersion(session),\n              id:               newSessionId,\n              parentSessionId:  sessionId,\n              messages:         [...prefixMsgs, continuedMarker],\n              createdAt:        now(),\n              updatedAt:        continuedMarker.createdAt,\n            };\n            await store.set(newSession.id, newSession);\n\n            // Current session: keep only suffix messages, headed by a marker pointing back to where\n            // the earlier messages now live. Its tail (the last suffix message) is unchanged, so by the\n            // lastActivityAt invariant updatedAt is preserved — the split doesn't reorder this session.\n            // targetMsg idx-1: the last earlier message in the new session.\n            const continued = {\n              ...session,\n              title:    generateSplitTitle(session.title ?? ''),\n              messages: [markerMessage({ relation: 'split-from', peerSessionId: newSessionId, targetMsg: idx - 1 }), ...suffixMsgs],\n            };\n            const updated = bumpVersion({ ...continued, updatedAt: lastActivityAt(continued) });\n            const res = await store.cas(sessionId, session.version, updated);\n            if (!res.ok) {\n              // CAS failed — clean up the new session we just created\n              await store.delete(newSession.id);\n              yield { type: 'error', message: 'Concurrent modification — please retry.' };\n              return;\n            }\n\n            yield {\n              type: 'result',\n              value: {\n                newSessionId:      newSession.id,\n                messagesSplit:     prefixMsgs.length,\n                currentSessionId:  sessionId,\n                messagesRemaining: suffixMsgs.length,\n              },\n            };\n            return;\n          }\n\n          case 'compact': {\n            if (idx === 0) { yield { type: 'error', message: `msgIndex ${msgIndex} out of range or nothing to compact.` }; return; }\n            let stripped = 0;\n            const messages = session.messages.map((m, i) => {\n              if (i >= idx) return m;\n              const compact = m.content.filter(c => KEEP_TYPES.has(c.type));\n              if (compact.length === m.content.length) return m;\n              stripped++;\n              return { ...m, content: compact };\n            });\n            // Compaction strips block content but preserves every message (and its timestamp), so the\n            // tail is unchanged and updatedAt holds — the session keeps its place in a recency-sorted list.\n            const compacted = { ...session, messages };\n            const next = bumpVersion({ ...compacted, updatedAt: lastActivityAt(compacted) });\n            const res = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { sessionId, messagesStripped: stripped } };\n            return;\n          }\n\n          default:\n            yield { type: 'error', message: `Unknown action \"${String(action)}\". Expected one of: cut, fork, split, compact.` };\n        }\n      },\n    },\n  };\n}\n\n// ── plugin ────────────────────────────────────────────────────────────────────\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n\n  async setup(services) {\n    const store = services.sessions;\n    if (!store) return;\n    services.tools.register(makeSessionEditTool(store));\n    services.tools.register(makeCompactSessionsTool(store));\n  },\n};\n",
    "/plugins/workspace/src/index.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst WORKSPACE_NS = 'workspace';\n\nconst MIME_MAP = {\n  '.txt':  'text/plain; charset=utf-8',\n  '.md':   'text/markdown; charset=utf-8',\n  '.html': 'text/html; charset=utf-8',\n  '.css':  'text/css; charset=utf-8',\n  '.js':   'application/javascript; charset=utf-8',\n  '.json': 'application/json; charset=utf-8',\n  '.csv':  'text/csv; charset=utf-8',\n  '.xml':  'application/xml; charset=utf-8',\n  '.svg':  'image/svg+xml',\n  '.png':  'image/png',\n  '.jpg':  'image/jpeg',\n  '.jpeg': 'image/jpeg',\n  '.gif':  'image/gif',\n  '.webp': 'image/webp',\n  '.pdf':  'application/pdf',\n  '.zip':  'application/zip',\n  '.sh':   'application/x-sh',\n};\n\n// Returns a normalised relative path if safe, null if it contains traversal.\nfunction safePath(input) {\n  const parts = input.replace(/\\\\/g, '/').split('/').filter(Boolean);\n  if (parts.some(p => p === '..')) return null;\n  return parts.join('/');\n}\n\nfunction mimeFromName(name) {\n  const dot = name.lastIndexOf('.');\n  const ext = dot !== -1 ? name.slice(dot).toLowerCase() : '';\n  return MIME_MAP[ext] ?? 'application/octet-stream';\n}\n\nfunction base64ToUint8(b64) {\n  const binary = atob(b64);\n  const bytes  = new Uint8Array(binary.length);\n  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);\n  return bytes;\n}\n\nfunction uint8ToBase64(bytes) {\n  let binary = '';\n  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);\n  return btoa(binary);\n}\n\nasync function collectStream(stream) {\n  const chunks = [];\n  let total = 0;\n  for await (const chunk of stream) { chunks.push(chunk); total += chunk.byteLength; }\n  const out = new Uint8Array(total);\n  let offset = 0;\n  for (const chunk of chunks) { out.set(chunk, offset); offset += chunk.byteLength; }\n  return out;\n}\n\n// The precise per-action contract. JSON Schema can't express \"content is required only for write\"\n// without an awkward oneOf the providers honour inconsistently, so the schema stays loose and the\n// description below carries this TypeScript discriminated union — which LLMs read accurately — as\n// the source of truth. The executor enforces it.\n\n\n\n\n\n\nconst workspaceExecutor = {\n  async *execute(input, ctx) {\n    const args = input ;\n    if (!ctx.files) { yield { type: 'error', message: 'No file store is configured for this session.' }; return; }\n\n    switch (args.action) {\n      case 'read': {\n        const { path: inputPath, encoding = 'utf8' } = args ;\n        if (!inputPath) { yield { type: 'error', message: 'action \"read\" requires \"path\".' }; return; }\n        const safe = safePath(inputPath);\n        if (!safe) { yield { type: 'error', message: 'Path escapes the workspace directory.' }; return; }\n\n        const handle = await ctx.files.getByName(safe, WORKSPACE_NS);\n        if (!handle) { yield { type: 'error', message: `File not found: \"${safe}\"` }; return; }\n\n        let bytes;\n        try {\n          bytes = await collectStream(handle.stream(ctx.signal));\n        } catch (e) {\n          yield { type: 'error', message: String(e) };\n          return;\n        }\n\n        yield {\n          type:  'result',\n          value: encoding === 'base64' ? uint8ToBase64(bytes) : new TextDecoder().decode(bytes),\n        };\n        return;\n      }\n\n      case 'write': {\n        const { path: inputPath, content, encoding = 'utf8' } = args ;\n        if (!inputPath) { yield { type: 'error', message: 'action \"write\" requires \"path\".' }; return; }\n        if (content === undefined) { yield { type: 'error', message: 'action \"write\" requires \"content\".' }; return; }\n        const safe = safePath(inputPath);\n        if (!safe) { yield { type: 'error', message: 'Path escapes the workspace directory.' }; return; }\n\n        const bytes = encoding === 'base64'\n          ? base64ToUint8(content)\n          : new TextEncoder().encode(content);\n\n        async function* makeStream() { yield bytes; }\n\n        let handle;\n        try {\n          handle = await ctx.files.put(safe, mimeFromName(safe), makeStream(), { namespace: WORKSPACE_NS, allowed: true });\n        } catch (e) {\n          yield { type: 'error', message: String(e) };\n          return;\n        }\n\n        yield { type: 'result', value: { path: safe, bytes: handle.size } };\n        return;\n      }\n\n      case 'list': {\n        const { path: inputPath, recursive = false } = args ;\n        const prefix = inputPath ? `${safePath(inputPath) ?? ''}/` : '';\n\n        const files = [];\n        try {\n          for await (const handle of ctx.files.list({ namespace: WORKSPACE_NS })) {\n            const name = handle.name;\n            if (prefix && !name.startsWith(prefix)) continue;\n            const rel = prefix ? name.slice(prefix.length) : name;\n            if (!recursive && rel.includes('/')) continue;\n            files.push({ path: name, size: handle.size });\n          }\n        } catch (e) {\n          yield { type: 'error', message: String(e) };\n          return;\n        }\n\n        yield { type: 'result', value: files };\n        return;\n      }\n\n      case 'delete': {\n        const { path: inputPath } = args ;\n        if (!inputPath) { yield { type: 'error', message: 'action \"delete\" requires \"path\".' }; return; }\n        const safe = safePath(inputPath);\n        if (!safe) { yield { type: 'error', message: 'Path escapes the workspace directory.' }; return; }\n\n        const handle = await ctx.files.getByName(safe, WORKSPACE_NS);\n        if (!handle) { yield { type: 'error', message: `File not found: \"${safe}\"` }; return; }\n\n        await ctx.files.delete(handle.id);\n        yield { type: 'result', value: { path: safe } };\n        return;\n      }\n\n      default:\n        yield { type: 'error', message: `Unknown action \"${String(args.action)}\". Expected one of: read, write, list, delete.` };\n    }\n  },\n};\n\nconst workspaceTool = {\n  name: 'workspace_action',\n  description:\n    'Read, write, list, and delete files in the **workspace** — a small scratch ' +\n    'and transfer area, NOT the host filesystem. Use it for files the user uploads or downloads, ' +\n    'generated artifacts (reports, charts, exports), and working notes or to-do lists. It is not a code ' +\n    'workspace: files here are not executable. Workspace files are publicly viewable; if a tool is available ' +\n    'to mint a shareable link for a stored file, prefer it over guessing a URL.\\n\\n' +\n    'For `list`, `path` is a filename prefix, not a directory — \".\" and \"/\" match nothing.\\n' +\n    \"Use encoding 'base64' for binary files (images, PDFs, zips); 'utf8' (the default) for text.\",\n  inputSchema: {\n    type:       'object',\n    required:   ['action'],\n    properties: {\n      action:    { type: 'string', enum: ['read', 'write', 'list', 'delete'], description: 'The operation to perform.' },\n      path:      { type: 'string', description: 'File path relative to the workspace root (e.g. \"report.md\", \"charts/data.csv\"). Required for read/write/delete; optional subdirectory filter for list.' },\n      content:   { type: 'string', description: 'File contents — required for action \"write\".' },\n      encoding:  { type: 'string', enum: ['utf8', 'base64'], default: 'utf8', description: \"Used by read/write. 'base64' for binary files, 'utf8' (default) for text.\" },\n      recursive: { type: 'boolean', default: false, description: 'list only: include files in subdirectories.' },\n    },\n  },\n  executor: workspaceExecutor,\n};\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  tools: [workspaceTool],\n};\n",

    "/plugins/json-validation/src/index.ts": "import { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\n// A deliberately small JSON Schema validator covering the subset matbot tool\n// inputSchemas use: type, properties, required, items, enum, additionalProperties,\n// pattern. Unknown keywords are ignored (standard JSON Schema semantics) and\n// unrecognised types pass — so this can never reject more than it understands.\n\n// Keywords this validator actually enforces.\nconst ENFORCED = new Set([\n  'type', 'properties', 'required', 'items', 'enum', 'additionalProperties', 'pattern',\n]);\n// Keywords that carry no validation semantics — safe to ignore without warning.\nconst ANNOTATIONS = new Set([\n  'description', 'title', 'default', 'examples', 'deprecated', 'readOnly', 'writeOnly',\n  '$schema', '$id', '$comment', 'definitions', '$defs',\n]);\n\n// Walk a schema tree and collect every keyword that affects validation but this\n// validator doesn't enforce (anyOf, $ref, minimum, format, …) → reported so an\n// overreaching tool schema is visible rather than silently passed through.\nfunction findUnvalidated(schema, path, found) {\n  for (const key of Object.keys(schema)) {\n    if (!ENFORCED.has(key) && !ANNOTATIONS.has(key) && !found.has(key)) {\n      found.set(key, path || '/');\n    }\n  }\n  const props = schema['properties'];\n  if (props && typeof props === 'object') {\n    for (const [k, v] of Object.entries(props)) {\n      if (v && typeof v === 'object') findUnvalidated(v , `${path}/${k}`, found);\n    }\n  }\n  const items = schema['items'];\n  if (items && typeof items === 'object') findUnvalidated(items , `${path}/[]`, found);\n  const additional = schema['additionalProperties'];\n  if (additional && typeof additional === 'object') findUnvalidated(additional , `${path}/*`, found);\n}\n\nfunction matches(type, value) {\n  switch (type) {\n    case 'string':  return typeof value === 'string';\n    case 'boolean': return typeof value === 'boolean';\n    case 'number':  return typeof value === 'number' && Number.isFinite(value);\n    case 'integer': return typeof value === 'number' && Number.isInteger(value);\n    case 'object':  return typeof value === 'object' && value !== null && !Array.isArray(value);\n    case 'array':   return Array.isArray(value);\n    case 'null':    return value === null;\n    default:        return true;\n  }\n}\n\nfunction validate(schema, value, path, errs) {\n  const at = path || '/';\n  const type = schema['type'];\n\n  if (typeof type === 'string' && !matches(type, value)) {\n    errs.push(`${at}: expected ${type}, got ${value === null ? 'null' : Array.isArray(value) ? 'array' : typeof value}`);\n    return;\n  }\n  if (Array.isArray(type) && !type.some(t => typeof t === 'string' && matches(t, value))) {\n    errs.push(`${at}: expected one of ${type.join(', ')}`);\n    return;\n  }\n\n  const enumVals = schema['enum'];\n  if (Array.isArray(enumVals) && !enumVals.some(e => e === value || JSON.stringify(e) === JSON.stringify(value))) {\n    errs.push(`${at}: must be one of ${enumVals.map(e => JSON.stringify(e)).join(', ')}`);\n  }\n\n  const pattern = schema['pattern'];\n  if (typeof pattern === 'string' && typeof value === 'string' && !new RegExp(pattern).test(value)) {\n    errs.push(`${at}: does not match pattern ${pattern}`);\n  }\n\n  if (matches('object', value)) {\n    const obj = value ;\n    const props = (schema['properties'] ?? {}) ;\n    const required = Array.isArray(schema['required']) ? schema['required']  : [];\n    const additional = schema['additionalProperties'];\n\n    for (const key of required) {\n      if (!(key in obj)) errs.push(`${path}/${key}: required property missing`);\n    }\n    for (const [key, v] of Object.entries(obj)) {\n      if (props[key]) validate(props[key], v, `${path}/${key}`, errs);\n      else if (additional === false) errs.push(`${path}/${key}: unexpected property`);\n      else if (typeof additional === 'object' && additional !== null) {\n        validate(additional , v, `${path}/${key}`, errs);\n      }\n    }\n  }\n\n  const items = schema['items'];\n  if (Array.isArray(value) && typeof items === 'object' && items !== null) {\n    value.forEach((v, i) => validate(items , v, `${path}/${i}`, errs));\n  }\n}\n\nfunction makeValidatorHook() {\n  const reported = new Set();\n\n  return {\n    on:         'toolcall',\n    pluginName: '@matatbread/matbot-tool-json-validation',\n    async handler(ctx) {\n      const { tool, toolCall } = ctx;\n\n      if (!reported.has(tool.name)) {\n        reported.add(tool.name);\n        const unvalidated = new Map();\n        findUnvalidated(tool.inputSchema, '', unvalidated);\n        if (unvalidated.size > 0) {\n          const list = [...unvalidated].map(([kw, at]) => `${kw} (at ${at})`).join(', ');\n          console.warn(`[json-validation] Tool \"${tool.name}\" schema uses keyword(s) this validator does not check: ${list}. Inputs exercising these are passed through unvalidated.`);\n        }\n      }\n\n      const errs = [];\n      validate(tool.inputSchema, toolCall.input, '', errs);\n      if (errs.length === 0) return;\n\n      return { rejectTool: { message: `Invalid input for tool \"${toolCall.name}\": ${errs.join('; ')} [${this.pluginName}]` } };\n    },\n  };\n}\n\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n\n  async setup(services) {\n    services.hooks.register(makeValidatorHook());\n  },\n};\n",

    "/core/src/index.ts": ";\n// matbot's typed errors are duck-typed: factory `xError()` builders + `isXError()` brand guards are\n// runtime values (re-exported here, since the `export type *` above would strip their value meaning),\n// while the `XError` shapes are types (re-exported below). StoreQueryError is still a class value.\nexport {\n  missingSecretError, isMissingSecretError,\n  incompatibleRuntimeError, isIncompatibleRuntimeError,\n  notAPluginError, isNotAPluginError,\n  promptCancelledError, isPromptCancelledError,\n  StoreQueryError,\n} from '@matatbread/matbot-plugin-api';\n\n\n;\nexport { applyCreateSecret }  from '@matatbread/matbot-plugin-api';\n// unifyServices is a runtime fn; the `export type *` above would otherwise strip its value meaning.\nexport { unifyServices }      from '@matatbread/matbot-plugin-api';\n// Same: pure runtime helpers that would otherwise be stripped to type-only by `export type *`.\nexport { forwardingProxy, makeSwappable, singleTurnRequest, createMountTable } from '@matatbread/matbot-plugin-api';\n// Observation-stream primitives (broadcaster + the bare-subscribe wrapper); the host wires `mounted`.\nexport { createBroadcaster, subscribable } from '@matatbread/matbot-plugin-api';\n;\n// Ambient security principal: interface is a type (carried by `export type *`); these are the values.\nexport {\n  installPrincipalCarrier, currentPrincipal, tryCurrentPrincipal,\n  runAs, enterPrincipal, createConstantPrincipalCarrier,\n  contextSwitch, onContextQuiesce, flushIfQuiescent,\n  installUsageCarrier, createSerialUsageCarrier, recordUsage, currentUsageSink, withUsageScope,\n  lastActivityAt,\n} from '@matatbread/matbot-plugin-api';\nexport * from './session.js';\nexport * from './usage.js';\nexport * from './hooks.js';\nexport * from './runner.js';\nexport * from './session-runner.js';\nexport * from './plugin.js';\nexport * from './registry.js';\nexport * from './settings.js';\nexport * from './loader.js';\nexport * from './tool-registry.js';\nexport * from './provider-registry.js';\nexport * from './system-context.js';\nexport * from './single-turn.js';\nexport * from './about.js';\nexport * from './config/index.js';\nexport * from './security/index.js';\nexport * from './knowledge/index.js';\n",
