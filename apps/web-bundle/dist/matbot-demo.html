    "/apps/web-bundle/src/setup.ts": "\n\n\n\n;\n\nconst CSS = `\n.mb-setup-overlay { position:fixed; inset:0; display:flex; align-items:center; justify-content:center;\n  background:#0f172a; font:14px/1.5 system-ui,sans-serif; color:#1a1a1a; z-index:9999; }\n.mb-setup-card { background:#fff; border-radius:14px; padding:24px; width:min(440px,92vw);\n  box-shadow:0 10px 40px rgba(0,0,0,.4); display:flex; flex-direction:column; gap:12px; }\n.mb-setup-card h2 { margin:0; font-size:18px; }\n.mb-setup-card p.sub { margin:0 0 4px; color:#666; font-size:13px; }\n.mb-setup-card label { display:flex; flex-direction:column; gap:4px; font-weight:600; font-size:13px; }\n.mb-setup-card input, .mb-setup-card select { font:inherit; padding:8px; border:1px solid #cfcfcf; border-radius:8px; font-weight:400; }\n.mb-setup-card .row { display:flex; gap:10px; margin-top:6px; }\n.mb-setup-card button { font:inherit; padding:9px 16px; border:none; border-radius:8px; cursor:pointer; }\n.mb-setup-card button.save { background:#2563eb; color:#fff; flex:1; }\n.mb-setup-card button.cancel { background:#eee; }\n.mb-setup-card .err { color:#b91c1c; font-size:13px; min-height:1em; }\n`;\n\nlet stylesInjected = false;\nfunction ensureStyles() {\n  if (stylesInjected) return;\n  const s = document.createElement('style');\n  s.textContent = CSS;\n  document.head.appendChild(s);\n  stylesInjected = true;\n}\n\nfunction field(labelText, input) {\n  const l = document.createElement('label');\n  l.textContent = labelText;\n  l.appendChild(input);\n  return l;\n}\n\n/**\n * Render the provider setup form and resolve with the user's entries. Shown at first startup when no\n * provider is configured (not cancelable then), and reusable later to add another (cancelable).\n */\nexport function runProviderSetup(\n  available,\n  opts = {},\n) {\n  ensureStyles();\n  return new Promise((resolve, reject) => {\n    const overlay = document.createElement('div');\n    overlay.className = 'mb-setup-overlay';\n    const card = document.createElement('div');\n    card.className = 'mb-setup-card';\n\n    const h = document.createElement('h2');\n    h.textContent = opts.title ?? 'Configure your LLM provider';\n    const sub = document.createElement('p');\n    sub.className = 'sub';\n    sub.textContent = 'matbot runs entirely in your browser and calls the model directly. Enter any OpenAI- or Anthropic-compatible endpoint (DeepSeek, Azure, a local server, …).';\n\n    const name = document.createElement('input');\n    name.placeholder = 'e.g. deepseek';\n\n    const type = document.createElement('select');\n    available.forEach((a, i) => {\n      const o = document.createElement('option');\n      o.value = String(i);\n      o.textContent = a.label;\n      type.appendChild(o);\n    });\n\n    const endpoint = document.createElement('input');\n    const model    = document.createElement('input');\n    const apiKey   = document.createElement('input');\n    apiKey.type = 'password';\n    apiKey.placeholder = 'sk-…';\n\n    const endpointField = field('Endpoint URL', endpoint);\n    const modelField    = field('Model', model);\n    const apiKeyField   = field('API key', apiKey);\n\n    const applyHints = () => {\n      const a = available[Number(type.value)];\n      // A self-contained adapter (e.g. a local demo LLM) needs no endpoint/model/key — hide them.\n      const sc = !!a?.selfContained;\n      for (const f of [endpointField, modelField, apiKeyField]) f.style.display = sc ? 'none' : '';\n      endpoint.placeholder = a?.endpointHint ?? 'https://…';\n      model.placeholder    = a?.modelHint ?? 'model-name';\n    };\n    type.addEventListener('change', applyHints);\n    applyHints();\n\n    const err = document.createElement('div');\n    err.className = 'err';\n\n    const row  = document.createElement('div');\n    row.className = 'row';\n    const save = document.createElement('button');\n    save.className = 'save';\n    save.textContent = 'Save & start';\n\n    const submit = () => {\n      const a = available[Number(type.value)];\n      const sc = !!a?.selfContained;\n      const draft = {\n        name:     name.value.trim(),\n        module:   a?.module ?? '',\n        endpoint: sc ? '' : endpoint.value.trim(),\n        model:    sc ? (a?.modelHint ?? a?.label ?? '') : model.value.trim(),\n        apiKey:   sc ? '' : apiKey.value.trim(),\n      };\n      if (!draft.name)   { err.textContent = 'A name is required.';     return; }\n      if (!draft.module) { err.textContent = 'Pick an adapter type.';   return; }\n      if (!sc) {\n        if (!draft.endpoint) { err.textContent = 'An endpoint URL is required.'; return; }\n        if (!draft.model)  { err.textContent = 'A model name is required.'; return; }\n        if (!draft.apiKey) { err.textContent = 'An API key is required.';  return; }\n      }\n      overlay.remove();\n      resolve(draft);\n    };\n    save.addEventListener('click', submit);\n    apiKey.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); submit(); } });\n    row.appendChild(save);\n\n    if (opts.cancelable) {\n      const cancel = document.createElement('button');\n      cancel.className = 'cancel';\n      cancel.textContent = 'Cancel';\n      cancel.addEventListener('click', () => { overlay.remove(); reject(new Error('setup cancelled')); });\n      row.appendChild(cancel);\n    }\n\n    card.append(\n      h, sub,\n      field('Name', name),\n      field('Adapter', type),\n      endpointField,\n      modelField,\n      apiKeyField,\n      err, row,\n    );\n    overlay.appendChild(card);\n    (document.getElementById('matbot-root') ?? document.body).appendChild(overlay);\n    name.focus();\n  });\n}\n",
    "/plugins/browser/src/plugin.ts": "\nimport { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\nimport { makePluginSettings, } from '@matatbread/matbot-core';\nimport { BrowserStorageBackend, assertBrowserRealm } from './storage-backend.js';\nimport { createBrowserPluginTool, } from './plugin-tool.js';\n\nconst EXTRA_KEY = 'extra-plugins';\n\n/**\n * The browser defaults plugin. Supplies the platform storage backend (IndexedDB + OPFS) and the\n * browser `plugin` management tool — the browser analogue of the node app's filesystem stores and\n * built-in `plugin` tool, but shipped as a plugin (not core), so the web build is assembled purely\n * from plugins over a platform-neutral core.\n *\n * Because the browser has no matbot.yaml, this plugin also owns the durable list of *user-added*\n * plugins: `add`/`remove` persist into its own settings (IndexedDB), and `setup()` replays them on\n * boot via `services.loadPlugin`, so a session's installed plugins survive a realm reload.\n */\nexport const plugin = {\n  apiVersion: PLUGIN_API_VERSION,\n  manifest:   { description: 'Browser defaults: IndexedDB + OPFS storage backend and the browser plugin manager.' },\n\n  storageBackend: {\n    open: (dotData) => BrowserStorageBackend.open(dotData),\n  },\n\n  async setup(services) {\n    // Browser-only: on node this throws, the loader logs and skips the plugin, and the host keeps its\n    // real (filesystem) backend — no dead config.\n    assertBrowserRealm();\n\n    // Hot-load path: if we weren't activated by the boot pre-scan, become the backend now so all\n    // stores (including the settings store this plugin uses below) land in IndexedDB.\n    if (!(services.StorageBackend instanceof BrowserStorageBackend)) {\n      await services.register('StorageBackend', await BrowserStorageBackend.open(''));\n    }\n\n    // Bind the extras list to the backend that is active *now* (the local IndexedDB default), captured\n    // concretely so it survives a later StorageBackend swap. `services.settings()` goes through the\n    // swappable store proxy, so if a plugin swaps the backend during its own load (e.g. the Google\n    // Drive backend, mid-`add`), the post-load write would land in the *new* backend while boot reads\n    // the default and never finds it — that plugin would silently fail to persist itself into the\n    // auto-load list, and `remove` would write to the wrong store too. Capturing the concrete store\n    // (BrowserStorageBackend caches per namespace, so this is the very same IndexedDB store/doc the\n    // proxy used — no migration, no data move) pins the list to local storage regardless of swaps.\n    // The namespace is this plugin's name, matching what `services.settings()` used before.\n    const backend = services.StorageBackend;\n    const settings = backend !== undefined\n      ? makePluginSettings(backend.createStore('settings'), services.self?.name ?? 'matbot-browser')\n      : services.settings();\n    const extras = {\n      async list() {\n        return (await settings.get(EXTRA_KEY)) ?? [];\n      },\n      async add(specifier) {\n        const cur = (await settings.get(EXTRA_KEY)) ?? [];\n        if (!cur.includes(specifier)) await settings.set(EXTRA_KEY, [...cur, specifier]);\n      },\n      async remove(specifier) {\n        const cur = (await settings.get(EXTRA_KEY)) ?? [];\n        await settings.set(EXTRA_KEY, cur.filter(s => s !== specifier));\n      },\n    };\n\n    services.tools.register(createBrowserPluginTool(extras));\n\n    // Replay user-added plugins from a previous realm. Failures are warned and skipped — a stale\n    // specifier (a URL that 404s now) must not abort boot.\n    for (const specifier of await extras.list()) {\n      try {\n        await services.loadPlugin(specifier);\n      } catch (e) {\n        console.warn(`[matbot-browser] Could not replay persisted plugin \"${specifier}\":`, e);\n      }\n    }\n  },\n};\n",
    "/plugins/browser/src/storage-backend.ts": "\nimport { IDBStore }      from './idb-store.js';\nimport { OPFSFileStore } from './opfs-file-store.js';\n\n/**\n * Refuse to run anywhere that isn't a browser realm. This plugin's whole contract — IndexedDB stores,\n * an OPFS file store — is browser-only, so if a node install accidentally lists it, the storage\n * pre-scan would otherwise swap in a backend that cannot work and brick the config. Throwing here\n * (and in setup) makes the host fall back to its real backend and skip the plugin instead.\n *\n * `process` is referenced via globalThis so this stays free of `@types/node` (the package is\n * platform-neutral); the IndexedDB check is the positive signal, the node check sharpens the message.\n */\nexport function assertBrowserRealm() {\n  const node = (globalThis ).process?.versions?.node;\n  if (typeof indexedDB === 'undefined' || node !== undefined) {\n    throw new Error(\n      '@matatbread/matbot-browser is a browser-only plugin (IndexedDB + OPFS backend) and cannot run under Node' +\n      (node !== undefined ? ` (detected Node ${node})` : '') +\n      '. Remove it from this installation — the node app already uses the filesystem storage backend by default.',\n    );\n  }\n}\n\n/**\n * Browser `StorageBackend`: document stores in IndexedDB, files in OPFS — the browser analogue of\n * the node filesystem backend. Each namespace gets its own IndexedDB database (`matbot-<ns>`) with a\n * single `docs` object store, sidestepping the version-1 upgrade race that opening many object\n * stores in one database would hit. Instances are cached per namespace so repeated `createStore`\n * calls reuse one connection.\n *\n * `open()` ignores its `dotData` argument — there is no filesystem path in the browser; the IDB\n * database names and the OPFS `matbot-files` directory are the durable locations.\n */\nexport class BrowserStorageBackend  {\n    stores = new Map();\n   fileStore = new OPFSFileStore();\n\n  createStore(namespace) {\n    let store = this.stores.get(namespace);\n    if (store === undefined) {\n      store = new IDBStore(`matbot-${namespace}`, 'docs');\n      this.stores.set(namespace, store);\n    }\n    return store ;\n  }\n\n  // IndexedDB connections close with the realm; nothing to flush. OPFS writes are durable on close.\n  async close() {}\n\n  static async open(_dotData) {\n    assertBrowserRealm();\n    return new BrowserStorageBackend();\n  }\n}\n",
    "/plugins/browser/src/idb-store.ts": "\nimport { executeQuery } from '@matatbread/matbot-core/storage-base';\n\n/** Promisify an IDBRequest. */\nfunction idbPromise(req) {\n  return new Promise((resolve, reject) => {\n    req.onsuccess = () => resolve(req.result);\n    req.onerror   = () => reject(req.error);\n  });\n}\n\nfunction openDB(dbName, storeName) {\n  return new Promise((resolve, reject) => {\n    const req = indexedDB.open(dbName, 1);\n    req.onupgradeneeded = () => {\n      req.result.createObjectStore(storeName, { keyPath: 'id' });\n    };\n    req.onsuccess = () => resolve(req.result);\n    req.onerror   = () => reject(req.error);\n  });\n}\n\n/**\n * `Store<T>` backed by IndexedDB.  Suitable for browser environments. Loads all documents and\n * delegates filtering/sorting/paging to the shared in-memory query engine.\n */\nexport class IDBStore {\n   dbp;\n\n    storeName;\n  constructor(dbName, storeName) {\n    this.storeName = storeName;\n    this.dbp = openDB(dbName, storeName);\n  }\n\n   async tx(mode) {\n    const db = await this.dbp;\n    return db.transaction(this.storeName, mode).objectStore(this.storeName);\n  }\n\n  async get(id) {\n    const store = await this.tx('readonly');\n    return (await idbPromise(store.get(id) )) ?? null;\n  }\n\n  async set(id, value) {\n    const store = await this.tx('readwrite');\n    await idbPromise(store.put(value));\n  }\n\n  async cas(id, expected, next) {\n    const db    = await this.dbp;\n    const tx    = db.transaction(this.storeName, 'readwrite');\n    const store = tx.objectStore(this.storeName);\n\n    const current = await idbPromise(store.get(id) );\n\n    if (current === undefined) {\n      return { ok: false, current: null };\n    }\n    if (current.version !== expected) {\n      return { ok: false, current };\n    }\n\n    await idbPromise(store.put(next));\n    return { ok: true, doc: next };\n  }\n\n  async delete(id, _expectedVersion) {\n    const store   = await this.tx('readwrite');\n    const current = await idbPromise(store.get(id) );\n    if (!current) return false;\n    await idbPromise(store.delete(id));\n    return true;\n  }\n\n  async query(q) {\n    const store = await this.tx('readonly');\n    const all = await idbPromise(store.getAll() );\n    return executeQuery(all, q);\n  }\n}\n",
    "/plugins/browser/src/opfs-file-store.ts": "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nasync function filesDir() {\n  const root = await navigator.storage.getDirectory();\n  return root.getDirectoryHandle('matbot-files', { create: true });\n}\n\nfunction makeHandle(meta, dir) {\n  return {\n    ...meta,\n    async *stream(signal) {\n      const fh   = await dir.getFileHandle(`${meta.id}.data`);\n      const file = await fh.getFile();\n      const rs   = file.stream();\n      const reader = rs.getReader();\n      try {\n        while (true) {\n          const { done, value } = await reader.read();\n          if (done || signal?.aborted) break;\n          yield value;\n        }\n      } finally {\n        reader.releaseLock();\n      }\n    },\n  };\n}\n\nasync function writeMeta(dir, meta) {\n  const metaFh = await dir.getFileHandle(`${meta.id}.meta.json`, { create: true });\n  const metaW  = await metaFh.createWritable();\n  await metaW.write(JSON.stringify(meta));\n  await metaW.close();\n}\n\nasync function writeData(dir, id, data) {\n  const dataFh   = await dir.getFileHandle(`${id}.data`, { create: true });\n  const writable = await dataFh.createWritable();\n  let size = 0;\n  for await (const chunk of data) {\n    // Copy into a fresh Uint8Array<ArrayBuffer> — OPFS writable requires ArrayBuffer-backed views\n    const safe = new Uint8Array(chunk.byteLength);\n    safe.set(chunk);\n    await writable.write(safe);\n    size += chunk.byteLength;\n  }\n  await writable.close();\n  return size;\n}\n\n/**\n * `FileStore` backed by the Origin Private File System (OPFS).\n * Requires a browser environment with `navigator.storage.getDirectory()`.\n */\nexport class OPFSFileStore  {\n  async put(\n    name,\n    mimeType,\n    data,\n    meta,\n  ) {\n    const dir = await filesDir();\n\n    // Upsert when name is provided: find existing entry with matching name (+ namespace).\n    if (name !== undefined) {\n      const existing = await this.getByName(name, meta?.namespace);\n      if (existing !== null) {\n        const size = await writeData(dir, existing.id, data);\n        const fileMeta = {\n          id:        existing.id,\n          version:   crypto.randomUUID(),\n          name,\n          mimeType,\n          size,\n          createdAt: existing.createdAt,\n          ...(meta?.sessionId !== undefined ? { sessionId: meta.sessionId } : {}),\n          ...(meta?.messageId !== undefined ? { messageId: meta.messageId } : {}),\n          ...(meta?.namespace !== undefined ? { namespace: meta.namespace } : {}),\n          ...(meta?.allowed   !== undefined ? { allowed:   meta.allowed   } : {}),\n        };\n        await writeMeta(dir, fileMeta);\n        return makeHandle(fileMeta, dir);\n      }\n    }\n\n    const id   = crypto.randomUUID();\n    const size = await writeData(dir, id, data);\n\n    const fileMeta = {\n      id,\n      version:   crypto.randomUUID(),\n      name:      name ?? id,\n      mimeType,\n      size,\n      createdAt: new Date().toISOString(),\n      ...(meta?.sessionId !== undefined ? { sessionId: meta.sessionId } : {}),\n      ...(meta?.messageId !== undefined ? { messageId: meta.messageId } : {}),\n      ...(meta?.namespace !== undefined ? { namespace: meta.namespace } : {}),\n      ...(meta?.allowed   !== undefined ? { allowed:   meta.allowed   } : {}),\n    };\n    await writeMeta(dir, fileMeta);\n\n    return makeHandle(fileMeta, dir);\n  }\n\n  async get(id) {\n    try {\n      const dir    = await filesDir();\n      const metaFh = await dir.getFileHandle(`${id}.meta.json`);\n      const file   = await metaFh.getFile();\n      const meta   = JSON.parse(await file.text()) ;\n      return makeHandle(meta, dir);\n    } catch {\n      return null;\n    }\n  }\n\n  async getByName(name, namespace) {\n    for await (const handle of this.list(namespace !== undefined ? { namespace } : {})) {\n      if (handle.name === name) return handle;\n    }\n    return null;\n  }\n\n  async delete(id) {\n    const dir = await filesDir();\n    await Promise.allSettled([\n      dir.removeEntry(`${id}.data`),\n      dir.removeEntry(`${id}.meta.json`),\n    ]);\n  }\n\n  async *list(filter) {\n    const dir = await filesDir();\n    // TypeScript DOM lib doesn't expose the async iterator methods on\n    // FileSystemDirectoryHandle yet; cast to use the runtime-available protocol.\n    // The default async iterator is entries() — it yields [name, handle] tuples.\n    \n    for await (const [name] of dir ) {\n      if (!name.endsWith('.meta.json')) continue;\n      const id  = name.slice(0, -'.meta.json'.length);\n      const fh  = await this.get(id);\n      if (!fh) continue;\n      if (filter?.namespace    && fh.namespace    !== filter.namespace)          continue;\n      if (filter?.sessionId    && fh.sessionId    !== filter.sessionId)         continue;\n      if (filter?.mimeType     && !fh.mimeType.startsWith(filter.mimeType))     continue;\n      if (filter?.createdAfter  && fh.createdAt < filter.createdAfter)          continue;\n      if (filter?.createdBefore && fh.createdAt > filter.createdBefore)         continue;\n      yield fh;\n    }\n  }\n\n  async putTemp(name, mimeType, data) {\n    return this.put(name, mimeType, data);\n  }\n\n  // OPFS has no native change notification; watch() is not implementable in the browser\n  // without a SharedWorker or polling. Yield nothing and return when the signal fires.\n  async *watch(signal) {\n    if (signal === undefined || signal.aborted) return;\n    await new Promise(resolve => { signal.addEventListener('abort', () => resolve(), { once: true }); });\n  }\n}\n",
    "/plugins/browser/src/webcrypto-vault.ts": "\nimport { missingSecretError, applyCreateSecret } from '@matatbread/matbot-core';\n\nconst REF_RE = /\\$\\{([^}]+)\\}/g;\n\n/**\n * Browser `Vault` backed by the Web Crypto API.\n *\n * Secrets are encrypted with AES-GCM using a key derived from a passphrase\n * (PBKDF2 / SHA-256).  On first access the key is derived and cached in memory\n * for the session lifetime.\n *\n * For simpler use-cases (e.g. local development), pass secrets directly as a\n * plain map — no encryption key required.\n */\nexport class WebCryptoVault  {\n    plain = new Map();\n\n  constructor(secrets) {\n    if (secrets) {\n      for (const [k, v] of Object.entries(secrets)) {\n        this.plain.set(k, v);\n      }\n    }\n  }\n\n  createSecret(name, value) {\n    return applyCreateSecret(this, name, value);\n  }\n\n  async writeSecret(name, value) {\n    if (value === '') this.plain.delete(name);\n    else this.plain.set(name, value);\n  }\n\n  hasKey(name) {\n    return this.plain.has(name);\n  }\n\n  findByValue(value) {\n    for (const [k, v] of this.plain) if (v === value) return k;\n    return undefined;\n  }\n\n  async resolve(ref) {\n    const errors = [];\n    const result = ref.replace(REF_RE, (_, name) => {\n      const value = this.plain.get(name);\n      if (value === undefined) {\n        errors.push(name);\n        return '';\n      }\n      return value;\n    });\n    if (errors.length > 0) {\n      throw missingSecretError(errors);\n    }\n    return result;\n  }\n\n  scrub(text) {\n    let result = text;\n    for (const value of this.plain.values()) {\n      if (value.length >= 4) {\n        result = result.split(value).join('[REDACTED]');\n      }\n    }\n    return result;\n  }\n\n  // ── Encryption helpers (optional; call to store/load secrets via IndexedDB) ──\n\n   static async deriveKey(passphrase, salt) {\n    const base = await crypto.subtle.importKey(\n      'raw',\n      new TextEncoder().encode(passphrase),\n      'PBKDF2',\n      false,\n      ['deriveKey'],\n    );\n    return crypto.subtle.deriveKey(\n      { name: 'PBKDF2', salt, iterations: 100_000, hash: 'SHA-256' },\n      base,\n      { name: 'AES-GCM', length: 256 },\n      false,\n      ['encrypt', 'decrypt'],\n    );\n  }\n\n  static async encrypt(passphrase, plaintext) {\n    const saltBuf = crypto.getRandomValues(new Uint8Array(16)).buffer ;\n    const ivBuf   = crypto.getRandomValues(new Uint8Array(12)).buffer ;\n    const key     = await WebCryptoVault.deriveKey(passphrase, saltBuf);\n    const data    = new TextEncoder().encode(plaintext);\n    const ct      = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: ivBuf }, key, data);\n\n    // Encode as base64: [salt(16)] [iv(12)] [ciphertext]\n    const combined = new Uint8Array(16 + 12 + ct.byteLength);\n    combined.set(new Uint8Array(saltBuf), 0);\n    combined.set(new Uint8Array(ivBuf), 16);\n    combined.set(new Uint8Array(ct), 28);\n    return btoa(String.fromCharCode(...combined));\n  }\n\n  static async decrypt(passphrase, encoded) {\n    const bytes  = Uint8Array.from(atob(encoded), c => c.charCodeAt(0));\n    const salt   = bytes.buffer.slice(bytes.byteOffset,       bytes.byteOffset + 16) ;\n    const iv     = bytes.buffer.slice(bytes.byteOffset + 16,  bytes.byteOffset + 28) ;\n    const ct     = bytes.buffer.slice(bytes.byteOffset + 28) ;\n    const key    = await WebCryptoVault.deriveKey(passphrase, salt);\n    const plain  = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);\n    return new TextDecoder().decode(plain);\n  }\n}\n",
    "/plugins/browser/src/local-vault.ts": "\nimport { WebCryptoVault } from './webcrypto-vault.js';\n\nconst STORAGE_KEY = 'matbot.vault';\n\nfunction load() {\n  try {\n    const raw = globalThis.localStorage?.getItem(STORAGE_KEY);\n    return raw ? (JSON.parse(raw) ) : {};\n  } catch { return {}; }\n}\n\n/**\n * A browser `Vault` whose secrets persist in `localStorage`, so an API key entered once survives a\n * realm reload. It is a thin durability layer over {@link WebCryptoVault} (which holds secrets in\n * memory and does the `${NAME}` resolution and scrubbing); every write is mirrored to storage.\n *\n * Secrets are stored in plaintext under one key — acceptable for a single-user local demonstrator,\n * not for shared machines. `WebCryptoVault`'s static AES-GCM helpers are the upgrade path.\n */\nexport class LocalStorageVault extends WebCryptoVault  {\n  // The base keeps secrets in a private map; we keep a parallel mirror purely to persist it.\n    mirror;\n\n  constructor() {\n    const seed = load();\n    super(seed);\n    this.mirror = { ...seed };\n  }\n\n   async writeSecret(name, value) {\n    await super.writeSecret(name, value);\n    if (value === '') delete this.mirror[name];\n    else this.mirror[name] = value;\n    try { globalThis.localStorage?.setItem(STORAGE_KEY, JSON.stringify(this.mirror)); } catch { /* storage full / unavailable */ }\n  }\n}\n",
    "/plugins/browser/src/plugin-tool.ts": "\nimport { CONFIRM_YES, CONFIRM_NO } from '@matatbread/matbot-plugin-api';\nimport { getRegisteredPlugins, getRegisteredTools, getRegisteredFrontendPlugins,\n         getRegisteredServiceKeys, getHookPlugins, getSystemContextPlugins,\n         getSpecifierForPlugin, getFailedPlugins, clearFailedPlugin } from '@matatbread/matbot-core';\n\n/**\n * Persistence of user-added plugin specifiers across realm reloads. The browser has no matbot.yaml,\n * so the bootstrap supplies a small store (its own plugin settings) that survives in IndexedDB and\n * is replayed at boot. `list()` returns the persisted extras; the bootstrap appends the inlined\n * baseline to produce the full configured set.\n */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction bakedAvailablePlugins() {\n  const mb = (globalThis ).__MB__;\n  return mb?.config?.availablePlugins ?? [];\n}\n\nasync function confirmAction(ctx, label) {\n  const field = { name: 'confirm', label, type: 'confirm', default: CONFIRM_NO };\n  const answer = await ctx.prompt(field);\n  return answer.trim().toLowerCase() === CONFIRM_YES;\n}\n\n// Reflect every channel a plugin contributes through (mirrors the node plugin tool) so `list` reports\n// the complete type set, not just the static fields.\nfunction pluginTypes(p, registeredToolPlugins) {\n  const t = [];\n  const serviceKeys = getRegisteredServiceKeys(p.name);\n\n  if (p.provider !== undefined)                                              t.push('provider');\n  if (p.tools?.length || registeredToolPlugins.has(p.name))                 t.push('tools');\n  if (Object.keys(p.storage ?? {}).length || p.storageBackend !== undefined\n      || serviceKeys.includes('StorageBackend'))                            t.push('storage');\n  if (getRegisteredFrontendPlugins().has(p.name))                           t.push('frontend');\n  if (getHookPlugins().has(p.name))                                         t.push('hooks');\n  if (getSystemContextPlugins().has(p.name))                                t.push('system-context');\n  t.push(...serviceKeys);\n  if (!t.length) t.push('extension');\n  return [...new Set(t)];\n}\n\n/**\n * The browser `plugin` tool. Unlike the node tool it edits no config file and runs no package\n * manager — there is neither in the browser. `add`/`remove`/`reload` work purely against live\n * specifiers (URL paths or import-map / inlined synthetic ids resolved by the host loader), and the\n * added set is persisted via the injected `extras` store so it survives a realm reload.\n */\nexport function createBrowserPluginTool(extras) {\n  const executor = {\n    async *execute(input, ctx) {\n      const { action } = input ;\n\n      if (action === 'list') {\n        const configured = await extras.list();\n        const allTools   = getRegisteredTools();\n        const toolsByPlugin = new Map();\n        for (const tl of allTools) {\n          const list = toolsByPlugin.get(tl.pluginName) ?? [];\n          list.push({ name: tl.name, description: tl.description });\n          toolsByPlugin.set(tl.pluginName, list);\n        }\n        const pluginToolNames = new Set(\n          [...toolsByPlugin.keys()].filter((k) => k !== undefined),\n        );\n        const loaded = getRegisteredPlugins().map(p => ({\n          name:       p.name,\n          apiVersion: p.apiVersion,\n          types:      pluginTypes(p, pluginToolNames),\n          tools:      toolsByPlugin.get(p.name) ?? [],\n          specifier:  p.specifier,\n          ...(p.manifest?.description ? { description: p.manifest.description } : {}),\n          ...(p.matbotRuntime !== undefined ? { matbotRuntime: p.matbotRuntime } : {}),\n        }));\n        const failed = getFailedPlugins();\n        yield {\n          type:  'result',\n          value: {\n            loaded,\n            configured,\n            ...(failed.length ? { failed: failed.map(f => ({ specifier: f.specifier, error: f.error, ...(f.name !== undefined ? { name: f.name } : {}) })) } : {}),\n            ...(toolsByPlugin.has(undefined) ? { builtinTools: toolsByPlugin.get(undefined) } : {}),\n          },\n        };\n        return;\n      }\n\n      if (action === 'discover_local') {\n        // Baked-but-idle plugins that aren't already loaded — offered for on-demand activation. Their\n        // specifier is the package name, which resolves through the import map to the baked blob (no\n        // network) and persists across reloads. Mirrors the node tool's discover_local result shape.\n        const loadedNames = new Set(getRegisteredPlugins().map(p => p.name));\n        yield { type: 'result', value: bakedAvailablePlugins().filter(p => !loadedNames.has(p.name)) };\n        return;\n      }\n\n      if (action === 'store-key') {\n        const { key } = input ;\n        if (!key || !key.trim()) {\n          yield { type: 'error', message: 'store-key requires a \"key\" name.' };\n          return;\n        }\n        const name    = key.trim();\n        const value   = await ctx.prompt(`Enter the value for secret \"${name}\" (leave blank to remove it; not added to the conversation):`, '');\n        const trimmed = value.trim();\n        const existed = trimmed === '' && ctx.vault.hasKey(name);\n        await ctx.vault.writeSecret(name, trimmed);\n        yield { type: 'result', value: { message:\n          trimmed !== '' ? `Secret \"${name}\" stored in the vault.`\n          : existed       ? `Secret \"${name}\" removed from the vault.`\n          :                 `No value entered and no secret named \"${name}\"; nothing changed.` } };\n        return;\n      }\n\n      const { specifier } = input ;\n      if (!specifier || !specifier.trim()) {\n        yield { type: 'error', message: `${action} requires a \"specifier\".` };\n        return;\n      }\n\n      if (action === 'add') {\n        if ((await extras.list()).includes(specifier)) {\n          yield { type: 'result', value: { message: `\"${specifier}\" is already configured.` } };\n          return;\n        }\n        // Duplicate-name guard: a package.json name is a plugin's identity (and the handle remove/reload\n        // use), and the registry forbids two loaded plugins sharing one. Catch the common \"add by a name\n        // already active\" up front with a clear message (a same-package-via-different-URL collision still\n        // surfaces, less prettily, as the load error below — persistence only happens after a clean load).\n        if (getRegisteredPlugins().some(p => p.name === specifier)) {\n          yield { type: 'result', value: { message: `A plugin named \"${specifier}\" is already active.` } };\n          return;\n        }\n        // Out-of-band confirmation — same security rationale as the node tool: a privileged action\n        // must break the LLM's execution chain so a malicious prompt cannot self-install plugins.\n        if (!await confirmAction(ctx, `Install plugin **\"${specifier}\"**?`)) {\n          yield { type: 'result', value: { message: 'Cancelled.' } };\n          return;\n        }\n        yield { type: 'stdout', chunk: `Activating \"${specifier}\"...\\n` };\n        try {\n          const loaded  = await ctx.loadPlugin(specifier);\n          // Persist a refresh-stable specifier. A plugin baked into the bundle re-resolves by package\n          // name through the import map on *every* boot — and the name is the one specifier common to\n          // node and the browser. The raw add specifier may instead be an ephemeral synthetic id\n          // (mbmod:, backed by a per-load blob) or an http-only local path, neither of which survives\n          // a reload cleanly. So when the loaded plugin's canonical name is itself baked, persist that;\n          // otherwise keep the original specifier (a genuinely remote plugin's name isn't baked, so\n          // only its URL resolves). Reads the web-bundle payload defensively — absent ⇒ no rewrite.\n          const baked = (globalThis )\n            .__MB__?.packageEntries ?? {};\n          const persistSpec = (loaded.name && baked[loaded.name] !== undefined) ? loaded.name : specifier;\n          await extras.add(persistSpec);\n          const welcome = await loaded.installationMessage?.();\n          yield {\n            type:  'result',\n            value: {\n              message: `\"${specifier}\" installed and is now active.`,\n              ...(welcome !== undefined ? { installationMessage: welcome } : {}),\n            },\n          };\n        } catch (e) {\n          yield { type: 'error', message: `Activation of \"${specifier}\" failed: ${String(e)}` };\n        }\n        return;\n      }\n\n      // A loaded plugin records its configured/extras specifier, so the canonical package name maps to\n      // it via getSpecifierForPlugin — accept the name (preferred) or the literal configured specifier.\n      const entry = getSpecifierForPlugin(specifier) ?? specifier;\n\n      if (action === 'remove') {\n        if (!(await extras.list()).includes(entry)) {\n          yield { type: 'result', value: { message: `\"${specifier}\" is not an installed plugin — pass its package name or its configured specifier (see \\`plugin list\\`).` } };\n          return;\n        }\n        if (!await confirmAction(ctx, `Remove plugin **\"${entry}\"**?`)) {\n          yield { type: 'result', value: { message: 'Cancelled.' } };\n          return;\n        }\n        yield { type: 'stdout', chunk: `Deactivating \"${entry}\"...\\n` };\n        try {\n          await ctx.unloadPlugin(entry);\n        } catch (e) {\n          yield { type: 'stderr', chunk: `Deactivation failed: ${String(e)}\\n` };\n        }\n        await extras.remove(entry);\n        // Drop any recorded load failure for this specifier — a removed plugin must not linger as a\n        // failed ghost in `plugin list` / the web UI once its config entry is gone.\n        clearFailedPlugin(entry);\n        yield { type: 'result', value: { message: `\"${entry}\" removed and deactivated.` } };\n        return;\n      }\n\n      if (action === 'reload') {\n        yield { type: 'stdout', chunk: `Reloading \"${entry}\"...\\n` };\n        let wasLoaded;\n        try {\n          wasLoaded = await ctx.unloadPlugin(entry);\n        } catch (e) {\n          yield { type: 'stderr', chunk: `${String(e)}\\n` };\n          wasLoaded = true;\n        }\n        if (!wasLoaded && !await confirmAction(ctx, `Plugin **\"${entry}\"** is not currently loaded — load it now?`)) {\n          yield { type: 'result', value: { message: 'Cancelled.' } };\n          return;\n        }\n        const reloaded = await ctx.loadPlugin(entry);\n        const welcome  = await reloaded.installationMessage?.();\n        yield { type: 'result', value: { message: welcome ?? `\"${entry}\" reloaded successfully.` } };\n        return;\n      }\n\n      yield { type: 'error', message: `Unknown action \"${String(action)}\".` };\n    },\n  };\n\n  return {\n    name:        'plugin',\n    description:\n      'Manage matbot plugins — the units that contribute tools, providers, storage, hooks, and ' +\n      'frontends to the running browser process. List them, install or remove one by specifier, ' +\n      'reload one to pick up code changes, or supply a secret a plugin or provider reported missing.\\n\\n' +\n      'This is the browser build: there is no config file and no package manager, so a specifier is ' +\n      'a URL path or an inlined synthetic id the host loader can import (not an npm name to install). ' +\n      'Added plugins persist across reloads.\\n\\n' +\n      'For add, a URL specifier is fetched as raw source and MUST resolve a package.json: the URL is one, ' +\n      'OR points at a directory containing one, OR is a code entry (…/index.ts) with a package.json as its ' +\n      'direct sibling. The package.json must declare a \"name\"; absence is a hard error.\\n\\n' +\n      'For remove/reload, prefer the plugin\\'s canonical package.json **name** (the `name` from `list`) — ' +\n      'the configured specifier also works. A name is unique, so it is unambiguous; `add` refuses a second ' +\n      'plugin with a name already active.',\n    inputSchema: {\n      type:     'object',\n      required: ['action'],\n      properties: {\n        action:    { type: 'string', enum: ['list', 'discover_local', 'add', 'remove', 'reload', 'store-key'] },\n        specifier: { type: 'string', description: 'For remove/reload: the plugin\\'s package.json name (preferred — the `name` from `list`) or its configured specifier. For add: a bundled package name, an inlined synthetic id, or a URL to raw source (a package.json, a directory containing one, or a code entry with a sibling package.json that declares a \"name\").' },\n        key:       { type: 'string', description: 'Name of the secret to store (required for store-key); value prompted separately. Entering a blank value removes the key.' },\n      },\n    },\n    executor,\n  };\n}\n",
    "/plugins/browser/src/provider-tool.ts": "\n\n/** An adapter type the provider tool / startup wizard can offer (baked from the build's providerModules). */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Browser `provider` tool. The portable analogue of the node provider tool: it manages the same\n * named-LLM-profile concept, but reads/writes a live providers map + a backing store + the vault rather\n * than a YAML file. The API key is collected out-of-band via `ctx.prompt` (never in the transcript),\n * exactly like `plugin store-key`. Persistence is entirely the injected {@link ProviderAdmin}'s concern.\n */\nexport function createBrowserProviderTool(admin) {\n  const adapterList = () => admin.available.map((a, i) => `  ${i}. ${a.label}  (${a.module})`).join('\\n');\n\n  const executor = {\n    async *execute(input, ctx) {\n      const act = input ;\n\n      if (act.action === 'list') {\n        yield { type: 'result', value: { providers: admin.list(), adapters: admin.available } };\n        return;\n      }\n\n      if (act.action === 'add') {\n        const { name, adapter, endpoint, model, parameters } = act;\n        if (!name || !adapter) {\n          yield { type: 'error', message: 'add requires: name, adapter.' };\n          return;\n        }\n        // Resolve adapter by module spec, exact/substring label, or numeric index.\n        const idx = /^\\d+$/.test(adapter) ? Number(adapter) : -1;\n        const found =\n          admin.available[idx] ??\n          admin.available.find(a => a.module === adapter || a.label === adapter) ??\n          admin.available.find(a => a.label.toLowerCase().includes(adapter.toLowerCase()));\n        if (found === undefined) {\n          yield { type: 'error', message: `Unknown adapter \"${adapter}\". Available:\\n${adapterList()}` };\n          return;\n        }\n\n        // A self-contained adapter (e.g. a local demo LLM) needs no endpoint, model, or key — mirrors\n        // the setup wizard, which hides those fields entirely for one. Asking for any of them, or\n        // refusing to add without a key, would be wrong for this class of adapter.\n        const resolvedModel = found.selfContained ? (model || found.modelHint || found.label) : model;\n        if (!found.selfContained) {\n          if (!endpoint)      { yield { type: 'error', message: 'add requires \"endpoint\" for this adapter.' }; return; }\n          if (!resolvedModel) { yield { type: 'error', message: 'add requires \"model\" for this adapter.' };    return; }\n        }\n\n        // Key out-of-band — never through the conversation. A blank answer just means no credentials\n        // (e.g. an unauthenticated local server); it does not abort the add — mirrors the node provider\n        // tool, which treats an empty credential prompt the same way.\n        let apiKey = '';\n        if (!found.selfContained) {\n          apiKey = await ctx.prompt({\n            name: 'apiKey', type: 'password',\n            label: `API key for provider \"${name}\" (leave blank if none required; not added to the conversation):`,\n          });\n        }\n\n        const draft = {\n          name, module: found.module, model: resolvedModel ?? '',\n          endpoint: endpoint ?? '', apiKey: apiKey.trim(),\n          ...(parameters !== undefined ? { parameters } : {}),\n        };\n        try {\n          const added = await admin.add(draft);\n          yield { type: 'result', value: { message: `Provider \"${added}\" added and ready (adapter: ${found.label}).` } };\n        } catch (e) {\n          yield { type: 'error', message: `Failed to add provider: ${String(e)}` };\n        }\n        return;\n      }\n\n      if (act.action === 'remove') {\n        if (!act.name) { yield { type: 'error', message: 'remove requires a \"name\".' }; return; }\n\n        // Same guards as the node provider tool: never remove the profile powering this very turn,\n        // and never remove the last remaining profile (there would be nothing left to run with).\n        if (ctx.provider === act.name) {\n          yield { type: 'result', value: { message: `Cannot remove \"${act.name}\" — it is the provider currently running this turn. Switch providers first.` } };\n          return;\n        }\n\n        const rows = admin.list();\n        if (!rows.some(r => r.name === act.name)) {\n          yield { type: 'result', value: { message: `No provider named \"${act.name}\".` } };\n          return;\n        }\n        if (rows.length <= 1) {\n          yield { type: 'result', value: { message: `Cannot remove \"${act.name}\" — it is the only configured provider. Add a replacement profile first.` } };\n          return;\n        }\n\n        const ok = await admin.remove(act.name);\n        yield { type: 'result', value: { message: ok ? `Provider \"${act.name}\" removed.` : `No provider named \"${act.name}\".` } };\n        return;\n      }\n\n      yield { type: 'error', message: `Unknown action \"${String((act ).action)}\".` };\n    },\n  };\n\n  return {\n    name: 'provider',\n    description:\n      'Manage LLM provider profiles — the named model configurations matbot can talk to (each is an ' +\n      'adapter + endpoint + model + key + optional generation parameters). List them, add one, or ' +\n      'remove one. This is the browser build: profiles persist in browser storage and the key in the ' +\n      'vault (no matbot.yaml; there is no separate `credentialEnvVar` concept since there are no ' +\n      'process env vars to reference).\\n\\n' +\n      'The API key is never passed here — `add` requests it out-of-band so it stays out of the ' +\n      'conversation, and a blank answer just means \"no credentials needed\" (it does not abort the ' +\n      'add). `adapter` is one of the available adapter types (by label, module, or index; call `list` ' +\n      'to see them — each carries `endpointHint`/`modelHint` and whether it is `selfContained`). A ' +\n      '`selfContained` adapter (e.g. a local demo LLM) needs no endpoint, model, or key at all — omit ' +\n      'them and the tool will not prompt for a key either. `remove` refuses to delete the only ' +\n      'configured profile or the one powering the current turn — add a replacement first or switch ' +\n      'providers.\\n\\n' +\n      'PARAMETERS  (pass as the `parameters` object on add)\\n' +\n      '  maxTokens   — integer, maximum output tokens\\n' +\n      '  temperature — float 0.0–1.0\\n' +\n      '  topP        — float, nucleus sampling probability\\n' +\n      '  thinking    — { type: \"enabled\", budgetTokens: <int> }  (Anthropic extended thinking;\\n' +\n      '                claude-3-7-sonnet and newer; set maxTokens > budgetTokens)',\n    inputSchema: {\n      type:     'object',\n      required: ['action'],\n      properties: {\n        action:   { type: 'string', enum: ['list', 'add', 'remove'] },\n        name:     { type: 'string', description: 'Profile name (add/remove).' },\n        adapter:  { type: 'string', description: 'Adapter type — label, module, or index from `list` (add).' },\n        endpoint: { type: 'string', description: 'Endpoint URL (add; omit for a selfContained adapter).' },\n        model:    { type: 'string', description: 'Model name (add; omit for a selfContained adapter — its modelHint/label is used).' },\n        parameters: {\n          type:                 'object',\n          additionalProperties: true,\n          description:          'Generation parameters: maxTokens, temperature, topP, thinking, etc. (add only).',\n        },\n      },\n    },\n    executor,\n  };\n}\n",
    "/plugins/browser/src/tool-types.ts": "\n\n// A browser ToolTypeIndex. The node one (@matatbread/matbot-tool-types) runs the real TypeScript compiler\n// over each tool's on-disk source to recover its `ToolContracts` augmentation; the browser has neither the\n// compiler nor a filesystem, so it derives contracts from two sources, in precedence order:\n//   • EMBEDDED — the assembler runs the node compiler at BUILD time and bakes the per-tool { params, result }\n//     for every built-in tool into the artifact; passed in here. This is what gives the browser the SAME\n//     real result types (not just `unknown`) as node for the built-in library.\n//   • a source-less tool (a function-tools function, the tool-store per-namespace tool) registered at\n//     runtime — absent from the embedded map — carries its contract as a `toolContract` string → spliced.\n//   • any remaining tool (e.g. an MCP proxy) has no reachable contract; `dts()` still synthesises its params\n//     from the (always-present) `inputSchema` (see schemaToTs) so a composer sees real fields, but\n//     `wireContracts()` omits it (no misleading `unknown` result in the wire description) — mirroring node.\n// `check()` is a no-op ([] = clean): there is no compiler to grade a snippet against, so function-tools\n// degrades to guess-and-run (define/lambda still compile and run via the sucrase TypeScriptStripper).\n\n// Split on `sep` at bracket-depth 0 only (respecting `<> {} () []`), so a top-level `|`/`,` inside a nested\n// type isn't mistaken for a separator.\nfunction splitTopLevel(s, sep) {\n  const parts = [];\n  let depth = 0, start = 0;\n  for (let i = 0; i < s.length; i++) {\n    const c = s[i];\n    if (c === '<' || c === '{' || c === '(' || c === '[') depth++;\n    else if (c === '>' || c === '}' || c === ')' || c === ']') depth--;\n    else if (depth === 0 && c === sep) { parts.push(s.slice(start, i)); start = i + 1; }\n  }\n  parts.push(s.slice(start));\n  return parts;\n}\n\n// Parse a `ToolContract<Result, Args>` type (or a `|`-union of such arms) to its `params`/`result` union\n// text. Returns null unless EVERY arm is a `ToolContract<R, P>` — mirroring the node compiler's extractArms\n// (a bare/plain entry yields no wire contract). This is the shape check; splitContract wraps it with a\n// permissive fallback for the always-a-contract `toolContract` string case.\nfunction parseContractArms(type) {\n  const results = [], params = [];\n  for (const armText of splitTopLevel(type, '|')) {\n    const t = armText.trim();\n    if (t === '') continue;                          // leading/trailing `|` in a multi-arm union\n    const m = t.match(/^ToolContract\\s*<([\\s\\S]*)>$/);\n    if (!m) return null;\n    const inner = splitTopLevel(m[1], ',');\n    results.push((inner[0] ?? 'unknown').trim());\n    params.push((inner[1] ?? 'unknown').trim());\n  }\n  return results.length ? { result: results.join(' | '), params: params.join(' | ') } : null;\n}\n\n// Flatten a `toolContract` (`ToolContract<Result, Args>`, or a `|`-union of arms) to the wire's\n// `params`/`result` union text. Permissive: a non-contract falls back to `unknown`/`unknown`.\nfunction splitContract(contract) {\n  return parseContractArms(contract) ?? { result: 'unknown', params: 'unknown' };\n}\n\n// Extract per-tool wire contracts from RAW .ts source, compiler-free: find each `interface ToolContracts\n// { … }` augmentation block and read each arm's `ToolContract<Result, Params>` type-argument TEXT. This is\n// exactly what the node compiler path does (it merges the augmentation declarations via the checker, then\n// reads `.getText()` on the two type args) — the checker is only needed to MERGE declarations across files,\n// not to extract, so a source scan is equivalent per-file. Runs at assemble time over built-in source AND at\n// runtime over http-fetched plugin source, so a remotely-loaded plugin's tools carry real TS too. Best-effort\n// (shares splitTopLevel's `>`-as-close-bracket limitation, so an arrow type inside a contract arg can confuse\n// depth); an unparseable arm simply yields no contract for that tool, which degrades to its base description.\nexport function extractToolContracts(src) {\n  const out = {};\n  const clean = src.replace(/\\/\\*[\\s\\S]*?\\*\\//g, ' ').replace(/\\/\\/[^\\n]*/g, ' ');   // drop comments\n  const RE = /interface\\s+ToolContracts\\s*\\{/g;\n  for (let m = RE.exec(clean); m !== null; m = RE.exec(clean)) {\n    let depth = 1, i = RE.lastIndex;\n    for (; i < clean.length && depth > 0; i++) {\n      const c = clean[i];\n      if (c === '{') depth++; else if (c === '}') depth--;\n    }\n    const body = clean.slice(RE.lastIndex, i - 1);\n    for (const member of splitTopLevel(body, ';')) {\n      const text = member.trim();\n      if (!text.includes('ToolContract')) continue;\n      const q = text.match(/^(['\"])(.*?)\\1\\s*:\\s*([\\s\\S]*)$/);          // quoted key\n      const b = q ? null : text.match(/^([A-Za-z_$][\\w$]*)\\s*:\\s*([\\s\\S]*)$/);   // bare key\n      const key  = q?.[2] ?? b?.[1];\n      const type = q?.[3] ?? b?.[2];\n      if (key === undefined || type === undefined) continue;\n      const c = parseContractArms(type.trim());\n      if (c) out[key] = c;\n    }\n    RE.lastIndex = i;\n  }\n  return out;\n}\n\n// Best-effort JSON-Schema → TypeScript type text. Deliberately shallow and total (never throws; anything\n// unrecognised degrades to `unknown`) and purely structural (no named refs) so the dts stays self-contained.\nfunction schemaToTs(schema, depth = 0) {\n  if (depth > 6 || schema === null || typeof schema !== 'object') return 'unknown';\n  const s = schema ;\n  const lit = (v) =>\n    typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean' || v === null ? JSON.stringify(v) : 'unknown';\n\n  const union = s['anyOf'] ?? s['oneOf'];\n  if (Array.isArray(union)) {\n    const parts = [...new Set(union.map(u => schemaToTs(u, depth + 1)))];\n    return parts.length ? parts.join(' | ') : 'unknown';\n  }\n  if (Array.isArray(s['enum'])) {\n    const parts = [...new Set(s['enum'].map(lit))];\n    return parts.length ? parts.join(' | ') : 'unknown';\n  }\n  const type = s['type'];\n  if (Array.isArray(type)) return [...new Set(type.map(t => schemaToTs({ ...s, type: t }, depth)))].join(' | ') || 'unknown';\n  switch (type) {\n    case 'string':  return 'string';\n    case 'integer':\n    case 'number':  return 'number';\n    case 'boolean': return 'boolean';\n    case 'null':    return 'null';\n    case 'array': {\n      const items = Array.isArray(s['items']) ? 'unknown' : schemaToTs(s['items'], depth + 1);\n      return /[ |&]/.test(items) ? `Array<${items}>` : `${items}[]`;\n    }\n  }\n  const props = s['properties'] && typeof s['properties'] === 'object' ? s['properties']  : undefined;\n  if (props && Object.keys(props).length > 0) {\n    const required = new Set(Array.isArray(s['required']) ? s['required']  : []);\n    const members = Object.entries(props).map(([k, v]) => {\n      const key = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(k) ? k : JSON.stringify(k);\n      return `${key}${required.has(k) ? '' : '?'}: ${schemaToTs(v, depth + 1)}`;\n    });\n    return `{ ${members.join('; ')} }`;\n  }\n  if (type === 'object') {\n    const ap = s['additionalProperties'];\n    return ap !== null && typeof ap === 'object' ? `Record<string, ${schemaToTs(ap, depth + 1)}>` : 'Record<string, unknown>';\n  }\n  return 'unknown';\n}\n\nclass BrowserToolTypeIndex  {\n    machine;\n  // Assembler-baked per-tool { params, result } (node compiler run at build time), keyed by tool name.\n  // Empty when a bundle didn't bake them, in which case behaviour falls back to the pre-embed path.\n    embedded;\n  constructor(machine, embedded) {\n    this.machine  = machine;\n    this.embedded = embedded ?? {};\n  }\n\n  async dts() {\n    const arms = this.machine.tools.list().map(t => {\n      const emb = this.embedded[t.name];\n      const contract = t.toolC     "/plugins/frontend/dom/src/ui.ts": "\n\n\nimport { createSession, currentPrincipal, promptCancelledError } from '@matatbread/matbot-core';\n\nconst CSS = `\n.mb-app { display:flex; flex-direction:column; height:100vh; font:14px/1.5 system-ui,sans-serif; color:#1a1a1a; background:#fafafa; }\n.mb-head { display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid #e2e2e2; background:#fff; }\n.mb-head .mb-title { font-weight:600; margin-right:auto; }\n.mb-head select, .mb-head button { font:inherit; padding:4px 8px; border:1px solid #cfcfcf; border-radius:6px; background:#fff; }\n.mb-head option.mb-archived { color:#9a9a9a; }\n.mb-msgs { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }\n.mb-row { display:flex; }\n.mb-row.user { justify-content:flex-end; }\n.mb-bubble { max-width:72ch; padding:8px 12px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }\n.mb-row.user  .mb-bubble { background:#2563eb; color:#fff; }\n.mb-row.assistant .mb-bubble { background:#fff; border:1px solid #e2e2e2; }\n.mb-bubble.mb-md { white-space:normal; }\n.mb-bubble.mb-md > :first-child { margin-top:0; }\n.mb-bubble.mb-md > :last-child { margin-bottom:0; }\n.mb-bubble.mb-md pre { background:#0f172a; color:#e2e8f0; padding:8px 10px; border-radius:8px; overflow-x:auto; }\n.mb-bubble.mb-md code { font-family:ui-monospace,monospace; font-size:.92em; }\n.mb-bubble.mb-md :not(pre) > code { background:rgba(0,0,0,.06); padding:1px 4px; border-radius:4px; }\n.mb-row.user .mb-bubble.mb-md :not(pre) > code { background:rgba(255,255,255,.2); }\n.mb-bubble.mb-md a { color:inherit; }\n.mb-tool { font-family:ui-monospace,monospace; font-size:12px; background:#0f172a; color:#e2e8f0; border-radius:8px; padding:8px 10px; max-width:72ch; white-space:pre-wrap; }\n.mb-tool .mb-tool-name { color:#7dd3fc; }\n.mb-err { color:#b91c1c; }\n.mb-think { color:#888; font-style:italic; font-size:12px; }\n.mb-foot { display:flex; gap:8px; padding:10px 12px; border-top:1px solid #e2e2e2; background:#fff; }\n.mb-foot textarea { flex:1; resize:none; font:inherit; padding:8px; border:1px solid #cfcfcf; border-radius:8px; min-height:42px; }\n.mb-foot button { font:inherit; padding:0 16px; border:none; border-radius:8px; background:#2563eb; color:#fff; cursor:pointer; }\n.mb-foot button.mb-stop { background:#b91c1c; }\n.mb-foot button:disabled { opacity:.5; cursor:default; }\n.mb-prompt { border:1px solid #f59e0b; background:#fffbeb; border-radius:12px; padding:12px; max-width:72ch; display:flex; flex-direction:column; gap:8px; }\n.mb-prompt .mb-q { font-weight:600; }\n.mb-prompt .mb-opts { display:flex; flex-wrap:wrap; gap:6px; }\n.mb-prompt button, .mb-prompt input { font:inherit; padding:6px 10px; border:1px solid #cfcfcf; border-radius:6px; background:#fff; cursor:pointer; }\n.mb-prompt input { cursor:text; }\n`;\n\nfunction el(\n  tag, cls, text,\n) {\n  const node = document.createElement(tag);\n  if (cls)  node.className   = cls;\n  if (text) node.textContent = text;\n  return node;\n}\n\nfunction textOf(content) {\n  return content.filter((c) => c.type === 'text')\n                .map(c => c.text).join('');\n}\n\n/**\n * A whole matbot chat UI in the DOM. Owns no I/O of its own beyond the runner: it submits turns\n * through `services.run` and renders the `PipelineEvent` stream, exactly as a remote frontend would\n * over SSE — only here the runner is in the same realm, so there is no wire.\n */\nexport class ChatUI {\n    services;\n    root;\n   msgs;\n   input;\n   sendBtn;\n   stopBtn;\n   provider;\n   sessionSel;\n\n   sessionId = '';\n   busy      = false;\n   currentAbort;\n   liveAssistant;\n   liveText = '';\n   liveTools = new Map();\n   session;\n  // Markdown renderer, loaded from a CDN only when served over http(s). On file:// it stays\n  // undefined and messages render as plain text — keeping the bundle self-contained and offline.\n   renderMd;\n\n  constructor(services, root) {\n    this.services = services;\n    this.root = root;\n  }\n\n  async mount() {\n    document.getElementById('mb-loading')?.remove();\n    const style = el('style');\n    style.textContent = CSS;\n    document.head.appendChild(style);\n\n    const app  = el('div', 'mb-app');\n    const head = el('div', 'mb-head');\n    head.appendChild(el('span', 'mb-title', 'matbot · web'));\n\n    this.provider = el('select');\n    this.populateProviders();\n    this.prevProvider = this.provider.value;\n    this.provider.addEventListener('change', () => void this.onProviderChange());\n    head.appendChild(this.provider);\n\n    this.sessionSel = el('select');\n    this.sessionSel.addEventListener('change', () => void this.selectSession(this.sessionSel.value));\n    head.appendChild(this.sessionSel);\n\n    const newBtn = el('button', undefined, '+ New');\n    newBtn.addEventListener('click', () => void this.newSession());\n    head.appendChild(newBtn);\n\n    this.msgs = el('div', 'mb-msgs');\n\n    const foot = el('div', 'mb-foot');\n    this.input = el('textarea');\n    this.input.placeholder = 'Message matbot…  (Shift+Enter to send, Enter for newline)';\n    this.input.addEventListener('keydown', e => {\n      if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); void this.send(); }\n    });\n    this.sendBtn = el('button', 'mb-send', 'Send');\n    this.sendBtn.addEventListener('click', () => void this.send());\n    this.stopBtn = el('button', 'mb-stop', 'Stop');\n    this.stopBtn.hidden = true;\n    this.stopBtn.addEventListener('click', () => this.services.run?.abort(this.sessionId));\n    foot.append(this.input, this.sendBtn, this.stopBtn);\n\n    app.append(head, this.msgs, foot);\n    this.root.appendChild(app);\n\n    void this.loadMarkdown();\n\n    await this.refreshSessionList();\n    const first = this.sessionSel.options[0]?.value;\n    if (first) await this.selectSession(first);\n    else       await this.newSession();\n  }\n\n   principal() {\n    return currentPrinc = undefined) return;\n    try {\n      const name = await api.add();\n      this.populateProviders(name);\n      this.prevProvider = name;\n    } catch { /* cancelled */ }\n  }\n\n   async refreshSessionList() {\n    const store = this.services.sessions;\n    if (store === undefined) return;\n    const { items } = await store.query({ sort: [{ field: 'updatedAt', dir: 'desc' }], limit: 50 });\n    this.sessionSel.replaceChildren();\n\n    const makeOption = (doc) => {\n      const o = el('option');\n      o.value = doc.id;\n      o.textContent = doc.title?.trim() || `(untitled ${doc.id.slice(0, 8)})`;\n      return o;\n    };\n\n    // Unarchived (active/pinned) first, most-recent first.\n    for (const doc of items) if (doc.status !== 'archived') this.sessionSel.appendChild(makeOption(doc));\n\n    // Archived sink to the bottom under a labelled group. Native <select> popups ignore `color` on\n    // <option> (esp. on macOS), so the grey class alone is invisible there; the <optgroup> label is\n    // always rendered by the OS, which is what actually separates and de-emphasises them.\n    const archived = items.filter(doc => doc.status === 'archived');\n    if (archived.length > 0) {\n      const group = el('optgroup');\n      group.label = 'Archived';\n      for (const doc of archived) {\n        const o = makeOption(doc);\n        o.classList.add('mb-archived');\n        group.appendChild(o);\n      }\n      this.sessionSel.appendChild(group);\n    }\n  }\n\n   async newSession() {\n    const store = this.services.sessions;\n    if (store === undefined) throw new Error('No sessions store available.');\n    const session = createSession({ ownerPrincipal: this.principal() });\n    await store.set(session.id, session);\n    await this.refreshSessionList();\n    await this.selectSession(session.id);\n  }\n\n   async selectSession(id) {\n    this.sessionId = id;\n    this.sessionSel.value = id;\n    const session = await this.services.sessions?.get(id);\n    this.render
