    "/core/src/session.ts": "\n\n\n\n\n\n\n\n\n\n\n\nexport function createSession(opts) {\n  const now = new Date().toISOString();\n  return {\n    id:               crypto.randomUUID(),\n    version:          crypto.randomUUID(),\n    ownerPrincipalId: opts.ownerPrincipal.id,\n    ...(opts.actorPrincipal && opts.actorPrincipal.id !== opts.ownerPrincipal.id\n      ? { actorPrincipalId: opts.actorPrincipal.id }\n      : {}),\n    ...(opts.persona              !== undefined ? { persona:              opts.persona              } : {}),\n    ...(opts.title                !== undefined ? { title:                opts.title                } : {}),\n    ...(opts.parentSessionId      !== undefined ? { parentSessionId:      opts.parentSessionId      } : {}),\n    ...(opts.branchPointMessageId !== undefined ? { branchPointMessageId: opts.branchPointMessageId } : {}),\n    status:    'active',\n    contexts:  opts.contexts ?? [],\n    messages:  [],\n    createdAt: now,\n    updatedAt: now,\n  };\n}\n\nexport function appendMessage(session, message) {\n  // updatedAt tracks conversational activity: the new last message's timestamp (the lastActivityAt\n  // invariant), not a fresh `now()` — so it stays consistent with structural edits that preserve the tail.\n  return {\n    ...session,\n    messages:  [...session.messages, message],\n    updatedAt: message.createdAt,\n    version:   crypto.randomUUID(),\n  };\n}\n\nexport function createMessage(opts\n\n\n\n\n\n\n) {\n  return {\n    id:        crypto.randomUUID(),\n    role:      opts.role,\n    content:   opts.content,\n    createdAt: new Date().toISOString(),\n    traceId:   opts.traceId,\n    ...(opts.providerName !== undefined ? { providerName: opts.providerName } : {}),\n    ...(opts.usage        !== undefined ? { usage:        opts.usage        } : {}),\n    ...(opts.metadata     !== undefined ? { metadata:     opts.metadata     } : {}),\n  };\n}\n",
    "/core/src/usage.ts": "\n\n/** Fold one usage tally into a running total; optional fields are summed only when either side has them. */\nexport function addUsage(acc, next) {\n  const a = acc ?? { inputTokens: 0, outputTokens: 0 };\n  const add = (x, y) =>\n    x === undefined && y === undefined ? undefined : (x ?? 0) + (y ?? 0);\n  return {\n    inputTokens:  a.inputTokens  + next.inputTokens,\n    outputTokens: a.outputTokens + next.outputTokens,\n    ...(((c) => c !== undefined ? { costUsd:             c } : {}))(add(a.costUsd,             next.costUsd)),\n    ...(((c) => c !== undefined ? { cacheReadTokens:     c } : {}))(add(a.cacheReadTokens,     next.cacheReadTokens)),\n    ...(((c) => c !== undefined ? { cacheCreationTokens: c } : {}))(add(a.cacheCreationTokens, next.cacheCreationTokens)),\n  };\n}\n\n/**\n * Aggregate the token accounting recorded on a set of messages, keyed by the provider billed: an\n * assistant turn's own `Message.usage` (billed to its `providerName`) plus every `tool-result` block's\n * `usage` records (each provider-tagged — a tool may run completions against several). Pass a single\n * turn's messages (filtered by `traceId`) for a per-turn breakdown, or a whole session for its total.\n */\nexport function usageByProvider(messages) {\n  const out = new Map();\n  for (const m of messages) {\n    if (m.usage !== undefined && m.providerName !== undefined) {\n      out.set(m.providerName, addUsage(out.get(m.providerName), m.usage));\n    }\n    for (const c of m.content) {\n      if (c.type === 'tool-result' && c.usage !== undefined) {\n        for (const r of c.usage) out.set(r.provider, addUsage(out.get(r.provider), r.usage));\n      }\n    }\n  }\n  return out;\n}\n",
    "/core/src/hooks.ts": "export { HookRegistry } from '@matatbread/matbot-plugin-api';\n",
    "/core/src/runner.ts": "\n\n\n\n\n\n\nimport { currentUsageSink } from '@matatbread/matbot-plugin-api';\nimport { HookRegistry } from './hooks.js';\nimport { appendMessage, createMessage } from './session.js';\nimport { addUsage } from './usage.js';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nexport async function* runSession(opts) {\n  const { config, provider, providerConfig, store, signal } = opts;\n  const tools   = opts.tools   ?? new Map();\n  const hookReg = opts.hooks   ?? new HookRegistry();\n  const promptFn = opts.prompt ?? (((p, def) => {\n    const fallback = typeof p === 'string' ? def : p.default;\n    if (fallback !== undefined) return Promise.resolve(fallback);\n    const label = typeof p === 'string' ? p : p.label;\n    return Promise.reject(new Error(`Non-interactive context: cannot prompt for \"${label}\"`));\n  }) );\n  const vault = opts.vault ?? {\n    async createSecret() { throw new Error('No vault configured'); },\n    async writeSecret()  { throw new Error('No vault configured'); },\n    hasKey() { return false; },\n    async resolve(ref) { return ref; },\n    scrub(text) { return text; },\n  };\n  const traceId = config.traceId ?? crypto.randomUUID();\n\n  // ── 1. screen — once per turn: shape/abort the incoming submission ──────────\n\n  const screen = await hookReg.runScreen({ session: opts.session, config, signal, prompt: promptFn });\n  if (screen.abort) {\n    // Hook-failure (and any other screen-injected) markers carried live, even on abort, so a\n    // misconfigured hook surfaces this turn rather than only on a later reload.\n    if (screen.markers.length > 0) yield { type: 'marker', content: screen.markers, traceId };\n    await store.set(screen.session.id, screen.session);\n    yield { type: 'aborted', reason: screen.abort, session: screen.session, traceId };\n    return;\n  }\n  // Durable context a screen hook folded onto the user message (e.g. a fired `contextual` trigger),\n  // carried live so a frontend draws it now rather than only on a later reload. It is already part of\n  // screen.session (origin: 'robo' blocks on the user turn) — this event is purely live delivery.\n  // Emitted BEFORE the markers so the live order matches a reload: the durable blocks belong to the\n  // user message (rendered with the turn), while screen markers were appended to the session AFTER it.\n  if (screen.durable.length > 0) {\n    yield { type: 'robo-user', content: screen.durable, traceId };\n  }\n  // Hook-failure (and any other screen-injected) markers, carried live so the UI shows them this turn\n  // rather than only on a later session reload. They are already persisted in screen.session.\n  if (screen.markers.length > 0) {\n    yield { type: 'marker', content: screen.markers, traceId };\n  }\n  let session = screen.session;\n\n  // Turn-scoped ephemeral context from screen — appended to the TAIL of the outgoing messages\n  // (onto the content of the freshest history message, preserving its role), never persisted.\n  // At the tail, not as a system prefix, because (a) a \"do X now\" directive needs the salience of\n  // being the last thing the model reads — a system-block prefix sits above the whole history and\n  // reads as stale once the turn has any momentum — and (b) per-turn content in the prefix would\n  // bust the cached system/history prefix every turn; appended at the tail it leaves the prefix\n  // byte-stable. Folding into the last message (rather than adding a trailing message) avoids\n  // role-alternation hazards and survives both adapters (Anthropic folds system→system=; OpenAI\n  // drops non-result content from tool-role messages — a separate trailing message would break on\n  // one or the other).\n  // injectedEphemeral (a pump-supplied retract-redo's context) leads, then screen's own — both share\n  // the identical tail-fold path below.\n  const ephemeral = [...(opts.injectedEphemeral ?? []), ...screen.ephemeral];\n\n  // ── 2. System context (built once per submit, never persisted) ─────────────\n\n  const systemText = opts.systemContext\n    ? await opts.systemContext.build({ session, signal })\n    : null;\n\n  const systemMsg = systemText !== null\n    ? [createMessage({ role: 'system', content: [{ type: 'text', text: systemText }], traceId: '' })]\n    : [];\n\n  if (systemText !== null) {\n    yield { type: 'system-context', text: systemText, traceId };\n  }\n\n  // ── 3. Agentic loop ────────────────────────────────────────────────────────\n\n  for (;;) {\n    // Respect an abort that arrived between turns (e.g. during tool execution).\n    if (signal.aborted) {\n      await store.set(session.id, session);\n      yield { type: 'aborted', reason: typeof signal.reason === 'string' ? signal.reason : 'user-abort', session, traceId };\n      return;\n    }\n\n    const pendingCalls = [];\n    const assistantParts = [];\n    let textAcc = '';\n    let turnUsage;\n\n    // One provider call. The outgoing array (system context + history, with screen's ephemeral\n    // blocks appended onto the tail message) is assembled here and handed to `contribute` hooks for\n    // a final ephemeral transform — none of this is written back to the session.\n    // Fold onto the last NON-marker message: markers are elided from the wire, so the literal last\n    // message can be a marker (e.g. a retract-redo leaves the retraction marker as the tail) — folding\n    // there would drop the ephemeral with it. -1 ⇒ nothing to fold onto (no non-marker history).\n    const foldIdx = ephemeral.length > 0 ? session.messages.findLastIndex(m => m.role !== 'marker') : -1;\n    const history = foldIdx >= 0\n      ? session.messages.map((m, i) =>\n          i === foldIdx ? { ...m, content: [...m.content, ...ephemeral] } : m)\n      : session.messages;\n    const outgoing = await hookReg.runContribute({\n      outgoing: [...systemMsg, ...history],\n      session, config, signal,\n    });\n    // Tools advertised for THIS call. A presenter (optional) may present a subset of the snapshot and\n    // grow it across iterations as the model discovers tools; absent ⇒ the whole snapshot. Withheld\n    // tools stay callable — execution resolves against the live registry (opts.toolRegistry), not this.\n    const advertised = opts.toolPresenter\n      ? await opts.toolPresenter.present([...tools.values()], { session, provider: config.provider })\n      : [...tools.values()];\n    try {\n      for await (const ev of provider.complete(outgoing, providerConfig, advertised, signal)) {\n        switch (ev.type) {\n          case 'text-delta':\n            textAcc += ev.delta;\n            yield { type: 'text-delta', delta: ev.delta, traceId };\n            break;\n          case 'thinking':\n            yield { type: 'thinking', delta: ev.delta, traceId };\n            break;\n          case 'thinking-block':\n            assistantParts.push({ type: 'thinking', thinking: ev.thinking, signature: ev.signature });\n            break;\n          case 'redacted-thinking':\n            assistantParts.push({ type: 'redacted-thinking', data: ev.data });\n            break;\n          case 'unknown-block':\n            assistantParts.push({ type: 'unknown-content', blockType: ev.blockType, raw: ev.raw });\n            break;\n          case 'reasoning-block':\n            assistantParts.push({ type: 'reasoning', reasoning: ev.reasoning });\n            break;\n          case 'tool-call':\n            pendingCalls.push({ id: ev.id, name: ev.name, input: ev.input });\n            break;\n          case 'usage':\n            turnUsage = addUsage(turnUsage, ev);\n            yield { type: 'usage', inputTokens: ev.inputTokens, outputTokens: ev.outputTokens, traceId,\n              ...(ev.costUsd              !== undefined ? { costUsd:              ev.costUsd              } : {}),\n              ...(ev.cacheReadTokens     !== undefined ? { cacheReadTokens:     ev.cacheReadTokens     } : {}),\n              ...(ev.cacheCreationTokens !== undefined ? { cacheCreationTokens: ev.cacheCreationTokens } : {}) };\n            break;\n          case 'done':\n            break;\n        }\n      }\n    } catch (e) {\n      if (signal.aborted) {\n        // Save whatever the LLM streamed before the abort hit.\n        if (textAcc) assistantParts.push({ type: 'text', text: textAcc });\n        if (assistantParts.length > 0) {\n          session = appendMessage(session, createMessage({\n            role: 'assistant', content: assistantParts, traceId, providerName: config.provider,\n            ...(turnUsage !== undefined ? { usage: turnUsage } : {}),\n          }));\n        }\n        await store.set(session.id, session);\n        yield { type: 'aborted', reason: typeof signal.reason === 'string' ? signal.reason : 'user-abort', session, traceId };\n        return;\n      }\n      yield { type: 'error', error: String(e) + (('cause' in e && e.cause) ? ' ('+String(e.cause)+')' : '' ), traceId };\n      return;\n    }\n\n    // Build and store assistant message\n    if (textAcc)           assistantParts.push({ type: 'text', text: textAcc });\n    for (const tc of pendingCalls) {\n      assistantParts.push({ type: 'tool-call', id: tc.id, name: tc.name, input: tc.input });\n    }\n\n    if (assistantParts.length > 0) {\n      const assistantMsg = createMessage({\n        role:         'assistant',\n        content:      assistantParts,\n        traceId,\n        providerName: config.provider,\n        ...(turnUsage !== undefined ? { usage: turnUsage } : {}),\n      });\n      session = appendMessage(session, assistantMsg);\n    } else {\n      // Diagnostic: the provider returned no text, no tool calls, no thinking — a genuinely empty\n      // completion. The turn will end with no assistant message, which reads as \"the agent never\n      // replied\". Logged here so a silent no-reply turn is traceable. (textAcc length is shown to\n      // tell a truly empty stream apart from one that was only whitespace.)\n      console.warn(`[runner] empty completion (no assistant content) on traceId ${traceId}; textAcc=${textAcc.length} chars, provider=${config.provider}`);\n    }\n\n    // No tool calls → done\n    if (pendingCalls.length === 0) break;\n\n    // ── 3. Execute tool calls ────────────────────────────────────────────────\n\n    const toolResults = [];\n    const toolMarkers = [];\n\n    for (const tc of pendingCalls) {\n      yield { type: 'tool:start', callId: tc.id, name: tc.name, input: tc.input, traceId };\n\n      const tool = opts.toolRegistry !== undefined ? opts.toolRegistry.resolve(tc.name) : tools.get(tc.name);\n      if (!tool) {\n        const err = { error: `Unknown tool: ${tc.name}` };\n        toolResults.push({ type: 'tool-result', id: tc.id, result: err, isError: true });\n        yield { type: 'tool:end', callId: tc.id, result: err, isError: true, traceId };\n        continue;\n      }\n\n      const decision = await hookReg.runToolCall({\n        session, config, signal,\n        toolCall: { id: tc.id, name: tc.name, input: tc.input },\n        tool,\n      });\n      if (decision.abort) {\n        yield { type: 'aborted', reason: decision.abort, session, traceId };\n        return;\n      }\n      if (decision.rejectTool) {\n        const err = { error: decision.rejectTool.message };\n        toolResults.push({ type: 'tool-result', id: tc.id, result: err, isError: true });\n        yield { type: 'tool:end', callId: tc.id, result: err, isError: true, traceId };\n        continue;\n      }\n\n      let result;\n      let isError = false;\n      // Token accounting for completions this tool runs (via singleTurn/complete) accrues into the\n      // ambient turn sink; slice off whatever it appends during *this* call to attribute it here.\n      const usageSink = currentUsageSink();\n      const usageMark = usageSink?.length ?? 0;\n      const startedAt = Date.now();\n\n      const toolCtx = {\n        callId: tc.id, session, signal, vault,\n        provider:     config.provider,\n        prompt:       promptFn,\n        loadPlugin:   (specifier, refresh) => opts.loadPlugin(specifier, promptFn, refresh),\n        unloadPlugin: opts.unloadPlugin,\n        ...(opts.workdir     !== undefined ? { workdir:     opts.workdir     } : {}),\n        ...(opts.configPath  !== undefined ? { configPath:  opts.configPath  } : {}),\n        ...(opts.files       !== undefined ? { files:       opts.files       } : {}),\n      };\n\n      try {\n        for await (const toolEv of tool.executor.execute(tc.input, toolCtx)) {\n          switch (toolEv.type) {\n            case 'stdout':   yield { type: 'tool:stdout', callId: tc.id, chunk: toolEv.chunk, traceId }; break;\n            case 'stderr':   yield { type: 'tool:stderr', callId: tc.id, chunk: toolEv.chunk, traceId }; break;\n            case 'file':     yield { type: 'file', handle: toolEv.handle, traceId }; break;\n            case 'result':   result = toolEv.value; break;\n            case 'marker':   toolMarkers.push({ type: 'marker', creator: toolEv.creator, data: toolEv.data }); break;\n            case 'progress': yield { type: 'tool:progress', callId: tc.id, pct: toolEv.pct, ...(toolEv.message !== undefined ? { message: toolEv.message } : {}), traceId }; break;\n            case 'error':    result = {\n              error: toolEv.message,\n              ...(toolEv.stdout !== undefined ? { stdout: toolEv.stdout } : {}),\n              ...(toolEv.stderr !== undefined ? { stderr: toolEv.stderr } : {}),\n            }; isError = true; break;\n          }\n        }\n      } catch (e) {\n        result  = { error: String(e) };\n        isError = true;\n      }\n\n      // toolresult — last chance to transform the result before it's recorded/yielded (hard redaction),\n      // or to observe it (auditing: args + result + timing). Owns the LLM-facing + persisted surfaces.\n      result = await hookReg.runToolResult({\n        session, config, signal,\n        toolCall: { id: tc.id, name: tc.name, input: tc.input },\n        tool, result, isError, durationMs: Date.now() - startedAt,\n      });\n\n      const callUsage = usageSink ? usageSink.slice(usageMark) : [];\n      toolResults.push({ type: 'tool-result', id: tc.id, result, isError,\n        ...(callUsage.length > 0 ? { usage: callUsage } : {}) });\n      yield { type: 'tool:end', callId: tc.id, result, isError, traceId };\n    }\n\n    // Add tool results message, then loop for the next provider call.\n    const toolMsg = createMessage({ role: 'tool', content: toolResults, traceId });\n    session = appendMessage(session, toolMsg);\n\n    // Markers a tool emitted while running: persist as their own marker-role message (elided from\n    // provider submission) and carry live so a frontend can render them without a reload.\n    if (toolMarkers.length > 0) {\n      session = appendMessage(session, createMessage({ role: 'marker', content: toolMarkers, traceId }));\n      yield { type: 'marker', content: toolMarkers, traceId };\n    }\n  }\n\n  // ── 4. Persist and finish ──────────────────────────────────────────────────\n  // `react` fires post-commit, in pump (the queue owner) — not here.\n\n  await store.set(session.id, session);\n\n  yield { type: 'done', session, traceId };\n}\n",
    "/core/src/session-runner.ts": "\n\n\n\n\n\n\n\nimport { appendMessage, createMessage } from './session.js';\nimport { contextSwitch, withUsageScope } from '@matatbread/matbot-plugin-api';\nimport { runSession } from './runner.js';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst MAX_RESUBMIT_DEPTH = 8;\n\n// Marker creator for a retract-and-rerun: its `data.retracted` carries the popped (superseded) turn\n// messages so a frontend can render them struck-through and a post-mortem can audit them. Core-owned\n// because the pop is a pump operation, not a plugin's.\nconst RETRACTION_CREATOR = 'matbot-retraction';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n// A single-consumer push channel surfaced as an AsyncIterable. `dispose` runs when the consumer\n// stops (break/return) or the channel closes, so an abandoned subscriber unregisters itself.\nfunction createSink(dispose) {\n  const buffer = [];\n  let waiting = null;\n  let closed = false;\n\n  const finish = () => {\n    if (closed) return;\n    closed = true;\n    if (waiting) { const w = waiting; waiting = null; w({ value: undefined , done: true }); }\n  };\n\n  return {\n    push(ev) {\n      if (closed) return;\n      if (waiting) { const w = waiting; waiting = null; w({ value: ev, done: false }); }\n      else buffer.push(ev);\n    },\n    close: finish,\n    iterable: {\n      [Symbol.asyncIterator]() {\n        return {\n          next() {\n            const head = buffer.shift();\n            if (head !== undefined) return Promise.resolve({ value: head, done: false });\n            if (closed)            return Promise.resolve({ value: undefined , done: true });\n            return new Promise(res => { waiting = res; });\n          },\n          return() {\n            finish();\n            dispose();\n            return Promise.resolve({ value: undefined , done: true });\n          },\n        };\n      },\n    },\n  };\n}\n\nexport function wireDescription(description, wc) {\n  return wc\n    ? `${description}\\n\\nTypeScript params:\\n\\`\\`\\`\\n${wc.params}\\n\\`\\`\\`\\n\\nTypeScript result:\\`\\`\\`${wc.result}\\n\\`\\`\\``\n    : description;\n}\n\nexport function createSessionRunner(deps) {\n  const states = new Map();\n\n  const stateFor = (id) => {\n    let s = states.get(id);\n    if (s === undefined) {\n      s = { queue: [], running: false, ac: undefined, subscribers: new Set(), replay: [] };\n      states.set(id, s);\n    }\n    return s;\n  };\n\n  const maybeCleanup = (id, s) => {\n    if (!s.running && s.queue.length === 0 && s.subscribers.size === 0) states.delete(id);\n  };\n\n  // Turn events go to the replay buffer (so a mid-flight subscriber sees the in-progress turn) and\n  // all live subscribers.\n  const emit = (s, ev) => {\n    s.replay.push(ev);\n    for (const sink of s.subscribers) sink.push(ev);\n  };\n\n  // Subscribers-only (no replay buffer): used for the `queued` events that describe the pending\n  // queue. Pending is NOT kept in `replay` (which is per-turn) — it's reconstructed from `s.queue`\n  // when a subscriber joins, so it survives turn boundaries correctly.\n  const notify = (s, ev) => {\n    for (const sink of s.subscribers) sink.push(ev);\n  };\n\n  // How many submissions sit ahead of the item at queue index `i` (the running turn counts as one).\n  const aheadOf = (s, i) => (s.running ? 1 : 0) + i;\n\n  const pump = async (id, s) => {\n    if (s.running) return;\n    s.running = true;\n    try {\n      while (s.queue.length > 0) {\n        // Per-submission concat: the head always runs; if the head is a concat submission it absorbs\n        // the following submissions while they too are concat, stopping at the first non-concat (a turn\n        // boundary). Net effect: maximal runs of consecutive concat submissions merge into one turn,\n        // while every queued/robo submission stays its own ordered turn — concat and queued mix freely.\n        const head  = s.queue.shift();\n        const batch = [head];\n        if (head.concatQueue) {\n          while (s.queue.length > 0 && s.queue[0].concatQueue) batch.push(s.queue.shift());\n        }\n        const content = batch.flatMap(i => i.content);\n        s.replay = [];\n        // Seed replay with the running turn's user message as a single merged `queued`, mirroring the\n        // message persisted just below. notify() (in open()) reaches only subscribers that are live at\n        // enqueue time; a GET /events/sessions/:id that connects after this synchronous preamble — the\n        // common case when the submit POST wins the race against the events stream — would otherwise\n        // find an empty queue and a cleared replay, and never render the user bubble. One merged event\n        // (not one per batch item) matches both stored history on reload and the live fold, so a late\n        // subscriber reconstructs exactly one bubble. A redo carries no new user message (and no\n        // content), so it seeds nothing — its retraction marker already went out at enqueue time.\n        if (head.redo === undefined) {\n          s.replay.push({ type: 'queued', content, queued: 0, concatQueue: false, traceId: head.traceId, rootTraceId: head.rootTraceId });\n        }\n\n        let session = await deps.store.get(id);\n        if (session === null) {\n          emit(s, { type: 'error', error: `Session \"${id}\" not found`, traceId: head.traceId });\n          continue;\n        }\n\n        // A redo re-runs the existing committed user turn — no title derivation, no new user message.\n        if (head.redo === undefined) {\n          if (!session.title && !session.messages.some(m => m.role === 'user')) {\n            const text = content\n              .filter((c) => c.type === 'text')\n              .map(c => c.text).join(' ').trim();\n            if (text) {\n              const words = text.split(/\\s+/).slice(0, 8).join(' ');\n              session = { ...session, title: words.length > 60 ? `${words.slice(0, 60)}…` : words };\n            }\n          }\n\n          // Persist-at-turn-start: the user message only hits the store when its turn begins, never\n          // while queued. That is what stops a mid-turn submit from clobbering session state. A robo\n          // resubmission's blocks already carry `origin: 'robo'` (stamped where it was enqueued).\n          session = appendMessage(session, createMessage({ role: 'user', content, traceId: head.traceId, providerName: head.provider }));\n          await deps.store.set(session.id, session);\n        }\n\n        const resolved = await deps.resolveProvider(head.provider);\n        if (resolved === null) {\n          emit(s, { type: 'error', error: `Unknown provider \"${head.provider}\"`, traceId: head.traceId });\n          continue;\n        }\n\n        const ac = new AbortController();\n        s.ac = ac;\n        // Fold each tool's wire contract — the `params`/`result` text flattened from its single contract\n        // (a source tool's ToolContracts arms, or a source-less tool's `toolContract`) — into its description\n        // for this turn, so the model reasons about the real TS shapes, not just the loose inputSchema.\n        // Derived here because `services`/ToolTypeIndex are live at dispatch. Tools with only a loose\n        // inputSchema (no contract) are left as-is; absent ToolTypeIndex (browser) ⇒ plain descriptions.\n        const wire = await deps.toolTypeIndex?.()?.wireContracts();\n        const toolPresenter = deps.toolPresenter?.();\n        const toolMap = deps.tools !== undefined\n          ? new Map(deps.tools.list().map(t => {\n              const wc = wire?.[t.name];\n              return [t.name, wc !== undefined\n                ? { ...t, description: wireDescription(t.description, wc) }\n                : t];\n            }))\n          : undefined;\n\n        try {\n          // Establish the submitter's principal for the whole turn here, not inside runSession:\n          // pump runs detached (`void pump`), so this scope — not the request that enqueued — is the\n          // turn's async root. Everything downstream (hooks, tools, and any Store/FileStore/Vault\n          // access they trigger) reads it via currentPrincipal(). The consumption MUST happen inside\n          // the callback: an async iterator returned out of the scope would lose it before it pulls.\n          // contextSwitch (not bare runAs): a turn is the transactional unit, so a StorageBackend swap\n          // deferred during it lands at this scope's quiescent edge — never mid-CAS.\n          await contextSwitch(head.principal, () => withUsageScope(async () => {\n            for await (const ev of runSession({\n              session,\n              config:         { provider: head.provider, traceId: head.traceId },\n              provider:       resolved.adapter,\n              providerConfig: resolved.config,\n              store:          deps.store,\n              signal:         ac.signal,\n              loadPlugin:     deps.loadPlugin,\n              unloadPlugin:   deps.unloadPlugin,\n              ...(toolMap            !== undefined ? { tools:         toolMap            } : {}),\n              ...(deps.tools         !== undefined ? { toolRegistry:  deps.tools         } : {}),\n              ...(toolPresenter      !== undefined ? { toolPresenter                     } : {}),\n              ...(deps.hooks         !== undefined ? { hooks:         deps.hooks         } : {}),\n              ...(deps.systemContext !== undefined ? { systemContext: deps.systemContext } : {}),\n              ...(deps.workdir       !== undefined ? { workdir:       deps.workdir       } : {}),\n              ...(deps.files         !== undefined ? { files:         deps.files         } : {}),\n              ...(deps.configPath    !== undefined ? { configPath:    deps.configPath    } : {}),\n              ...(deps.vault         !== undefined ? { vault:         deps.vault         } : {}),\n              ...(head.prompt        !== undefined ? { prompt:        head.prompt        } : {}),\n              ...(head.redo          !== undefined ? { injectedEphemeral: head.redo.ephemeral } : {}),\n            })) {\n              emit(s, ev);\n            }\n          }));\n\n          // followup — post-commit, in the queue owner. A hook reads the just-committed turn and may\n          // head-enqueue a robo follow-up (its own real turn, running next). Skipped on abort; runs\n          // under the submitter's principal because a reactor may itself call complete() (a classifier).\n          const hooks = deps.hooks;\n          if (!ac.signal.aborted && hooks) {\n            const committed = await deps.store.get(id);\n            if (committed && head.resubmitDepth < MAX_RESUBMIT_DEPTH) {\n              let followup = { resubmits: [], markers: [] };\n              await contextSwitch(head.principal, async () => {\n                followup = await hooks.runFollowup({\n                  session:       committed,\n                  resubmitDepth: head.resubmitDepth,\n                  config:        { provider: head.provider, traceId: head.traceId },\n                  signal:        ac.signal,\n                  ...(head.prompt !== undefined ? { prompt: head.prompt } : {}),\n                });\n              });\n              const resubmits = followup.resubmits;\n\n              // Durable markers a followup hook returned (e.g. a fired trigger's silent tool tracing\n              // what it did). Append-only to the just-committed session; the pump is the sole writer\n              // post-commit, so an unconditional set is safe. Emitted live too (post-`done`, like a\n              // `queued` event) so a live draw matches a reload — the engine surfaces everything it\n              // persists; a frontend filters if it wants to. Skipped when retracting: the pop rewrites\n              // the message tail, so these markers are folded into     "/core/src/registry.ts": "\nimport { createBroadcaster } from '@matatbread/matbot-plugin-api';\n\n\n\n\nimport { PLUGIN_API_VERSION, unifyServices } from './plugin.js';\nimport { HookRegistry } from './hooks.js';\nimport { makePluginSettings } from './settings.js';\n\n\n// ── Internal state ────────────────────────────────────────────────────────────\n\n/**\n * A plugin the loader could not bring up — an incompatible runtime, an import that rejected, a\n * module that is not plugin-shaped, or a setup() throw. Recorded (not discarded) so the failure is\n * *graceful but not silent*: the `plugin` tool and web UI can show which configured plugins failed\n * and why, instead of the failure vanishing into a boot-time console line. `error` is pre-stringified\n * (sidesteps the `unknown` catch-var); `name` is present only when known before the failure.\n */\n \n\n// Mutable arrays/maps held in a single object to make _resetRegistry() simple.\nconst state = {\n  plugins:         [] ,\n  providers:       new Map(),\n  storage:         new Map(),\n  toolRegistry:    undefined ,\n  frontendPlugins:  new Map(),  // pluginName → info, written by services.registerFrontend()\n  serviceKeys:     new Map(),  // pluginName → MatbotMachine keys it registered\n  hookPlugins:        new Set(),         // plugins that registered at least one hook\n  systemContextPlugins: new Set(),       // plugins that registered a system-context contributor\n  failedPlugins:   [] ,         // plugins the loader skipped, keyed by specifier (last failure wins)\n  overwriteAllTools: undefined ,  // persisted \"overwrite on collision, this install\" choice, loaded lazily\n};\n\n// Read-only observation of plugin load/unload, for consumers that key off plugin presence (e.g. the\n// web plugins panel refreshing live when a backend restores a plugin set out of band). Module-level,\n// not in `state` — it owns subscribers across the registry's lifetime, not per-plugin data.\nconst pluginEvents = createBroa ─────\n\n/**\n * Run setup() for a single plugin. Called by loadPlugins immediately after registration.\n *\n * `prompt`, when supplied by the host, makes tool-name collisions interactive: registering a\n * tool whose name a *different* plugin already owns asks the user whether to overwrite. Absent\n * (non-interactive host), collisions overwrite silently — the historical default.\n */\nexport async function setupPlugin(plugin, services, prompt) {\n  state.toolRegistry ??= services.tools;\n\n  // Single choke point for every plugin tool registration (static `plugin.tools` and in-setup\n  // `services.tools.register`). Stamps ownership and resolves name collisions. The no-collision\n  // path runs synchronously (an async fn yields nothing before its first await), so fire-and-forget\n  // callers that don't await still get the tool registered in the same tick.\n  const registerTool = async (tool) => {\n    const stamped = { ...tool, pluginName: plugin.name };\n    const existing = services.tools.resolve(stamped.name);\n    if (existing !== null && existing.pluginName !== plugin.name) {\n      const overwrite = await resolveToolCollision(services, stamped.name, existing.pluginName, plugin.name, prompt);\n      if (!overwrite) return;\n    }\n    services.tools.register(stamped);\n  };\n\n  // Plugin-scoped settings: bound to this plugin's identity, built once. A plugin reaches only its\n  // own settings — there is no way to name another's.\n  const ownSettings = makePluginSettings(services.createStore('settings'), plugin.name);\n\n  // Per-plugin `mounted`: a thin adapter over the host mount table that delivers *this plugin's* scoped\n  // machine (and scoped onUnmount) to handlers. The stable `scoped` object reads through the host's\n  // re-pointing proxies/registry, so `scoped[key]` is the host's live service by the time a transition\n  // fires. Forward-referenced via `scoped`, assigned below; consume() only runs after setup.\n  let scoped;\n  const scopedMounted = {\n    consume(options, handler) {\n      // Forward to the host mount table but deliver *this plugin's* scoped machine — it reads through\n      // the same proxies/registry, so scoped[key] is the host's live service. onUnmount is scoped too.\n      const forwarded = options.onUnmount !== undefined\n        ? { ...options, onUnmount: () => options.onUnmount(scoped) }\n        : options;\n      services.mounted.consume(forwarded, () => handler(scoped ));\n    },\n  };\n\n  scoped = unifyServices({\n    ...services,\n    mounted: scopedMounted,\n    settings: () => ownSettings,\n    self: {\n      name:      plugin.name,\n      specifier: plugin.specifier,\n      ...(plugin.source !== undefined ? { source: plugin.source } : {}),\n    },\n    tools: {\n      register:      registerTool,\n      remove:        (name) => services.tools.remove(name),\n      resolve:       (name) => services.tools.resolve(name),\n      list:          ()             => services.tools.list(),\n      removeByPlugin:(name) => services.tools.removeByPlugin(name),\n      watch:         (signal) => services.tools.watch(signal),\n    },\n    hooks: {\n      register(hook) {\n        state.hookPlugins.add(plugin.name);\n        services.hooks.register({ ...hook, pluginName: plugin.name } );\n      },\n      removeByPlugin: (name) => services.hooks.removeByPlugin(name),\n    } ,\n    systemContext: {\n      register(contributor) {\n        state.systemContextPlugins.add(plugin.name);\n        services.systemContext.register(contributor, plugin.name);\n      },\n      removeByPlugin: (name) => services.systemContext.removeByPlugin(name),\n      build:          (ctx)          => services.systemContext.build(ctx),\n    },\n    async register(key, svc) {\n      const keys = state.serviceKeys.get(plugin.name) ?? [];\n      keys.push(key );\n      state.serviceKeys.set(plugin.name, keys);\n      await services.register(key, svc);\n    },\n    registerFrontend(info) {\n      state.frontendPlugins.set(plugin.name, info);\n    },\n  });\n  for (const tool of plugin.tools ?? []) {\n    await registerTool(tool);\n  }\n  await plugin.setup?.(scoped);\n}\n\n/** Tear down and fully unload a single plugin, removing all its registered contributions. */\nexport async function unloadPlugin(pluginName, services) {\n  console.warn(`[matbot] Unloading plugin \"${pluginName}\"`);\n  const idx = state.plugins.findIndex(p => p.name === pluginName);\n  if (idx === -1) return false;\n\n  // Note: all synchronous cleanup (removing tools, hooks, services) is done before any asynchronous teardown() calls, to ensure a consistent state even if teardown() fails or hangs.\n  const plugin = state.plugins[idx];\n\n  services.tools.removeByPlugin(pluginName);\n  services.hooks.removeByPlugin(pluginName);\n  services.systemContext.removeByPlugin(pluginName);\n\n  for (const key of state.serviceKeys.get(pluginName) ?? []) {\n    services.unregister(key);\n  }\n  state.serviceKeys.delete(pluginName);\n  state.hookPlugins.delete(pluginName);\n  state.systemContextPlugins.delete(pluginName);\n\n  if (plugin.provider !== undefined) state.providers.delete(plugin.name);\n  for (const type of Object.keys(plugin.storage   ?? {})) state.storage.delete(type);\n\n  state.frontendPlugins.delete(pluginName);\n\n  state.plugins.splice(idx, 1);\n  pluginEvents.emit({ type: 'unloaded', name: pluginName });\n  await Promise.race([\n    plugin.teardown?.(),\n    new Promise((_, reject) => setTimeout(() => reject(new Error(`Teardown timeout for plugin ${pluginName}`)), 10000))\n  ]);\n  return true;\n}\n\n/** Run each plugin's teardown() in reverse-registration order. Errors are logged, not thrown. */\nexport async function teardownPlugins() {\n  const results = await Promise.allSettled([...state.plugins].reverse().map(plugin => plugin.teardown?.()));\n  results.forEach((result, i) => {\n    if (result.status === 'rejected') {\n      console.error(`[matbot] teardown error in plugin \"${state.plugins[i]?.name}\":`, result.reason);\n    }\n  });\n}\n\n",
    "/core/src/settings.ts": "\n\n\n\n\n\n\n\nexport function isSettingsDoc(v) {\n  return typeof v === 'object' && v !== null &&\n    typeof (v ).id      === 'string' &&\n    typeof (v ).version === 'string' &&\n    typeof (v ).data    === 'object' && (v ).data !== null;\n}\n\n/**\n * Settings namespaces double as Store document ids, which the filesystem store restricts to\n * /^[\\w-]+$/. Plugin names are now loader-derived package names (`@scope/pkg`), so slug them to a\n * safe id. Collisions are theoretically possible but irrelevant for this install scale.\n */\nexport function slugSettingsNamespace(name) {\n  return name.replace(/[^\\w-]+/g, '_');\n}\n\n/** Build a PluginSettings facade over the shared settings store, scoped to one document id. */\nexport function makePluginSettings(store, namespace) {\n  const id = slugSettingsNamespace(namespace);\n\n  // Handles migration from the old flat-object format (pre-Store).\n  const getDoc = async () => {\n    const raw = await store.get(id);\n    if (raw === null) return null;\n    if (isSettingsDoc(raw)) return raw;\n    // Old format: flat { key: value } — wrap it so subsequent writes upgrade the file.\n    return { id, version: '0', data: raw  };\n  };\n\n  return {\n    async get(key) {\n      return (await getDoc())?.data[key] ;\n    },\n    async set(key, value) {\n      for (;;) {\n        const doc  = await getDoc();\n        const data = { ...(doc?.data ?? {}), [key]: value  };\n        const next = { id, version: Date.now().toString(), data };\n        // version '0' means migrated-but-not-yet-written — use set to upgrade the file.\n        if (doc === null || doc.version === '0') { await store.set(id, next); return; }\n        const r = await store.cas(id, doc.version, next);\n        if (r.ok) return;\n      }\n    },\n    async delete(key) {\n      for (;;) {\n        const doc = await getDoc();\n        if (doc === null) return;\n        const data = { ...doc.data };\n        delete data[key];\n        const next = { id, version: Date.now().toString(), data };\n        if (doc.version === '0') { await store.set(id, next); return; }\n        const r = await store.cas(id, doc.version, next);\n        if (r.ok) return;\n      }\n    },\n  };\n}\n",
    "/core/src/loader.ts": "\n\nimport { incompatibleRuntimeError, notAPluginError } from '@matatbread/matbot-plugin-api';\nimport { registerPlugin, setupPlugin, unloadPlugin, recordFailedPlugin, clearFailedPlugin } from './registry.js';\n\n/**\n * The runtime this process is executing in. Detected the same way the rejected-import branch below\n * already distinguishes platforms (`typeof window`). Used only for the declarative pre-import gate;\n * an absent `matbotRuntime` declaration bypasses the gate entirely.\n */\nconst CURRENT_RUNTIME = typeof window !== 'undefined' ? 'browser' : 'node';\n\n/**\n * Query-param marker appended to a plugin entry URL when `bustCache` is set.\n *\n * Core only *marks* the entry; it does not propagate. Interpretation is the job\n * of an optional node-side module-customization hook (see apps/cli/ts-hooks.js),\n * which reads this marker off `context.parentURL` and re-stamps the plugin's\n * first-party imports so the whole subtree re-evaluates — \"fresh all the way\n * down\". Where no such hook is installed (browser builds; node without the hook)\n * the marker is an inert query string: only the entry module re-evaluates, and\n * a browser frontend reloads the whole realm instead.\n *\n * The name is namespaced so it cannot collide with a query a plugin URL might\n * legitimately carry. Keep it in sync with the hook.\n */\nconst FRESH_PARAM = 'mbfresh';\n\n// Monotonic tie-breaker: two reloads inside the same millisecond would otherwise\n// produce the same stamp and re-hit the cache.\nlet freshSeq = 0;\n\n/**\n * Load plugins from the given specifiers, register them, then run setup().\n *\n * Node: specifiers are npm package names (e.g. \"matbot-anthropic\") or\n *   file paths relative to the process working directory.\n *\n * Browser: specifiers must be URL paths served from the same origin\n *   (e.g. \"/plugins/matbot-anthropic.js\" or \"./plugins/my-plugin.js\").\n *   Bare package names are supported only if an import map is in scope.\n *   A failed import logs a warning and is skipped rather than aborting\n *   startup — the browser has no node_modules to fall back to.\n *\n * Each module must export either:\n *   export const plugin: MatbotPlugin  (named export, preferred)\n *   export default { plugin: MatbotPlugin }  (default export)\n *\n * A specifier is normally a string that is both imported and recorded as the plugin's\n * `specifier`. The object form decouples those concerns for a host that has already done its\n * own resolution:\n *   - `spec` — recorded as the plugin's `specifier` (the human/config-level identity).\n *   - `importSpec` — the URL actually imported, when it differs from `spec`. The browser\n *     fetches a remote plugin, type-strips it, and imports the resulting ephemeral `blob:`\n *     URL while recording the original source URL as `spec`; node imports a resolved\n *     `file://` path while recording the original `matbot.yaml` entry. Defaults to `spec`.\n *     `bustCache` still applies to a pre-set `importSpec`: a `file:` URL is stamped in place\n *     (the host owns resolution — re-resolving `spec` here would fail for `./…`-relative or\n *     remote specifiers — but the loader owns the freshness stamp). A `blob:` URL is left\n *     untouched (a `?${FRESH_PARAM}` query does not resolve to the blob, and the browser busts\n *     by reloading the whole realm anyway); any other scheme is passed through unstamped.\n *   - `name` — the canonical plugin name, when the host has already derived it (e.g. by\n *     reading the resolved package.json). Bypasses `resolver.identify(spec)` — necessary\n *     because `spec` (a remote URL, a versioned npm range) may not itself identify the name.\n *   - `runtimes` — the package.json `matbotRuntime`, when the host has already read it; used\n *     for the pre-import gate in place of `resolver.runtimes(spec)`.\n *\n * @param bustCache When true, the URL imported for each specifier gets a unique\n *   `${FRESH_PARAM}` query stamp appended before importing — either a host-pre-resolved\n *   `file:` `importSpec` stamped in place, or, absent one, the bare `spec` resolved via\n *   `import.meta.resolve` and then stamped. This forces the JS engine to bypass its module\n *   cache and re-evaluate the entry from disk. With the companion node resolve hook installed\n *   (apps/cli/ts-hooks.js) the stamp propagates to the plugin's first-party imports too, so the\n *   entire subtree re-evaluates — necessary when reloading a plugin whose code, or whose own\n *   modules' code, changed since startup. When resolution is needed but `import.meta.resolve`\n *   is unavailable (or throws), it falls back to the original specifier — re-importing the\n *   cached module — and logs a warning. (Because the single-funnel node host always supplies a\n *   pre-resolved `importSpec`, forgetting to stamp it silently neuters every node reload —\n *   hence the stamp is applied here, in the loader, not left to the caller.)\n * @param prompt Optional host prompt used by setup() to resolve tool-name collisions\n *   interactively. Omitted by non-interactive hosts, in which case collisions overwrite\n *   silently (the historical default).\n * @param onLoadError What to do when an entry cannot become a plugin — an incompatible\n *   `matbotRuntime`, an import that rejects, or a module that is not plugin-shaped (no `plugin`\n *   export, no `apiVersion`, a non-function lifecycle member). `'skip'` (default, the startup\n *   batch) warns and moves on — one mis-targeted or non-plugin entry in the config must not abort\n *   the process, or, under a supervisor that restarts on exit (systemd `Restart=always`), a single\n *   bad `matbot.yaml` line becomes an unbreakable crash loop fixable only by hand-editing the\n *   config. `'throw'` is for an explicit, single, user-initiated load (the `plugin`/`provider`\n *   tools via `services.loadPlugin`): the user named *this* plugin, so a silent skip would surface\n *   only as a confusing empty-result error downstream — fail loudly with the reason instead.\n */\nexport async function loadPlugins(\n  specifiers,\n  services,\n  bustCache = false,\n  prompt,\n  onLoadError = 'skip',\n) {\n  const reqs = specifiers.map(s => (typeof s === 'string' ? { spec: s } : s) );\n  if (bustCache) {\n    console.debug(\n      `[matbot] cache-bust requested for ${specifiers.length} plugin(s); the entry is re-evaluated, ` +\n      `and its first-party imports too IF the node resolve hook is installed (else only the entry).`,\n    );\n  }\n  // Declarative pre-import gate. A plugin whose package.json `matbotRuntime` lists runtimes that\n  // exclude this host is skipped *before* import() — its (possibly platform-specific) top-level\n  // code never evaluates here, which is both the quick path and the only safe one for, e.g., a\n  // node-only plugin reached from a browser. An *absent* declaration means \"don't know\": the\n  // resolver returns undefined and we import it, falling back to the try-load / rollback path\n  // below. Reading the declaration is the host resolver's job (this module stays node-free).\n  const declared = await Promise.all(\n    reqs.map(({ spec, runtimes }) =>\n      runtimes !== undefined                     ? Promise.resolve(runtimes)\n      : services.resolver?.runtimes !== undefined ? services.resolver.runtimes(spec)\n      :                                             Promise.resolve(undefined),\n    ),\n  );\n\n  const toLoad = [];\n  for (let i = 0; i < reqs.length; i++) {\n    const { spec, importSpec, name } = reqs[i];\n    const runtimes = declared[i];\n    if (runtimes !== undefined && runtimes.length > 0 && !runtimes.includes(CURRENT_RUNTIME)) {\n      if (onLoadError === 'throw') {\n        throw incompatibleRuntimeError(spec, runtimes, CURRENT_RUNTIME);\n      }\n      const reason = `declares matbotRuntime [${runtimes.join(', ')}], host runtime is \"${CURRENT_RUNTIME}\".`;\n      console.warn(`[matbot] Skipping plugin \"${spec}\": ${reason}`);\n      recordFailedPlugin({ specifier: spec, error: reason, ...(name !== undefined ? { name } : {}) });\n      continue;\n    }\n    toLoad.push({\n      spec,\n      importSpec: freshImportSpec(spec, importSpec, bustCache),\n      // The resolved location WITHOUT the reload cache-bust stamp — a stable `file:`/bare URL a\n      // consumer can map back to source (e.g. skills_compiler building a types program over the\n      // live plugin set). Falls back to the bare spec when the host pre-resolved nothing.\n      resolvedUrl: importSpec ?? spec,\n      ...(name     !== undefined ? { name }     : {}),\n      ...(runtimes !== undefined ? { runtimes } : {}),\n    });\n  }\n\n  // Imports run in parallel; registration remains sequential to preserve order.\n  const results = await Promise.allSettled(\n    toLoad.map(({ importSpec }) => import(/* @vite-ignore */ importSpec) ),\n  );\n\n  const loaded = [];\n\n  // A load failure is either skipped (the startup batch — a bad entry must not abort the whole\n  // boot) or rethrown (an explicit single load — the user named this plugin). One funnel so every\n  // failure below — import rejection and each shape check — obeys the same mode. See @param onLoadError.\n  // `kind: 'shape'` distinguishes a module that imported cleanly but is not plugin-shaped (a library)\n  // from a `'load'` failure (import rejection — a bad path, a syntax error). Only the former is\n  // permanently-not-a-plugin: it throws NotAPluginError so the `add` flow can roll back the config\n  // write, where an import failure may be a fixable typo and is left in config.\n  const failLoad = (spec, reason, kind = 'load') => {\n    if (onLoadError === 'throw') throw kind === 'shape' ? notAPluginError(spec, reason) : new Error(reason);\n    console.warn(`[matbot] Skipping plugin \"${spec}\": ${reason}`);\n    recordFailedPlugin({ specifier: spec, error: reason });\n  };\n\n  for (let i = 0; i < toLoad.length; i++) {\n    const spec   = toLoad[i].spec;\n    const result = results[i];\n\n    if (result.status === 'rejected') {\n      const reason = result.reason instanceof Error ? result.reason.message : String(result.reason);\n      if (typeof window !== 'undefined') {\n        // Browser: warn and skip — browser environments have no node_modules fallback.\n        console.warn(`[matbot] Could not load plugin \"${spec}\" (browser: use a URL path or configure an import map): ${reason}`);\n        recordFailedPlugin({ specifier: spec, error: reason });\n        continue;\n      }\n      console.error(`[matbot] Failed to load plugin \"${spec}\":`, result.reason);\n      failLoad(spec, `Could not load plugin \"${spec}\": ${reason}`);\n      continue;\n    }\n\n    const mod  = result.value;\n    const spec_obj = (mod['plugin'] ?? (mod['default'] )?.['plugin']) ;\n\n    // Shape verification: a loaded module is a matbot plugin only if it exports a `plugin` object\n    // carrying `apiVersion`, and any lifecycle members it declares are functions. This is the\n    // post-import half of the install guard (the pre-import half is the package.json matbotRuntime\n    // check) — it is what stops an arbitrary fetched/installed module from being treated as a plugin.\n    if (spec_obj === undefined || typeof spec_obj !== 'object') {\n      failLoad(spec,\n        `Plugin module \"${spec}\" does not export a \\`plugin\\` object — it is not a matbot plugin. ` +\n        `Expected: export const plugin: MatbotPluginSpec`,\n        'shape',\n      );\n      continue;\n    }\n    if (!('apiVersion' in spec_obj)) {\n      failLoad(spec, `Plugin module \"${spec}\" exports a \\`plugin\\` object with no \\`apiVersion\\` — it is not a valid matbot plugin.`, 'shape');\n      continue;\n    }\n    const lifecycle = spec_obj ;\n    let lifecycleError;\n    for (const fn of ['setup', 'teardown', 'installationMessage'] ) {\n      const v = lifecycle[fn];\n      if (v !== undefined && typeof v !== 'function') {\n        lifecycleError = `Plugin module \"${spec}\" exports \\`plugin.${fn}\\` that is not a function (got ${typeof v}).`;\n        break;\n      }\n    }\n    if (lifecycleError !== undefined) { failLoad(spec, lifecycleError, 'shape'); continue; }\n\n    // The single boundary where an author's spec becomes a loaded plugin: identity is stamped here,\n    // never declared by the author. The host-injected resolver derives the canonical name; absent a\n    // resolver (e.g. a bare host) we fall back to platform-neutral string munging.\n    const name     = toLoad[i].name ?? (services.resolver !== undefined ? await services.resolver.identify(spec) : defaultIdentify(spec));\n    const source   = sourceOf(spec);\n    const runtimes = toLoad[i].runtimes;\n    const version  = services.resolver?.version !== undefined ? await services.resolver.version(spec) : undefined;\n    const plugin = {\n      ...spec_obj,\n      name,\n      specifier:   spec,\n      resolvedUrl: toLoad[i].resolvedUrl,\n      ...(source   !== undefined ? { source }                 : {}),\n      ...(runtimes !== undefined ? { matbotRuntime: runtimes } : {}),\n      ...(version  !== undefined ? { version }                 : {}),\n    };\n\n    // registered gates the rollback: only an attempt that *itself* registered the\n    // plugin may unload it. A registerPlugin failure means the name/provider/storage\n    // was already owned by a different, healthy plugin — unloading by name there would\n    // tear down that innocent bystander.\n    let registered = false;\n    try {\n      registerPlugin(plugin);\n      registered = true;\n      await setupPlugin(plugin, services, prompt);\n      loaded.push(plugin);\n      // Successful (re)load: a fixed plugin drops off the failed list (reload runs this same path).\n      clearFailedPlugin(spec);\n    } catch (err) {\n      const reason = err instanceof Error ? err.message : String(err);\n      console.error(`[matbot] Ignoring plugin \"${plugin.name}\" from \"${spec}\" due to an error:`, reason);\n      // Graceful but not silent: record the setup failure (skip mode — the boot batch) so the `plugin`\n      // tool and web UI can show it. Explicit single loads (`onLoadError: 'throw'`) surface the error to\n      // the caller directly, so they are not added to the persistent failed list.\n      if (onLoadError === 'skip') recordFailedPlugin({ specifier: spec, name: plugin.name, error: reason });\n      // Roll back partial registration so a failed load leaves no ghost state. setupPlugin\n      // can throw after the plugin is already in the registry with some of its tools / hooks /\n      // services / provider / storage wired (a wrong-platform plugin touching a missing\n      // primitive mid-setup is the common case). unloadPlugin is the exact inverse of\n      // register + setup, so it removes precisely those contributions. We run it defensively:\n      // a half-set-up plugin's own teardown() may throw, and a rollback failure must not abort\n      // the remaining loads.\n      if (registered) {\n        try {\n          await unloadPlugin(plugin.name, services);\n        } catch (cleanupErr) {\n          console.error(\n            `[matbot] Cleanup after failed load of \"${plugin.name}\" did not fully complete; some state may linger:`,\n            cleanupErr instanceof Error ? cleanupErr.message : cleanupErr,\n          );\n        }\n      }\n    }\n  }\n\n  return loaded;\n}\n\n/**\n * Stamp a plugin entry URL with a unique `${FRESH_PARAM}` value to force a fresh\n * evaluation (and, with the node resolve hook, a fresh subtree — see FRESH_PARAM).\n *\n * Diagnostics: cache-busting silently degrades in two ways that are\n * indistinguishable from \"it worked\" at the call site, so both are logged here.\n *   1. import.meta.resolve throws (e.g. a cwd-relative spec that does not resolve\n *      relative to *this* module's URL) — we fall back to the bare spec, which\n *      re-imports the *cached* module. No busting happens at all.\n *   2. Resolution succeeds but no resolve hook is installed: only the entry is\n *      re-evaluated, while everything it statically imports stays cached. We can\n *      detect (1) here; (2) is noted at the call site.\n */\n/**\n * Classify how a specifier resolves to code, from its shape alone (platform-neutral; no fs).\n * github shorthand is only recognised via the explicit `github:` prefix — a bare `owner/repo`\n * is indistinguishable from a scoped npm package and is treated as npm.\n */\nfunction sourceOf(spec) {\n  if (/^https?:\\/\\//.test(spec))                                    return 'cdn';\n  if (spec.startsWith('github:'))                                   return 'github';\n  if (spec.startsWith('file://') || spec.startsWith('./') ||\n      spec.startsWith('../')     || spec.startsWith('/'))           return 'local';\n  return 'npm';\n}\n\n/**\n * Degraded name derivation used only when no PluginResolver is injected. A bare package name is its\n * own identity; anything path/URL-shaped collapses to its last segment (query and extension\n * stripped). Real hosts inject a resolver that walks package.json (node) or parses the CDN URL\n * (browser); this exists so a resolver-less host still loads rather than crashing.\n */\nfunction defaultIdentify(spec) {\n  if (sourceOf(spec) === 'npm') return spec;\n  const noQuery = (spec.split('?')[0]) ?? spec;\n  const last    = noQuery.replace(/\\/+$/, '').split('/').pop() ?? noQuery;\n  return last.replace(/\\.[^.]+$/, '') || noQuery;\n}\n\n/**\n * Pick the URL to actually import, honouring a host-pre-resolved `importSpec` while still\n * applying the cache-bust stamp when requested.\n *\n * The host (apps/cli's resolvePluginSpecifiers) is the *only* place that can resolve a config\n * specifier (`./plugins/…`, a bare name, a remote URL) to an absolute file: URL — it reads the\n * package.json `exports`, materialises remotes into `.plugins/`, and resolves through node_modules.\n * So when an `importSpec` is supplied we must keep it (re-resolving the bare `spec` here against\n * *this* module's URL would fail). But \"keep it\" used to mean \"skip the stamp entirely\", which\n * silently neutered every node-side reload (the pre-set importSpec is never undefined under the\n * single-funnel host). We now stamp the pre-resolved file: URL directly.\n *\n * Carve-out: a `blob:` importSpec (the browser bundle's import-map entries) is left untouched — a\n * `?query` on a blob URL does not resolve to the blob, and the browser busts by reloading the whole\n * realm anyway. Any non-file:, non-blob: scheme is also passed through unstamped.\n */\nfunction freshImportSpec(spec, importSpec, bustCache) {\n  if (!bustCache) return importSpec ?? spec;\n  if (importSpec === undefined) return toFreshUrl(spec);\n  if (importSpec.startsWith('file:')) {\n    const fresh = stampFresh(importSpec);\n    console.debug(`[matbot] cache-bust: \"${spec}\" -> ${fresh}`);\n    return fresh;\n  }\n  return importSpec;\n}\n\nfunction stampFresh(url) {\n  const u = new URL(url);\n  u.searchParams.set(FRESH_PARAM, `${Date.now()}.${++freshSeq}`);\n  return u.href;\n}\n\nfunction toFreshUrl(spec) {\n  try {\n    const fresh = stampFresh(import.meta.resolve(spec));\n    console.debug(`[matbot] cache-bust: \"${spec}\" -> ${fresh}`);\n    return fresh;\n  } catch (err) {\n    const reason = err instanceof Error ? err.message : String(err);\n    console.warn(\n      `[matbot] cache-bust fallback: import.meta.resolve(\"${spec}\") failed (${reason}); ` +\n      `re-importing the CACHED module — changes on disk will NOT be picked up. ` +\n      `(Specifiers must be resolvable relative to ${import.meta.url} or be bare package names.)`,\n    );\n    return spec;\n  }\n}\n",
    "/core/src/tool-registry.ts": "\nimport { createBroadcaster } from '@matatbread/matbot-plugin-api';\n\nexport class ToolRegistryImpl  {\n    tools = new Map();\n    events = createBroadcaster();\n\n  constructor(initial) {\n    if (initial !== undefined) for (const tool of initial) this.tools.set(tool.name, tool);\n  }\n\n  register(tool) {\n    this.tools.set(tool.name, tool);\n    this.events.emit({ type: 'registered', name: tool.name, ...(tool.pluginName !== undefined ? { pluginName: tool.pluginName } : {}) });\n  }\n\n  remove(name) {\n    if (this.tools.delete(name)) this.events.emit({ type: 'removed', name });\n  }\n\n  removeByPlugin(pluginName) {\n    for (const [name, tool] of this.tools) {\n      if (tool.pluginName === pluginName && this.tools.delete(name)) this.events.emit({ type: 'removed', name });\n    }\n  }\n\n  resolve(name) {\n    return this.tools.get(name) ?? null;\n  }\n\n  list() {\n    return [...this.tools.values()];\n  }\n\n  watch(signal) {\n    return this.events.subscribe(signal);\n  }\n}\n",
    "/core/src/provider-registry.ts": "\n\n/**\n * A `Map` of provider profiles that also satisfies the sanctioned {@link ProviderRegistry} write API.\n * Extending `Map` gives every read-surface consumer (`get`/`has`/`keys`/`values`/iteration) the exact\n * standard-library types, while `register`/`remove`/`revert` are the names plugins and the `provider`\n * tool use to contribute profiles — mirroring `ToolRegistry.register`/`remove`.\n *\n * The entries present at construction are snapshotted as the *boot baseline*: `revert(name)` restores\n * that value (or deletes if there was none), so a plugin that contributed — possibly shadowing — a\n * profile can undo it on unload, returning the set to the host's boot condition.\n */\nexport class ProviderRegistryImpl extends Map {\n    bootBaseline;\n\n  constructor(initial) {\n    super(initial);\n    this.bootBaseline = new Map(this);\n  }\n\n  register(config) { this.set(config.name, config); }\n  remove(name) { return this.delete(name); }\n\n  revert(name) {\n    const boot = this.bootBaseline.get(name);\n    if (boot !== undefined) this.set(name, boot);\n    else this.delete(name);\n  }\n}\n",
    "/core/src/system-context.ts": "\n\n\n\n\n\n\nexport class SystemContextRegistryImpl  {\n    _contributors = [];\n\n  register(contributor, pluginName) {\n    this._contributors.push({ fn: contributor, ...(pluginName !== undefined ? { pluginName } : {}) });\n  }\n\n  removeByPlugin(pluginName) {\n    for (let i = this._contributors.length - 1; i >= 0; i--) {\n      if (this._contributors[i]?.pluginName === pluginName) this._contributors.splice(i, 1);\n    }\n  }\n\n  async build(ctx) {\n    const parts = (await Promise.all(this._contributors.map(c => c.fn(ctx))))\n      .filter((s) => typeof s === 'string' && s.length > 0);\n    return parts.length > 0 ? parts.join('\\n\\n') : null;\n  }\n}\n",
    "/core/src/single-turn.ts": "\n\n\n\n\n\n\n\n/**\n * Exposes {@link MatbotMachine.singleTurn} to the model: a one-shot completion against a configured\n * provider, returning its reply. The intended use is consulting another model (e.g. a different-lineage\n * critic of the current draft, or any generation that should run on a specific provider) with a\n * well-defined interface, rather than the model improvising a bash/curl call.\n *\n * `provider` is optional: omitted, the call runs on the current turn's provider ({@link ToolContext.provider}).\n * This is the general case — name a provider to switch models, or leave it off to relay through the\n * model already in use. It lives in core (not in any plugin) because it is the model-facing surface of\n * a core service (`singleTurn`); core is also the one cross-runtime home both the node app and the\n * browser bundle register it from — the tool-plugin barrel (where `plugin`/`provider` live) is node-only.\n */\nexport function createSingleTurnTool(services) {\n  const executor = {\n    async *execute(input, ctx) {\n      const args = input ;\n      if (typeof args.prompt !== 'string') { yield { type: 'error', message: 'single_turn requires a string \"prompt\".' }; return; }\n      const provider = args.provider ?? ctx.provider;\n      if (!provider) {\n        yield { type: 'error', message: 'single_turn needs a \"provider\" — none was given and there is no current turn provider to fall back to.' };\n        return;\n      }\n      if (!services.providers.has(provider)) {\n        const known = [...services.providers.keys()].join(', ') || '(none configured)';\n        yield { type: 'error', message: `Unknown provider \"${provider}\". Configured providers: ${known}.` };\n        return;\n      }\n      const res = await services.singleTurn({\n        provider,\n        prompt: args.prompt,\n        signal: ctx.signal,\n        ...(typeof args.system === 'string' ? { system: args.system } : {}),\n      });\n      // Usage is accounting, not conversation: it is captured ambiently (the host's complete() reports\n      // it into the turn's usage sink, attributed to this tool call) — the model gets only the text.\n      yield { type: 'result', value: { text: res.text } };\n    },\n  };\n\n  return {\n    name: 'single_turn',\n    description:\n      'Run a single-turn completion against a configured provider and return its reply. This is a ' +\n      'one-shot call — not your own response: you send one `prompt` (and optional `system`), and get ' +\n      'back its text. Use it to consult a different model — e.g. a second, ' +\n      'different-lineage model critiquing your draft, or any generation that should run on a specific ' +\n      'provider. `provider` is OPTIONAL: omit it to run on the current conversation\\'s model, or name ' +\n      'a configured provider to switch models (list or add providers with the provider tool).',\n    inputSchema: {\n      type:       'object',\n      required:   ['prompt'],\n      properties: {\n        provider: { type: 'string', description: 'Name of a configured provider to run the completion against. Optional — defaults to the current turn\\'s provider.' },\n        prompt:   { type: 'string', description: 'The user message to send to that provider.' },\n        system:   { type: 'string', description: 'Optional system prompt for the call.' },\n      },\n    },\n    executor,\n  };\n}\n",
    "/core/src/about.ts": "\n\n\n\n\n\n\n\nconst ABOUT = 'Matbot composable LLM harness';\n\n/**\n * Reports what the model is running: the harness `version` and a one-line description. The harness is\n * not a plugin (so it has no row in `plugin list`), and its version is a singleton fact rather than a\n * per-plugin one — hence a dedicated tool. The factory lives in core (like `single_turn`) because it is\n * the one cross-runtime home both the node app and the browser bundle register it from, each passing its\n * own app package version.\n */\nexport function createAboutMatbotTool(version) {\n  const executor = {\n    async *execute(_input, ctx) {\n      yield { type: 'result', value: { version, about: ABOUT, currentProvider: ctx.provider } };\n    },\n  };\n\n  return {\n    name: 'about_matbot',\n    description:\n      'Report what you are running: the matbot harness version and a one-line description. Use it when ' +\n      'asked what version of matbot this is, or for an \"about\" of the harness itself (distinct from the ' +\n      'plugin tool, which lists loaded plugins).',\n    inputSchema: { type: 'object', properties: {} },\n    executor,\n  };\n}\n",

    "/plugin-api/src/types.ts": "\n\n\n// ── Primitives ────────────────────────────────────────────────────────────────\n\n \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Canonical values a `type: 'confirm'` prompt resolves to. The rendered label and buttons are a\n * cosmetic, host-specific concern (and may be localised), so consumers MUST branch on these tokens\n * — never on the displayed string. Compare case-insensitively to tolerate host casing differences.\n */\nexport const CONFIRM_YES = 'yes';\nexport const CONFIRM_NO  = 'no';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n
