llId, result, isError) {\n    const box = this.liveTools.get(callId);\n    const text = `→ ${isError ? '[error] ' : ''}${safeJson(result)}`;\n    if (box) box.appendChild(document.createTextNode(text + '\\n'));\n    else { const b = el('div', 'mb-tool', text); this.msgs.appendChild(b); }\n  }\n\n   scroll() { this.msgs.scrollTop = this.msgs.scrollHeight; }\n\n   setBusy(busy) {\n    this.busy = busy;\n    this.sendBtn.disabled = busy;\n    this.input.disabled   = busy;\n    this.stopBtn.hidden   = !busy;\n  }\n\n  // ── submit + event loop ────────────────────────────────────────────────────\n   async send() {\n    if (this.busy) return;\n    const text = this.input.value.trim();\n    if (!text) return;\n    const run = this.services.run;\n    if (run === undefined) { this.bubble('assistant', '[no session runner available]'); return; }\n\n    this.input.value = '';\n    this.bubble('user', text);\n    this.scroll();\n    this.setBusy(true);\n    this.liveAssistant = undefined;\n    this.liveText = '';\n\n    const ac = new AbortController();\n    this.currentAbort = ac;\n    try {\n      const view = await run.open({\n        sessionId: this.sessionId,\n        signal:    ac.signal,\n        content:   [{ type: 'text', text }],\n        provider:  this.provider.value,\n        principal: this.principal(),\n        prompt:    this.promptFn,\n      });\n      for await (const ev of view.events) {\n        if (!('traceId' in ev)) continue;          // session-level events (e.g. 'idle') — not this turn\n        if (ev.traceId !== view.traceId) continue;\n        this.render(ev);\n        if (ev.type === 'done' || ev.type === 'aborted' || ev.type === 'error' || ev.type === 'cancelled') break;\n      }\n    } catch (e) {\n      this.bubble('assistant', `[error] ${String(e)}`).classList.add('mb-err');\n    } finally {\n      this.finalizeLive();\n      this.currentAbort = undefined;\n      this.setBusy(false);\n      await this.refreshSessionList();\n      this.sessionSel.value = this.sessionId;\n    }\n  }\n\n  // Re-render the streamed assistant text as markdown once the turn (or tool break) ends.\n   finalizeLive() {\n    if (this.liveAssistant !== undefined && this.liveText) this.setContent(this.liveAssistant, this.liveText);\n    this.liveAssistant = undefined;\n    this.liveText = '';\n  }\n\n   render(ev) {\n    switch (ev.type) {\n      case 'text-delta':\n        if (this.liveAssistant === undefined) { this.liveAssistant = this.addBubble('assistant'); this.liveText = ''; }\n        this.liveText += ev.delta;\n        this.liveAssistant.textContent = this.liveText;   // plain while streaming; markdown on finalise\n        break;\n      case 'thinking': break;\n      case 'tool:start':\n        this.finalizeLive();\n        this.toolBlock(ev.callId, ev.name, ev.input);\n        break;\n      case 'tool:stdout':\n      case 'tool:stderr': {\n        const box = this.liveTools.get(ev.callId);\n        if (box) box.appendChild(document.createTextNode(ev.chunk));\n        break;\n      }\n      case 'tool:end':\n        this.toolResult(ev.callId, ev.result, ev.isError);\n        break;\n      case 'error':\n        this.bubble('assistant', `[error] ${ev.error}`).classList.add('mb-err');\n        break;\n      case 'aborted':\n        this.bubble('assistant', `[aborted: ${ev.reason}]`).classList.add('mb-err');\n        break;\n      default: break;\n    }\n    this.scroll();\n  }\n\n  // ── interactive prompt (ask_user, plugin confirm, store-key) ────────────────\n    promptFn = ((arg, def) => {\n    const field = typeof arg === 'string'\n      ? { name: 'q', label: arg, type: 'text', ...(def !== undefined ? { default: def } : {}) }\n      : arg;\n    return this.renderPrompt(field);\n  }) ;\n\n   renderPrompt(field) {\n    return new Promise((resolve, reject) => {\n      const box = el('div', 'mb-prompt');\n      box.appendChild(el('div', 'mb-q', field.label));\n      const cancelable = field.cancelable !== false;\n\n      const done = (value) => { box.remove(); resolve(value); };\n      const cancel = () => { box.remove(); reject(promptCancelledError()); };\n\n      if (field.type === 'confirm') {\n        const opts = el('div', 'mb-opts');\n        const yes = el('button', undefined, 'Yes'); yes.addEventListener('click', () => done('yes'));\n        const no  = el('button', undefined, 'No');  no.addEventListener('click', () => done('no'));\n        opts.append(yes, no);\n        box.appendChild(opts);\n      } else if (field.type === 'select') {\n        const opts = el('div', 'mb-opts');\n        for (const option of field.options ?? []) {\n          const b = el('button', undefined, option);\n          b.addEventListener('click', () => done(option));\n          opts.appendChild(b);\n        }\n        box.appendChild(opts);\n        if (field.allowOther) box.appendChild(this.freeText(done, 'Other…'));\n      } else {\n        box.appendChild(this.freeText(done, field.type === 'password' ? '••••••' : '', field.type === 'password', field.default));\n      }\n\n      if (cancelable) {\n        const c = el('button', undefined, 'Cancel');\n        c.addEventListener('click', cancel);\n        box.appendChild(c);\n      }\n      this.msgs.appendChild(box);\n      this.scroll();\n    });\n  }\n\n   freeText(done, placeholder, password = false, def) {\n    const wrap  = el('div', 'mb-opts');\n    const input = el('input');\n    input.type = password ? 'password' : 'text';\n    input.placeholder = placeholder;\n    if (def !== undefined) input.value = def;\n    const submit = el('button', undefined, 'OK');\n    const go = () => done(input.value);\n    submit.addEventListener('click', go);\n    input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); go(); } });\n    wrap.append(input, submit);\n    return wrap;\n  }\n}\n\nfunction safeJson(v) {\n  try {\n    const s = typeof v === 'string' ? v : JSON.stringify(v);\n    return s.length > 600 ? s.slice(0, 600) + '…' : s;\n  } catch { return String(v); }\n}\n",
    "/plugins/sessions/src/tools.ts": "\nimport { lastActivityAt, StoreQueryError } from '@matatbread/matbot-plugin-api';\nimport { compileFilter, applySort, validateQuery, decodeCursor, encodeCursor, } from '@matatbread/matbot-core/storage-base';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nfunction sessionPreview(session) {\n  const first = session.messages.find(m => m.role === 'user');\n  const text  = first?.content.find(\n    (c) => c.type === 'text',\n  )?.text ?? '';\n  return text.length > 60 ? `${text.slice(0, 60)}…` : text;\n}\n\nfunction toSummary(s) {\n  return { id: s.id, title: s.title, preview: sessionPreview(s), updatedAt: s.updatedAt };\n}\n\n// Synthesized, lowercased \"columns\" holding the conversation text per authorship role — matbot's\n// pretend fields for the query grammar, since the real text is buried in messages[].content[].\n// Only `type:'text'` blocks count; tool calls/results, thinking, images and markers are dropped as noise.\nfunction synthRoles(s) {\n  let user = '', assistant = '';\n  for (const m of s.messages) {\n    if (m.role !== 'user' && m.role !== 'assistant') continue;\n    for (const c of m.content) {\n      if (c.type !== 'text') continue;\n      if (m.role === 'user') user      += (user      ? '\\n' : '') + c.text;\n      else                   assistant += (assistant ? '\\n' : '') + c.text;\n    }\n  }\n  return { user: user.toLowerCase(), assistant: assistant.toLowerCase() };\n}\n\n// Case-insensitive match over the synthesized fields: they are stored lowercased, so lowercase the\n// operand of any `stringContains` that targets one (recursing through and/or/not). Real stored fields\n// (status/title/…) keep exact semantics — we only touch `user`/`assistant`.\nconst SYNTH_FIELDS = new Set(['user', 'assistant']);\nfunction oneKey(field) {\n  const segs = Array.isArray(field) ? field : [field];\n  return segs.length === 1 ? segs[0] : undefined;\n}\nfunction lowerSynthOperands(f) {\n  switch (f.op) {\n    case 'and':\n    case 'or':  return { op: f.op, clauses: f.clauses.map(lowerSynthOperands) };\n    case 'not': return { op: 'not', clause: lowerSynthOperands(f.clause) };\n    case 'stringContains':\n      return SYNTH_FIELDS.has(oneKey(f.field) ?? '') ? { ...f, value: f.value.toLowerCase() } : f;\n    default:    return f;\n  }\n}\n\nexport function makeSessionTools(store) {\n  return [makeSessionActionTool(store)];\n}\n\n// The precise per-action contract. JSON Schema can't express \"title required only for rename\"\n// without an awkward oneOf, so the schema stays loose and the description carries this TypeScript\n// discriminated union — which LLMs read accurately — as the source of truth. The executor enforces it.\n\n\n\n\n\n\n\n\nfunction makeSessionActionTool(store) {\n  return {\n    name: 'session_action',\n    description:\n      'Manage conversation sessions. A session is a stored conversation — a chronological list of ' +\n      'messages identified by a unique ID, with a title and a status (active or archived). This tool ' +\n      'covers the lifecycle: list sessions, search their contents (query), fetch one in full (get), ' +\n      'rename one, hide (archive) one, or unhide (unarchive) one.\\n\\n' +\n      '\"list\" and \"query\" return lightweight summaries — each item\\'s \"preview\" is just the session\\'s ' +\n      'first user message truncated to 60 characters (empty if it has no text), a display label, not a ' +\n      'summary of the conversation. To read a session\\'s contents, use \"get\".\\n\\n' +\n      '\"query\" searches with the store query grammar. Two synthesized string fields hold the conversation ' +\n      'text and are matched case-insensitively: \"user\" (everything the user said) and \"assistant\" ' +\n      '(everything the assistant said) — e.g. sessions where the user mentioned invoices: ' +\n      '{ where: { op: \"stringContains\", field: \"user\", value: \"invoice\" } }. Search both sides by OR-ing ' +\n      'a clause on each field. The stored fields \"status\", \"title\", \"createdAt\" and \"updatedAt\" are also ' +\n      'queryable (eq/neq/in/lt/lte/gt/gte/exists), combinable with and/or/not. Optional \"sort\" (stored ' +\n      'fields only, e.g. [{ field: \"updatedAt\", dir: \"desc\" }]), \"limit\" (the search early-exits once this ' +\n      'many match), and \"cursor\" (from a previous result) paginate.',\n    inputSchema: {\n      type:       'object',\n      required:   ['action'],\n      properties: {\n        action:          { type: 'string', enum: ['list', 'query', 'get', 'rename', 'hide', 'unhide'], description: 'The operation to perform.' },\n        sessionId:       { type: 'string', description: 'ID of the target session. Required for get/rename/hide/unhide.' },\n        title:           { type: 'string', description: 'New title — required for action \"rename\".' },\n        includeArchived: { type: 'boolean', description: 'list only: include archived sessions. Default false.' },\n        where:           { type: 'object', description: 'query only: a store-query Filter over \"user\"/\"assistant\" (session text) and stored fields. See description.' },\n        sort:            { type: 'array',  description: 'query only: SortSpec[] over stored fields, e.g. [{ \"field\": \"updatedAt\", \"dir\": \"desc\" }].' },\n        limit:           { type: 'number', description: 'query only: max results — the search early-exits once this many match.' },\n        cursor:          { type: 'string', description: 'query only: opaque cursor from a previous query result, for the next page.' },\n      },\n    },\n    executor: {\n      async *execute(input, _ctx) {\n        const args = input ;\n\n        switch (args.action) {\n          case 'list': {\n            const { includeArchived } = args ;\n            const { items } = await store.query(\n              includeArchived ? {} : { where: { op: 'neq', field: 'status', value: 'archived' } },\n            );\n            const sorted = items.slice().sort((a, b) => b.updatedAt.localeCompare(a.updatedAt));\n            yield { type: 'result', value: sorted.map(toSummary) };\n            return;\n          }\n\n          case 'query': {\n            const { where, sort, limit, cursor } = args ;\n\n            // A cursor fully determines its page (its `where` was already normalized when encoded);\n            // otherwise take the caller's clauses, lowercasing synth-field operands for case-insensitivity.\n            let page;\n            try {\n              if (cursor !== undefined) {\n                page = decodeCursor(cursor);\n                validateQuery({\n                  ...(page.where !== undefined ? { where: page.where } : {}),\n                  ...(page.sort  !== undefined ? { sort:  page.sort  } : {}),\n                  ...(page.limit !== undefined ? { limit: page.limit } : {}),\n                });\n              } else {\n                const q = {\n                  ...(where !== undefined ? { where: lowerSynthOperands(where) } : {}),\n                  ...(sort  !== undefined ? { sort  } : {}),\n                  ...(limit !== undefined ? { limit } : {}),\n                };\n                validateQuery(q);\n                page = {\n                  offset: 0,\n                  ...(q.where !== undefined ? { where: q.where } : {}),\n                  ...(q.sort  !== undefined ? { sort:  q.sort  } : {}),\n                  ...(q.limit !== undefined ? { limit: q.limit } : {}),\n                };\n              }\n            } catch (e) {\n              if (e instanceof StoreQueryError) { yield { type: 'error', message: `${e.message} (at ${e.pointer})` }; return; }\n              throw e;\n            }\n\n            const { items } = await store.query({});\n            const ordered   = applySort(items, page.sort);   // stored-field ordering, before any text synthesis\n            const match     = page.where !== undefined ? compileFilter(page.where) : () => true;\n\n            // The for-loop with the early break: synthesize + test one session at a time and stop the\n            // moment the page is full, so a low `limit` over hundreds of sessions never searches the tail.\n            const rows = [];\n            let matched = 0;\n            for (const s of ordered) {\n              if (page.limit !== undefined && rows.length >= page.limit) break;\n              if (!match({ ...s, ...synthRoles(s) })) continue;\n              if (matched++ >= page.offset) rows.push(toSummary(s));\n            }\n\n            // Optimistic cursor: emitted whenever the page filled, so the next page may be empty — the\n            // price of early-exit (we don't scan on to confirm a further match exists). `total` is omitted\n            // for the same reason: we never counted the tail.\n            const nextPage = (page.limit !== undefined && rows.length >= page.limit)\n              ? { cursor: encodeCursor({ ...page, offset: page.offset + page.limit }) }\n              : {};\n            yield { type: 'result', value: { items: rows, ...nextPage } };\n            return;\n          }\n\n          case 'get': {\n            const { sessionId } = args ;\n            if (!sessionId) { yield { type: 'error', message: 'action \"get\" requires \"sessionId\".' }; return; }\n            // Pure committed history. Pending submissions and the in-progress response are the live\n            // \"delta\" delivered over the runner's event stream, never overlaid onto stored state.\n            const session = await store.get(sessionId);\n            if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n            yield { type: 'result', value: session };\n            return;\n          }\n\n          case 'rename': {\n            const { sessionId, title } = args ;\n            if (!sessionId) { yield { type: 'error', message: 'action \"rename\" requires \"sessionId\".' }; return; }\n            if (title === undefined) { yield { type: 'error', message: 'action \"rename\" requires \"title\".' }; return; }\n            const session = await store.get(sessionId);\n            if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n            // Rename is a metadata edit, not conversational activity: keep updatedAt on the last message\n            // (the lastActivityAt invariant) so renaming doesn't float the session up a recency-sorted list.\n            const next = { ...session, title, version: crypto.randomUUID(), updatedAt: lastActivityAt(session) };\n            const res  = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { id: sessionId, title } };\n            return;\n          }\n\n          case 'hide': {\n            const { sessionId } = args ;\n            if (!sessionId) { yield { type: 'error', message: 'action \"hide\" requires \"sessionId\".' }; return; }\n            const session = await store.get(sessionId);\n            if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n            // Archiving is a status edit, not conversational activity — preserve updatedAt (lastActivityAt).\n            const next = { ...session, status: 'archived' , version: crypto.randomUUID(), updatedAt: lastActivityAt(session) };\n            const res  = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { id: sessionId, status: 'archived' } };\n            return;\n          }\n\n          case 'unhide': {\n            const { sessionId } = args ;\n            if (!sessionId) { yield { type: 'error', message: 'action \"unhide\" requires \"sessionId\".' }; return; }\n            const session = await store.get(sessionId);\n            if (!session) { yield { type: 'error', message: `Session \"${sessionId}\" not found.` }; return; }\n            // Unarchiving is a status edit, not conversational activity — preserve updatedAt (lastActivityAt).\n            const next = { ...session, status: 'active' , version: crypto.randomUUID(), updatedAt: lastActivityAt(session) };\n            const res  = await store.cas(sessionId, session.version, next);\n            if (!res.ok) { yield { type: 'error', message: 'Concurrent modification — please retry.' }; return; }\n            yield { type: 'result', value: { id: sessionId, status: 'active' } };\n            return;\n          }\n\n          default:\n            yield { type: 'error', message: `Unknown action \"${String(args.action)}\". Expected one of: list, query, get, rename, hide, unhide.` };\n        }\n      },\n    },\n  };\n}\n",
    "/plugins/edit-session/src/compact-sessions.ts": "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nimport { lastActivityAt } from '@matatbread/matbot-plugin-api';\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/** Content types preserved through compaction (everything else — tool-call, tool-result, thinking,\n *  thinking-redacted, reasoning, image, document, audio — is stripped). Must match the set used by\n *  the `session_edit` tool's `compact` action so behaviour is identical regardless of which code\n *  path performs the compaction. */\nconst KEEP_TYPES = new Set(['text', 'refusal', 'marker']);\n\n\n\n\n\n\n// ── helpers ───────────────────────────────────────────────────────────────────\n\nfunction compactMessages(messages, msgIndex) {\n  // msgIndex < 0 is an offset from the end (like JS Array.slice)\n  const idx = msgIndex < 0 ? messages.length + msgIndex : msgIndex;\n  if (idx <= 0) return { messages, stripped: 0 };\n\n  let stripped = 0;\n  const compacted = messages.map((m, i) => {\n    if (i >= idx) return m;                           // past the cutoff — untouched\n    const filtered = m.content.filter(c => KEEP_TYPES.has(c.type));\n    if (filtered.length === m.content.length) return m; // nothing to strip\n    stripped++;\n    return { ...m, content: filtered };\n  });\n  return { messages: compacted, stripped };\n}\n\n// ── tool factory ──────────────────────────────────────────────────────────────\n\nconst compactSessionDefaults = { activeMessages: 10, inactiveDays: 28 };\nexport function makeCompactSessionsTool(store) {\n  const executor = {\n    async *execute(input, ctx) {\n      const currentSessionId = ctx.session.id;\n      const compacted = [];\n      const skipped = [];\n      let cursor;\n      let totalExamined = 0;\n      let pagesLoaded = 0;\n\n      if (!input) input = compactSessionDefaults;\n      else {\n        if (typeof input.inactiveDays !== 'number')\n          input.inactiveDays = compactSessionDefaults.inactiveDays;\n        if (typeof input.activeMessages !== 'number')\n          input.activeMessages = compactSessionDefaults.activeMessages;\n      }\n\n      const inactiveTimestamp = input.inactiveDays * 24 * 60 * 60 * 1000;\n\n      function isInactiveSession(updatedAt) {\n        const then = new Date(updatedAt).getTime();\n        return Date.now() - then >= inactiveTimestamp;\n      }\n\n      do {\n        const page = await store.query({ cursor, limit: 100 });\n        cursor = page.cursor;\n        pagesLoaded++;\n\n        for (const session of page.items) {\n          totalExamined++;\n\n          // Never compact the session this tool is being called from\n          if (session.id === currentSessionId) {\n            skipped.push({ sessionId: session.id, title: session.title ?? '', reason: 'current session' });\n            continue;\n          }\n\n          // Re-read via get() so the CAS below uses a fresh version — the query result may be stale\n          const current = await store.get(session.id);\n          if (!current) {\n            skipped.push({ sessionId: session.id, title: session.title ?? '', reason: 'deleted before compaction' });\n            continue;\n          }\n\n          // ── Tier 1 — full compact ──\n          if (current.status === 'archived' || isInactiveSession(current.updatedAt)) {\n            const { messages, stripped } = compactMessages(current.messages, -1);\n            if (stripped === 0) {\n              skipped.push({ sessionId: current.id, title: current.title ?? '', reason: 'nothing to strip' });\n              continue;\n            }\n            const next = { ...current, messages, updatedAt: lastActivityAt({ ...current, messages }) };\n            const res = await store.cas(current.id, current.version, { ...next, version: crypto.randomUUID() });\n            if (!res.ok) {\n              skipped.push({ sessionId: current.id, title: current.title ?? '', reason: 'concurrent modification' });\n              continue;\n            }\n            compacted.push({ sessionId: current.id, title: current.title ?? '', tier: 'full', messagesStripped: stripped });\n            continue;\n          }\n\n          // ── Tier 2 — partial compact ──\n          if (current.messages.length > input.activeMessages * 2) {\n            const { messages, stripped } = compactMessages(current.messages, -input.activeMessages);\n            if (stripped === 0) {\n              skipped.push({ sessionId: current.id, title: current.title ?? '', reason: 'nothing to strip' });\n              continue;\n            }\n            const next = { ...current, messages, updatedAt: lastActivityAt({ ...current, messages }) };\n            const res = await store.cas(current.id, current.version, { ...next, version: crypto.randomUUID() });\n            if (!res.ok) {\n              skipped.push({ sessionId: current.id, title: current.title ?? '', reason: 'concurrent modification' });\n              continue;\n            }\n            compacted.push({ sessionId: current.id, title: current.title ?? '', tier: 'partial', messagesStripped: stripped });\n            continue;\n          }\n\n          skipped.push({ sessionId: current.id, title: current.title ?? '', reason: 'below thresholds' });\n        }\n\n        yield { type: 'progress', pct: cursor ? Math.round((totalExamined / (page.total ?? 1)) * 100) : 100, message: `Examined ${totalExamined} sessions, compacted ${compacted.length}` };\n      } while (cursor);\n\n      yield { type: 'result', value: { examined: totalExamined, pages: pagesLoaded, compacted, skipped } };\n    },\n  };\n\n  return {\n    name: 'compact_sessions',\n    description:\n`Apply the session compaction policy to the entire session store. Note: this should always be user-initiated\nor set up as a background task. Do not use this tool to compact a specific session, use \\`session_edit({ action: \"compact\", ...})\\`\n\nTwo tiers:\n  Tier 1 — Full compact: sessions that are archived OR untouched for >28 days.\n    Strips all tool calls, tool results, and thinking blocks from every message.\n  Tier 2 — Partial compact: active sessions with >20 messages, keeping the last 10 intact.\n    Strips tool calls / tool results / thinking from all earlier messages.\nThe current session is never touched. Idempotent — safe to run on a schedule.\nReturns a summary of what was compacted and skipped.`,\n    inputSchema: {\n      type: 'object',\n      properties: {\n        inactiveDays:  { type: 'number', description: 'Optional threshold for full compact of old sessions. Default 28' },\n        activeMessages:  { type: 'number', description: 'Optional number of messages at the head of the session to NOT compact for recent sessions. Default 10' },\n      },\n      additionalProperties: false,\n    },\n    executor,\n  };\n}\n",
    "/plugins/rumsfeld/src/plugin.ts": "import { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\n\n\n\n\n\n\n\nexport function createRumsfeldPlugin() {\n  return {\n    apiVersion: PLUGIN_API_VERSION,\n\n    async setup(services) {\n      const executor = {\n        async *execute(input, ctx) {\n          const { terms } = input ;\n\n          if (terms.length === 0) {\n            yield { type: 'error', message: 'No search terms provided.' };\n            return;\n          }\n\n          const results = await services.KnowledgeIndex.search(terms, ctx.signal);\n\n          if (results.length === 0) {\n            yield { type: 'error', message: 'There is no skill available for the requested operation.' };\n            return;\n          }\n\n          const best = results[0];\n          yield { type: 'result', value: { name: best.entities[0] ?? best.id, content: best.content } };\n        },\n      };\n\n      services.tools.register({\n        name:        'contextual_search',\n        description: `Load context for an unknown concept, system, term, or entity — returns a whole knowledge document to read.\n\n      For a single specific fact (a city, a URL, a date) rather than a document, use find_fact instead.\n\n      Examples:\n        - Is <unknown> currently working?\n        - Tell me about <unknown>'s <unknown>.\n        - Use your skill about <unknown>.\n        - <unknown> said to <unknown> that <unknown> is broken.\n        - The <unknown> is arriving for <unknown>'s birthday.\n\n      Use when you encounter an \"unknown\" concept, system, term, entity, person or domain you lack specific context about — a named system you haven't\n      been trained on, user-specific preferences, personal information, a specialised topic or other subject the user assumes you know about.\n\n      Use this tool early and as a higher priority than external searches as it is more likely to yield domain specific results than a general search.\n      Use this tool in preference to guessing, hallucinating, confabulating or making assumptions about what the unknown term might refer to.\n      Only ask for more information about the unknown term if you have already tried to find context using the term as a search query, and that search did not return any relevant results.\n\n      Markers of \"unknown\" terms are:\n      - use of definite articles, demonstratives or possessives (\"the\", \"my\", \"his\", \"that\", \"Fred's\") even if the noun is common, for example \"my Volvo\" isn't a reference to Volvo's in general, it's about the user's specific car which they assume you have information about.\n      - words that are clearly novel proper nouns or nouns used in a non-standard or domain-specific way, for example \"the Xmit system\" or \"What does Xmit say?\".\n      - when the user directly uses the term 'skill' in their query, for example \"Use your skill about <unknown> to do <unknown>\".\n      - Deictic words such as \"here\", \"there\", \"the other one\", \"home\" which imply contextual knowledge, but none was present.\n\n      Each term must be SPECIFIC enough to identify a particular thing — a proper noun, a named system, or a personal identifier. Strip qualifiers from a named entity (\"my Volvo\" → \"Volvo\"; \"Fred's car\" → \"Fred\" and \"car\" as separate terms), but do NOT collapse a query down to a bare generic noun: searching a common word like \"location\", \"weather\" or \"car\" on its own matches any document that merely discusses that topic — including procedures about it — rather than the specific fact you need.\n      When the unknown is deictic or self-referential — \"here\", \"home\", \"where am I?\", \"my location\" — the thing you actually lack context about is the USER, not the common noun. Search for the user's own identifier (their name if you know it, otherwise terms like \"user\", \"profile\", \"home\") so you retrieve their stored personal facts, not material that merely mentions the concept.\n      Always include the contextual phrase or sentence each term was mentioned in.`,\n        inputSchema: {\n          type:     'object',\n          required: ['terms'],\n          properties: {\n            terms: {\n              type:  'array',\n              items: {\n                type:        'object',\n                properties:  {\n                  term:    { type: 'string' },\n                  context: { type: 'string' },\n                },\n                description: 'A list of unknown concepts, systems, terms, entities or domains and their immediate context.',\n              },\n            },\n          },\n        },\n        executor,\n      });\n\n      const findFactExecutor = {\n        async *execute(input, ctx) {\n          const { question, terms, provider: explicitProvider } =\n            input ;\n\n          if (!question || typeof question !== 'string') {\n            yield { type: 'error', message: 'Parameter \"question\" (the specific fact you want) is required.' };\n            return;\n          }\n          if (!Array.isArray(terms) || terms.length === 0) {\n            yield { type: 'error', message: 'Parameter \"terms\" (search keys locating the fact) is required.' };\n            return;\n          }\n\n          // Prefer the caller's provider; fall back to any configured one so a tool that invokes\n          // find_fact without threading ctx.provider still works rather than hard-failing.\n          const provider = explicitProvider || ctx.provider || [...services.providers.keys()][0];\n          if (!provider) {\n            yield { type: 'error', message: 'No provider configured to extract the fact.' };\n            return;\n          }\n\n          const results = await services.KnowledgeIndex.search(terms, ctx.signal);\n          if (results.length === 0) {\n            yield { type: 'result', value: null };\n            return;\n          }\n\n          // Read across the top matches, not just the best one: the fact may live in a lower-ranked\n          // entry (the user's profile can rank below a how-to that merely mentions the topic). Cap the\n          // count and per-entry length so the extraction prompt stays bounded.\n          const considered = results.slice(0, 5);\n          const knowledgeEntries = considered\n            .map(e => `## ${e.entities[0] ?? e.id}\\n${e.content.slice(0, 6000)}`)\n            .join('\\n\\n');\n\n          yield { type: 'progress', pct: 50, message: `Reading ${considered.length} source(s)...` };\n\n          const res = await services.singleTurn({\n            provider,\n            system: `Answer the specific question below using ONLY the supplied knowledge entries.\nExtract the precise fact or facts that answers the question. Multiple answers are permitted. If the supplied entries do not contain it, return \\`null\\` for the result.\nNever guess, infer, or fall back on outside knowledge to answer the question - the source of the answer must be in the supplied entries.\nReply with JSON only, no prose: {\"result\": Array<{\"fact\": string, \"source\": string}> | null}\n\"fact\" contains only the concise answer, not any surrounding text or context - only the fact that answers the question.\n\"source\" is the heading of the entry it came from.`,\n            prompt: `Question: ${question}\\n\\n--- KNOWLEDGE ENTRIES ---\\n${knowledgeEntries}\\n--- END KNOWLEDGE ENTRIES ---`,\n            signal: ctx.signal,\n          });\n\n          try {\n            const m = res.text.match(/\\{[\\s\\S]*\\}/);\n            const parsed = m ? JSON.parse(m[0])  : null;\n            if (parsed?.result?.length) {\n              yield {\n                type: 'result',\n                value: parsed.result.map(e => e.fact)\n              };\n              return;\n            }\n          } catch { /* unparseable — treat as not found */ }\n\n          yield { type: 'result', value: null };\n          return ;\n        },\n      };\n\n      services.tools.register({\n        name: 'find_fact',\n        description: `Retrieve a fact from stored knowledge — whatever the knowledge index happens to hold. Its contents are open-ended: personal details, a system's URL, a configured threshold, someone's birthday, domain-specific knowledge — or anything else that has been stored. Whenever a request turns on some fact that might be recorded, this can likely answer it.\n\nUse this, not contextual_search, when you want the precise answer rather than a whole document to read. It searches the index, reads across the best matches (the fact may not be in the top-ranked entry), and returns just the answers as an array of strings — or null if the knowledge doesn't contain it. It never invents an answer.\n\nProvide \"question\" (the fact sought, e.g. \"the user's home city\") and \"terms\" (specific search keys that locate it — proper nouns, named systems, or personal identifiers; for a personal or deictic fact, search the user's name or \"user\"/\"profile\", not a bare generic noun). Returns string[] or null`,\n        inputSchema: {\n          type: 'object',\n          required: ['question', 'terms'],\n          properties: {\n            question: { type: 'string', description: 'The specific fact you need, phrased as a question or noun phrase.' },\n            terms: {\n              type: 'array',\n              items: { type: 'object', properties: { term: { type: 'string' }, context: { type: 'string' } } },\n              description: 'Specific search keys locating the fact, each with the phrase it was mentioned in.',\n            },\n            provider: { type: 'string', description: 'Optional extraction provider. Defaults to the turn provider.' },\n          },\n        },\n        executor: findFactExecutor,\n      });\n    },\n  };\n}\n\nexport const plugin = createRumsfeldPlugin();\n",
    "/plugins/providers/anthropic/src/adapter.ts": "\nimport { parseSSE } from '@matatbread/matbot-core/providers-base';\nimport { toAnthropicMessages, toAnthropicSystem, toAnthropicTools } from './convert.js';\n\nconst DEFAULT_ENDPOINT   = 'https://api.anthropic.com';\nconst ANTHROPIC_VERSION  = '2023-06-01';\nconst DEFAULT_MAX_TOKENS = 4096;\n\n// Minimal shapes for Anthropic SSE events — enough to drive CompletionEvent\n\n\nexport class AnthropicAdapter  {\n   name = 'anthropic';\n\n  complete(\n    messages,\n    config,\n    tools,\n    signal,\n  ) {\n    return this.stream(messages, config, tools, signal);\n  }\n\n   async *stream(\n    messages,\n    config,\n    tools,\n    signal,\n  ) {\n    const endpoint = config.endpoint ?? DEFAULT_ENDPOINT;\n    const apiKey   = config.credentials?.['apiKey'] ?? '';\n\n    const body = {\n      model:      config.model,\n      max_tokens: config.parameters?.maxTokens ?? DEFAULT_MAX_TOKENS,\n      messages:   toAnthropicMessages(messages),\n      stream:     true,\n    };\n\n    const system = toAnthropicSystem(messages);\n    if (system) body['system'] = system;\n\n    const toolDefs = toAnthropicTools(tools);\n    if (toolDefs.length > 0) body['tools'] = toolDefs;\n\n    if (config.parameters?.temperature !== undefined) {\n      body['temperature'] = config.parameters.temperature;\n    }\n\n    const headers = {\n      'content-type':     'application/json',\n      'x-api-key':        apiKey,\n      'anthropic-version': ANTHROPIC_VERSION,\n    };\n\n    // Enable extended thinking + prompt caching betas if requested\n    const betas = ['prompt-caching-2024-07-31'];\n    if (config.parameters?.['thinking']) betas.push('interleaved-thinking-2025-05-14');\n    headers['anthropic-beta'] = betas.join(',');\n\n    const res = await fetch(`${endpoint}/v1/messages`, {\n      method: 'POST',\n      headers,\n      body:   JSON.stringify(body),\n      signal,\n    });\n\n    if (!res.ok || !res.body) {\n      const text = await res.text().catch(() => res.statusText);\n      throw new Error(`Anthropic ${res.status}: ${text}`);\n    }\n\n    // Accumulate content block state per index\n    const toolInputs      = new Map();\n    const thinkingBlocks  = new Map();\n    const redactedBlocks  = new Map();\n    const unknownBlocks   = new Map();\n    let inputTokens = 0;\n    let stopReason;\n    // A tool_use block whose argument JSON failed to parse — almost always because the response\n    // was truncated mid-stream (e.g. max_tokens). Surfaced as a hard error at message_stop rather\n    // than silently delivering `{}` to the tool, which crashes downstream with no diagnostic.\n    let truncatedTool;\n\n    for await (const line of parseSSE(res.body)) {\n      let ev;\n      try { ev = JSON.parse(line) ; } catch { continue; }\n\n      switch (ev['type']) {\n        case 'message_start': {\n          const usage = (ev['message'] )?.usage;\n          if (usage?.input_tokens) {\n            inputTokens = usage.input_tokens;\n            yield {\n              type: 'usage', inputTokens, outputTokens: 0,\n              ...(usage.cache_read_input_tokens     ? { cacheReadTokens:     usage.cache_read_input_tokens     } : {}),\n              ...(usage.cache_creation_input_tokens ? { cacheCreationTokens: usage.cache_creation_input_tokens } : {}),\n            };\n          }\n          break;\n        }\n\n        case 'content_block_start': {\n          const idx   = ev['index'] ;\n          const block = ev['content_block'] ;\n          if (block.type === 'tool_use') {\n            toolInputs.set(idx, { id: block.id ?? '', name: block.name ?? '', json: '' });\n          } else if (block.type === 'thinking') {\n            thinkingBlocks.set(idx, { thinking: '', signature: '' });\n          } else if (block.type === 'redacted_thinking') {\n            redactedBlocks.set(idx, { data: block.data ?? '' });\n          } else if (block.type !== 'text') {\n            unknownBlocks.set(idx, { blockType: block.type, raw: ev['content_block'] });\n          }\n          break;\n        }\n\n        case 'content_block_delta': {\n          const idx   = ev['index'] ;\n          const delta = ev['delta'] ;\n          if (delta.type === 'text_delta' && delta.text) {\n            yield { type: 'text-delta', delta: delta.text };\n          } else if (delta.type === 'input_json_delta' && delta.partial_json) {\n            const call = toolInputs.get(idx);\n            if (call) call.json += delta.partial_json;\n          } else if (delta.type === 'thinking_delta' && delta.thinking) {\n            yield { type: 'thinking', delta: delta.thinking };\n            const tb = thinkingBlocks.get(idx);\n            if (tb) tb.thinking += delta.thinking;\n          } else if (delta.type === 'signature_delta' && delta.signature) {\n            const tb = thinkingBlocks.get(idx);\n            if (tb) tb.signature = delta.signature;\n          }\n          break;\n        }\n\n        case 'content_block_stop': {\n          const idx  = ev['index'] ;\n          const call = toolInputs.get(idx);\n          if (call) {\n            try {\n              yield { type: 'tool-call', id: call.id, name: call.name, input: JSON.parse(call.json || '{}') };\n            } catch {\n              truncatedTool ??= { name: call.name, bytes: call.json.length };\n            }\n            toolInputs.delete(idx);\n          }\n          const tb = thinkingBlocks.get(idx);\n          if (tb) {\n            yield { type: 'thinking-block', thinking: tb.thinking, signature: tb.signature };\n            thinkingBlocks.delete(idx);\n          }\n          const rb = redactedBlocks.get(idx);\n          if (rb) {\n            yield { type: 'redacted-thinking', data: rb.data };\n            redactedBlocks.delete(idx);\n          }\n          const ub = unknownBlocks.get(idx);\n          if (ub) {\n            yield { type: 'unknown-block', blockType: ub.blockType, raw: ub.raw };\n            unknownBlocks.delete(idx);\n          }\n          break;\n        }\n\n        case 'message_delta': {\n          const stop = (ev['delta'] )?.stop_reason;\n          if (stop) stopReason = stop;\n          const usage = (ev['usage'] );\n          if (usage?.output_tokens) {\n            yield { type: 'usage', inputTokens: 0, outputTokens: usage.output_tokens };\n          }\n          break;\n        }\n\n        case 'message_stop': {\n          // Flush any tool block the stream left open (truncation can end the response before\n          // content_block_stop). A complete-but-unclosed block still parses; an incomplete one\n          // is recorded as truncated.\n          for (const [, call] of toolInputs) {\n            try {\n              yield { type: 'tool-call', id: call.id, name: call.name, input: JSON.parse(call.json || '{}') };\n            } catch {\n              truncatedTool ??= { name: call.name, bytes: call.json.length };\n            }\n          }\n          toolInputs.clear();\n          if (truncatedTool) {\n            throw new Error(\n              `Tool \"${truncatedTool.name}\" arguments could not be parsed — ${truncatedTool.bytes} bytes received` +\n              `${stopReason ? `, stop_reason \"${stopReason}\"` : ''}. ` +\n              (stopReason === 'max_tokens'\n                ? 'The response hit the token limit mid tool-call; increase the provider\\'s maxTokens.'\n                : 'The provider returned malformed tool arguments.'),\n            );\n          }\n          yield { type: 'done' };\n          break;\n        }\n\n        case 'error': {\n          const err = ev['error'] ;\n          throw new Error(`Anthropic stream error: ${err?.message ?? JSON.stringify(ev)}`);\n        }\n      }\n    }\n  }\n\n  async health() {\n    // Lightweight check — just verify credentials key is present\n    return { status: 'ok', latencyMs: 0 };\n  }\n}\n",
    "/plugins/providers/openai-compat/src/adapter.ts": "\nimport { parseSSE } from '@matatbread/matbot-core/providers-base';\nimport { toOAIMessages, toOAITools } from './convert.js';\n\nconst DEFAULT_ENDPOINT   = 'https://api.openai.com/v1/chat/completions';\nconst DEFAULT_MAX_TOKENS = 4096;\n\n// OpenAI renamed `max_tokens` → `max_completion_tokens` for its newer models. The two are mutually\n// exclusive — OpenAI returns 400 if both are present — and the o-series / gpt-5 / 4o models reject\n// the legacy name outright. The rest of the compat ecosystem (DeepSeek, vLLM, llama.cpp, ollama,\n// legacy gpt-4/3.5) still wants `max_tokens`; DeepSeek in particular *silently ignores*\n// `max_completion_tokens`, leaving the cap unenforced. So the field is chosen per model, with an\n// explicit `tokenLimitParam` override for names this heuristic can't anticipate.\nfunction tokenLimitParam(config) {\n  const override = config.parameters?.['tokenLimitParam'];\n  if (override === 'max_tokens' || override === 'max_completion_tokens') return override;\n  const m = config.model.toLowerCase();\n  return /^o\\d/.test(m) || m.startsWith('gpt-5') || m.includes('4o')\n    ? 'max_completion_tokens'\n    : 'max_tokens';\n}\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nexport class OpenAICompatAdapter  {\n   name;\n\n  constructor(name = 'openai-compat') {\n    this.name = name;\n  }\n\n  complete(\n    messages,\n    config,\n    tools,\n    signal,\n  ) {\n    return this.stream(messages, config, tools, signal);\n  }\n\n   async *stream(\n    messages,\n    config,\n    tools,\n    signal,\n  ) {\n    const endpoint = config.endpoint ?? DEFAULT_ENDPOINT;\n    const apiKey   = config.credentials?.['apiKey'] ?? '';\n    // Opt-in prompt caching (Anthropic-style breakpoints, e.g. via OpenRouter). Off by default so a\n    // plain OpenAI / ollama endpoint never receives `cache_control` it can't parse.\n    const cache    = config.parameters?.['promptCache'] === true;\n\n    const body = {\n      model:    config.model,\n      [tokenLimitParam(config)]: config.parameters?.maxTokens ?? DEFAULT_MAX_TOKENS,\n      messages:       toOAIMessages(messages, cache),\n      stream:         true,\n      stream_options: { include_usage: true },\n    };\n\n    const toolDefs = toOAITools(tools, cache);\n    if (toolDefs.length > 0) body['tools'] = toolDefs;\n\n    if (config.parameters?.temperature !== undefined) {\n      body['temperature'] = config.parameters.temperature;\n    }\n\n    const res = await fetch(endpoint, {\n      method:  'POST',\n      headers: {\n        'content-type':  'application/json',\n        'authorization': `Bearer ${apiKey}`,\n        ...(config.credentials?.['organization']\n          ? { 'openai-organization': config.credentials?.['organization'] }\n          : {}),\n      },\n      body:   JSON.stringify(body),\n      signal,\n    });\n\n    if (!res.ok || !res.body) {\n      const text = await res.text().catch(() => res.statusText);\n      throw new Error(`OpenAI-compat ${res.status}: ${text}`);\n    }\n\n    // Accumulate streaming tool call arguments and reasoning per index\n    const toolAccum    = new Map();\n    let reasoningAcc = '';\n    // Diagnostic state: did the model emit anything, and how did it finish? Used to surface a\n    // genuinely empty completion (e.g. an Azure content filter, or a provider returning a bare stop)\n    // rather than letting it vanish into a no-reply turn.\n    let sawAny     = false;\n    let lastFinish;\n\n    for await (const line of parseSSE(res.body)) {\n      let chunk;\n      try { chunk = JSON.parse(line) ; } catch { continue; }\n\n      // Usage (some providers send at end of stream). `prompt_tokens` is the full input including any\n      // cache hit; `prompt_tokens_details.cached_tokens` is the cached portion (OpenAI auto-cache,\n      // DeepSeek, and Anthropic-via-OpenRouter all report it). Split them so inputTokens is the fresh\n      // (full-price) part and cacheReadTokens the discounted part — matching the anthropic adapter.\n      if (chunk.usage) {\n        const cached = chunk.usage.prompt_tokens_details?.cached_tokens ?? 0;\n        const prompt = chunk.usage.prompt_tokens ?? 0;\n        yield {\n          type:         'usage',\n          inputTokens:  Math.max(0, prompt - cached),\n          outputTokens: chunk.usage.completion_tokens ?? 0,\n          ...(cached > 0 ? { cacheReadTokens: cached } : {}),\n        };\n      }\n\n      const choice = chunk.choices?.[0];\n      if (!choice) continue;\n\n      const delta = choice.delta ?? {};\n\n      if (choice.finish_reason) lastFinish = choice.finish_reason;\n\n      if (delta.reasoning_content) {\n        sawAny = true;\n        reasoningAcc += delta.reasoning_content;\n        yield { type: 'thinking', delta: delta.reasoning_content };\n      }\n      if (delta.content) {\n        sawAny = true;\n        yield { type: 'text-delta', delta: delta.content };\n      }\n      if ((delta.tool_calls?.length ?? 0) > 0) sawAny = true;\n\n      for (const tc of delta.tool_calls ?? []) {\n        const acc = toolAccum.get(tc.index);\n        if (!acc) {\n          toolAccum.set(tc.index, {\n            id:   tc.id   ?? '',\n            name: tc.function?.name ?? '',\n            args: tc.function?.arguments ?? '',\n          });\n        } else {\n          if (tc.id)                       acc.id   = tc.id;\n          if (tc.function?.name)           acc.name = tc.function.name;\n          if (tc.function?.arguments)      acc.args += tc.function.arguments;\n        }\n      }\n\n      // 'length' is OpenAI's truncation reason (the analogue of Anthropic's max_tokens) — treat\n      // it as terminal too, so a tool call cut off mid-arguments is flushed and surfaced here\n      // rather than silently dropped to the fallback below.\n      if (choice.finish_reason === 'tool_calls' || choice.finish_reason === 'stop' || choice.finish_reason === 'length') {\n        if (reasoningAcc) {\n          yield { type ',')}). A 'content_filter' finish_reason means the endpoint blocked it.`,\n      );\n    }\n    yield { type: 'done' };\n  }\n\n  async health() {\n    return { status: 'ok' };\n  }\n}\n",
