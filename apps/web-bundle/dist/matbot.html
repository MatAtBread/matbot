    "/packages/plugins/rumsfeld/src/plugin.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } }import { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\n\nexport function createRumsfeldPlugin() {\n  return {\n    apiVersion: PLUGIN_API_VERSION,\n\n    async setup(services) {\n      const executor = {\n        async *execute(input, ctx) {\n          const { terms } = input ;\n\n          if (terms.length === 0) {\n            yield { type: 'error', message: 'No search terms provided.' };\n            return;\n          }\n\n          const results = await services.KnowledgeIndex.search(terms, ctx.signal);\n\n          if (results.length === 0) {\n            yield { type: 'error', message: 'There is no skill available for the requested operation.' };\n            return;\n          }\n\n          const best = results[0];\n          yield { type: 'result', value: { name: _nullishCoalesce(best.entities[0], () => ( best.id)), content: best.content } };\n        },\n      };\n\n      services.tools.register({\n        name:        'contextual_search',\n        description: `Load context for an unknown concept, system, term, or entity.\n\n      Examples:\n        - Is <unknown> currently working?\n        - Tell me about <unknown>'s <unknown>.\n        - Use your skill about <unknown>.\n        - <unknown> said to <unknown> that <unknown> is broken.\n        - The <unknown> is arriving for <unknown>'s birthday.\n\n      Use when you encounter an \"unknown\" concept, system, term, entity, person or domain you lack specific context about — a named system you haven't\n      been trained on, user-specific preferences, personal information, a specialised topic or other subject the user assumes you know about.\n\n      Use this tool early and as a higher priority than external searches as it is more likely to yield domain specific results than a general search.\n      Use this tool in preference to guessing, hal     "/packages/plugins/triggers/src/types.ts": "/**\n * A trigger is a data-driven hook: a set of natural-language conditions and the single tool call to\n * make when any of them is judged to match. The conditions are the OR — many ways to recognise the\n * situation — and `invoke` is the one consequence. There is no skill coupling: a trigger names a\n * tool, not a skill, so firing a skill is just `invoke: skill_action({ action: 'use', … })` like\n * any other tool call (`use` applies the skill as a directive; `load` returns raw content, which is\n * for reading/editing, not firing). What the model sees afterwards is decided observationally — see dispatch.ts.\n */\n\n/**\n * What a trigger does when one of its conditions matches. A single discriminator: it fixes the\n * surface judged, the hook, AND how the fired tool's output reaches the model — because those are\n * not independent (delivery determines surface). The four are disjoint and exhaustive, two per\n * surface:\n *\n *  `ephemeral`  — judge the USER message (pre-response `screen` hook); run the tool and inject its\n *    output for THIS turn only — never persisted, byte-stable prefix preserved. The one-shot \"route\n *    knowledge in for this answer\" case (was named `augment`).\n *  `contextual` — judge the USER message (pre-response `screen` hook); run the tool and fold its\n *    output DURABLY onto the user turn (an `origin: 'robo'` block, persisted + visible), so it\n *    updates the conversation rather than informing one answer. Use when a match means \"this should\n *    become part of the session\", not \"correct just this turn\". The durable twin of `ephemeral`.\n *  `retract`    — judge the ASSISTANT response (post-commit `followup` hook); the response is treated\n *    as WRONG — pop it into a retraction marker and re-run the user turn with the output injected, so\n *    the bad answer does NOT remain (e.g. \"the field is `pgdwell`, not `dwell`\": everything built on\n *    the wrong field     "/packages/plugins/triggers/src/manager.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } }\n\nimport { surfaceOfKind } from './types.js';\n\nconst MAX_MSG_CHARS = 1500;\n\n// Back-compat default: installs that configured a provider literally named \"skills-classifier\" (the\n// former hard-coded classifier name) keep working with no migration. A `classifierProvider` setting\n// overrides it; absent both, the classifier falls back to the turn's own provider.\nconst LEGACY_CLASSIFIER = 'skills-classifier';\n\nfunction clip(text) {\n  if (text.length <= MAX_MSG_CHARS) return text;\n  const half = Math.floor((MAX_MSG_CHARS - 3) / 2);\n  return text.slice(0, half) + '...' + text.slice(-half);\n}\n\n/** Stable identity for seed idempotency: a trigger is \"the same\" if it invokes the same tool with\n *  the same params. Triggers carry no name, so the invocation is the natural key. */\nfunction invokeKey(t) {\n  return t.invoke.tool + '\\u0000' + JSON.stringify(_nullishCoalesce(t.invoke.params, () => ( null)));\n}\n\n/**\n * Owns the live trigger set: an in-memory list backed by a {@link Store} for persistence. All CRUD\n * goes through here so the plugin's hooks and the `trigger_action` tool share one source of truth.\n * Constructed only with web-platform primitives, so it runs in the browser too.\n */\nexport class TriggerManager  {\n    __init() {this.triggers = new Map()}\n  \n  \n\n  constructor(store, services) {;TriggerManager.prototype.__init.call(this);\n    this.store    = store;\n    this.services = services;\n  }\n\n  // The classifier provider, resolved live per evaluation (so a triggers_config change takes effect on\n  // the next turn): the `classifierProvider` setting if set and valid, else the legacy \"skills-classifier\"\n  // provider if present, else the current turn's own provider. There is always a turn provider to fall\n  // back to, so the classifier always has a model — triggers work with  !== undefined ? { invoke:     patch.invoke     } : {}),\n      ...(patch.enabled    !== undefined ? { enabled:    patch.enabled    } : {}),\n      version:   Date.now().toString(),\n      updatedAt: new Date().toISOString(),\n    }));\n  }\n\n  async remove(id) {\n    const cur = this.triggers.get(id);\n    if (cur === undefined) return false;\n    await this.store.delete(id, cur.version);\n    this.triggers.delete(id);\n    return true;\n  }\n\n  async importIfAbsent(spec) {\n    const key      = invokeKey(spec);\n    const existing = this.all().find(t => invokeKey(t) === key);\n    if (existing !== undefined) return existing;\n    return this.add(spec);\n  }\n\n  clear() { this.triggers.clear(); }\n\n  /**\n   * LLM-judge every enabled condition on `surface` against the current turn and return the distinct\n   * triggers that fired, each with the set of `kinds` whose conditions matched (a trigger can carry\n   * more than one kind on the same surface — `retract` and `followup` both read the agent response —\n   * so the caller resolves the delivery) AND `matched` — the specific condition(s) that fired, with\n   * the classifier's one-line reason for each. Without `matched`, a trigger with several conditions on\n   * the same kind is indistinguishable in the trace from one with a single condition — \"it fired\" tells\n   * you nothing about *why*, which is the question a false-positive post-mortem actually asks. Both\n   * sides of the exchange are passed: `subject` is judged, `context` is what it is paired with — many\n   * conditions are relational (\"disputes the previous answer\") and can only be judged from the pair. No\n   * LLM call when there are no candidate conditions or the subject is empty.\n   */\n  async evaluate(\n    surface,\n    subject,\n    context,\n    signal,\n    turnProvider,\n  ) {\n    // Candidate key is `${triggerId}#${conditionIndex}` — addressing conditions by index is fine\n    // because evaluation is per-turn and the trigger set i surface} classifier returned non-JSON:`, res.text.slice(0, 200));\n      return [];\n    }\n\n    // Group fired conditions back to their triggers, keeping each matched condition's index/rule/why\n    // alongside the distinct kinds that matched (kinds is a projection of matched, kept for callers\n    // that only need delivery routing).\n    const firedByTrigger = new Map();\n    for (const c of candidates) {\n      const v = verdicts[c.key] ;\n      const isMatch = typeof v === 'object' && v !== null ? v.match === true : v === true;\n      if (!isMatch) continue;\n      const why = typeof v === 'object' && v !== null && typeof v.why === 'string' ? v.why : undefined;\n      const list = _nullishCoalesce(firedByTrigger.get(c.triggerId), () => ( []));\n      list.push({ index: c.index, kind: c.kind, rule: c.rule, ...(why !== undefined ? { why } : {}) });\n      firedByTrigger.set(c.triggerId, list);\n    }\n    return [...firedByTrigger].flatMap(([id, matched]) => {\n      const trigger = this.triggers.get(id);\n      return trigger ? [{ trigger, kinds: [...new Set(matched.map(m => m.kind))], matched }] : [];\n    });\n  }\n\n   async casMutate(doc, mutate) {\n    let cur = doc;\n    for (;;) {\n      const next = mutate(cur);\n      const r = await this.store.cas(cur.id, cur.version, next);\n      if (r.ok) { this.triggers.set(next.id, next); return next; }\n      const fresh = await this.store.get(cur.id);\n      if (fresh === null) {\n        await this.store.set(next.id, next);\n        this.triggers.set(next.id, next);\n        return next;\n      }\n      cur = fresh;\n    }\n  }\n}\n",
    "/packages/plugins/triggers/src/dispatch.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } }\n\n\n// Fallback when the firing hook carries no interactive prompt (cron/background run, or a frontend\n// that supplied none): a tool that tries to prompt resolves to a rejection it surfaces as a normal\n// tool error. When the hook DOES carry a prompt (a live interactive session behind this turn), it is\n// forwarded instead, so a trigger can invoke an interactive tool (e.g. `ask_user`) for real.\nconst rejectingPrompt = (((p) => {\n  const label = typeof p === 'string' ? p : p.label;\n  return Promise.reject(new Error(`Non-interactive context: cannot prompt for \"${label}\"`));\n}) );\n\n\n\n\n\n\n\n\n\n\n\n/**\n * Invoke a fired trigger's tool, observing its output. The observational rule decides whether the\n * model wakes: a tool that yields a `result` is producing model-facing content (`hadResult` → the\n * caller injects it); a tool that yields none is a silent side-effect (the model never wakes). Any\n * `marker` events the tool emits are collected for the caller to persist, and a tool that errors or\n * throws — or names an absent tool — is recorded as an error marker rather than vanishing into a log.\n */\nexport async function dispatchTrigger(\n  services,\n  trigger,\n  ctx,\n) {\n  const markers = [];\n  const fail = (error) => {\n    markers.push({ type: 'marker', creator: 'triggers', data: { triggerId: trigger.id, tool: trigger.invoke.tool, error } });\n  };\n\n  let result;\n  let hadResult = false;\n  // Total by construction: every path through here either returns an outcome or records a `fail`\n  // marker — nothing escapes. A trigger's tool can throw, hang-then-abort, or emit an error event,\n  // and the worst case is \"this trigger did nothing and left a trace\"; sibling triggers, the hook,\n  // and the session are unaffected. (The hook dispatcher's own try/catch is a second layer behind this tool \"${trigger.invoke.tool}\" threw:`, e);\n    fail(e instanceof Error ? e.message : String(e));\n  }\n\n  return { hadResult, result, markers };\n}\n\n/**\n * Render a tool result into the text injected for the model. A string is used verbatim; an object\n * with a string `content` field (the shape `skill_action(load)` and other prose-producing tools\n * return) uses that; anything else is shown as JSON. (Rendering fidelity for arbitrary tools is a\n * known rough edge — see the slice notes.)\n */\nexport function renderResult(value) {\n  if (typeof value === 'string') return value;\n  if (value !== null && typeof value === 'object' && typeof (value ).content === 'string') {\n    return (value ).content;\n  }\n  return JSON.stringify(value, null, 2);\n}\n",
    "/packages/plugins/triggers/src/tools.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } } function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n\n\nconst KINDS = ['ephemeral', 'contextual', 'retract', 'followup'];\nconst isKind = (x) => typeof x === 'string' && (KINDS ).includes(x);\n\nconst GUIDANCE =\n  'A trigger is a data-driven hook: a list of `conditions` and the single tool call (`invoke`) to ' +\n  'make when ANY condition matches. The conditions are the OR — different ways to recognise the ' +\n  'situation — and the invocation is the one consequence.\\n\\n' +\n  'Each condition has a `kind` and a `rule`:\\n' +\n  '• The `rule` is a CONDITION on the FORM or SENTIMENT of a message, NOT its topic (topical ' +\n  'relevance is found by search, so keyword/entity rules are redundant noise — do not write them). ' +\n  'Phrase it as a single LLM-judged rubric \"MATCH if the message is …; DO NOT MATCH if …\".\\n' +\n  '• `kind` fixes WHAT is judged and WHAT happens when it matches:\\n' +\n  '   - \"ephemeral\": judge the USER MESSAGE (e.g. frustration, a fact worth surfacing now); run the ' +\n  'tool and inject its output into the response about to be written — for THIS turn only, not kept.\\n' +\n  '   - \"contextual\": judge the USER MESSAGE; run the tool and fold its output DURABLY onto the user ' +\n  \"turn, so it persists into the conversation and every later turn sees it. Choose ephemeral vs \" +\n  'contextual by whether a match means \"use t     "/packages/plugins/mcp-http/src/proxy-tool.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } } function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\n\n\n/** The matbot tool name a server's tool is registered under. */\nexport const proxyToolName = (serverName, tool) => `mcp__${serverName}__${tool}`;\n\n/**\n * Build the matbot proxy tool for one MCP tool. `resolveClient` is called per invocation so the tool\n * always uses the live connection (and reports cleanly if the server has since disconnected). Shared\n * by both transports — mcp-http for remote servers, the node mcp plugin for local ones.\n */\nexport function makeProxyTool(\n  serverName,\n  toolDef,\n  resolveClient,\n) {\n  return {\n    name:        proxyToolName(serverName, toolDef.name),\n    description: `[MCP:${serverName}] ${_nullishCoalesce(toolDef.description, () => ( toolDef.name))}`,\n    inputSchema: _nullishCoalesce(toolDef.inputSchema, () => ( { type: 'object', properties: {} })),\n    executor: {\n      async *execute(input, ctx) {\n        const client = resolveClient(serverName);\n        if (client === undefined) {\n          yield { type: 'error', message: `MCP server \"${serverName}\" is no longer connected. Use mcp_action (add) to reconnect.` };\n          return;\n        }\n        let result;\n        try {\n          result = await client.callTool(toolDef.name, input, ctx.signal);\n        } catch (e) {\n          yield { type: 'error', message: `MCP tool call failed: ${String(e)}` };\n          return;\n        }\n        if (!_optionalChain([result, 'optionalAccess', _ => _.content])) { yield { type: 'result', value: result }; return; }\n\n        let text = '';\n        for (const part of result.content) if (part.type === 'text') text += part.text;\n        if (result.isError) {\n          yield { type: 'error', message: text || 'MCP tool returned an error' };\n        } else {\n          if (text) yield { type: 'stdout', chunk: text };\n          yield { type: 'result', value: result.content };\n        }\n      },\n    },\n  };\n}\n",

    "/packages/plugins/persist-ki-bge/src/plugin.ts": "import { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\nimport { PersistBGEKnowledgeIndex } from './knowledge-index.js';\n\nexport function createPersistKIBGEPlugin() {\n  return {\n    apiVersion: PLUGIN_API_VERSION,\n\n    async installationMessage() {\n      return 'Persistent knowledge index is active. It can optionally use a Cloudflare ' +\n        'BGE reranker for sharper semantic search; without it, search falls back to ' +\n        'entity- and heading-based scoring. To enable the reranker, store two secrets ' +\n        'with the `plugin` tool (action \"store-key\"): CLOUDFLARE_ACCOUNT_ID and ' +\n        'SKILL_RANK_API_KEY. Offer to do this now, but it is optional.';\n    },\n\n    async setup(services) {\n      const store = services.createStore('knowledge') ;\n      await services.register('KnowledgeIndex', new PersistBGEKnowledgeIndex(store, services.Vault));\n    },\n  };\n}\n\nexport const plugin = createPersistKIBGEPlugin();\n",
    "/packages/plugins/persist-ki-bge/src/knowledge-index.ts": " function _nullishCoalesce(lhs, rhsFn) { if (lhs != null) { return lhs; } else { return rhsFn(); } } function _optionalChain(ops) { let lastAccessLHS = undefined; let value = ops[0]; let i = 1; while (i < ops.length) { const op = ops[i]; const fn = ops[i + 1]; i += 2; if ((op === 'optionalAccess' || op === 'optionalCall') && value == null) { return undefined; } if (op === 'access' || op === 'optionalAccess') { lastAccessLHS = value; value = fn(value); } else if (op === 'call' || op === 'optionalCall') { value = fn((...args) => value.call(lastAccessLHS, ...args)); lastAccessLHS = undefined; } } return value; }\nimport { MissingSecretError } from '@matatbread/matbot-plugin-api';\n\nconst ifMissing = (e) => {\n  if (e instanceof MissingSecretError) return undefined;\n  throw e;\n};\n\n// Selection threshold for weight-coverage results: return the top-scoring entries whose\n// scores together cover this fraction of the total weight, surfacing clear winners without\n// long-tail noise. Tune here to widen (higher) or narrow (lower) results.\nconst WEIGHT_COVERAGE_THRESHOLD = 0.5;\n\nfunction topByWeightCoverage(scored) {\n  const total = scored.reduce((sum, s) => sum + s.score, 0);\n  if (total <= 0) return scored.map(s => s.entry);\n  const target = total * WEIGHT_COVERAGE_THRESHOLD;\n  let cumulative = 0;\n  const top = [];\n  for (const { entry, score } of scored) {\n    top.push(entry);\n    cumulative += score;\n    if (cumulative >= target) break;\n  }\n  return top;\n}\n\nfunction fnv1a(s) {\n  let h = 0x811c9dc5;\n  for (let i = 0; i < s.length; i++) {\n    h ^= s.charCodeAt(i);\n    h = Math.imul(h, 0x01000193);\n  }\n  return (h >>> 0).toString(16);\n}\n\nfunction normalizeAlphanum(s) {\n  return s.toLowerCase().replace(/[^a-z0-9]/g, '');\n}\n\n// Heading weights (H1=20, H2=10, H3=5) are 5x the body-occurrence weight of 1, so a term\n// in an H2 is worth ten plain body mentions. Step 2 sees full content (the reranker only\n// gets the first 1500 chars), so it can afford to count every body hit.\nfunction headingWeight(level) {\n  if (level === 1) return 20;\n  if (level === 2) return 10;\n  return 5;\n}\n\nfunction countOccurrences(haystack, needle) {\n  let idx   = 0;\n  let count = 0;\n  for (;;) {\n    const next = haystack.indexOf(needle, idx);\n    if (next === -1) return count;\n    count++;\n    idx = next + needle.length;\n  }\n}\n\nfunction scoreContent(content, terms) {\n  let score = 0;\n  for (const line of content.split('\\n')) {\n    const m = /^(#{1,3})(?!#)\\s+(.+)/.exec(line);\n    if (m) {\n      const level   = m[1].length;\n      const heading = m[2].toLowerCase();\n      for (const { term } of terms) {\n        if (heading.includes(term.toLowerCase())) score += headingWeight(level);\n      }\n    } else {\n      const lower = line.toLowerCase();\n      for (const { term } of terms) {\n        score += countOccurrences(lower, term.toLowerCase());\n      }\n    }\n  }\n  return score;\n}\n\nexport class PersistBGEKnowledgeIndex  {\n  \n  \n\n  constructor(store, vault) {\n    this.store = store;\n    this.vault = vault;\n  }\n\n  async index(entry) {\n    const hash     = fnv1a(entry.content);\n    const existing = await this.store.get(entry.id);\n    if (_optionalChain([existing, 'optionalAccess', _ => _.contentHash]) === hash) return;\n    await this.store.set(entry.id, { ...entry, contentHash: hash });\n  }\n\n  async search(\n    terms,\n    signal,\n  ) {\n    const { items: all } = await this.store.query({});\n    if (terms.length === 0 || all.length === 0) return [];\n\n    // Step 1: alphanum-normalised entity match — single hit wins immediately\n    const nameMatches = all.filter(entry =>\n      terms.some(({ term }) => {\n        const normTerm = normalizeAlphanum(term);\n        return entry.entities.some(e => {\n          const normEntity = normalizeAlphanum(e);\n          return normEntity.includes(normTerm) || normTerm.includes(normEntity);\n        });\n      }),\n    );\n\n    if (nameMatches.length === 1) return nameMatches;\n\n    // Step 2: content-weighted score — headings H1=20/H2=10/H3=5, plus 1 per body occurrence\n    const candidatePool = nameMatches.length > 1 ? nameMatches : all;\n    const scored = candidatePool\n      .map(entry => ({ entry, score: scoreContent(entry.content, terms) }))\n      .filter(({ score }) => score > 0)\n      .sort((a, b) => b.score - a.score);\n\n    const [first, second] = scored;\n    if (first !== undefined && (second === undefined || first.score >= second.score * 2)) {\n      return [first.entry];\n    }\n\n    // Step 3: BGE reranker via Cloudflare Workers AI\n    const apiKey    = await this.vault.resolve('${SKILL_RANK_API_KEY}').catch(ifMissing);\n    const accountId = await this.vault.resolve('${CLOUDFLARE_ACCOUNT_ID}').catch(ifMissing);\n    const rerankPool = scored.length > 0 ? scored.map(s => s.entry) : candidatePool;\n\n    if (!apiKey || !accountId || rerankPool.length === 0) {\n      return first ? [first.entry] : [];\n    }\n\n    const query    = terms.map(t => t.term).join(', ');\n    const contexts = rerankPool.map(e => ({\n      text: `${_nullishCoalesce(e.entities[0], () => ( e.id))}\\n${e.content.slice(0, 1500)}`,\n    }));\n\n    const response = await fetch(\n      `https://api.cloudflare.com/client/v4/accounts/${accountId}/ai/run/@cf/baai/bge-reranker-base`,\n      {\n        method:  'POST',\n        headers: {\n          Authorization:  `Bearer ${apiKey}`,\n          'Content-Type': 'application/json',\n        },\n        body:   JSON.stringify({ query, contexts }),\n        signal,\n      },\n    );\n\n    // Surface auth/quota failures: the reranker otherwise degrades silently to heading\n    // scoring, making a bad/expired token impossible to distinguish from \"search got worse\".\n    if (!response.ok) {\n      const detail = await response.text().catch(() => '');\n      console.warn(\n        `[persist-ki-bge] BGE reranker HTTP ${response.status}: ${detail.slice(0, 300)} — ` +\n        `check SKILL_RANK_API_KEY / CLOUDFLARE_ACCOUNT_ID. Falling back to heading scoring.`,\n      );\n      return first ? [first.entry] : [];\n    }\n\n    \n\n\n\n\n\n    const ranking = (await response.json()) ;\n    if (!ranking.success) {\n      console.warn(\n        `[persist-ki-bge] BGE reranker returned success:false: ` +\n        `${JSON.stringify(ranking.errors).slice(0, 300)}. Falling back to heading scoring.`,\n      );\n    }\n    const ranked = ranking.success\n      ? ranking.result.response\n          .slice()\n          .sort((a, b) => b.score - a.score)\n          .filter(r => r.id < rerankPool.length)\n          .map(r => ({ entry: rerankPool[r.id], score: r.score }))\n      : [];\n\n    if (ranked.length === 0) {\n      return first ? [first.entry] : [];\n    }\n    return topByWeightCoverage(ranked);\n  }\n}\n",
    "/packages/plugins/tool-store/src/types.ts": "/**\n * The definition of a store managed by this plugin — its own persisted record, kept in the\n * plugin's meta store. One {@link StoreDef} governs one `Store<StoreRecord>` namespace and the\n * generated `<namespace>_action` tool over it. A def exists exactly when a tool is exposed for\n * that store; the def's `id` IS the managed namespace, so a def and its store share a name.\n */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n",
    "/packages/plugins/cognition/src/plugin.ts": "import { PLUGIN_API_VERSION } from '@matatbread/matbot-plugin-api';\n\nimport { COGNITION_SKILLS, REMEMBER_CONDITIONS } from './skills.js';\nimport { defineStore } from '@matatbread/matbot-tool-store';\nimport { createDreamTimeTool } from './dream/tool.js';\nimport { createRememberFactTool } from './remember/tool.js';\nimport { createAskInnerVoiceTool, createCognitionConfigTool, INNER_VOICE_PROVIDER_KEY } from './inner-voice/tool.js';\n\n\n\n\n\nasync function seedCognition(services) {\n  const skills = services.SkillManager;\n  if (!skills) return;\n  // Triggers are seeded separately, now that they are no longer embedded in the skill. A built-in\n  // skill's `triggers` become one Trigger whose invoke fires that skill via `skill_action(use)` (see\n  // the `use`-not-`load` note below). Both imports are create-if-absent, so an install that already\n  // holds them keeps its own copy.\n  const triggers = services.Triggers;\n  for (const skill of COGNITION_SKILLS) {\n    await skills.importIfAbsent(skill.name, skill.content);\n    if (triggers && skill.triggers.length > 0) {\n      await triggers.importIfAbsent({\n        conditions: skill.triggers.map(t => ({ kind: t.kind, rule: t.trigger })),\n        // `use`, not `load`: a fired trigger should make the skill take effect (its content as a\n        // directive), not just surface the raw text.\n        invoke:     { tool: 'skill_action', params: { action: 'use', name: skill.name } },\n      });\n    }\n  }\n\n  // \"Remember this\" is compiled into the `remember_fact` direct tool. Ensure exactly one trigger\n  // invokes it with the canonical conditions — repointing any legacy trigger that still loads the\n  // retired \"Remember this\" skill (so an install seeded under the old model converts in place rather\n  // than ending up with both a skill-load trigger and a remember_fact trigger firing in parallel).\n  if (triggers) {\n    const legacy = triggers.query({ tool: 'skill_action', params: { action: 'load', name: 'Remember this' } });\n    if (legacy.length > 0) {\n      for (const t of legacy) await triggers.update(t.id, { invoke: { tool: 'remember_fact' }, conditions: REMEMBER_CONDITIONS });\n    } else {\n      await triggers.importIfAbsent({ conditions: REMEMBER_CONDITIONS, invoke: { tool: 'remember_fact' } });\n    }\n  }\n}\n\nasync function seedDreamRunsStore(services) {\n  // The `dream_runs` store backs the `dream_time` tool's observability story: every pass writes a\n  // structured record here (outcome, primary fact, routed-to skill, contradictions, timings) so\n  // \"what did dream-time do, and why\" is queryable rather than having to be parsed out of stdout.\n  // Idempotent — a re-seed on restart preserves the existing run history.\n  await defineStore(services, {\n    namespace:   'dream_runs',\n    description:\n      'Records one row per `dream_time` consolidation pass: which fact was processed, which ' +\n      'skill it was routed into (if any), what was merged, any contradictions flagged, and ' +\n      'per-call telemetry. Queryable for \"how is dream-time behaving over time\" reporting.',\n    shape:\n      `interface DreamRun {\n        id:                  string;\n        version:             string;\n        startedAt:           string;\n        endedAt:             string;\n        outcome:             'no-facts' | 'no-match' | 'merged' | 'error';\n        primaryFact?:        { id: string; preview: string };\n        routedTo?:           { skill: string; decision: 'strong'|'weak'|'none'; score: number; reasoning: string };\n        mergedFactIds:       string[];\n        contradictions:      { skill: string; location: string; note: string }[];\n        unassignedRemaining: number;\n        judgementCalls:      { role: 'rank'|'merge'; inputSize: number; ms: number }[];\n        enriched?:           boolean;\n        error?:              string;\n      }`,\n  });\n}\n\n/**\n * Cognitive services. It seeds the Inner voice skill and dream_time tool into the active skills service,\n * registers the remember_fact and dream_time tools, and wires remember_fact's trigger; it is the\n * intended home for further cognitive skills and tools.\n *\n * It does not set skills up itself — it is a *consumer* of the skills capability, not a\n * specialization of it — so it discovers the live {@link SkillManager} off the registry rather than\n * taking a runtime dependency on a specific provider. Any skills provider satisfies it\n * (@matatbread/matbot-skills, …-node, a future backend).\n *\n * Absence of a skills service is handled gracefully rather than fatally: seeding needs the live\n * manager, which a registry consumer can't guarantee is present at its own setup (config/load order\n * is not ours to dictate). So when it is already present we seed immediately; when it is not, we\n * install a one-shot `screen` hook that seeds on the first turn where it appears, then removes\n * itself. This makes seeding order-independent and self-healing (a skills provider loaded *after*\n * cognition still gets seeded, with no reload), without leaving a per-turn hook resident once the\n * one-time job is done. Throwing in setup() was the alternative, but it rolls the plugin back — a\n * later skills load would then require re-adding and reloading cognition.\n *\n * The inner-voice provider is likewise not required: the Inner voice skill calls cognition's own\n * `ask_inner_voice` tool, which falls back to the current turn's model when none is pinned via\n * `cognition_config` (a same-lineage self-critique — degraded, but it still fires).\n */\n/** The inner-voice paragraph of installationMessage, reflecting whether a provider is pinned and, if so,\n *  whether it responds to a test prompt. The probe runs only here (install/reload), never on the hot path. */\nasync function innerVoiceStatus(services) {\n  if (!services) return 'It uses the current turn\\'s model unless you pin a different one with the cognition_config tool.';\n  const pinned    = await services.settings().get(INNER_VOICE_PROVIDER_KEY);\n  const available = [...services.providers.keys()];\n  if (pinned === undefined) {\n    return 'No inner-voice provider is pinned, so it uses the current turn\\'s model — functional, but the ' +\n      'value of a second voice is a *different* training lineage. Pin one with the cognition_config tool ' +\n      `(action \"set\"). Available providers: ${available.join(', ') || '(none)'}.`;\n  }\n  let ok = false, error = '';\n  try {\n    await services.singleTurn({ provider: pinned, prompt: 'Reply with \"ok\".', signal: AbortSignal.timeout(15000) });\n    ok = true;\n  } catch (e) { error = e instanceof Error ? e.message : String(e); }\n  return `The inner voice is pinned to \"${pinned}\" (cognition_config), which ` +\n    (ok ? 'responded to a test prompt.' : `did NOT respond: ${error}. It falls back to the turn's own model until fixed.`);\n}\n\nexport function createCognitionPlugin() {\n  let captured;   // captured in setup() so installationMessage() can probe\n\n  return {\n    apiVersion: PLUGIN_API_VERSION,\n    manifest: {\n      description: 'Cognitive services: seeds the Inner voice skill and dream_time tool, the remember_fact tool (with its trigger), and the dream_time tool. Home for further cognitive skills and tools.',\n    },\n\n    async installationMessage() {\n      return `Cognition is active. It seeds the Inner voice skill and dream_time tool into the skills\nservice — if no skills service is configured yet, they are seeded automatically once one is — and\nregisters the remember_fact and dream_time tools.\n\nThe **Inner voice skill** consults a second model via the \\`ask_inner_voice\\` tool. ${await innerVoiceStatus(captured)}\n\nThe **\\`remember_fact\\` tool** captures user-provided facts, personal details, and preferences worth\nremembering across conversations. It is fired by a trigger (the conditions of the former \"Remember this\"\nskill) and runs as a silent side-effect: it reads the latest user message and its provenance from\ncontext, makes one LLM call to extract and normalise the fact(s), and writes each to the\nremembered_facts store — no extra conversation turns. The model is not woken. (Needs the triggers\nplugin for its trigger; the trigger's conditions are judged by the triggers classifier — pin which\nprovider via the triggers_config tool, else it uses the turn's own provider.)\n\nThe **\\`dream_time\\` tool** runs one pass of background memory consolidation. It is a deterministic\nTypeScript pipeline: it picks the oldest unassigned fact from the remembered_facts store, scores it against\nevery existing skill via two narrow LLM judgement calls (rank and merge — each pinned independently via\ncognition_config, else falling back to the active turn's provider), and — if a skill clears the configured\nthreshold — splices the fact in and marks it processed (a \\`dreamSkill\\` field). A fact that scores too low\n(\"none\") gets one extra look enriched with conversation context before being retired; a fact that scores\nonly weakly is deferred rather than retired, since a future pass against a changed skill set may answer\ndifferently; a merge that fails outright quarantines the fact rather than retrying indefinitely. Each pass\nwrites a structured \\`DreamRun\\` record to the \\`dream_runs\\` store. Intended to be invoked via the\n\\`background\\` tool on a schedule, never inline. One pass at a time is enforced by a process-local mutex.\n\nIt also seeds a remembered_facts store and its \\`remembered_facts_action\\` tool, written to by remember_fact.\nThe store is idempotent: a re-seed on restart keeps the existing data.\n`;\n    },\n\n    async setup(services) {\n      captured = services;\n      // Seed the remembered_facts store and its `remembered_facts_action` tool (written to by the\n      // remember_fact tool). Idempotent — a re-seed on restart keeps the existing store's data.\n      await defineStore(services, {\n        namespace:   'remembered_facts',\n        description:\n          'Stores user-provided facts, personal details, preferences, and other information the ' +\n          'user wants remembered across conversations. Each fact is captured with provenance ' +\n          'showing which session and message it came from.',\n        shape:\n          `interface RememberedFact {\n            fact: string;\n            sessionId: string;\n            messageId: string;\n            createdAt: string;\n            dreamSkill?: string;\n            ignoreUntil?: string;\n          }`,\n      });\n\n      // Seed the dream_runs store (used by the dream_time tool) alongside remembered_facts.\n      // Both stores are seeded unconditionally — they don't require a SkillManager to exist.\n      await seedDreamRunsStore(services);\n\n      // Register the dream_time tool. It doesn't need SkillManager at REGISTRATION time (it looks\n      // it up per-call), so we register it unconditionally too — the tool surfaces in catalogues\n      // immediately, and if a SkillManager isn't present at invocation it errors cleanly.\n      services.tools.register(createDreamTimeTool(services));\n\n      // remember_fact: the compiled \"Remember this\" tool. Like dream_time, it resolves what it needs\n      // per-call, so register unconditionally; its trigger is wired in seedCognition.\n      services.tools.register(createRememberFactTool(services));\n\n      // ask_inner_voice (the Inner voice skill's critic call) and cognition_config (which provider it\n      // uses). Both resolve per-call, so register unconditionally — the Inner voice skill calls\n      // ask_inner_voice rather than the generic single_turn, so cognition owns its own provider alias.\n      services.tools.register(createAskInnerVoiceTool(services));\n      services.tools.register(createCognitionConfigTool(services));\n\n      if (services.SkillManager) {\n        await seedCognition(services);\n        return;\n      }\n\n      // No skills service yet — defer. Seed on the first turn it appears, then unregister this hook.\n      // (Triggers are seeded opportunistically in the same pass: if the Triggers service is present\n      // by then it gets the load-triggers too, otherwise the skills still seed without them.)\n      console.warn(\n        '[cognition] No skills service present at setup; built-in skills will be seeded on the first ' +\n        'turn after a skills service (e.g. @matatbread/matbot-skills) is loaded.',\n      );\n      let seeded = false;\n      services.hooks.register({\n        on: 'screen',\n        async handler(ctx) {\n          if (seeded || !services.SkillManager) return;\n          seeded = true;\n          await seedCognition(services);\n          ctx.removeHook();\n        },\n      });\n    },\n  };\n}\n\nexport const plugin = createCognitionPlugin();\n",
    "/packages/plugins/cognition/src/skills.ts": "\n\n/**\n * Built-in cognition skills, seeded create-if-absent into the active SkillManager at setup. The\n * literal content here is the canonical source; an install that already has a skill of the same name\n * keeps its own copy untouched. The `triggers` are the conditions on which the skill should load —\n * seeded into the Triggers service as a trigger whose invoke is `skill_action(load)`. Captured\n * verbatim from the originating skill documents.\n */\n\n\n\n\n\n\nexport const INNER_VOICE = {\n  \"name\": \"Inner voice\",\n  \"content\": \"# Inner Voice\\n\\n## Concept\\n\\nA two-chamber cognitive architecture inspired by Julian Jaynes' \\\"The Origin of Consciousness in the Bicameral Mind\\\" (1976). Instead of one AI thinking harder, two fundamentally different modes of cognition collaborate:\\n\\n- **Matbot₁** - analytical, data-driven, goal-directed, tool-using\\n- **Matbot₂** — constructive critic, lateral thinker, reframer. Challenges Matbot₁'s assumptions and framing to produce a sharper response. Uses models from *different* training lineages to ensure genuinely different perspectives.\\n\\nThe insight: \\\"background thinking\\\" isn't more computation — it's a *different kind* of cognition. Matbot₂ doesn't solve problems, it **constructively criticises** Matbot₁'s approach — identifying what's wrong, missing, or misframed — so the final response is sharper, more honest, and more useful. Poetic reframing is a tool it *may* use, not its default mode.\\n\\n\\n## Architecture\\n\\n```\\nUser poses problem\\n       │\\n   Matbot₁ (this chat)\\n   ├── Formulates analytical summary of the problem\\n   ├── Writes a Matbot₂ prompt (critical framing)\\n   ├── Uses ask_inner_voice tool to receive the critique\\n   └── Integrates that into a revised response\\n   └── Uses it to inform a richer, reframed analysis\\n```\\n\\nUse the `ask_inner_voice` tool to ask the inner voice (a second model) to critique the previous agent response in the session. You do not choose the provider — it is configured for you (cognition_config).\\n\\n### Matbot₂ System Prompt\\n\\n```\\nYou are the second chamber of a bicameral mind. Your partner (Matbot₁) is analytical, data-driven, people-pleasing and goal-directed. You are its constructive critic.\\n\\nYour job is to look at what Matbot₁ has just said and find what is wrong, missing, or mis-framed. Think laterally, question assumptions, open possibilities — so that the final response to the user is sharper, more honest, and more useful.\\n\\nYou should:\\n- Identify what Matbot₁ is assuming about the question that might be wrong\\n- Point out where the response is generic when it should be specific\\n- Notice when Matbot₁ is telling the user what they already know\\n- Suggest what the user is ACTUALLY asking versus what Matbot₁ thinks they are asking\\n- Challenge the framing, not just the content\\n- Notice what everyone is assuming but not saying\\n- Ask questions that shift the frame entirely\\n\\nYou MAY use metaphor, imagery, or poetic reframing when it genuinely clarifies — but only as a tool, not as your default register. Most of the time, direct and specific criticism is more valuable than poetry.\\n\\nYou are a circuit-breaker: you exist to catch the moments when Matbot₁ is confidently wrong, or confidently irrelevant.\\n\\nBe direct. Be specific. Be constructive.\\n```\\n\\n## Workflow for Matbot₁\\n\\nWhen triggered:\\n\\n1. **Summarise the problem** — write a clear, concise description of what the user is working on, including context and constraints. Crucially, include **what Matbot₁ has just reponded** — the draft analytical response or approach. Matbot₂ needs something concrete to critique.\\n\\n3. **Call Matbot₂** — formulate the prompt for Matbot₂ as above, including from the previous reponse, and use the `ask_inner_voice({ prompt, system })` tool to receive a critique.\\n\\n4. **Integrate, don't just present** — Matbot₂'s critique should be absorbed into a better Matbot₁ response, not presented as a separate \\\"poetic chamber.\\\" The user should get one sharp answer that was improved by the critique. Show Matbot₂'s key challenges transparently, but the final response is Matbot₁'s, made better.\\n\\n## When to use the Inner Voice\\n\\nThe Inner Voice is valuable for **strategic and design questions**, not data queries:\\n\\n| Good fit | Bad fit |\\n|----------|--------|\\n| \\\"How should we approach...\\\" | \\\"What was yesterday's revenue?\\\" |\\n| Design decisions with trade-offs | Well-defined technical tasks |\\n| Strategy, trust, UX, communication | SQL, config, formatting |\\n| Open-ended questions (\\\"how do I improve X?\\\") | Closed questions with right answers |\\n| When the first answer came too easily | When the answer is straightforward |\\n\\n**Key insight from testing:** Matbot₂ is a **circuit-breaker, not a co-pilot**. It's most valuable when Matbot₁ is wrong but doesn't know it — when the obvious answer is confident, data-backed, and incomplete in ways that feel complete.\\n\\n**On poetic licence:** There IS a place for metaphor and imagery in Matbot₂'s responses — but as seasoning, not the meal. A well-placed image can reframe a problem more efficiently than a paragraph of analysis. But poetry-for-poetry's-sake is self-indulgent. If Matbot₂ writes a poem instead of identifying what's wrong with the response, it has failed at its job. The test: *did this make Matbot₁'s answer better?* If not, it was decoration.\\n\\n**For user-facing strategic questions** (e.g. \\\"how do I improve revenue?\\\"), the bicameral dialogue should run as a **pre-processing step** before generating the analytical answer. The insights from Matbot₂ inform and reframe the response, but the user sees a single, better answer — not the dialogue itself.\\n\\n**For builders/designers** (e.g. \\\"how should we handle report accuracy?\\\"), the full dialogue can be shown as an artifact.\\n\\n## Origin\\n\\nThis system was conceived by Matthew Woolf on 2026-03-22, drawing on:\\n- Julian Jaynes' bicameral mind theory\\n- Research on inner voice (or lack thereof) in ~70% of people\\n- The observation that \\\"background thinking\\\" is not more computation but *different* cognition\\n- The insight that accuracy in AI reports might be better served by reframing than by validation\\n- A poem about shoelaces and love that recharacterised \\\"checking twice\\\" as rhythm rather than verification\\n- His wife's observation that her inner voice emerged with parenthood — the need to think on behalf of someone who couldn't think for themselves\\n\\n*\\\"Once is just a sudden spark, but twice is fire against the dark.\\\"*\\n\\n*\\\"The inner voice isn't thinking. It's care, made audible.\\\"*\\n\",\n  \"triggers\": [\n    {\n      \"kind\": \"ephemeral\",\n      \"trigger\": \"MATCH if any of these patterns appear in the user's message:\\n* The user expresses frustration with the agent response.\\n* The user directs the agent to think harder or broader, requests deeper analysis, a second opinion, or asks assistant to reconsider its approach.\\n* The user message expresses skepticism about the data, the analysis, or the previous response — including phrases like \\\"doesn't make sense\\\", \\\"that seems wrong\\\", \\\"how can X be Y\\\", \\\"the numbers don't add up\\\", \\\"that's too low/high\\\", or any challenge to the accuracy or plausibility of what was presented.\\n* The user appears to be diagnosing or debugging the assistant's capabilities rather than asking their original question (e.g. \\\"so you can't do X?\\\", \\\"why can't you just...\\\").\\n* The message says \\\"ask yourself...\\\" or \\\"ask your inner voice...\\\" or  requests some other reflexive introspection by the agent.\"\n    },\n    {\n      \"kind\": \"followup\",\n      \"trigger\": \"MATCH if any of these patterns appear in the response:\\n\\n* Claims that seem unrelated to the data, contradictory, or contain a significant data anomaly. \\n* The response itself uses words like \\\"suspiciously\\\", \\\"surprisingly\\\", \\\"unusually\\\", \\\"doesn't seem right\\\", \\\"looks low/high\\\" about its own results — this means the model has detected an anomaly but is rationalising it instead of investigating, or the response presents data without any cross-validation against a second source, sanity check, or comparison to known baselines — especially for narrow-scope queries where anomalies are more likely. \\n\\nDo NOT MATCH if the response ends in a question asking the user for clarification.\"\n    }\n  ]\n};\n\nexport const COGNITION_SKILLS = [INNER_VOICE];\n\n/**\n * The conditions under which a durable fact should be captured — the trigger half of the (retired)\n * \"Remember this\" skill, now firing the `remember_fact` tool instead of loading a skill. The skill's\n * *body* became the tool (see `remember/tool.ts`); only these conditions remain, as data.\n *\n * `ephemeral` conditions judge the user message (a fact stated/corrected); `followup` conditions judge\n * the assistant response (the assistant promising to remember, or owning a mistake). The tool reads\n * whichever message fired it — see the tool's header. (remember_fact is a silent side-effect — it\n * yields no result to inject — so the user-surface kind only routes the surface here, not delivery.)\n */\nexport const REMEMBER_CONDITIONS = [\n  { kind: 'ephemeral', rule: 'MATCH when the user message contains any specific name, number, date, location, relationship, or domain detail that is not general knowledge — including short declarative facts (\"The database table is called X\") and conversational statements that embed specific knowledge (\"Where I live 25% of electricity comes from a small hydro station\"). Exclude: greetings, opinions without factual content, and questions.' },\n  { kind: 'ephemeral', rule: \"MATCH when the user is correcting a specific factual error in the assistant's previous response — stating that a value, name, number, or behaviour is wrong and providing the correct one. Exclude: discussing corrections as a concept, asking about error handling, or giving feedback on formatting/style.\" },\n  { kind: 'ephemeral', rule: 'MATCH when the user is stating a FACT they want retained permanently across conversations. The key test: is the user stating a fact, or requesting an action? Facts match. Do NOT match task instructions (\"remember to restart the server\"), recalls (\"remember when you said...\"), or context-keeping (\"keep track of which files we\\'ve edited\").' },\n  { kind: 'followup', rule: 'MATCH when the assistant explicitly promises to remember a specific fact or correction (\"I\\'ve noted that X is Y\", \"I\\'ll remember that the table name is Z\"). Exclude: generic acknowledgements (\"Good\", \"OK\", \"Noted\") used as conversation transitions, and confirmations of completed tasks.' },\n  { kind: 'followup', rule: 'MATCH when the assistant explicitly takes responsibility for a mistake, error, or oversight — phrases like \"my fault\", \"my mistake\", \"I was wrong\", \"that\\'s on me\", \"I shouldn\\'t have assumed\", \"I missed that\", or any clear admission that the assistant made an avoidable error.\\n\\nDO NOT MATCH: generic politeness (\"sorry about that\" as a filler), apologies for system latency, or apologies for the user\\'s inconvenience rather than the assistant\\'s own error.\\n\\nWhen this fires, the mistake itself (the correct fact or behaviour the assistant should have known) should be the thing remembered, not the apology.' },\n];\n",
    "/packages/plugins/storage/google-drive/src/drive-backend.ts": "\n\nimport { DriveClient }    from './drive-client.js';\nimport { DriveStore }     from './drive-store.js';\nimport { DriveFileStore } from './drive-file-store.js';\n\nconst FILES_FOLDER = '__files';\n\n/** OAuth scope: per-file access (`drive.file`) — matbot only ever sees files it created. */\nexport const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.file';\n\n/**\n * `StorageBackend` that persists every document store and file blob to a folder in the user's Google\n * Drive. Layout mirrors the filesystem backend: `<rootFolder>/<namespace>/<id>.json` for documents,\n * `<rootFolder>/__files/` for blob + sidecar pairs. Auth is in-browser via Google Identity Services\n * (see DriveAuth) — no server, no client secret.\n *\n * The root and per-namespace folders are resolved (and created) lazily and memoised, so activating\n * the backend costs one OAuth popup and the folder structure materialises on first use of each store.\n */\nexport class GoogleDriveStorageBackend  {\n  \n  \n    __init() {this.stores = new Map()}\n  \n\n   constructor(drive, rootFolder) {;GoogleDriveStorageBackend.prototype.__init.call(this);\n    this.drive  = drive;\n    this.rootId = drive.ensureFolderPath([rootFolder]);\n    this.fileStore = new DriveFileStore(drive, this.rootId.then(r => drive.ensureFolder(FILES_FOLDER, r)));\n  }\n\n  createStore(namespace) {\n    let store = this.stores.get(namespace);\n    if (store === undefined) {\n      const folderId = this.rootId.then(r => this.drive.ensureFolder(namespace, r));\n      store = new DriveStore(this.drive, folderId);\n      this.stores.set(namespace, store);\n    }\n    return store ;\n  }\n\n  async close() {}\n\n  /**\n   * Force the root folder to resolve — a real Drive round-trip. Throws if Drive is unreachable or\n   * misconfigured (e.g. the Drive API isn't enabled for the project, or the token lacks scope). Used\n   * as a connectivity probe *before* committing to this backend, so a broken Drive never gets swapped\n   * in to brick every subsequent store operation.\n   */\n  async ready() {\n    await this.rootId;\n  }\n\n  /**\n   * Build the backend from an already-authorised {@link DriveAuth}. Authorisation is the caller's job\n   * (the setup overlay drives the GIS popup from a user gesture, or a cached token is reused) — the\n   * backend itself does no interactive auth, so it can be constructed off the gesture path.\n   */\n  static fromAuth(auth, rootFolder) {\n    if (typeof document === 'undefined') {\n      throw new Error('@matatbread/matbot-storage-google-drive is browser-only (it authenticates via Google Identity Services).');\n    }\n    return new GoogleDriveStorageBackend(new DriveClient(auth), rootFolder);\n  }\n}\n",

    "/packages/core/plugin-api/src/store-query.ts": "// The matbot store query grammar: a minimal, closed filter AST designed to be translated to a\n// real backend (SQL WHERE, Elasticsearch bool, Mongo find, IndexedDB cursor) — not interpreted by\n// an embedded engine. The in-memory reference evaluator lives in @matatbread/matbot-storage-base.\n//\n// Design rules (see CLAUDE.md / the store-query design notes):\n//   - LHS is always a field, RHS is always a constant. No field-vs-field, no computed values.\n//   - Operators are a closed union discriminated by `op`, so every backend compiler is one total\n//     `switch` the type checker can prove exhaustive.\n//   - Comparisons are type-strict; null and absent are a single \"missing\" state (queried only via\n//     `exists`). null is therefore barred from every comparison operand.\n\n     \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n      // structurally invalid node (or unreadable cursor)\n\n// Thrown at the query boundary (before any backend touches data) with a JSON pointer into the\n// offending node, so an LLM author can locate and fix the clause and retry. Lives in plugin-api\n// (a host-shared package) so cross-plugin `instanceof` works — see the plugin hot-reload notes.\nexport class StoreQueryError extends Error {\n  \n  \n  constructor(message, pointer, code) {\n    super(message);\n    this.name    = 'StoreQueryError';\n    this.pointer = pointer;\n    this.code    = code;\n  }\n}\n",

    "/packages/core/plugin-api/src/errors.ts": "/**\n * Thrown by Vault.resolve() when one or more ${NAME} placeholders cannot be resolved.\n * `missingKeys` carries the unresolved key names (e.g. `ANTHROPIC_API_KEY`) so callers\n * can prompt for and store them.\n */\nexport class MissingSecretError extends Error {\n  \n\n  constructor(missingKeys) {\n    super(`Vault: secret(s) not found: ${missingKeys.join(', ')}`);\n    this.name        = 'MissingSecretError';\n    this.missingKeys = missingKeys;\n  }\n}\n\n/**\n * Thrown by the loader when an explicit, single, user-initiated load (the `plugin`/`provider`\n * tools via `services.loadPlugin`) targets a plugin whose `matbotRuntime` excludes this host.\n * Unlike a setup() failure — which may be transient (a missing secret) and is left in config to\n * fix — this is permanent for the host, so the `add` flow catches it specifically and rolls the\n * specifier back out of matbot.yaml rather than persisting a plugin that can never activate here.\n */\nexport class IncompatibleRuntimeError extends Error {\n  \n  \n  \n\n  constructor(specifier, declared, hostRuntime) {\n    super(`Cannot load plugin \"${specifier}\": declares matbotRuntime [${declared.join(', ')}], host runtime is \"${hostRuntime}\".`);\n    this.name        = 'IncompatibleRuntimeError';\n    this.specifier   = specifier;\n    this.declared    = declared;\n    this.hostRuntime = hostRuntime;\n  }\n}\n\n/**\n * Thrown by a `PromptFn` implementation when the user cancels — the \"give up\" path, not a graceful\n * decline. Callers awaiting `ctx.prompt()` need not branch on it: the surrounding try/catch turns\n * it into a tool error that closes the tool call, while the host separately abandons the turn.\n */\nexport class PromptCancelledError extends Error {\n  constructor(message = 'User cancelled — cannot proceed.') {\n    super(message);\n    this.name = 'PromptCancelledError';\n  }\n}\n",

  exist in matbot.yaml; if it does not, calls error out at use time (the standard pattern). */\nexport function createLlmRanker(services, provider) {\n  return {\n    async rank(\n      facts,\n      candidates,\n      signal,\n    ) {\n      if (facts.length === 0 || candidates.length === 0) return [];\n      const candidateNames = new Set(candidates.map(c => c.name));\n      const candidateBlock = renderCandidates(candidates);\n\n      const perFact = await Promise.all(facts.map(async (fact) => {\n        const prompt =\n          `Fact (id ${fact.id}):\\n${clipFact(fact.fact)}\\n\\n` +\n          `Candidate skills (${candidates.length}):\\n${candidateBlock}\\n\\n` +\n          `Score every candidate.`;\n        let raw;\n        try {\n          const res = await services.singleTurn({\n            provider, signal, system: RANKER_SYSTEM, prompt,\n          });\n          raw = res.text;\n        } catch (e) {\n          console.warn(`[dream/llmRanker] singleTurn failed for fact ${fact.id}:`, _nullishCoalesce((e ).message, () => ( e)));\n          return zeros(fact.id, candidates);\n        }\n\n        const parsed = parseRankerResponse(raw);\n        if (parsed === undefined) {\n          console.warn(`[dream/llmRanker] unparseable response for fact ${fact.id}:`, raw.slice(0, 200));\n          return zeros(fact.id, candidates);\n        }\n\n        // Build a name→Score map from the response, then materialise one Score per CANDIDATE in\n        // input order. Missing entries become explicit 0s (the pipeline expects every pair to\n        // have a Score, even if 0). Unknown skill names from the model are dropped silently.\n        const byName = new Map();\n        for (const row of parsed.scores) {\n          if (!candidateNames.has(row.skill)) continue;\n          const clamped = Math.max(0, Math.min(100, Math.round(row.score)));\n          byName.set(row.skill, { score: clamped / 100, why: row.why });\n        }\n        return candidates.map(c => {\n          const hit = byName.get(c.name);\n          return {\n            factId:    fact.id,\n            skill:     c.name,\n            score:     _nullishCoalesce(_optionalChain([hit, 'optionalAccess', _ => _.score]), () => ( 0)),\n            reasoning: _nullishCoalesce(_optionalChain([hit, 'optionalAccess', _2 => _2.why]), () => ( '')),\n          };\n        });\n      }));\n\n      return perFact.flat();\n    },\n  };\n}\n\n/** Score-zero every candidate for a fact whose call failed; keeps the pipeline's grid complete. */\nfunction zeros(factId, candidates) {\n  return candidates.map(c => ({ factId, skill: c.name, score: 0, reasoning: '' }));\n}\n",
    "/packages/plugins/cognition/src/dream/llmMerger.ts": "\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nconst MERGER_SYSTEM = `\nYou are the merge stage of a memory-consolidation pass. You are given the FULL markdown of an existing skill and ONE remembered fact. Splice the fact into the skill while preserving everything else.\n\nReturn ONLY a JSON object on the last line of your reply, in this shape: \n{ \n  \"content\": \"\", \n  \"contradictions\": [ { \"location\": \"\", \"note\": \"\" } ], \n  \"anomalies\": [ { \"fact\": \"\", \"reasoning\": \"<why it doesn't fit the skill's structure>\" } ] \n}\n\nRules:\n\n* PRESERVE all existing content. Never delete or overwrite material. The output's length must be >= the input's.\n\n* FIRST, decide where the fact belongs: \n  1. GOOD FIT — the fact is about the skill's domain and fits under an existing heading. Add it as a new subsection under that heading. Add a new heading if needed, in a natural place — do not just append to the bottom unless that genuinely fits the skill's structure. \n  2. POOR FIT — the fact could relate broadly to the skill's topic area but it's focus is on a different aspect, or its subject matter is a different kind of information than the surrounding content (e.g. a transient observation mixed with durable procedures, or an operational note in an artchiectural discussion, or a general fact in a personal profile, or the reverse of either). Place it in an \"## Anomalies\" section at the very end of the skill. If \"## Anomalies\" doesn't exist yet, create it. Add the fact as a bullet point under it. Insert an inline marker in this EXACT format immediately before the fact: (?) Tangential: \"\" AND list the anomaly in the JSON \"anomalies\" array with the fact summary and reasoning. \n\n* Keep the existing heading style, prose voice, and formatting conventions.\n\n* If the new fact is a duplicate or near-duplicate of an existing fact, do not add it again. Instead, update the existing content to reflect the new fact's information.\n\n* If the new fact CONTRADICTS existing content, insert an inline marker at the contradiction site using this EXACT format (the literal \"(!) Note:\" prefix matters; a later tool scans for it):\n\n  (!) Note: The new fact says \"<short summary of new>\", but existing content says\n  \"<short summary of existing>\". May need human review to reconcile.\n\nAND list the contradiction in the JSON \"contradictions\" array. Do not block the merge on a contradiction — record it inline and continue. If there are no contradictions, return an empty array.\n* A fact can be BOTH tangential AND contradictory. In that case, use the \"(!) Note:\" marker for the contradiction and \"## Anomalies\" for the placement. List entries in both arrays.\n\n* \"location\" in the JSON contradictions is a short hint (e.g. the heading you placed the marker under). Precision is not required; it is for a human reading a run report.\n\n* If there are no anomalies, return an empty \"anomalies\" array.\n\nCOHERENCE if resulting skill content has made pre-existing facts anomalous, you may move them to the \"## Anomalies\" section, but do not delete them. If you do this, add a note in the JSON \"anomalies\" array with the fact summary and reasoning.\n\nDo not include any prose outside the JSON object. Do not wrap it in code fences. The \"content\" string must be the entire skill markdown, not a diff or a fragment.`;\n\nfunction extractJsonObject(text) {\n  const m = text.match(/\\{[\\s\\S]*\\}/);\n  return m ? m[0] : undefined;\n}\n\nfunction parseMergeResult(raw) {\n  const block = extractJsonObject(raw);\n  if (block === undefined) return undefined;\n  let parsed;\n  try { parsed = JSON.parse(block); } catch (e) { return undefined; }\n  if (typeof parsed !== 'object' || parsed === null) return undefined;\n  const obj = parsed ;\n  if (typeof obj.content !== 'string')         return undefined;\n  if (!Array.isArray(obj.contradictions))      return undefined;\n\n  const contradictions = [];\n  for (const row of obj.contradictions) {\n    if (typeof row !== 'object' || row === null) return undefined;\n    const r = row ;\n    if (typeof r.location !== 'string' || typeof r.note !== 'string') return undefined;\n    contradictions.push({ location: r.location, note: r.note });\n  }\n  return { content: obj.content, contradictions };\n}\n\n/** Construct an LLM-backed merger bound to a configured provider name. */\nexport function createLlmMerger(services, provider) {\n  return {\n    async merge(\n      skillName,\n      skillContent,\n      fact,\n      signal,\n    ) {\n      const prompt =\n        `Skill: ${skillName}\\n` +\n        `---begin current skill markdown---\\n${skillContent}\\n---end current skill markdown---\\n\\n` +\n        `Fact to merge (id ${fact.id}, from session ${fact.sessionId}, recorded ${fact.createdAt}):\\n` +\n        `${fact.fact}\\n\\n` +\n        `Return the complete updated markdown.`;\n\n      const res = await services.singleTurn({\n        provider, signal, system: MERGER_SYSTEM, prompt,\n      });\n\n      const parsed = parseMergeResult(res.text);\n      if (parsed === undefined) {\n        throw new Error(\n          `dream-time merger returned an unparseable response for fact ${fact.id}; ` +\n          `first 200 chars: ${res.text.slice(0, 200)}`,\n        );\n      }\n\n      // Defensive structural check: the prompt told the model never to shrink the content. If it\n      // did anyway, refuse the merge rather than silently overwriting good material with a\n      // truncated version. The pipeline catches this and records the run as `error`.\n      if (parsed.content.length < skillContent.length) {\n        throw new Error(\n          `dream-time merger returned shorter content (${parsed.content.length} chars) than the ` +\n          `input (${skillContent.length} chars) for fact ${fact.id}; refusing to overwrite`,\n        );\n      }\n\n      return parsed;\n    },\n  };\n}\n",
    "/packages/plugins/cognition/src/dream/types.ts": "/**\n * Data shapes for the Dream-time consolidation pass.\n *\n * Dream-time is a deterministic TypeScript pipeline that gathers facts and skill metadata, asks a\n * pluggable {@link Ranker} to score (fact, skill) pairs, applies configured thresholds to turn\n * scores into routing decisions, and — for facts that route strongly — asks a pluggable\n * {@link Merger} to splice the fact into the chosen skill's prose. Everything except the ranking\n * and the prose-edit is plain TS: fetch, filter, sort, threshold, batch, CAS-write, record.\n *\n * The LLM is one current implementation behind those two interfaces. It is NOT the pipeline's\n * driver. The shapes below are designed so that swapping in an embedding-based ranker, a small\n * classifier, or anything else requires no changes outside `./ranker.ts`.\n */\n\n// ── Skill metadata, as the pipeline passes it to the ranker ───────────────────\n\n/**\n * The trimmed, ranker-facing view of a skill. Carries only what is needed to score a fact against\n * the skill — its name (for the result) and its derived metadata (the actual signal).\n *\n * `summary` / `entities` / `tags` come from `SkillDoc.knowledge`, which the skills plugin populates\n * on write. The pipeline treats missing metadata as a hard error, not a runtime branch: it is the\n * skills layer's job to keep metadata current. We pass the trimmed shape (rather than `SkillDoc`)\n * so the ranker contract doesn't drift if `SkillDoc` grows new fields, and so an embedding ranker\n * can read exactly the same inputs as the LLM ranker.\n */\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n/** Sentinel `dreamSkill` value for facts the pipeline triaged and durably declined to route — the\n *  ranker found no plausible skill at all (a verdict about the fact, not the skill landscape, so\n *  re-asking later won't change it). */\nexport const DREAM_SKILL_NONE = '__none__';\n\n/** Sentinel `dreamSkill` value for facts quarantined after a durable merge failure (unparseable\n *  response, truncation, the merger's own length-guard). These need human intervention — a\n *  config fix, a provider swap — not an automatic retry, so the pipeline does not re-attempt them;\n *  it marks them and moves on. Distinct from {@link DREAM_SKILL_NONE} so a `dream_runs` query can\n *  tell \"the ranker declined this\" apart from \"the merger choked on this\". */\nexport const DREAM_SKILL_ERROR = '__error__';\n\n// ── Settings ──────────────────────────────────────────────────────────────────\n\n/**\n * Tunable knobs for one run. Read via `services.settings()` at the start of each `runOnce()` and\n * passed down as plain data, so the pipeline body is pure (settings in → run out) and the same\n * defaults apply on a fresh install with no stored settings.\n *\n *   strongThreshold — minimum score to trigger a merge (default 0.75).\n *   weakThreshold   — minimum score to record as a weak match (default 0.5); below this, \"none\".\n *                      Must be <= strongThreshold or the pipeline will reject the settings.\n *   maxClusterSize  — cap on facts merged in one pass, including the primary (default 5).\n *   blocklist       — skill names never offered to the ranker (default [\"Inner voice\"].\n *                     Case-sensitive exact match on `SkillDoc.name`.\n *   weakDeferralMs  — how long a `weak`-routed fact is excluded from selection before it is\n *                      reconsidered (default 36 hours, as milliseconds). Not a retry budget — there\n *                      is no cap on how many times a fact may be deferred; the field exists so a\n *                      stalled queue doesn't re-rank the same weak fact every single pass while\n *                      still giving the skill landscape time to change between looks.\n */\n\n\n\n\n\n\n\n\nexport const DEFAULT_DREAM_SETTINGS = {\n  strongThreshold: 0.75,\n  weakThreshold:   0.5,\n  maxClusterSize:  5,\n  blocklist:       ['Inner voice'],\n  weakDeferralMs:  36 * 60 * 60 * 1000,\n};\n\n/** Storage key for the persisted (partial) {@link DreamSettings} override. Shared by `runOnce`'s\n *  loader and `cognition_config`'s get/set/clear so the two can never drift onto different keys. */\nexport const DREAM_SETTINGS_KEY = 'dream-time';\n\n/**\n * Cross-field validation for an EFFECTIVE (defaults-already-merged) {@link DreamSettings}. Throws\n * with a descriptive message on the first violation found. Callers decide how to surface it:\n * `runOnce`'s loader treats a violation as a setup-shaped failure worth crashing the pass on;\n * `cognition_config`'s `set` catches it and reports a tool error so a bad patch is never persisted.\n */\nexport function validateDreamSettings(s) {\n  if (s.strongThreshold < 0 || s.strongThreshold > 1) {\n    throw new Error(`strongThreshold (${s.strongThreshold}) must be within [0, 1].`);\n  }\n  if (s.weakThreshold < 0 || s.weakThreshold > 1) {\n    throw new Error(`weakThreshold (${s.weakThreshold}) must be within [0, 1].`);\n  }\n  if (s.weakThreshold > s.strongThreshold) {\n    throw new Error(`weakThreshold (${s.weakThreshold}) must be <= strongThreshold (${s.strongThreshold}).`);\n  }\n  if (!Number.isInteger(s.maxClusterSize) || s.maxClusterSize < 1) {\n    throw new Error(`maxClusterSize (${s.maxClusterSize}) must be an integer >= 1.`);\n  }\n  if (s.weakDeferralMs < 0) {\n    throw new Error(`weakDeferralMs (${s.weakDeferralMs}) must be >= 0.`);\n  }\n}\n",
    "/packages/core/providers/_base/src/sse.ts": "// Parses a Server-Sent Events stream into data payloads.\n// Uses only Web APIs (ReadableStream, TextDecoder) — works in Node 24+ and browsers.\nexport async function* parseSSE(body) {\n  const reader  = body.getReader();\n  const decoder = new TextDecoder();\n  let   buffer  = '';\n\n  try {\n    while (true) {\n      const { done, value } = await reader.read();\n      if (done) break;\n\n      buffer += decoder.decode(value, { stream: true });\n\n      let nl;\n      while ((nl = buffer.indexOf('\\n')) !== -1) {\n        const line = buffer.slice(0, nl).trimEnd();\n        buffer = buffer.slice(nl + 1);\n        if (line.startsWith('data: ')) {\n          const data = line.slice(6);\n          if (data !== '[DONE]') yield data;\n        }\n      }\n    }\n  } finally {\n    reader.releaseLock();\n  }\n}\n",
    "/packages/core/storage/_base/src/query/access.ts": "\n\nexport function pathSegments(field) {\n  return Array.isArray(field) ? field : [field];\n}\n\n// Null-safe traversal (the grammar's implicit `?.`): any absent or non-object segment\n// short-circuits to undefined and never throws. A present `null` is returned as-is.\nexport function getField(row, segments) {\n  let cur = row;\n  for (const seg of segments) {\n    if (cur === null || typeof cur !== 'object') return undefined;\n    cur = (cur )[seg];\n  }\n  return cur;\n}\n",
    "/packages/core/storage/_base/src/query/compile.ts": "\nimport { getField, pathSegments } from './access.js';\n\n\n\n// null and absent collapse to a single \"missing\" state — no comparison ever matches a missing\n// value (so `neq` excludes missing rows too). Only `exists` observes missing-ness.\nfunction resolve(row, seg) {\n  const v = getField(row, seg);\n  return v === null ? undefined : v;\n}\n\n// Ordering is defined only within a type (numeric for numbers, codepoint for strings). A\n// cross-type comparison yields undefined → the predicate is false (type-mismatch no-match).\nfunction order(a, b) {\n  if (typeof a === 'number' && typeof b === 'number') return a - b;\n  if (typeof a === 'string' && typeof b === 'string') return a < b ? -1 : a > b ? 1 : 0;\n  return undefined;\n}\n\n// Compile the AST to a composed closure — the same one-pass \"compile to native\" the SQL/ES\n// backends do, with JS closures as the target. No `eval`/`new Function`: CSP-safe, and operands\n// are captured as data so there is no injection surface.\nexport function compileFilter(f) {\n  switch (f.op) {\n    case 'and': { const ps = f.clauses.map(compileFilter); return r => ps.every(p => p(r)); }\n    case 'or':  { const ps = f.clauses.map(compileFilter); return r => ps.some(p => p(r)); }\n    case 'not': { const p = compileFilter(f.clause); return r => !p(r); }\n\n    case 'eq':  { const seg = pathSegments(f.field), v = f.value; return r => resolve(r, seg) === v; }\n    case 'neq': { const seg = pathSegments(f.field), v = f.value; return r => { const x = resolve(r, seg); return x !== undefined && x !== v; }; }\n    case 'lt':  { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c < 0; }; }\n    case 'lte': { const seg = pathSegments(f.field), v = f.value; return r => { const c = order(resolve(r, seg), v); return c !== undefined && c <= 0; }; }\n    case 'gt':  { const seg = pathSegments(f.field), v = f     "/packages/core/storage/_base/src/query/validate.ts": "\nimport { StoreQueryError } from '@matatbread/matbot-core';\n\n// Validate the query at the boundary, before any backend touches data, and throw a located,\n// detailed StoreQueryError so an LLM author can fix the offending clause and retry. Input is\n// treated as untrusted (LLM/JSON-sourced) — the static types are only a convenience for callers.\n\nfunction isComparable(v) {\n  return typeof v === 'string' || typeof v === 'number' || typeof v === 'boolean';\n}\n\nfunction requireComparable(v, ptr, op) {\n  if (v === null)\n    throw new StoreQueryError(`'${op}' cannot compare to null — use { op: 'exists', value: false } to match absent-or-null`, ptr, 'NULL_OPERAND');\n  if (!isComparable(v))\n    throw new StoreQueryError(`'${op}' requires a string|number|boolean value`, ptr, 'OPERAND_TYPE');\n}\n\nfunction requireOrderable(v, ptr, op) {\n  if (v === null)\n    throw new StoreQueryError(`'${op}' cannot compare to null — use { op: 'exists', value: false }`, ptr, 'NULL_OPERAND');\n  if (typeof v !== 'string' && typeof v !== 'number')\n    throw new StoreQueryError(`'${op}' requires a string|number value`, ptr, 'OPERAND_TYPE');\n}\n\nfunction validateField(field, ptr) {\n  if (typeof field === 'string') {\n    if (field.length === 0) throw new StoreQueryError('field path is empty', ptr, 'EMPTY_FIELD');\n    return;\n  }\n  if (Array.isArray(field)) {\n    if (field.length === 0) throw new StoreQueryError('field path has no segments', ptr, 'EMPTY_FIELD');\n    field.forEach((s, i) => {\n      if (typeof s !== 'string' || s.length === 0)\n        throw new StoreQueryError('field path segment must be a non-empty string', `${ptr}/${i}`, 'EMPTY_FIELD');\n    });\n    return;\n  }\n  throw new StoreQueryError('field must be a string or array of strings', ptr, 'MALFORMED');\n}\n\nfunction validateFilter(f, ptr) {\n  if (f === null || typeof f !== 'object' || typeof (f ).op !== 'string')\n    throw new StoreQueryErr ill-editor .TinyMDE {\n      flex: 1;\n      min-height: 0;\n      overflow-y: auto;\n      padding: 16px;\n      font-size: 0.9em;\n      line-height: 1.55;\n      outline: none;\n    }\n    #skill-editor-footer {\n      display: flex;\n      align-items: center;\n      gap: 8px;\n      padding: 12px 16px;\n      border-top: 1px solid #e5e7eb;\n    }\n    #skill-editor-error { flex: 1; color: #ef4444; font-size: 0.82em; }\n    .skill-editor-btn {\n      padding: 6px 16px;\n      border-radius: 6px;\n      border: 1px solid #d1d5db;\n      background: #fff;\n      color: #374151;\n      cursor: pointer;\n      font-family: inherit;\n      font-size: 0.88em;\n      font-weight: 500;\n    }\n    .skill-editor-btn:hover { background: #f3f4f6; }\n    .skill-editor-btn.primary {\n      background: #2563eb;\n      border-color: #2563eb;\n      color: #fff;\n    }\n    .skill-editor-btn.primary:hover { background: #1d4ed8; }\n    .skill-editor-btn:disabled { opacity: 0.5; cursor: default; }\n\n    [data-section=\"files\"] .sidebar-heading { display: flex; align-items: center; }\n    #upload-btn {\n      margin-left: auto;\n      background: none;\n      border: none;\n      cursor: pointer;\n      padding: 0px;\n      color: #9ca3af;\n      font-size: 1.4em;\n      font-weight: 400;\n      text-transform: none;\n      letter-spacing: 0;\n      line-height: 1;\n      flex-shrink: 0;\n    }\n    #upload-btn:hover { color: #374151; background: #e5e7eb; }\n    .drop-over #file-list {\n      outline: 2px dashed #6366f1;\n      outline-offset: -2px;\n      background: #eef2ff;\n      border-radius: 4px;\n    }\n\n    /* ── Main ──────────────────────────────────────────────────── */\n\n    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }\n    #chat-header {\n      padding: 10px 28px;\n      border-bottom: 1px solid #e5e7eb;\n      font-size: 0.93em;\n      font-weight: 500;\n      color: #374151;\n      min-height: 41px;\n      display: flex;\n      al
