<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <title>matbot</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>(function(){const s=localStorage.getItem('fontSize');if(s)document.documentElement.style.setProperty('--fs',s+'px');}());</script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }

    body {
      display: flex;
      height: 100vh;
      height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: var(--fs, 14px); /* master — adjust --fs to scale everything */
      background: #fff;
      color: #111;
      overflow: hidden;
    }

    /* ── Sidebar ───────────────────────────────────────────────── */

    #sidebar {
      width: 240px;
      min-width: 240px;
      border-right: 1px solid #e5e7eb;
      display: flex;
      flex-direction: column;
      background: #f9fafb;
    }
    #sidebar h1 {
      padding: 15px 16px 14px;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: -0.01em;
      border-bottom: 1px solid #e5e7eb;
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }
    .fs-controls { margin-left: auto; display: flex; align-items: center; gap: 1px; }
    .fs-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      font-weight: 700;
      color: #9ca3af;
      line-height: 1;
      font-family: inherit;
      user-select: none;
    }
    .fs-btn:hover { color: #374151; background: #e5e7eb; }
    #fs-down { font-size: 0.72em; }
    #fs-up   { font-size: 1.1em; }
    #new-btn {
      margin: 10px 12px 6px;
      padding: 8px 12px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.93em;
      font-weight: 500;
      text-align: left;
      flex-shrink: 0;
      text-decoration: none;
      display: block;
    }
    #new-btn:hover { background: #374151; }
    .sidebar-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
      border-top: 1px solid #e5e7eb;
    }
    .sidebar-section:first-of-type { border-top: none; }
    .sidebar-section.collapsed {
      flex: 0 0 auto;
    }
    .sidebar-section.collapsed .sidebar-list {
      display: none;
    }
    .sidebar-heading {
      padding: 8px 14px 2px;
      font-size: 0.79em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #9ca3af;
      flex-shrink: 0;
      cursor: pointer;
      user-select: none;
    }
    .sidebar-heading::before {
      content: '\25bc';
      font-size: 0.73em; /* relative to sidebar-heading's 0.79em */
      margin-right: 5px;
      display: inline-block;
      transition: transform 0.15s;
    }
    .sidebar-section.collapsed .sidebar-heading::before {
      transform: rotate(-90deg);
    }
    .sidebar-heading:hover { color: #6b7280; }
    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }
    #session-list {
      padding: 4px 8px 8px;
    }
    #file-list {
      padding: 4px 8px 8px;
    }
    .session-item {
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.93em;
      color: #555;
      margin: 1px 0;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .session-item:hover  { background: #f0f0f2; color: #111; }
    .session-item.active { background: #e5e7eb; color: #111; font-weight: 500; }
    .session-item.busy::before,
    .session-item.unread::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .session-item.busy::before {
      background: #f59e0b;
      animation: session-pulse 1.4s ease-in-out infinite;
    }
    .session-item.unread::before { background: #22c55e; }
    @keyframes session-pulse {
      0%, 100% { opacity: 1;   transform: scale(1);    }
      50%       { opacity: 0.3; transform: scale(0.75); }
    }
    .session-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      padding: 2px 0;
    }
    .session-actions { display: none; flex-shrink: 0; }
    .session-item:hover .session-actions { display: flex; }
    .session-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 1.08em; /* relative to session-item's 0.93em */
      line-height: 1;
    }
    .session-action-btn[title="Rename"] { color: #6b7280; }
    .session-action-btn[title="Hide"] { color: #ef4444; }
    .session-action-btn:hover { background: #d1d5db; color: #374151; }

    .file-item {
      padding: 4px 10px;
      font-size: 0.86em;
      color: #555;
      display: flex;
      align-items: center;
      gap: 6px;
      border-radius: 4px;
      cursor: pointer;
    }
    .file-item:hover { background: #f0f0f2; }
    .file-item.updated::before {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: #22c55e;
    }
    .file-name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-size {
      font-size: 0.92em; /* relative to file-item's 0.86em */
      color: #9ca3af;
      flex-shrink: 0;
      font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
    }

    .file-actions { display: none; flex-shrink: 0; }
    .file-item:hover .file-actions { display: flex; }
    .file-action-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 1.17em; /* relative to file-item's 0.86em */
      line-height: 1;
      color: #ef4444;
    }
    .file-action-btn:hover { background: #fecaca; }

    [data-section="files"] .sidebar-heading { display: flex; align-items: center; }
    #upload-btn {
      margin-left: auto;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0px;
      color: #9ca3af;
      font-size: 1.4em;
      font-weight: 400;
      text-transform: none;
      letter-spacing: 0;
      line-height: 1;
      flex-shrink: 0;
    }
    #upload-btn:hover { color: #374151; background: #e5e7eb; }
    .drop-over #file-list {
      outline: 2px dashed #6366f1;
      outline-offset: -2px;
      background: #eef2ff;
      border-radius: 4px;
    }

    /* ── Main ──────────────────────────────────────────────────── */

    #main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    #chat-header {
      padding: 10px 28px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.93em;
      font-weight: 500;
      color: #374151;
      min-height: 41px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 32px 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding-bottom: 60px;
      color: #9ca3af;
      text-align: center;
    }
    .empty-state strong { font-size: 1.14em; font-weight: 500; color: #6b7280; }

    /* ── Message types ─────────────────────────────────────────── */

    .message { max-width: 700px; }

    /* User: right-aligned dark bubble */
    .message.user {
      align-self: flex-end;
      background: #111;
      color: #fff;
      padding: 10px 14px;
      border-radius: 12px 12px 2px 12px;
      line-height: 1.65;
      word-break: break-word;
    }
    .message.user .md-body { color: #fff; }
    .message.user .md-body code { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.2); color: #fff; }
    .message.user .md-body pre { background: rgba(0,0,0,0.3); border-color: rgba(255,255,255,0.15); }
    .message.user .md-body pre code { background: none; border: none; }
    .message.user .md-body a { color: #93c5fd; }
    .message.user .md-body blockquote { border-left-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); }
    .message.user .md-body th { background: rgba(0,0,0,0.2); }
    .message.user .md-body th, .message.user .md-body td { border-color: rgba(255,255,255,0.2); }
    .message.user .md-body hr { border-top-color: rgba(255,255,255,0.2); }

    /* Assistant: left-aligned, no background */
    .message.assistant { align-self: flex-start; }

    /* Tool-result messages: left, subtle left border */
    .message.tool-turn {
      align-self: flex-start;
      padding-left: 10px;
      border-left: 2px solid #e5e7eb;
      margin-top: -10px;
    }

    .msg-label {
      font-size: 0.79em;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #9ca3af;
      margin-bottom: 6px;
    }

    /* Loading dots while waiting for first token */
    .msg-loading::after {
      content: '●●●';
      letter-spacing: 4px;
      font-size: 0.64em;
      color: #d1d5db;
      animation: blink 1.1s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 0.25; }
      50%       { opacity: 1; }
    }

    /* ── Markdown body ─────────────────────────────────────────── */

    .md-body { line-height: 1.7; color: #111; }
    .md-body p { margin: 0 0 0.65em; }
    .md-body p:last-child { margin-bottom: 0; }
    .md-body code {
      font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
      font-size: 0.89em;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 3px;
      padding: 1px 5px;
    }
    .md-body pre {
      background: #f8f9fa;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: 0.5em 0 0.65em;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .md-body pre code { background: none; border: none; padding: 0; font-size: 0.93em; white-space: inherit; }
    .md-body ul, .md-body ol { padding-left: 1.4em; margin: 0.3em 0 0.65em; }
    .md-body li { margin: 0.2em 0; }
    .md-body blockquote {
      border-left: 3px solid #d1d5db;
      padding-left: 12px;
      margin: 0.5em 0;
      color: #6b7280;
    }
    .md-body h1, .md-body h2, .md-body h3 {
      font-weight: 600;
      margin: 0.7em 0 0.35em;
      line-height: 1.3;
    }
    .md-body h1 { font-size: 1.2em; }
    .md-body h2 { font-size: 1.1em; }
    .md-body h3 { font-size: 1em; }
    .md-body a { color: #2563eb; text-decoration: underline; }
    .md-body table { border-collapse: collapse; margin: 0.6em 0; font-size: 0.93em; width: 100%; }
    .md-body th, .md-body td { border: 1px solid #e5e7eb; padding: 6px 10px; text-align: left; }
    .md-body th { background: #f9fafb; font-weight: 600; }
    .md-body hr { border: none; border-top: 1px solid #e5e7eb; margin: 1em 0; }
    .md-body strong { font-weight: 600; }

    /* ── Thinking / Reasoning blocks ───────────────────────────── */

    .thinking-block {
      background: #f0f4ff;
      border: 1px solid #c7d2fe;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .thinking-summary {
      padding: 6px 12px;
      font-size: 0.86em;
      font-weight: 500;
      color: #4338ca;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .thinking-summary::-webkit-details-marker { display: none; }
    .thinking-summary::before { content: '▶'; font-size: 0.75em; opacity: 0.6; } /* relative to thinking-summary's 0.86em */
    details[open] > .thinking-summary::before { content: '▼'; }
    .thinking-content {
      padding: 8px 12px 10px;
      font-size: 0.89em;
      line-height: 1.65;
      color: #3730a3;
      white-space: pre-wrap;
      word-break: break-word;
      border-top: 1px solid #c7d2fe;
      max-height: 10vh;
      overflow-y: scroll;
    }
    .thinking-redacted {
      font-size: 0.86em;
      color: #9ca3af;
      font-style: italic;
      margin-bottom: 6px;
    }

    /* ── Tool blocks ───────────────────────────────────────────── */

    .tool-block {
      background: #0f172a;
      border-radius: 6px;
      overflow: hidden;
      margin: 4px 0 8px;
      font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
      font-size: 0.86em;
    }
    .tool-header {
      padding: 6px 12px;
      color: #a78bfa;
      font-weight: 600;
      border-bottom: 1px solid #1e293b;
    }
    .tool-args {
      border-bottom: 1px solid #1e293b;
    }
    .tool-args summary {
      padding: 4px 12px;
      color: #64748b;
      cursor: pointer;
      font-size: 0.92em; /* relative to tool-block's 0.86em */
      list-style: none;
      user-select: none;
    }
    .tool-args summary::-webkit-details-marker { display: none; }
    .tool-args pre {
      margin: 0;
      padding: 6px 12px 8px;
      color: #94a3b8;
      font-size: 0.96em; /* relative to tool-block's 0.86em */
      white-space: pre-wrap;
      word-break: break-word;
    }
    .tool-output {
      margin: 0;
      padding: 7px 12px;
      color: #94a3b8;
      font-size: 0.96em; /* relative to tool-block's 0.86em */
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 10vh;
      overflow-y: auto;
    }

    /* ── Tool results ──────────────────────────────────────────── */

    .tool-result {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin: 2px 0 6px;
    }
    .tool-result-icon {
      flex-shrink: 0;
      font-size: 0.86em;
      padding-top: 3px;
      color: #16a34a;
    }
    .tool-result-error .tool-result-icon { color: #ef4444; }
    .tool-result-text {
      margin: 0;
      font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
      font-size: 0.82em;
      color: #374151;
      white-space: pre-wrap;
      word-break: break-word;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      border-radius: 4px;
      padding: 4px 8px;
      flex: 1;
      max-height: 180px;
      overflow-y: auto;
    }

    /* ── Misc message parts ────────────────────────────────────── */

    .msg-refusal {
      color: #b45309;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 0.93em;
      font-style: italic;
    }
    .msg-error { color: #ef4444; font-size: 0.93em; }

    /* ── Token stats ─────────────────────────────────────────────── */
    .token-stats { margin-top: 6px; }
    .token-stats > summary {
      font-size: 0.79em;
      color: #9ca3af;
      cursor: pointer;
      user-select: none;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .token-stats > summary::-webkit-details-marker { display: none; }
    .token-stats > summary::before { content: '▶'; font-size: 0.73em; opacity: 0.5; margin-right: 2px; } /* relative to summary's 0.79em */
    details.token-stats[open] > summary::before { content: '▼'; }
    .token-stats-body {
      display: flex;
      gap: 12px;
      font-size: 0.79em;
      color: #6b7280;
      padding: 3px 0 0;
      font-family: 'SF Mono', 'Cascadia Code', ui-monospace, monospace;
    }

    /* ── Sessions banner ───────────────────────────────────────── */

    .plugin-prompt-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 8px 28px;
      background: #fffbeb;
      border-top: 1px solid #fde68a;
      font-size: 0.86em;
      color: #92400e;
    }
    .plugin-prompt-banner span { flex: 1; }
    .plugin-prompt-banner button {
      padding: 4px 12px;
      background: #d97706;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .plugin-prompt-banner button:hover { background: #b45309; }

    /* ── Input area ────────────────────────────────────────────── */

    #input-area { border-top: 1px solid #e5e7eb; padding: 12px 28px 20px; }
    #input-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      font-size: 0.86em;
      color: #9ca3af;
    }
    #provider-select {
      background: transparent;
      border: none;
      font-size: 1em; /* inherits input-meta's 0.86em */
      color: #6b7280;
      cursor: pointer;
      outline: none;
      padding: 0;
      max-width: 260px;
    }
    #provider-select:hover { color: #374151; }
    #input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
      max-width: 700px;
    }
    #input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 1em;
      line-height: 1.5;
      resize: none;
      overflow-y: hidden;
      max-height: 180px;
      outline: none;
      transition: border-color 0.15s;
    }
    #input:focus    { border-color: #9ca3af; }
    #input:disabled { background: #f9fafb; }
    #input::placeholder { opacity: 1; color: #6b7280; }
    #send-btn {
      background: #111;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 2.14em;
      font-weight: 500;
      flex-shrink: 0;
      transition: background 0.1s;
      height: 1.5em;
      width: 1.5em;
    }
    #send-btn:hover              { background: #374151; }
    #send-btn:disabled           { background: #d1d5db; cursor: not-allowed; }
    #send-btn.stop-mode          { background: #dc2626; }
    #send-btn.stop-mode:hover    { background: #b91c1c; }
    #send-btn.stop-mode:disabled { background: #fca5a5; cursor: not-allowed; }

    /* ── Form blocks ──────────────────────────────────────────── */

    .form-block {
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      padding: 14px 16px;
      max-width: 420px;
      margin-top: 4px;
    }
    .form-field-label {
      font-size: 0.93em;
      color: #374151;
      font-weight: 500;
      margin-bottom: 8px;
    }
    .form-select {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.93em;
      font-family: inherit;
      background: #fff;
      outline: none;
      cursor: pointer;
      min-width: 160px;
    }
    .form-select:focus { border-color: #9ca3af; }
    .form-select:disabled { background: #f9fafb; cursor: not-allowed; }
    .form-text-input {
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.93em;
      font-family: inherit;
      outline: none;
      width: 100%;
      margin-bottom: 8px;
    }
    .form-text-input:focus { border-color: #9ca3af; }
    .form-actions { display: flex; gap: 8px; margin-top: 10px; align-items: center; }
    .form-submit-btn {
      padding: 6px 16px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.93em;
      font-weight: 500;
    }
    .form-submit-btn:hover    { background: #374151; }
    .form-submit-btn:disabled { background: #d1d5db; cursor: not-allowed; }

    /* ── Prompt blocks ─────────────────────────────────────────── */

    .prompt-block {
      align-self: flex-start;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 8px;
      padding: 12px 14px;
      max-width: 500px;
      margin-top: 4px;
    }
    .prompt-question {
      font-size: 0.93em;
      color: #374151;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }
    .prompt-row { display: flex; gap: 8px; }
    .prompt-input {
      flex: 1;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.93em;
      font-family: inherit;
      outline: none;
    }
    .prompt-input:focus    { border-color: #9ca3af; }
    .prompt-input:disabled { background: #f9fafb; }
    .prompt-submit {
      padding: 6px 14px;
      background: #111;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.93em;
      font-weight: 500;
      flex-shrink: 0;
    }
    .prompt-submit:hover    { background: #374151; }
    .prompt-submit:disabled { background: #d1d5db; cursor: not-allowed; }
    .prompt-choices { display: flex; gap: 8px; }
    .prompt-choice-btn {
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.93em;
      font-weight: 500;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #374151;
      transition: background 0.1s, border-color 0.1s;
    }
    .prompt-choice-btn:hover    { background: #f3f4f6; border-color: #9ca3af; }
    .prompt-choice-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .prompt-choice-btn.primary  { background: #111; color: #fff; border-color: #111; }
    .prompt-choice-btn.primary:hover { background: #374151; border-color: #374151; }

    /* ── Scrollbar ─────────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }

    /* ── Burger button (hidden on desktop) ─────────────────────── */
    #burger {
      display: none;
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 6px;
      font-size: 1.43em;
      line-height: 1;
      color: #374151;
      flex-shrink: 0;
      margin-right: 6px;
    }
    #sidebar-overlay { display: none; }

    /* ── Mobile layout ─────────────────────────────────────────── */
    @media (max-width: 640px) {
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        height: 100dvh;
        z-index: 200;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
        padding-top: env(safe-area-inset-top, 0px);
      }
      body.sidebar-open #sidebar {
        transform: translateX(0);
        box-shadow: 4px 0 20px rgba(0,0,0,0.15);
      }
      #sidebar-overlay {
        position: fixed;
        inset: 0;
        z-index: 199;
        background: rgba(0,0,0,0.3);
      }
      body.sidebar-open #sidebar-overlay { display: block; }
      body {
        position: fixed;
        width: 100%;
      }
      #burger { display: block; }
      #chat-header {
        padding-left: 12px;
        padding-top: max(10px, env(safe-area-inset-top, 0px));
      }
      #messages    { padding-left: 16px; padding-right: 16px; }
      #input-area  {
        padding-left: 16px;
        padding-right: 16px;
        padding-bottom: max(20px, env(safe-area-inset-bottom, 0px));
      }
      .session-actions { display: flex; }
    }
  </style>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <nav id="sidebar">
    <h1>matbot<span class="fs-controls"><button class="fs-btn" id="fs-down" title="Smaller">A</button><button class="fs-btn" id="fs-up" title="Larger">A</button></span></h1>
    <a id="new-btn" href="#new">+ New conversation</a>
    <div class="sidebar-section" data-section="conversations">
      <div class="sidebar-heading">Conversations</div>
      <div id="session-list" class="sidebar-list"></div>
    </div>
    <div class="sidebar-section" data-section="files">
      <div class="sidebar-heading">Files<button id="upload-btn" title="Upload files">+📄</button></div>
      <input type="file" id="upload-input" multiple style="display:none">
      <div id="file-list" class="sidebar-list"></div>
    </div>
  </nav>

  <main id="main">
    <div id="chat-header"><button id="burger" aria-label="Open menu">&#9776;</button><span id="chat-title"></span></div>
    <div id="messages"></div>
    <div id="sessions-banner" class="plugin-prompt-banner">
      <span>Sessions plugin not loaded — conversations won't be saved after reload.</span>
      <button id="sessions-enable-btn">Enable sessions</button>
    </div>
    <div id="input-area">
      <div id="input-meta">
        <span>Provider:</span>
        <select id="provider-select"></select>
      </div>
      <div id="input-row">
        <textarea id="input" rows="1" placeholder="Shift+⬅️ to send, ⬅️ for newline"></textarea>
        <button id="send-btn">▶</button>
      </div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
