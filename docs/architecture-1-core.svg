<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <style>
      .title{font-size:30px;font-weight:800;fill:#0f172a}.subtitle{font-size:15px;fill:#475569}.small{font-size:12px;fill:#64748b}.tiny{font-size:11px;fill:#94a3b8}.coreTitle{font-size:22px;font-weight:800;fill:#f8fafc}.boxTitle{font-size:15px;font-weight:800;fill:#fff}.boxText{font-size:12px;fill:#dbeafe}.ifaceTitle{font-size:14px;font-weight:800;fill:#0f172a}.ifaceText{font-size:11px;fill:#475569}.label{font-size:12px;font-weight:800;fill:#475569;letter-spacing:1.4px}.pkg{font-size:11px;fill:#cbd5e1;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <text x="600" y="44" text-anchor="middle" class="title">matbot core: platform-neutral runtime + contracts</text>
  <text x="600" y="70" text-anchor="middle" class="subtitle">The core owns orchestration, type contracts, session shape, registries, and default service facades. Capabilities are plugged in.</text>

  <rect x="150" y="105" width="900" height="445" rx="24" fill="url(#core)" filter="url(#shadow)"/>
  <text x="600" y="140" text-anchor="middle" class="coreTitle">Core packages</text>
  <text x="600" y="162" text-anchor="middle" class="pkg">core, plugin-api and apps/* bootstrap wiring</text>

  <!-- core package cards -->
  <g transform="translate(185,190)">
    <rect width="250" height="112" rx="12" fill="#1d4ed8" stroke="#60a5fa"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">runner</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">SessionRunner queue + pump</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">runSession provider/tool loop</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">ToolRegistry · HookRegistry</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">@matatbread/matbot-core</text>
  </g>
  <g transform="translate(475,190)">
    <rect width="250" height="112" rx="12" fill="#7c3aed" stroke="#c4b5fd"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">plugin-api</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">MatbotPluginSpec + services</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">Message, Session, Tool, Hook</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">ProviderAdapter, Store, Vault</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">PLUGIN_API_VERSION 0.1</text>
  </g>
  <g transform="translate(765,190)">
    <rect width="250" height="112" rx="12" fill="#be185d" stroke="#f9a8d4"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">providers/_base</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">ProviderConfig</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">ProviderAdapter.complete()</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">streams CompletionEvents</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">adapters live in plugins</text>
  </g>

  <g transform="translate(185,330)">
    <rect width="250" height="112" rx="12" fill="#0e7490" stroke="#67e8f9"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">storage</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">Store&lt;T&gt; query/CAS contract</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">Filter AST · sort · cursor</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">FilesystemStore default in Node</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">_base + filesystem</text>
  </g>
  <g transform="translate(475,330)">
    <rect width="250" height="112" rx="12" fill="#15803d" stroke="#86efac"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">knowledge</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">KnowledgeIndex interface</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">KnowledgeEntry documents</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">LookupKnowledgeIndex default</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">backend swappable</text>
  </g>
  <g transform="translate(765,330)">
    <rect width="250" height="112" rx="12" fill="#b45309" stroke="#fcd34d"/>
    <text x="125" y="25" text-anchor="middle" class="boxTitle">security + config</text>
    <text x="125" y="47" text-anchor="middle" class="boxText">PrincipalCarrier + runAs()</text>
    <text x="125" y="64" text-anchor="middle" class="boxText">Vault + MissingSecretError</text>
    <text x="125" y="81" text-anchor="middle" class="boxText">matbot.yaml parser/loader</text>
    <text x="125" y="99" text-anchor="middle" class="pkg">ambient identity, not policy</text>
  </g>

  <g transform="translate(310,470)">
    <rect width="580" height="55" rx="12" fill="#334155" stroke="#94a3b8"/>
    <text x="290" y="24" text-anchor="middle" class="boxTitle">host bootstrap in apps/cli and apps/web-bundle</text>
    <text x="290" y="42" text-anchor="middle" class="boxText">builds MatbotServices, resolves provider/plugin modules, installs PrincipalCarrier, creates swappable stores/files/knowledge</text>
  </g>

  <!-- interface band -->
  <text x="80" y="610" class="label">PUBLIC EXTENSION INTERFACES</text>
  <line x1="80" y1="622" x2="1120" y2="622" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <g transform="translate(70,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">MatbotPluginSpec</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">apiVersion, provider,</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">storage, tools, hooks via</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">setup(services)</text>
  </g>
  <g transform="translate(250,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">Tool</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">name + schema</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">async executor emits</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">stdout/stderr/result</text>
  </g>
  <g transform="translate(430,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">Hook</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">screen · contribute</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">toolcall · toolresult</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">followup</text>
  </g>
  <g transform="translate(610,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">Store + FileStore</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">namespaced docs, CAS,</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">queries, blobs</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">via StorageBackend</text>
  </g>
  <g transform="translate(790,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">ProviderAdapter</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">LLM adapters stream</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">text, thinking, tool</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">calls and usage</text>
  </g>
  <g transform="translate(970,650)">
    <rect width="160" height="86" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="80" y="25" text-anchor="middle" class="ifaceTitle">MatbotServices</text>
    <text x="80" y="48" text-anchor="middle" class="ifaceText">complete(), createStore,</text>
    <text x="80" y="64" text-anchor="middle" class="ifaceText">register(), settings,</text>
    <text x="80" y="78" text-anchor="middle" class="ifaceText">tools, hooks, vault</text>
  </g>

  <path class="line" d="M600 550 C600 585 600 610 600 642"/>
  <text x="600" y="792" text-anchor="middle" class="small">Core design: keep the runner small, make every capability replaceable through explicit TypeScript interfaces.</text>
</svg>
