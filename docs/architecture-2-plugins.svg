<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 900" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e293b"/><stop offset="1" stop-color="#020617"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity=".16"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .title{font-size:30px;font-weight:850;fill:#0f172a}.subtitle{font-size:15px;fill:#475569}.label{font-size:12px;font-weight:850;fill:#475569;letter-spacing:1.3px}.coreTitle{font-size:21px;font-weight:850;fill:#f8fafc}.boxTitle{font-size:14px;font-weight:800;fill:#0f172a}.boxText{font-size:11px;fill:#475569}.whiteTitle{font-size:14px;font-weight:800;fill:#fff}.whiteText{font-size:11px;fill:#e2e8f0}.tiny{font-size:10px;fill:#64748b}.pkg{font-size:10.5px;fill:#64748b;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.line{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;fill:none;stroke-dasharray:6 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1300" height="900" fill="url(#bg)"/>
  <text x="650" y="45" text-anchor="middle" class="title">matbot plugins: optional capabilities that plug into core seams</text>
  <text x="650" y="72" text-anchor="middle" class="subtitle">A plugin can register tools, providers, hooks, storage backends, frontends, system context, or new services via setup(services).</text>

  <!-- central core -->
  <rect x="390" y="165" width="520" height="465" rx="26" fill="url(#core)" filter="url(#shadow)"/>
  <text x="650" y="203" text-anchor="middle" class="coreTitle">Matbot core + MatbotServices</text>
  <text x="650" y="226" text-anchor="middle" class="whiteText">loadPlugins() imports modules, stamps identity, checks API version, then setup() wires contributions</text>

  <g transform="translate(430,260)">
    <rect width="200" height="78" rx="12" fill="#1d4ed8" stroke="#60a5fa"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">ToolRegistry</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">registered tools exposed</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">to the LLM each call</text>
  </g>
  <g transform="translate(670,260)">
    <rect width="200" height="78" rx="12" fill="#7c3aed" stroke="#c4b5fd"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">HookRegistry</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">screen/contribute/tool</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">filters and followups</text>
  </g>
  <g transform="translate(430,365)">
    <rect width="200" height="78" rx="12" fill="#0e7490" stroke="#67e8f9"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">StorageBackend</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">Store&lt;T&gt; + FileStore</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">swappable proxies</text>
  </g>
  <g transform="translate(670,365)">
    <rect width="200" height="78" rx="12" fill="#be185d" stroke="#f9a8d4"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">Provider factories</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">adapter plugins implement</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">Anthropic/OpenAI/etc.</text>
  </g>
  <g transform="translate(430,470)">
    <rect width="200" height="78" rx="12" fill="#15803d" stroke="#86efac"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">KnowledgeIndex</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">lookup default; persistent</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">semantic backend optional</text>
  </g>
  <g transform="translate(670,470)">
    <rect width="200" height="78" rx="12" fill="#b45309" stroke="#fcd34d"/>
    <text x="100" y="24" text-anchor="middle" class="whiteTitle">Frontends + run</text>
    <text x="100" y="47" text-anchor="middle" class="whiteText">registerFrontend()</text>
    <text x="100" y="62" text-anchor="middle" class="whiteText">submit/observe SessionRunner</text>
  </g>

  <!-- plugin categories -->
  <text x="80" y="125" class="label">TOOL PLUGINS</text>
  <g transform="translate(55,145)">
    <rect width="270" height="210" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="135" y="31" text-anchor="middle" class="boxTitle">add model-callable abilities</text>
    <text x="25" y="62" class="boxText">• bash / docker-bash — run scripts</text>
    <text x="25" y="82" class="boxText">• http — make HTTP requests</text>
    <text x="25" y="102" class="boxText">• workspace / files — artifacts + blobs</text>
    <text x="25" y="122" class="boxText">• mcp / mcp-http — bridge MCP tools</text>
    <text x="25" y="142" class="boxText">• ask-user — interactive forms</text>
    <text x="25" y="162" class="boxText">• background/every_action — jobs</text>
    <text x="25" y="182" class="boxText">• sessions/edit-session/whoami</text>
  </g>
  <path class="line" d="M325 250 C355 255 370 275 425 296"/>

  <text x="80" y="415" class="label">HOOK + CONTEXT PLUGINS</text>
  <g transform="translate(55,435)">
    <rect width="270" height="170" rx="18" fill="#ede9fe" stroke="#a78bfa"/>
    <text x="135" y="31" text-anchor="middle" class="boxTitle">shape the turn pipeline</text>
    <text x="25" y="62" class="boxText">• json-validation rejects bad calls</text>
    <text x="25" y="82" class="boxText">• hook-logger audits hook stages</text>
    <text x="25" y="102" class="boxText">• skills injects reusable context</text>
    <text x="25" y="122" class="boxText">• rumsfeld consults knowledge on</text>
    <text x="36" y="138" class="boxText">unknown/uncertain terms</text>
  </g>
  <path class="line" d="M325 510 C360 500 390 445 670 405"/>
  <path class="dash" d="M325 535 C365 550 395 535 430 515"/>

  <text x="980" y="125" class="label">PROVIDER PLUGINS</text>
  <g transform="translate(970,145)">
    <rect width="275" height="160" rx="18" fill="#fce7f3" stroke="#f472b6"/>
    <text x="137" y="31" text-anchor="middle" class="boxTitle">LLM adapters</text>
    <text x="25" y="62" class="boxText">• anthropic — Anthropic Messages API</text>
    <text x="25" y="82" class="boxText">• openai-compat — OpenAI style APIs</text>
    <text x="25" y="102" class="boxText">• customer-services — mock adapter</text>
    <text x="25" y="124" class="boxText">Provider profiles in matbot.yaml point</text>
    <text x="25" y="140" class="boxText">at one registered adapter factory.</text>
  </g>
  <path class="line" d="M970 235 C930 260 895 315 870 392"/>

  <text x="1000" y="365" class="label">STORAGE + KNOWLEDGE</text>
  <g transform="translate(970,385)">
    <rect width="275" height="185" rx="18" fill="#ccfbf1" stroke="#2dd4bf"/>
    <text x="137" y="31" text-anchor="middle" class="boxTitle">replace or enrich persistence</text>
    <text x="25" y="62" class="boxText">• storage/sqlite replaces filesystem</text>
    <text x="36" y="78" class="boxText">stores and file store</text>
    <text x="25" y="100" class="boxText">• persist-ki-bge registers a durable</text>
    <text x="36" y="116" class="boxText">KnowledgeIndex with reranking</text>
    <text x="25" y="138" class="boxText">Swappable proxies mean captured</text>
    <text x="25" y="154" class="boxText">service handles follow the new backend.</text>
  </g>
  <path class="line" d="M970 460 C930 460 905 420 870 405"/>
  <path class="dash" d="M970 505 C930 505 905 508 870 510"/>

  <text x="440" y="700" class="label">FRONTEND PLUGINS</text>
  <g transform="translate(360,720)">
    <rect width="290" height="120" rx="18" fill="#ffedd5" stroke="#fb923c"/>
    <text x="145" y="31" text-anchor="middle" class="boxTitle">own UI / transport</text>
    <text x="25" y="62" class="boxText">• frontend/web — HTTP + SSE web UI</text>
    <text x="25" y="82" class="boxText">• frontend/dom — browser DOM helpers</text>
    <text x="25" y="102" class="boxText">• frontend/telegram — Telegram bot</text>
  </g>
  <path class="line" d="M650 720 C685 670 705 605 770 548"/>

  <text x="735" y="700" class="label">PLUGIN-TO-PLUGIN SERVICES</text>
  <g transform="translate(700,720)">
    <rect width="300" height="120" rx="18" fill="#dcfce7" stroke="#4ade80"/>
    <text x="150" y="31" text-anchor="middle" class="boxTitle">new service interfaces</text>
    <text x="25" y="62" class="boxText">Any plugin may augment MatbotServices,</text>
    <text x="25" y="82" class="boxText">then services.register('key', impl).</text>
    <text x="25" y="102" class="boxText">Consumers use services.get('key') safely.</text>
  </g>
  <path class="dash" d="M785 720 C785 650 765 595 760 548"/>

  <!-- lifecycle strip -->
  <g transform="translate(220,95)">
    <rect width="860" height="44" rx="22" fill="#fff" stroke="#cbd5e1"/>
    <text x="430" y="28" text-anchor="middle" class="boxText">Lifecycle: matbot.yaml / plugin tool → resolve specifier → import module → validate plugin object → register factories → setup(scopedServices) → hot unload removes owned tools/hooks/services</text>
  </g>

  <text x="650" y="875" text-anchor="middle" class="tiny">Runtime gates package.json matbotRuntime: node, browser, or both. Node can load npm/local/GitHub/CDN; browser uses baked import maps and remote type-stripped modules.</text>
</svg>
